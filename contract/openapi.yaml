        vehicles: { $ref: '#/components/schemas/HoursCost' }
        materials: { $ref: '#/components/schemas/Amount' }
        rentals: { $ref: '#/components/schemas/Amount' }
        subcontract: { $ref: '#/components/schemas/Amount' }
        other: { $ref: '#/components/schemas/Amount' }
        total: { $ref: '#/components/schemas/Amount' }
        budget:
          oneOf:
            - $ref: '#/components/schemas/Amount'
