      description: |
        Permesso: purchases.update. Si inviano tutti i campi; le righe sostituiscono le
        precedenti. Solo in bozza: altrimenti 409 con code order_not_draft.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PurchaseOrderInput' }
      responses:
        '200':
          description: Ordine aggiornato
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseOrder' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: L'ordine non è in bozza (code order_not_draft).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
    delete:
      operationId: deletePurchaseOrder
      summary: Eliminazione di un ordine in bozza
      description: 'Permesso: purchases.delete. Solo in bozza: altrimenti 409 con code order_not_draft.'
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Ordine eliminato
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: L'ordine non è in bozza (code order_not_draft).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /api/companies/{company}/purchase-orders/{order}/duplicate:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/PurchaseOrderId'
    post:
      operationId: duplicatePurchaseOrder
      summary: Copia di un ordine al fornitore, per riordinare
      description: |
        Permessi: purchases.view e purchases.create. Crea un ordine nuovo in bozza allo stesso
        fornitore, per lo stesso cantiere, con le stesse note e una copia di tutte le righe, in
        qualunque stato sia quello di partenza, che non cambia. La data è quella di oggi (ora
        italiana), con il numero successivo del suo anno; la data di consegna resta vuota.
        Senza permesso di vedere gli ordini risponde 404.
      security:
        - session: []
          csrf: []
      responses:
        '201':
          description: La copia in bozza
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseOrder' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{company}/purchase-orders/{order}/status:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/PurchaseOrderId'
    post:
      operationId: changePurchaseOrderStatus
      summary: Invio, ricevimento o ritorno indietro di un ordine
      description: |
        Permesso: purchases.update. Da draft a sent (inviato al fornitore), da sent a received
        (merce ricevuta), e indietro di un passo: da sent a draft, da received a sent. Un ordine
        senza righe non si invia (422 sotto lines). Gli altri passaggi rispondono 409 con code
        invalid_transition; un ordine già caricato in magazzino non torna indietro (409 con code
        has_documents).
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/PurchaseOrderStatus' }
      responses:
        '200':
          description: Stato cambiato
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseOrder' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            Passaggio di stato non ammesso (code invalid_transition) o ordine già caricato in
            magazzino (code has_documents).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /api/companies/{company}/purchase-orders/{order}/warehouse-loads:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/PurchaseOrderId'
    post:
      operationId: loadPurchaseOrderIntoWarehouse
      summary: Carico in magazzino della merce di un ordine ricevuto
      description: |
        Permessi: warehouse.create e purchases.view. Solo per ordini received (altrimenti 409
        con code invalid_transition). Crea un movimento di carico per ogni riga indicata, con
        la data indicata e collegato all'ordine; gli articoli si scelgono a mano perché le righe
        dell'ordine sono testo libero. Si può caricare in più volte.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, lines]
              properties:
                date: { $ref: '#/components/schemas/Date' }
                lines:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
                    required: [item_id, quantity]
                    properties:
                      item_id: { $ref: '#/components/schemas/Id' }
                      quantity:
                        description: Quantità maggiore di zero, nell'unità dell'articolo.
                        allOf:
                          - $ref: '#/components/schemas/Quantity'
      responses:
        '201':
          description: Movimenti di carico registrati
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/WarehouseMovement' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: L'ordine non è ricevuto (code invalid_transition).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/warehouse/items:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: listWarehouseItems
      summary: Articoli di magazzino con la giacenza
      description: |
        Permesso: warehouse.view. La ricerca guarda codice e nome. La giacenza è la somma dei
        carichi meno quella degli scarichi, e può essere negativa se manca un carico.
        filter[below_min]=true dà solo gli articoli sotto la scorta minima, da riordinare.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - name: sort
          in: query
          description: Campo di ordinamento; il segno meno vuol dire ordine decrescente.
          schema:
            type: string
            enum: [name, -name, code, -code, stock, -stock]
            default: name
        - $ref: '#/components/parameters/WarehouseItemFilter'
      responses:
        '200':
          description: Una pagina di articoli
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarehouseItemList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    post:
      operationId: createWarehouseItem
      summary: Nuovo articolo di magazzino
      description: 'Permesso: warehouse.create. Il codice, se c''è, è unico nell''azienda (422 su code).'
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WarehouseItemInput' }
      responses:
        '201':
          description: Articolo creato
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarehouseItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/warehouse/items/import:
    parameters:
      - $ref: '#/components/parameters/Company'
    post:
      operationId: importWarehouseItems
      summary: Importazione di articoli nuovi di magazzino da un file CSV, con la giacenza iniziale
      description: |
        Permesso: warehouse.create. Come importClients: stesso formato del file (al massimo
        5000 articoli), solo articoli nuovi, tutti o nessuno, errori sotto `file` o
        `row.<n>`; il file di exportWarehouseItems si reimporta così com'è, se nessuna
        giacenza è negativa. Colonne per nome:
        articolo (nome) e unità sono obbligatorie; le altre sono codice, giacenza (12,500
        oppure 12.5, non negativa, al massimo tre decimali) e note. Ogni riga si controlla
        come createWarehouseItem; un codice già presente nell'azienda o ripetuto nel file
        (senza distinguere maiuscole) è un errore della riga. Una giacenza maggiore di zero
        diventa un carico con la data di oggi e la nota «Giacenza iniziale (importazione)».
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string }
            example: "codice;articolo;unità;giacenza\r\nCEM-01;Cemento 32,5 R;sacco;40\r\n"
      responses:
        '200':
          description: Articoli importati
          content:
            application/json:
              schema:
                type: object
                required: [created, stock_loaded]
                properties:
                  created:
                    type: integer
                    minimum: 1
                    description: Articoli aggiunti.
                  stock_loaded:
                    type: integer
                    minimum: 0
                    description: Articoli con un carico della giacenza iniziale.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413':
          description: File più grande di 5 MB.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '415':
          description: Il corpo non è un file CSV (Content-Type text/csv).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/warehouse/items/export:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: exportWarehouseItems
      summary: Esportazione degli articoli di magazzino con la giacenza in CSV
      description: |
        Permesso: warehouse.view. Stessa ricerca e ordinamento dell'elenco, senza paginazione,
        nello stesso formato dell'esportazione dei clienti. Giacenza con la virgola decimale
        (12,500). Il file si chiama magazzino.csv. Le colonne restano quelle dell'importazione:
        la scorta minima non c'è.
      parameters:
        - $ref: '#/components/parameters/Search'
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, -name, code, -code, stock, -stock]
            default: name
        - $ref: '#/components/parameters/WarehouseItemFilter'
      responses:
        '200':
          description: Il file CSV
          headers:
            Content-Disposition:
              description: attachment, con il nome del file.
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/warehouse/items/{item}:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/WarehouseItemId'
    get:
      operationId: getWarehouseItem
      summary: Un articolo di magazzino
      description: 'Permesso: warehouse.view. Senza permesso risponde 404, non 403.'
      responses:
        '200':
          description: L'articolo
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarehouseItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateWarehouseItem
      summary: Modifica di un articolo
      description: 'Permesso: warehouse.update. Si inviano tutti i campi.'
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WarehouseItemInput' }
      responses:
        '200':
          description: Articolo aggiornato
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarehouseItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
    delete:
      operationId: deleteWarehouseItem
      summary: Eliminazione di un articolo senza movimenti
      description: 'Permesso: warehouse.delete. Con movimenti risponde 409 con code has_documents.'
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Articolo eliminato
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: L'articolo ha movimenti (code has_documents).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /api/companies/{company}/warehouse/movements:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: listWarehouseMovements
      summary: Movimenti di magazzino
      description: 'Permesso: warehouse.view. Dal più recente.'
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: filter
          in: query
          description: |
            Filtri, ad esempio filter[item]=<id>, filter[site]=<id>, filter[kind]=out,
            filter[from]=2026-11-01 e filter[to]=2026-11-30.
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              item: { $ref: '#/components/schemas/Id' }
              site: { $ref: '#/components/schemas/Id' }
              kind: { $ref: '#/components/schemas/WarehouseMovementKind' }
              from: { $ref: '#/components/schemas/Date' }
              to: { $ref: '#/components/schemas/Date' }
      responses:
        '200':
          description: Una pagina di movimenti
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarehouseMovementList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    post:
      operationId: createWarehouseMovement
      summary: Carico o scarico di un articolo
      description: |
        Permesso: warehouse.create. Un movimento non si modifica: si elimina e se ne registra un
        altro. Lo scarico verso un cantiere indica site_id.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WarehouseMovementInput' }
      responses:
        '201':
          description: Movimento registrato
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarehouseMovement' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/warehouse/movements/{movement}:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/WarehouseMovementId'
    delete:
      operationId: deleteWarehouseMovement
      summary: Eliminazione di un movimento
      description: 'Permesso: warehouse.delete. Il movimento non cambia mai, quindi niente If-Match.'
      security:
        - session: []
          csrf: []
      responses:
        '204':
          description: Movimento eliminato
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{company}/sites/{site}/cost-summary:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/SiteId'
    get:
      operationId: getSiteCostSummary
      summary: Riepilogo dei costi di un cantiere, confrontato con il budget
      description: |
        Permesso: costs.view. Senza permesso risponde 404, non 403. Manodopera e mezzi vengono
        dai rapportini approvati, alle ore per il costo orario attuale di dipendenti e mezzi
        (senza costo orario valgono zero e si contano in missing_hourly_costs); poi i costi
        inseriti a mano per categoria. Importi senza IVA. Con invoices.view anche revenue: il
        fatturato del cantiere (imponibile delle fatture emesse collegate) e il margine
        rispetto ai costi; senza quel permesso revenue è null. Con anche estimates.view, in
        revenue ci sono i SAL approvati dei computi del cantiere (certified) e quelli ancora
        senza fattura (certified_uninvoiced), con la ritenuta di garanzia trattenuta
        (retention_held) e quella ancora da svincolare (retention_to_release); lo svincolo già
        fatturato (retention_released) c'è anche senza estimates.view.
      responses:
        '200':
          description: Il riepilogo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteCostSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{company}/sites/{site}/work-summary:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/SiteId'
    get:
      operationId: getSiteWorkSummary
      summary: Ore di un cantiere per dipendente e per mezzo
      description: |
        Permessi: sites.view (senza, 404 come per la scheda) e reports.view (senza, 403). Per
        la scheda squadra del cantiere: ore dai rapportini, giorni con ore, primo e ultimo
        giorno per dipendente e per mezzo, da chi ha più ore. I costi, alle ore per il costo
        orario attuale, ci sono solo con costs.view; senza quel permesso, o senza costo orario,
        sono null. Senza filtri conta tutti i rapportini del cantiere.
      parameters:
        - name: filter
          in: query
          description: |
            Filtri, ad esempio filter[from]=2026-11-01&filter[to]=2026-11-30 (estremi compresi)
            e filter[status]=approved.
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              from: { $ref: '#/components/schemas/Date' }
              to: { $ref: '#/components/schemas/Date' }
              status: { $ref: '#/components/schemas/DailyReportStatus' }
      responses:
        '200':
          description: Le ore del cantiere
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteWorkSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/sites/{site}/documents:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/SiteId'
    get:
      operationId: listSiteDocuments
      summary: Documenti e foto di un cantiere
      description: |
        Permesso: documents.view. Senza permesso, o se il cantiere non c'è, risponde 404. Dal più
        recente. Le foto sono i file JPEG, PNG e WebP; gli altri sono documenti.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: filter
          in: query
          description: |
            Filtri, ad esempio filter[kind]=photo per la scheda delle foto e
            filter[daily_report]=<id> per le foto di un rapportino.
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              kind: { $ref: '#/components/schemas/SiteDocumentKind' }
              daily_report: { $ref: '#/components/schemas/Id' }
      responses:
        '200':
          description: Una pagina di documenti
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteDocumentList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    post:
      operationId: uploadSiteDocument
      summary: Caricamento di un documento o di una foto
      description: |
        Permesso: documents.create. Il corpo è il file, con il suo Content-Type: PDF, JPEG, PNG,
        WebP, Word (.docx) o Excel (.xlsx), al massimo 20 MB. Il contenuto deve corrispondere al
        tipo dichiarato (altrimenti 422 sotto file). Nome del file e titolo nella query; senza
        titolo vale il nome del file. Il file non si sostituisce: si elimina e se ne carica un
        altro. Con daily_report_id il file (di solito una foto scattata in cantiere) resta
        collegato a un rapportino dello stesso cantiere; se il rapportino non c'è o è di un altro
        cantiere, 422 sotto daily_report_id. Il collegamento non si cambia dopo il caricamento;
        se il rapportino viene eliminato, il file resta nel cantiere senza collegamento.
      security:
        - session: []
          csrf: []
      parameters:
        - name: file_name
          in: query
          required: true
          description: Nome originale del file; si tiene solo l'ultima parte del percorso.
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: title
          in: query
          required: false
          schema: { type: string, maxLength: 200 }
        - name: daily_report_id
          in: query
          required: false
          description: Rapportino dello stesso cantiere a cui collegare il file.
          schema: { $ref: '#/components/schemas/Id' }
      requestBody:
        required: true
        content:
          application/pdf:
            schema: { type: string, format: binary }
          image/jpeg:
            schema: { type: string, format: binary }
          image/png:
            schema: { type: string, format: binary }
          image/webp:
            schema: { type: string, format: binary }
          application/vnd.openxmlformats-officedocument.wordprocessingml.document:
            schema: { type: string, format: binary }
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema: { type: string, format: binary }
      responses:
        '201':
          description: File caricato
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteDocument' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413':
          description: File più grande di 20 MB.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '415':
          description: Tipo di file non ammesso.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/sites/{site}/documents/{document}:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/SiteId'
      - $ref: '#/components/parameters/SiteDocumentId'
    get:
      operationId: getSiteDocument
      summary: Un documento del cantiere
      description: 'Permesso: documents.view. Senza permesso risponde 404, non 403.'
      responses:
        '200':
          description: Il documento, senza il file
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteDocument' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateSiteDocument
      summary: Modifica di titolo e note di un documento
      description: 'Permesso: documents.update. Si inviano tutti i campi.'
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SiteDocumentInput' }
      responses:
        '200':
          description: Documento aggiornato
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteDocument' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
    delete:
      operationId: deleteSiteDocument
      summary: Eliminazione di un documento
      description: 'Permesso: documents.delete. Elimina anche il file.'
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Documento eliminato
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /api/companies/{company}/sites/{site}/documents/{document}/content:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/SiteId'
      - $ref: '#/components/parameters/SiteDocumentId'
    get:
      operationId: getSiteDocumentContent
      summary: Il file di un documento
      description: |
        Permesso: documents.view. Senza permesso risponde 404. Il file arriva sempre come
        allegato (Content-Disposition: attachment, con il nome originale); va bene anche come
        sorgente di un tag img per le anteprime delle foto.
      responses:
        '200':
          description: Il file
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Content-Disposition:
              schema: { type: string }
          content:
            application/pdf:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema: { type: string, format: binary }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{company}/cash-flow:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: getCashFlowForecast
      summary: Previsione di cassa, mese per mese
      description: |
        Permesso: invoices.view. Quanto resta da incassare dalle fatture emesse e da pagare
        per quelle ricevute (remaining_amount, come in DashboardInvoices), diviso per mese
        della scadenza di pagamento, a partire dal mese in corso in Italia. Le fatture già
        scadute stanno in overdue e non nel loro mese; quelle senza scadenza in undated;
        quelle oltre l'ultimo mese in later. balance di ogni mese è il saldo accumulato:
        overdue più i netti dei mesi fino a quello compreso. Conta solo le fatture: preventivi,
        ordini e SAL non ancora fatturati restano fuori.
      parameters:
        - name: months
          in: query
          description: Quanti mesi, quello in corso compreso.
          schema:
            type: integer
            minimum: 1
            maximum: 24
            default: 6
      responses:
        '200':
          description: La previsione
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CashFlowForecast' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/cash-flow/export:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: exportCashFlowForecast
      summary: Previsione di cassa in CSV
      description: |
        Permesso e parametro come getCashFlowForecast, nel formato delle altre esportazioni:
        importi con la virgola decimale (1234,50), negativi con il meno. Una riga per lo
        scaduto (Scaduto al 07/11/2026), una per mese (11/2026), poi Oltre, Senza scadenza e
        Totale; il saldo progressivo c'è solo nelle righe dello scaduto e dei mesi. Il file si
        chiama previsione-cassa.csv.
      parameters:
        - name: months
          in: query
          description: Quanti mesi, quello in corso compreso.
          schema:
            type: integer
            minimum: 1
            maximum: 24
            default: 6
      responses:
        '200':
          description: Il file CSV
          headers:
            Content-Disposition:
              description: attachment, con il nome del file.
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/dashboard:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: getDashboard
      summary: Indicatori della dashboard dell'azienda
      description: |
        Qualsiasi membro dell'azienda la chiama; ogni sezione è null se manca il suo permesso:
        sites con sites.view; over_budget con sites.view e costs.view; costs_this_month con
        costs.view; reports con reports.view; deadlines con deadlines.view; invoices con
        invoices.view; progress_statements con estimates.view; quotes con quotes.view; purchase_orders con
        purchases.view; warehouse con warehouse.view. Le date sono quelle
        di oggi in Italia. over_budget elenca, dal più sforato, al massimo 10 cantieri non chiusi
        con un budget e costi oltre il budget (manodopera e mezzi dai rapportini approvati, più
        i costi inseriti a mano, come in getSiteCostSummary). costs_this_month somma i costi del
        mese in corso con la stessa regola. deadlines elenca al massimo 10 scadenze aperte,
        scadute o entro 7 giorni, dalla più vecchia; i conteggi sono in getDeadlineSummary.
        Per i grafici: costs_by_month (costs.view) dà gli ultimi 12 mesi, mese in corso
        compreso, dal più vecchio, con la stessa regola dei costi divisa tra manodopera, mezzi e
        costi inseriti a mano; site_progress (sites.view) elenca al massimo 10 cantieri attivi
        con un cronoprogramma, dal più in ritardo rispetto al previsto.
      responses:
        '200':
          description: Gli indicatori
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{company}/search:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: searchCompany
      summary: Ricerca rapida in tutta l'azienda
      description: |
        Qualsiasi membro dell'azienda la chiama, per la ricerca della barra in alto. Cerca il
        testo (da 2 a 100 caratteri, maiuscole e minuscole uguali) e restituisce al massimo 5
        risultati per tipo, solo dei tipi che l'utente può vedere: client (clients.view: nome,
        partita IVA, codice fiscale, email), supplier (suppliers.view, come i clienti), site
        (sites.view: nome, codice, indirizzo), quote (quotes.view: oggetto e numero, es.
        2026/001), estimate (estimates.view: titolo), invoice (invoices.view: numero e
        descrizione), purchase_order (purchases.view: numero e nome del fornitore), employee
        (employees.view: nome, cognome e codice fiscale), vehicle (vehicles.view: nome e
        targa), deadline (deadlines.view: titolo), price_list_item (price_lists.view: codice e
        descrizione della voce), site_document (documents.view: titolo e nome del file),
        warehouse_item (warehouse.view: nome e codice dell'articolo di magazzino),
        site_activity (sites.view: nome dell'attività del cronoprogramma).
        parent_id è il prezzario della voce o il cantiere del documento o dell'attività, null
        per gli altri tipi. Clienti e fornitori archiviati sono esclusi.
        I tipi escono in quest'ordine; dentro un tipo prima i titoli che iniziano con il testo,
        poi gli altri in ordine alfabetico.
      parameters:
        - name: q
          in: query
          required: true
          description: Il testo da cercare.
          schema: { type: string, minLength: 2, maxLength: 100 }
      responses:
        '200':
          description: I risultati
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResults' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/sites/{site}/activities:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/SiteId'
    get:
      operationId: listSiteActivities
      summary: Cronoprogramma del cantiere
      description: |
        Permesso: sites.view. Senza permesso risponde 404, non 403. Tutte le attività del
        cantiere (al massimo 500), senza paginazione, per disegnare il Gantt: in ordine di inizio,
        fine e nome.
      responses:
        '200':
          description: Le attività
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteActivityList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createSiteActivity
      summary: Nuova attività del cronoprogramma
      description: |
        Permesso: sites.update. Le dipendenze sono attività dello stesso cantiere che devono
        finire prima che questa inizi; un ciclo di dipendenze dà 422 sotto depends_on. Al
        massimo 500 attività per cantiere (422 sotto `_`).
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SiteActivityInput' }
      responses:
        '201':
          description: Attività creata
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteActivity' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/sites/{site}/activities/{activity}:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/SiteId'
      - $ref: '#/components/parameters/SiteActivityId'
    put:
      operationId: updateSiteActivity
      summary: Modifica di un'attività del cronoprogramma
      description: |
        Permesso: sites.update. Si inviano tutti i campi; depends_on sostituisce le dipendenze
        precedenti.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SiteActivityInput' }
      responses:
        '200':
          description: Attività aggiornata
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteActivity' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
    delete:
      operationId: deleteSiteActivity
      summary: Eliminazione di un'attività del cronoprogramma
      description: |
        Permesso: sites.update. Le attività che dipendevano da questa perdono la dipendenza.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Attività eliminata
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /api/companies/{company}/activities:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: listCompanyActivities
      summary: Attività del cronoprogramma di tutti i cantieri
      description: |
        Permesso: sites.view. Le attività di tutti i cantieri, in ordine di fine, inizio e nome,
        con il cantiere. Filtri sul cantiere (filter[site]) e sulle attività da seguire
        (filter[follow_up]), calcolate sulla data italiana e solo per i cantieri previsti o in
        corso (non sospesi né chiusi): late le attività non finite (avanzamento sotto 100) con
        la fine già passata; starting_soon quelle non ancora iniziate (avanzamento 0) che
        iniziano entro 7 giorni da oggi, oggi compreso; in_progress quelle non finite in corso
        oggi. Sono le stesse condizioni di activities in getDashboard.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: filter
          in: query
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              site: { $ref: '#/components/schemas/Id' }
              follow_up: { $ref: '#/components/schemas/ActivityFollowUp' }
      responses:
        '200':
          description: Una pagina di attività
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyActivityList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/activities/export:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: exportCompanyActivities
      summary: Esportazione in CSV delle attività del cronoprogramma di tutti i cantieri
      description: |
        Permesso: sites.view. Stessi filtri e ordinamento di listCompanyActivities, senza
        paginazione, nello stesso formato dell'esportazione dei clienti. Date come 30/11/2026.
        Il file si chiama cronoprogramma.csv.
      parameters:
        - name: filter
          in: query
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              site: { $ref: '#/components/schemas/Id' }
              follow_up: { $ref: '#/components/schemas/ActivityFollowUp' }
      responses:
        '200':
          description: Il file CSV
          headers:
            Content-Disposition:
              description: attachment, con il nome del file.
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/progress-statements:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: listCompanyProgressStatements
      summary: SAL di tutti i computi dell'azienda
      description: |
        Permesso: estimates.view. Dal più recente per data del SAL. Filtri sul cantiere del
        computo (filter[site]), sul cliente del computo (filter[client]), sullo stato
        (filter[status]), sulla fattura (filter[invoiced]:
        true i SAL già fatturati, false quelli senza fattura) e sulla data del SAL
        (filter[from], filter[to]). Con filter[status]=approved e filter[invoiced]=false si
        hanno i SAL approvati da fatturare. total_amount e total_net_amount sommano i SAL che
        rispettano i filtri, non solo quelli della pagina.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: filter
          in: query
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              site: { $ref: '#/components/schemas/Id' }
              client: { $ref: '#/components/schemas/Id' }
              status: { $ref: '#/components/schemas/ProgressStatementStatus' }
              invoiced: { type: string, enum: ['true', 'false'] }
              from: { $ref: '#/components/schemas/Date' }
              to: { $ref: '#/components/schemas/Date' }
      responses:
        '200':
          description: Una pagina di SAL
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyProgressStatementList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/progress-statements/export:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: exportCompanyProgressStatements
      summary: Esportazione in CSV dei SAL di tutta l'azienda
      description: |
        Permesso: estimates.view. Stessi filtri e ordinamento di listCompanyProgressStatements,
        senza paginazione, nello stesso formato dell'esportazione dei clienti. Date come
        30/11/2026, importi con la virgola decimale (1234,50). Il file si chiama sal.csv.
      parameters:
        - name: filter
          in: query
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              site: { $ref: '#/components/schemas/Id' }
              client: { $ref: '#/components/schemas/Id' }
              status: { $ref: '#/components/schemas/ProgressStatementStatus' }
              invoiced: { type: string, enum: ['true', 'false'] }
              from: { $ref: '#/components/schemas/Date' }
              to: { $ref: '#/components/schemas/Date' }
      responses:
        '200':
          description: Il file CSV
          headers:
            Content-Disposition:
              description: attachment, con il nome del file.
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/estimates/{estimate}/progress-statements:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/EstimateId'
    get:
      operationId: listProgressStatements
      summary: SAL del computo
      description: |
        Permesso: estimates.view. Senza permesso risponde 404. Tutti gli stati di avanzamento
        lavori del computo, in ordine di numero, senza le righe.
      responses:
        '200':
          description: I SAL
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProgressStatementList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createProgressStatement
      summary: Nuovo SAL
      description: |
        Permesso: estimates.update. Il SAL nasce in bozza con il numero successivo. Le quantità
        sono quelle eseguite in questo SAL, voce per voce; il prezzo si copia dalla voce del
        computo. Se c'è già un SAL in bozza risponde 409 con code statement_draft_exists.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProgressStatementInput' }
      responses:
        '201':
          description: SAL creato
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProgressStatement' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: C'è già un SAL in bozza (code statement_draft_exists).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/estimates/{estimate}/progress-statements/{statement}:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/EstimateId'
      - $ref: '#/components/parameters/ProgressStatementId'
    get:
      operationId: getProgressStatement
      summary: Dettaglio di un SAL
      description: |
        Permesso: estimates.view. Le righe sono le voci con una quantità in questo SAL o in uno
        precedente, con quantità e importi del SAL, dei precedenti e progressivi.
      responses:
        '200':
          description: Il SAL
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProgressStatement' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateProgressStatement
      summary: Modifica di un SAL in bozza
      description: |
        Permesso: estimates.update. Si inviano tutti i campi; le righe sostituiscono le
        precedenti e riprendono il prezzo attuale delle voci. Solo in bozza: altrimenti 409 con
        code statement_not_draft.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProgressStatementInput' }
      responses:
        '200':
          description: SAL aggiornato
          headers:
