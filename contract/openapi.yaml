    put:
      operationId: setEmployeeDocumentFile
      summary: Caricamento o sostituzione del file di un documento del dipendente
      description: |
        Permesso: employees.update. Il corpo è il file, con il suo Content-Type: PDF, JPEG o
        PNG (l'attestato o il giudizio di idoneità, scansionato o fotografato), al massimo 20 MB. Il contenuto deve
