            default: -updated_at
        - name: filter
          in: query
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              status: { $ref: '#/components/schemas/SiteStatus' }
              client: { $ref: '#/components/schemas/Id' }
              report_missing:
                type: boolean
                description: |
                  true: cantieri attivi senza un rapportino (in qualunque stato) con la data di
                  oggi, gli stessi contati in reports.missing_today di getDashboard. false:
                  cantieri attivi che il rapportino di oggi ce l'hanno.
              subcontractor_compliance:
                type: string
                enum: [expired, expiring, no_valid_durc, no_valid_credit_license]
                description: |
                  Cantieri con almeno un subappaltatore (con un costo o un ordine sul cantiere,
                  anche archiviato) nella condizione indicata, come filter[compliance] dei
                  fornitori e listSiteSubcontractors. Serve anche suppliers.view, altrimenti 403.
              team_documents:
                type: string
                enum: [expired, expiring]
                description: |
                  Cantieri con almeno un dipendente della squadra (getSiteTeam) con un documento
                  nella condizione indicata, come filter[documents] dei dipendenti. expired basta
                  sites.view, come documents_expired della squadra; expiring vuole anche
                  employees.view, altrimenti 403.
      responses:
        '200':
          description: Il file CSV
          headers:
            Content-Disposition:
              description: attachment, con il nome del file.
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/sites/{site}:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/SiteId'
    get:
      operationId: getSite
      summary: Scheda di un cantiere
      description: 'Permesso: sites.view. Senza permesso risponde 404, non 403.'
      responses:
        '200':
          description: Il cantiere
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Site' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateSite
      summary: Modifica di un cantiere
      description: 'Permesso: sites.update. Si inviano tutti i campi.'
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SiteInput' }
      responses:
        '200':
          description: Cantiere aggiornato
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Site' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
    delete:
      operationId: deleteSite
      summary: Eliminazione di un cantiere
      description: 'Permesso: sites.delete.'
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Cantiere eliminato
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            Il cantiere ha rapportini, costi, documenti o computi collegati (code has_documents).
            Si può chiudere.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /api/companies/{company}/sites/{site}/team:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/SiteId'
    get:
      operationId: getSiteTeam
      summary: Squadra del cantiere
      description: |
        Permesso: sites.view. Senza permesso risponde 404, non 403. Solo nome, cognome,
        mansione e stato dei dipendenti, senza costi: la vede anche chi non ha employees.view.
        In ordine di cognome e nome. Con le assenze di oggi, nel calendario italiano: `away`
        per chi è assente tutto il giorno; tipo dell'assenza e ore di un permesso solo con
        employees.view. `documents_expired` per chi ha un documento scaduto (idoneità,
        attestato di un corso…), senza dire quale.
      responses:
        '200':
          description: La squadra
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteTeam' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: replaceSiteTeam
      summary: Modifica della squadra del cantiere
      description: |
        Permesso: sites.update. Si invia l'elenco completo dei dipendenti, che sostituisce il
        precedente (al massimo 200, i doppioni si tolgono). Senza If-Match: il valore è assoluto.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SiteTeamInput' }
      responses:
        '200':
          description: La squadra aggiornata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteTeam' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/sites/{site}/team/documents/export:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/SiteId'
    get:
      operationId: exportSiteTeamDocuments
      summary: Documenti della squadra del cantiere in CSV
      description: |
        Permessi: sites.view ed employees.view. Senza sites.view risponde 404, non 403; senza
        employees.view 403. Per il coordinatore della sicurezza: una riga per ogni documento dei
        dipendenti della squadra (idoneità sanitaria, attestati dei corsi, patentini), in ordine
        di cognome e nome, poi di tipo e di scadenza; chi non ha documenti ha una riga con lo
        stato «Nessun documento». Colonne: Cognome, Nome, Mansione, Documento (il tipo per
        esteso), Descrizione, Rilascio, Scadenza (come 30/11/2026), Stato, Note, File (Sì se c'è
        la scansione). Lo stato, nell'ora italiana: Valido, In scadenza (entro 30 giorni),
        Scaduto, Senza scadenza, oppure Rinnovato se dello stesso tipo c'è un documento con una
        scadenza più lontana, che è quello che conta. Stesso formato dell'esportazione dei
        clienti. Il file si chiama documenti-squadra.csv.
      responses:
        '200':
          description: Il file CSV
          headers:
            Content-Disposition:
              description: attachment, con il nome del file.
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{company}/sites/{site}/subcontractors:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/SiteId'
    get:
      operationId: listSiteSubcontractors
      summary: Subappaltatori del cantiere
      description: |
        Permessi: sites.view e suppliers.view. Senza sites.view risponde 404, non 403; senza
        suppliers.view 403. Per la scheda del cantiere: i subappaltatori (fornitori con
        `subcontractor`) che hanno sul cantiere un costo o un ordine, anche archiviati, in ordine
        di nome, gli stessi del CSV dei loro documenti. Per ognuno la regolarità con le stesse
        condizioni di filter[compliance] dei fornitori: `documents_expired`, `documents_expiring`
        (entro 30 giorni, senza nulla di scaduto), `no_valid_durc` e `no_valid_credit_license`.
        Nessun importo. Senza
        paginazione: sono pochi per cantiere.
      responses:
        '200':
          description: I subappaltatori del cantiere
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteSubcontractorList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{company}/sites/{site}/subcontractors/documents/export:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/SiteId'
    get:
      operationId: exportSiteSubcontractorDocuments
      summary: Documenti dei subappaltatori del cantiere in CSV
      description: |
        Permessi: sites.view e suppliers.view. Senza sites.view risponde 404, non 403; senza
        suppliers.view 403. Per il coordinatore della sicurezza, come i documenti della squadra:
        i subappaltatori (fornitori con `subcontractor`) che hanno sul cantiere un costo o un
        ordine, anche archiviati, in ordine di nome; una riga per ogni loro documento (DURC,
        visura camerale, assicurazione), poi di tipo e di scadenza; chi non ha documenti ha una
        riga con lo stato «Nessun documento». Colonne: Subappaltatore, Partita IVA, Documento (il
        tipo per esteso), Descrizione, Rilascio, Scadenza (come 30/11/2026), Stato, Note, File
        (Sì se c'è la scansione). Stati come nei documenti della squadra: Valido, In scadenza
        (entro 30 giorni), Scaduto, Senza scadenza, Rinnovato. Nessun importo. Il file si chiama
        documenti-subappaltatori.csv.
      responses:
        '200':
          description: Il file CSV
          headers:
            Content-Disposition:
              description: attachment, con il nome del file.
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{company}/daily-reports:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: listDailyReports
      summary: Elenco dei rapportini
      description: |
        Permesso: reports.view. Senza le righe delle ore, con i totali. Ordine predefinito: dal
        giorno più recente, poi per nome del cantiere.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: sort
          in: query
          description: Campo di ordinamento; il segno meno vuol dire ordine decrescente.
          schema:
            type: string
            enum: [date, -date, updated_at, -updated_at]
            default: -date
        - name: filter
          in: query
          description: |
            Filtri, ad esempio filter[site]=<id>, filter[status]=submitted,
            filter[from]=2026-11-01 e filter[to]=2026-11-30 (estremi compresi).
            filter[employee]=<id> e filter[vehicle]=<id> tengono i rapportini con ore di quel
            dipendente o di quel mezzo, per le schede di dipendenti e mezzi. filter[q]=testo
            cerca nei lavori eseguiti e nelle note, senza distinguere maiuscole e minuscole.
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              site: { $ref: '#/components/schemas/Id' }
              employee: { $ref: '#/components/schemas/Id' }
              vehicle: { $ref: '#/components/schemas/Id' }
              status: { $ref: '#/components/schemas/DailyReportStatus' }
              from: { $ref: '#/components/schemas/Date' }
              to: { $ref: '#/components/schemas/Date' }
              q:
                type: string
                maxLength: 100
      responses:
        '200':
          description: Una pagina di rapportini
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DailyReportList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    post:
      operationId: createDailyReport
      summary: Nuovo rapportino
      description: |
        Permesso: reports.create. Nasce in bozza. Uno solo per cantiere e giorno (altrimenti
        422 su date). Dipendenti e mezzi sono quelli dell'azienda, anche fuori dalla squadra.
        Niente ore a un dipendente assente tutto il giorno (un'assenza senza ore che comprende
        la data): 422 sotto `labor.N.employee_id`, senza dire il tipo dell'assenza. Un permesso
        a ore non blocca.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DailyReportInput' }
      responses:
        '201':
          description: Rapportino creato
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DailyReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/daily-reports/today:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: getTodayDailyReport
      summary: Rapportino del giorno di un cantiere, per il telefono
      description: |
        Permesso: reports.view. Il rapportino del cantiere in quel giorno, se c'è; altrimenti
        una proposta da inviare a createDailyReport, con la squadra del cantiere a 8 ore.
        Senza date vale oggi, nel calendario italiano. Con i dipendenti e i mezzi attivi da
        scegliere (solo nomi, niente costi), anche per chi non ha employees.view o vehicles.view.
        Con `copy_previous=true` la proposta prende persone, mezzi, ore e descrizioni delle
        righe dall'ultimo rapportino del cantiere prima di quel giorno («come ieri»), lasciando
        fuori dipendenti e mezzi non più attivi; meteo, lavori svolti e note restano vuoti.
        Senza un rapportino precedente la proposta è quella della squadra. Chi è assente tutto
        il giorno (ferie, malattia…, un'assenza senza ore) resta fuori dalla proposta e tra i
        dipendenti da scegliere ha `away`; il tipo dell'assenza e le ore di un permesso solo
        con employees.view. Tra i dipendenti e i mezzi da scegliere `documents_expired` dice
        chi ha un documento scaduto in quel giorno (idoneità, corso, assicurazione, bollo…),
        senza dire quale: è un avviso, le ore si possono segnare lo stesso.
      parameters:
        - name: site
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Id' }
        - name: date
          in: query
          schema: { $ref: '#/components/schemas/Date' }
        - name: copy_previous
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Il rapportino del giorno o la proposta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DailyReportToday' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/daily-reports/export:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: exportDailyReports
      summary: Esportazione dei rapportini in CSV
      description: |
        Permesso: reports.view. Stessi filtri e ordinamento dell'elenco, senza paginazione, nello
        stesso formato dell'esportazione dei clienti. Date come 30/11/2026, importi con la
        virgola decimale (1234,50). In fondo le colonne «Ore straordinario»
        (total_overtime_hours), «Ore perse per maltempo» (total_weather_hours), «Dipendenti in
        trasferta» (travel_count) e «Festivo» (holiday, Sì o No). Il file si chiama
        rapportini.csv.
      parameters:
        - name: sort
          in: query
          schema:
            type: string
            enum: [date, -date, updated_at, -updated_at]
            default: -date
        - name: filter
          in: query
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              site: { $ref: '#/components/schemas/Id' }
              employee: { $ref: '#/components/schemas/Id' }
              vehicle: { $ref: '#/components/schemas/Id' }
              status: { $ref: '#/components/schemas/DailyReportStatus' }
              from: { $ref: '#/components/schemas/Date' }
              to: { $ref: '#/components/schemas/Date' }
              q:
                type: string
                maxLength: 100
      responses:
        '200':
          description: Il file CSV
          headers:
            Content-Disposition:
              description: attachment, con il nome del file.
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/daily-reports/monthly-hours:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: exportMonthlyHours
      summary: Foglio ore mensile dei dipendenti in CSV
      description: |
        Permessi: reports.view ed employees.view. Le ore dei rapportini di un mese, da mandare al
        consulente del lavoro per le buste paga: una riga per dipendente con ore nel mese (per
        cognome e nome), con cognome, nome e codice fiscale, una colonna per ogni giorno del
        mese (1, 2, … 31; vuota se zero) e il totale. Ore con la virgola decimale (7,5). Se un
        dipendente lavora su due cantieri lo stesso giorno, le ore si sommano. Si possono tenere
        solo i rapportini di un cantiere o di uno stato (per esempio solo gli approvati). Senza
        filter[site] ci sono anche le assenze (listEmployeeAbsences), qualunque sia
        filter[status]: nei giorni di assenza la cella porta la sigla, dopo le ore se ci sono
        (FE ferie, MA malattia, PE permesso, IN infortunio, AL altro; con le ore del permesso,
        come «6 PE 2»), e compare anche chi nel mese ha solo assenze, con totale 0. Dopo il
        totale, la colonna «Di cui straordinario» con la somma di overtime_hours del mese (0 se
        non ce ne sono), poi «Giorni di trasferta»: i giorni del mese con almeno una riga con
        travel (un giorno su due cantieri conta una volta), poi «Di cui festive»: le ore lavorate
        di domenica, nei festivi nazionali (Pasquetta compresa) e nel santo patrono dei dati
        dell'azienda (0 se non ce ne sono), poi «Ore perse per maltempo»: la somma di
        weather_hours del mese (0 se non ce ne sono), per la cassa integrazione per intemperie.
        Il file si chiama ore-2026-11.csv.
      parameters:
        - name: month
          in: query
          required: true
          description: Il mese, come 2026-11.
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        - name: filter
          in: query
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              site: { $ref: '#/components/schemas/Id' }
              status: { $ref: '#/components/schemas/DailyReportStatus' }
      responses:
        '200':
          description: Il file CSV
          headers:
            Content-Disposition:
              description: attachment, con il nome del file.
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/daily-reports/monthly-site-hours:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: exportMonthlySiteHours
      summary: Ore mensili dei dipendenti per cantiere in CSV
      description: |
        Permessi: reports.view ed employees.view. Le ore dei rapportini di un mese divise per
        cantiere, come le chiedono la Cassa Edile e il consulente del lavoro: una riga per
        dipendente e cantiere con ore nel mese (per cognome, nome e nome del cantiere), con
        cognome, nome, codice fiscale, cantiere, codice e indirizzo del cantiere, giorni con
        ore e ore (con la virgola decimale, 7,5), poi «Di cui straordinario» (somma di
        overtime_hours, 0 se non ce ne sono), «Giorni di trasferta» (giorni con travel su quel
        cantiere) e «Di cui festive» (ore di domenica, dei festivi nazionali e del santo patrono
        dei dati dell'azienda), poi «Ore perse per maltempo» (somma di weather_hours su quel
        cantiere). Si possono tenere solo i rapportini di un
        cantiere o di uno stato (per esempio solo gli approvati). Il file si chiama
        ore-cantieri-2026-11.csv.
      parameters:
        - name: month
          in: query
          required: true
          description: Il mese, come 2026-11.
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        - name: filter
          in: query
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              site: { $ref: '#/components/schemas/Id' }
              status: { $ref: '#/components/schemas/DailyReportStatus' }
      responses:
        '200':
          description: Il file CSV
          headers:
            Content-Disposition:
              description: attachment, con il nome del file.
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/daily-reports/pdf:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: getWorkLogPdf
      summary: Giornale dei lavori di un cantiere in PDF
      description: |
        Permesso: reports.view. I rapportini di un cantiere in un periodo, per data, in un solo
        PDF da archiviare o consegnare alla direzione lavori: ognuno comincia su una pagina
        nuova, come in getDailyReportPdf (anche con «festivo» nel titolo e con il CIG e il CUP
        del cantiere). Cantiere, inizio e fine sono obbligatori; si possono
        tenere solo i rapportini di uno stato (per esempio solo gli approvati). Al massimo 200
        rapportini: oltre, 422 sotto filter[to] e si accorcia il periodo. Senza rapportini nel
        periodo, 422 sotto filter[from]. Un cantiere che non c'è o di un'altra azienda risponde
        404. Il file si chiama giornale-lavori-C-1-2026-11-01-2026-11-30.pdf (codice del
        cantiere, se c'è, e periodo).
      parameters:
        - name: filter
          in: query
          required: true
          style: deepObject
          explode: true
          schema:
            type: object
            required: [site, from, to]
            properties:
              site: { $ref: '#/components/schemas/Id' }
              from: { $ref: '#/components/schemas/Date' }
              to: { $ref: '#/components/schemas/Date' }
              status: { $ref: '#/components/schemas/DailyReportStatus' }
      responses:
        '200':
          description: Il PDF
          headers:
            Content-Disposition:
              description: attachment, con il nome del file.
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/daily-reports/{report}:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/DailyReportId'
    get:
      operationId: getDailyReport
      summary: Un rapportino con le ore
      description: 'Permesso: reports.view. Senza permesso risponde 404, non 403.'
      responses:
        '200':
          description: Il rapportino
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DailyReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateDailyReport
      summary: Modifica di un rapportino in bozza
      description: |
        Permesso: reports.update. Si inviano tutti i campi; le righe delle ore sostituiscono le
        precedenti. Solo in bozza: altrimenti 409 con code report_not_draft. Come in
        createDailyReport, 422 sotto `labor.N.employee_id` per un dipendente assente tutto il
        giorno.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DailyReportInput' }
      responses:
        '200':
          description: Rapportino aggiornato
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DailyReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Il rapportino non è in bozza (code report_not_draft).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
    delete:
      operationId: deleteDailyReport
      summary: Eliminazione di un rapportino in bozza
      description: 'Permesso: reports.delete. Solo in bozza: altrimenti 409 con code report_not_draft.'
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Rapportino eliminato
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Il rapportino non è in bozza (code report_not_draft).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /api/companies/{company}/daily-reports/{report}/pdf:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/DailyReportId'
    get:
      operationId: getDailyReportPdf
      summary: PDF del rapportino da stampare e firmare
      description: |
        Permesso: reports.view. Il rapportino in A4, da archiviare o da far firmare al
        committente o al direttore dei lavori: intestazione dell'azienda, cantiere (con la riga
        «CIG … - CUP …» sotto l'indirizzo, solo se il cantiere ne ha almeno uno), data, meteo,
        lavori eseguiti, ore dei dipendenti e dei mezzi con i totali, note e spazi per le firme.
        Lo straordinario compare accanto al dipendente («straordinario 2») e sotto il totale
        delle ore («di cui straordinario»), solo se c'è. Di domenica, nei festivi nazionali
        (Pasquetta compresa) e nel santo patrono dei dati dell'azienda il titolo dice «festivo»
        («Rapportino del 06/12/2026, festivo»), come `holiday` del rapportino. Niente costi. Una bozza esce con la dicitura «bozza»; un rapportino approvato riporta
        chi l'ha approvato e quando. Il file si chiama rapportino-2026-11-05-C-1.pdf (data e
        codice del cantiere, se c'è). Senza permesso risponde 404, non 403.
      responses:
        '200':
          description: Il PDF
          headers:
            Content-Disposition:
              description: attachment, con il nome del file.
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{company}/daily-reports/{report}/status:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/DailyReportId'
    post:
      operationId: changeDailyReportStatus
      summary: Invio, approvazione o ritorno in bozza di un rapportino
      description: |
        Da draft a submitted (invio) con reports.update; da submitted ad approved e da
        submitted o approved a draft (ritorno in bozza per correggere) con reports.approve.
        Gli altri passaggi rispondono 409 con code invalid_transition.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/DailyReportStatus' }
      responses:
        '200':
          description: Stato cambiato
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DailyReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Passaggio di stato non ammesso (code invalid_transition).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /api/companies/{company}/costs:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: listSiteCosts
      summary: Elenco dei costi inseriti a mano
      description: |
        Permesso: costs.view. Materiali, noli, subappalti e altri costi dei cantieri, dal più
        recente. total_amount è la somma di tutti i costi che rispettano i filtri, non solo
        della pagina. Manodopera e mezzi dei rapportini non sono qui.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: sort
          in: query
          description: Campo di ordinamento; il segno meno vuol dire ordine decrescente.
          schema:
            type: string
            enum: [date, -date, amount, -amount]
            default: -date
        - name: filter
          in: query
          description: |
            Filtri, ad esempio filter[site]=<id>, filter[category]=materials,
            filter[supplier]=<id>, filter[from]=2026-11-01 e filter[to]=2026-11-30 e
            filter[q]=testo (nella descrizione e nelle note, senza distinguere maiuscole e
            minuscole, e nel CIG e nel CUP del cantiere, anche in parte o con gli spazi).
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              site: { $ref: '#/components/schemas/Id' }
              supplier: { $ref: '#/components/schemas/Id' }
              category: { $ref: '#/components/schemas/CostCategory' }
              from: { $ref: '#/components/schemas/Date' }
              to: { $ref: '#/components/schemas/Date' }
              q:
                type: string
                maxLength: 100
      responses:
        '200':
          description: Una pagina di costi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteCostList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    post:
      operationId: createSiteCost
      summary: Nuovo costo di un cantiere
      description: 'Permesso: costs.create.'
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SiteCostInput' }
      responses:
        '201':
          description: Costo registrato
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteCost' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/site-costs/totals:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: listSiteCostTotals
      summary: Costi di tutti i cantieri confrontati con il budget
      description: |
        Permessi: costs.view e sites.view (senza uno dei due, 403). Un elemento per cantiere,
        anche senza costi (a zero). Il totale segue la regola di getSiteCostSummary: manodopera
        e mezzi dai rapportini approvati al costo orario fissato all'approvazione, più i costi
        inseriti a mano;
        il materiale del magazzino e gli ordini ai fornitori restano fuori. Importi senza IVA.
        budget_remaining è il budget meno il totale, null senza budget; nell'ordinamento per
        residuo i cantieri senza budget vanno in fondo in entrambe le direzioni.
        filter[over_budget]=true lascia i cantieri con un budget superato, false gli altri
        (quelli senza budget compresi). total_amount e budget_amount sommano tutti i cantieri
        che rispettano i filtri, non solo la pagina. search cerca nel nome e nel codice del
        cantiere, e nel CIG e nel CUP (anche in parte, in minuscolo o con gli spazi). Con
        filter[from] e/o filter[to] (date del rapportino o del costo, estremi
        compresi) period_total dà la parte del totale che cade nel periodo e
        period_total_amount la somma sui cantieri filtrati; senza periodo valgono null.
        Budget, residuo e over_budget restano sul totale di sempre; sort=period_total ordina per
        costo del periodo (senza periodo coincide con sort=total). 422 se una data non è valida
        o la fine viene prima dell'inizio.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - name: sort
          in: query
          description: Campo di ordinamento; il segno meno vuol dire ordine decrescente.
          schema:
            type: string
            enum: [name, -name, total, -total, period_total, -period_total, remaining, -remaining]
            default: name
        - name: filter
          in: query
          description: |
            Filtri, ad esempio filter[status]=active, filter[over_budget]=true,
            filter[from]=2026-11-01 e filter[to]=2026-11-30.
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              status: { $ref: '#/components/schemas/SiteStatus' }
              over_budget: { type: boolean }
              from: { $ref: '#/components/schemas/Date' }
              to: { $ref: '#/components/schemas/Date' }
      responses:
        '200':
          description: Una pagina di cantieri con i loro costi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteCostTotalList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/site-costs/totals/export:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: exportSiteCostTotals
      summary: Esportazione dei costi di tutti i cantieri in CSV
      description: |
        Permessi: costs.view e sites.view. Stessi filtri, ricerca e ordinamento dell'elenco,
        senza paginazione, nello stesso formato dell'esportazione dei clienti. Importi con la
        virgola decimale (1234,50); budget e residuo vuoti senza budget; «Sopra budget» vale Sì
        o No. Dopo «Sopra budget» le colonne CIG e CUP del cantiere, vuote se mancano. Con
        filter[from] o filter[to] c'è in fondo la colonna «Costo del periodo». Il file si
        chiama costi-cantieri.csv.
      parameters:
        - $ref: '#/components/parameters/Search'
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, -name, total, -total, period_total, -period_total, remaining, -remaining]
            default: name
        - name: filter
          in: query
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              status: { $ref: '#/components/schemas/SiteStatus' }
              over_budget: { type: boolean }
              from: { $ref: '#/components/schemas/Date' }
              to: { $ref: '#/components/schemas/Date' }
      responses:
        '200':
          description: Il file CSV
          headers:
            Content-Disposition:
              description: attachment, con il nome del file.
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/costs/export:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: exportSiteCosts
