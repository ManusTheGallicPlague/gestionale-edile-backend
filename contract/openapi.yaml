      - $ref: '#/components/parameters/VehicleId'
    get:
      operationId: getVehicleWorkSummary
      summary: Ore del mezzo per cantiere
      description: |
        Permessi: vehicles.view (senza, 404 come per la scheda) e reports.view (senza, 403). Per la
        scheda del mezzo: ore dai rapportini, giorni con ore e costo per cantiere, dal cantiere con
        più ore. Il costo usa il costo orario fissato
        all'approvazione del rapportino (attuale per i rapportini non approvati), come il
        riepilogo dei costi del cantiere; è null se nessuna riga ha un costo orario. Senza
        filtri conta tutti i rapportini.
        maintenance: numero e spesa delle manutenzioni del mezzo nello stesso periodo (filter[status]
        non conta).
        fuel: numero di rifornimenti, litri e spesa del carburante nello stesso periodo
        (filter[status] non conta), con il consumo medio (litri ogni 100 km per gli automezzi,
        litri all'ora per gli altri).
      parameters:
        - name: filter
          in: query
          description: |
            Filtri, ad esempio filter[from]=2026-11-01&filter[to]=2026-11-30 (estremi compresi)
            e filter[status]=approved.
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              from: { $ref: '#/components/schemas/Date' }
              to: { $ref: '#/components/schemas/Date' }
              status: { $ref: '#/components/schemas/DailyReportStatus' }
      responses:
        '200':
