openapi: 3.1.0
info:
  title: Gestionale edile API
  version: 0.1.0
  description: |
    Contratto tra frontend e backend: è l'unica fonte. Ogni cambio di API passa prima da qui.
    Proposta da concordare con il backend: vedi docs/adr/0003-contratto-api-e-sessione.md.

    COPIA DEL BACKEND: è la PR #7 di gestionale-edile (commit 660b946) con le modifiche
    proposte nel commento del 4 novembre 2026. Quando la PR viene aggiornata, si sostituisce
    con la versione concordata.

    Regole comuni:
    - Sessione con cookie HttpOnly, frontend e API sullo stesso dominio.
    - Le richieste che modificano dati (POST, PUT, PATCH, DELETE) portano l'header X-XSRF-TOKEN,
      copia del cookie XSRF-TOKEN. Il cookie lo imposta GET /api/auth/csrf.
    - L'azienda è nel percorso: /api/companies/{company}/... Il backend verifica a ogni richiesta
      che l'utente ne faccia parte; se non è così risponde 404, come per un record che non esiste.
    - Importi e quantità sono stringhe decimali ("1234.50"); date e orari in ISO 8601.

servers:
  - url: /
    description: Stesso dominio del frontend

security:
  - session: []

paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Stato del servizio
      description: |
        Per il bilanciatore, l'orchestratore dei container e i controlli di disponibilità.
        Senza sessione e senza dati delle aziende. 200 se l'API raggiunge il database, 503
        con code database_unavailable se non risponde entro 2 secondi.
      security: []
      responses:
        '200':
          description: Il servizio funziona
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
        '503':
          description: Il database non risponde
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/auth/csrf:
    get:
      operationId: getCsrfCookie
      summary: Imposta il cookie XSRF-TOKEN
      description: |
        Il frontend lo chiama quando il cookie manca, prima della prima richiesta che modifica dati.
        Il backend rinnova il token a ogni accesso e uscita, insieme alla sessione.
      security: []
      responses:
        '204':
          description: Cookie XSRF-TOKEN impostato (non HttpOnly, SameSite=Lax, Secure)

  /api/auth/login:
    post:
      operationId: login
      summary: Accesso con email e password
      description: |
        Se va a buon fine, il backend crea una nuova sessione e invalida la precedente.
        Con credenziali sbagliate risponde 422 con un messaggio generico sul campo email,
        senza rivelare se l'email esiste.
      security:
        - csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInput' }
      responses:
        '204':
          description: Accesso eseguito
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/auth/password-reset:
    post:
      operationId: requestPasswordReset
      summary: Password dimenticata, richiesta del link
      description: |
        Serve il token CSRF (come per l'accesso). Se l'email è di un account attivo il backend
        manda un messaggio con il link /password-dimenticata/{token}, valido un'ora e una volta
        sola; al massimo 3 messaggi l'ora per account. La risposta è sempre 204, anche per
        un'email sconosciuta: non rivela quali account esistono.
      security:
        - csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetRequestInput' }
      responses:
        '204':
          description: Richiesta ricevuta
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/auth/password-reset/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 100
    post:
      operationId: resetPassword
      summary: Password dimenticata, scelta della nuova password
      description: |
        Serve il token CSRF. Con un link valido la password cambia, tutte le sessioni
        dell'account si chiudono e gli altri link inviati smettono di funzionare; poi si
        accede con la nuova password. Un link sconosciuto, già usato o scaduto risponde 404.
      security:
        - csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetInput' }
      responses:
        '204':
          description: Password cambiata
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/auth/logout:
    post:
      operationId: logout
      summary: Uscita
      description: Il backend chiude la sessione sul server, non si limita a cancellare il cookie.
      security:
        - session: []
          csrf: []
      responses:
        '204':
          description: Uscita eseguita
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/me:
    get:
      operationId: getMe
      summary: Utente collegato, con le sue aziende e i permessi in ognuna
      responses:
        '200':
          description: Utente collegato
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      operationId: updateMe
      summary: Cambio del proprio nome
      description: L'email non si cambia da qui.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileInput' }
      responses:
        '200':
          description: Profilo aggiornato
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/me/password:
    post:
      operationId: changePassword
      summary: Cambio della propria password
      description: |
        Serve la password attuale: se è sbagliata la risposta è 422 sul campo
        current_password e conta come tentativo di accesso fallito (dopo troppi, 429). La
        nuova password ha almeno 10 caratteri. Le altre sessioni dell'utente vengono chiuse;
        quella da cui arriva la richiesta resta aperta.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordChangeInput' }
      responses:
        '204':
          description: Password cambiata
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/companies/{company}/clients:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: listClients
      summary: Elenco dei clienti
      description: 'Permesso: clients.view'
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - name: sort
          in: query
          description: Campo di ordinamento; il segno meno vuol dire ordine decrescente.
          schema:
            type: string
            enum: [name, -name, created_at, -created_at]
            default: name
        - name: filter
          in: query
          description: |
            Filtri, ad esempio filter[kind]=company. filter[archived]=true mostra solo i clienti
            archiviati; senza il filtro, o con false, solo quelli attivi.
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              kind: { $ref: '#/components/schemas/ClientKind' }
              archived:
                type: boolean
                default: false
      responses:
        '200':
          description: Una pagina di clienti
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    post:
      operationId: createClient
      summary: Nuovo cliente
      description: 'Permesso: clients.create'
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientInput' }
      responses:
        '201':
          description: Cliente creato
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Client' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/clients/import:
    parameters:
      - $ref: '#/components/parameters/Company'
    post:
      operationId: importClients
      summary: Importazione di clienti nuovi da un file CSV
      description: |
        Permesso: clients.create. Per chi arriva da un altro programma. Il file è come quello
        di importPriceListItems (UTF-8, al massimo 5 MB, separatore riconosciuto dalla prima
        riga) e ha al massimo 5000 clienti; il file di exportClients si reimporta così com'è
        (l'apostrofo davanti alle celle che sembrano formule si toglie). Colonne per nome,
        in qualsiasi ordine: nome (ragione sociale, denominazione) è obbligatoria; le altre
        sono tipo (impresa, azienda, privato, persona, ente pubblico, PA; vuoto vale
        impresa), partita IVA, codice fiscale, email, PEC, telefono, codice destinatario
        (codice SDI), indirizzo, CAP, città (comune), provincia, paese (vuoto vale IT), note.
        Anche i nomi dei campi di ClientInput vanno bene. Ogni riga si controlla come
        createClient, anche le partite IVA e i codici fiscali già presenti o ripetuti nel
        file.

        Si aggiungono solo clienti nuovi, tutti o nessuno: se anche una riga è sbagliata non
        cambia niente e la risposta è 422 con gli errori sotto `file` o sotto `row.<n>` (n è
        la riga del file, la prima è l'intestazione; al massimo 50 righe), ogni messaggio
        preceduto dal nome della colonna.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string }
            example: "nome;partita iva;città\r\nEdil Esempio S.r.l.;01234567897;Bergamo\r\n"
      responses:
        '200':
          description: Clienti importati
          content:
            application/json:
              schema:
                type: object
                required: [created]
                properties:
                  created:
                    type: integer
                    minimum: 1
                    description: Clienti aggiunti.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413':
          description: File più grande di 5 MB.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '415':
          description: Il corpo non è un file CSV (Content-Type text/csv).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/clients/balances:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: listClientBalances
      summary: Crediti verso i clienti, cliente per cliente
      description: |
        Permessi: clients.view e invoices.view. I clienti con fatture emesse ancora da
        saldare, anche se archiviati, dal residuo più alto (a parità, per nome). Gli importi
        sono quelli di SubjectAccount; outstanding e overdue in fondo sono le somme di tutti i
        clienti, non solo della pagina.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: filter
          in: query
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              overdue:
                description: true per avere solo chi ha qualcosa di scaduto.
                type: boolean
      responses:
        '200':
          description: Una pagina di clienti
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubjectBalanceList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/clients/balances/export:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: exportClientBalances
      summary: Esportazione dei crediti verso i clienti in CSV
      description: |
        Permessi e filtro come listClientBalances. Gli stessi clienti nello stesso ordine, senza
        paginazione, nel formato dell'esportazione dei clienti: date come 30/11/2026, importi
        con la virgola decimale (1234,50). Il file si chiama crediti-clienti.csv.
      parameters:
        - name: filter
          in: query
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              overdue:
                description: true per avere solo chi ha qualcosa di scaduto.
                type: boolean
      responses:
        '200':
          description: Il file CSV
          headers:
            Content-Disposition:
              description: attachment, con il nome del file.
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/clients/export:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: exportClients
      summary: Esportazione dei clienti in CSV
      description: |
        Permesso: clients.view. Stessi filtri, ricerca e ordinamento dell'elenco, senza
        paginazione (al massimo 10000 righe). Il file è per i fogli di calcolo in italiano:
        UTF-8 con BOM, separatore punto e virgola, intestazioni in italiano. Le celle che
        inizierebbero con = + - @ sono precedute da un apostrofo, perché il foglio di calcolo
        non le esegua come formule. Il file si chiama clienti.csv.
      parameters:
        - $ref: '#/components/parameters/Search'
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, -name, created_at, -created_at]
            default: name
        - name: filter
          in: query
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              kind: { $ref: '#/components/schemas/ClientKind' }
              archived:
                type: boolean
                default: false
      responses:
        '200':
          description: Il file CSV
          headers:
            Content-Disposition:
              description: attachment, con il nome del file.
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/clients/{client}:
    parameters:
      - $ref: '#/components/parameters/Company'
      - name: client
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Id' }
    get:
      operationId: getClient
      summary: Scheda di un cliente
      description: 'Permesso: clients.view. Senza permesso risponde 404, non 403.'
      responses:
        '200':
          description: Il cliente
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Client' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateClient
      summary: Modifica di un cliente
      description: |
        Permesso: clients.update. Si inviano tutti i campi, come in creazione.
        If-Match porta l'ETag ricevuto con la scheda: se nel frattempo qualcuno ha modificato
        il cliente, la risposta è 412 e niente viene sovrascritto.
      security:
        - session: []
          csrf: []
      parameters:
        - name: If-Match
          in: header
          required: true
          description: ETag della versione che l'utente sta modificando.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientInput' }
      responses:
        '200':
          description: Cliente aggiornato
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Client' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412':
          description: Il cliente è stato modificato da qualcun altro dopo che l'utente l'ha aperto.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428':
          description: Manca l'header If-Match.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      operationId: deleteClient
      summary: Eliminazione di un cliente
      description: |
        Permesso: clients.delete. Si può eliminare solo un cliente senza documenti collegati
        (preventivi, computi, scadenze): altrimenti la risposta è 409 con code has_documents e
        il cliente va archiviato. If-Match come nella modifica.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Cliente eliminato
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Il cliente ha documenti collegati (code has_documents). Si può archiviare.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /api/companies/{company}/clients/{client}/archive:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/ClientId'
    post:
      operationId: archiveClient
      summary: Archiviazione di un cliente
      description: |
        Permesso: clients.update. Il cliente sparisce dall'elenco predefinito ma resta
        consultabile, con i documenti collegati. Archiviare un cliente già archiviato non cambia
        la data di archiviazione. If-Match come nella modifica.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Cliente archiviato
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Client' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /api/companies/{company}/clients/{client}/restore:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/ClientId'
    post:
      operationId: restoreClient
      summary: Ripristino di un cliente archiviato
      description: 'Permesso: clients.update. Riporta il cliente tra quelli attivi. If-Match come nella modifica.'
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Cliente di nuovo attivo
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Client' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /api/companies/{company}/clients/{client}/account:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/ClientId'
    get:
      operationId: getClientAccount
      summary: Estratto conto di un cliente
      description: |
        Permessi: clients.view e invoices.view. Totali delle fatture emesse al del cliente, anche se
        archiviato: fatturato, netto a incassare, già incassato, residuo e parte scaduta.
        Le singole fatture si leggono con listInvoices e filter[client]=<id>. Senza
        clients.view il cliente è «non trovato» (404), come nella scheda; senza invoices.view la
        risposta è 403.
      responses:
        '200':
          description: L'estratto conto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubjectAccount' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{company}/clients/{client}/account/pdf:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/ClientId'
    get:
      operationId: getClientAccountPdf
      summary: PDF dell'estratto conto di un cliente, da mandare come sollecito
      description: |
        Permessi: clients.view e invoices.view, come getClientAccount. In A4: intestazione
        dell'azienda, cliente con indirizzo e partita IVA, data di oggi, le fatture emesse non
        ancora pagate dalla scadenza più vecchia (numero, data, scadenza, netto a pagare, già
        incassato, residuo; «scaduta» accanto alla scadenza passata), totale da incassare e parte
        scaduta, e l'IBAN dell'azienda se c'è. Senza fatture aperte esce la riga «Nessuna
        fattura da incassare.». Il file si chiama estratto-conto.pdf.
      responses:
        '200':
          description: Il PDF
          headers:
            Content-Disposition:
              description: attachment, con il nome del file.
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{company}/suppliers:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: listSuppliers
      summary: Elenco dei fornitori e dei subappaltatori
      description: 'Permesso: suppliers.view'
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - name: sort
          in: query
          description: Campo di ordinamento; il segno meno vuol dire ordine decrescente.
          schema:
            type: string
            enum: [name, -name, created_at, -created_at]
            default: name
        - name: filter
          in: query
          description: |
            Filtri, ad esempio filter[category]=rentals o filter[subcontractor]=true.
            filter[archived]=true mostra solo i fornitori archiviati; senza il filtro, o con
            false, solo quelli attivi.
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              category: { $ref: '#/components/schemas/SupplierCategory' }
              subcontractor: { type: boolean }
              archived:
                type: boolean
                default: false
              compliance:
                type: string
                enum: [expired, expiring, no_valid_durc]
                description: |
                  Regolarità dai documenti del fornitore (DURC, visura, assicurazione, altro),
                  guardando per ogni tipo solo la scadenza più lontana: un DURC vecchio scaduto
                  non conta se ce n'è uno nuovo. expired: almeno un tipo scaduto. expiring:
                  nessuno scaduto, almeno uno che scade entro 30 giorni da oggi, oggi compreso.
                  no_valid_durc: nessun DURC valido oggi (mai caricato o scaduto), di solito con
                  filter[subcontractor]=true.
      responses:
        '200':
          description: Una pagina di fornitori
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupplierList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    post:
      operationId: createSupplier
      summary: Nuovo fornitore
      description: 'Permesso: suppliers.create'
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupplierInput' }
      responses:
        '201':
          description: Fornitore creato
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Supplier' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/suppliers/import:
    parameters:
      - $ref: '#/components/parameters/Company'
    post:
      operationId: importSuppliers
      summary: Importazione di fornitori nuovi da un file CSV
      description: |
        Permesso: suppliers.create. Come importClients: stesso formato del file (al massimo
        5000 fornitori), solo fornitori nuovi, tutti o nessuno, errori sotto `file` o
        `row.<n>`; il file di exportSuppliers si reimporta così com'è. Colonne per nome:
        nome (ragione sociale) è obbligatoria; le altre sono partita IVA, codice fiscale,
        email, PEC, telefono, indirizzo, CAP, città, provincia, paese (vuoto vale IT),
        categorie (separate da virgole: materiali, noli, subappalto, servizi, altro),
        subappaltatore (sì o no, vuoto vale no), note. Ogni riga si controlla come
        createSupplier.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string }
            example: "nome;partita iva;categorie;subappaltatore\r\nFerro Esempio S.r.l.;01234567897;Materiali, Noli;No\r\n"
      responses:
        '200':
          description: Fornitori importati
          content:
            application/json:
              schema:
                type: object
                required: [created]
                properties:
                  created:
                    type: integer
                    minimum: 1
                    description: Fornitori aggiunti.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413':
          description: File più grande di 5 MB.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '415':
          description: Il corpo non è un file CSV (Content-Type text/csv).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/suppliers/balances:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: listSupplierBalances
      summary: Debiti verso i fornitori, fornitore per fornitore
      description: |
        Permessi: suppliers.view e invoices.view. I fornitori con fatture ricevute ancora da
        saldare, anche se archiviati, dal residuo più alto (a parità, per nome). Gli importi
        sono quelli di SubjectAccount; outstanding e overdue in fondo sono le somme di tutti i
        fornitori, non solo della pagina.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: filter
          in: query
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              overdue:
                description: true per avere solo chi ha qualcosa di scaduto.
                type: boolean
      responses:
        '200':
          description: Una pagina di fornitori
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubjectBalanceList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/suppliers/balances/export:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: exportSupplierBalances
      summary: Esportazione dei debiti verso i fornitori in CSV
      description: |
        Permessi e filtro come listSupplierBalances. Gli stessi fornitori nello stesso ordine, senza
        paginazione, nel formato dell'esportazione dei clienti: date come 30/11/2026, importi
        con la virgola decimale (1234,50). Il file si chiama debiti-fornitori.csv.
      parameters:
        - name: filter
          in: query
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              overdue:
                description: true per avere solo chi ha qualcosa di scaduto.
                type: boolean
      responses:
        '200':
          description: Il file CSV
          headers:
            Content-Disposition:
              description: attachment, con il nome del file.
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/suppliers/export:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: exportSuppliers
      summary: Esportazione dei fornitori in CSV
      description: |
        Permesso: suppliers.view. Stessi filtri, ricerca e ordinamento dell'elenco, senza
        paginazione, nello stesso formato dell'esportazione dei clienti. Le categorie sono in
        una sola colonna, separate da virgole. Il file si chiama fornitori.csv.
      parameters:
        - $ref: '#/components/parameters/Search'
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, -name, created_at, -created_at]
            default: name
        - name: filter
          in: query
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              category: { $ref: '#/components/schemas/SupplierCategory' }
              subcontractor: { type: boolean }
              archived:
                type: boolean
                default: false
              compliance:
                type: string
                enum: [expired, expiring, no_valid_durc]
                description: |
                  Regolarità dai documenti del fornitore (DURC, visura, assicurazione, altro),
                  guardando per ogni tipo solo la scadenza più lontana: un DURC vecchio scaduto
                  non conta se ce n'è uno nuovo. expired: almeno un tipo scaduto. expiring:
                  nessuno scaduto, almeno uno che scade entro 30 giorni da oggi, oggi compreso.
                  no_valid_durc: nessun DURC valido oggi (mai caricato o scaduto), di solito con
                  filter[subcontractor]=true.
      responses:
        '200':
          description: Il file CSV
          headers:
            Content-Disposition:
              description: attachment, con il nome del file.
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/suppliers/{supplier}:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/SupplierId'
    get:
      operationId: getSupplier
      summary: Scheda di un fornitore
      description: 'Permesso: suppliers.view. Senza permesso risponde 404, non 403.'
      responses:
        '200':
          description: Il fornitore
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Supplier' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateSupplier
      summary: Modifica di un fornitore
      description: |
        Permesso: suppliers.update. Si inviano tutti i campi, come in creazione. If-Match come
        nella modifica dei clienti.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupplierInput' }
      responses:
        '200':
          description: Fornitore aggiornato
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Supplier' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
    delete:
      operationId: deleteSupplier
      summary: Eliminazione di un fornitore
      description: |
        Permesso: suppliers.delete. Solo senza documenti collegati: altrimenti 409 con code
        has_documents, e il fornitore va archiviato.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Fornitore eliminato
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Il fornitore ha documenti collegati (code has_documents).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /api/companies/{company}/suppliers/{supplier}/archive:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/SupplierId'
    post:
      operationId: archiveSupplier
      summary: Archiviazione di un fornitore
      description: 'Permesso: suppliers.update. Come per i clienti.'
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Fornitore archiviato
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Supplier' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /api/companies/{company}/suppliers/{supplier}/restore:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/SupplierId'
    post:
      operationId: restoreSupplier
      summary: Ripristino di un fornitore archiviato
      description: 'Permesso: suppliers.update. Come per i clienti.'
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Fornitore di nuovo attivo
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Supplier' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /api/companies/{company}/suppliers/{supplier}/account:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/SupplierId'
    get:
      operationId: getSupplierAccount
      summary: Estratto conto di un fornitore
      description: |
        Permessi: suppliers.view e invoices.view. Totali delle fatture ricevute dal del fornitore, anche se
        archiviato: fatturato, netto a pagare, già pagato, residuo e parte scaduta.
        Le singole fatture si leggono con listInvoices e filter[supplier]=<id>. Senza
        suppliers.view il fornitore è «non trovato» (404), come nella scheda; senza invoices.view la
        risposta è 403.
      responses:
        '200':
          description: L'estratto conto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubjectAccount' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{company}/suppliers/{supplier}/documents:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/SupplierId'
    get:
      operationId: listSupplierDocuments
      summary: Documenti di regolarità di un fornitore
      description: |
        Permesso: suppliers.view. Tutti i documenti del fornitore, senza paginazione (sono
        pochi), ordinati per scadenza: prima quelli che scadono prima, in fondo quelli senza.
      responses:
        '200':
          description: I documenti
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupplierDocumentList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createSupplierDocument
      summary: Nuovo documento di regolarità
      description: 'Permesso: suppliers.update'
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupplierDocumentInput' }
      responses:
        '201':
          description: Documento registrato
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupplierDocument' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/suppliers/{supplier}/documents/{document}:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/SupplierId'
      - name: document
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Id' }
    put:
      operationId: updateSupplierDocument
      summary: Modifica di un documento di regolarità
      description: 'Permesso: suppliers.update. Si inviano tutti i campi. If-Match come per i fornitori.'
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupplierDocumentInput' }
      responses:
        '200':
          description: Documento aggiornato
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupplierDocument' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
    delete:
      operationId: deleteSupplierDocument
      summary: Eliminazione di un documento di regolarità
      description: 'Permesso: suppliers.update. If-Match come per i fornitori.'
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Documento eliminato
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /api/companies/{company}/suppliers/{supplier}/documents/{document}/file:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/SupplierId'
      - $ref: '#/components/parameters/SupplierDocumentId'
    get:
      operationId: getSupplierDocumentFile
      summary: Il file di un documento di regolarità
      description: |
        Permesso: suppliers.view. Senza permesso, o se il documento non ha un file, risponde
        404. Il file arriva come allegato (Content-Disposition: attachment, con il nome
        originale).
      responses:
        '200':
          description: Il file
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Content-Disposition:
              schema: { type: string }
          content:
            application/pdf:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: setSupplierDocumentFile
      summary: Caricamento o sostituzione del file di un documento di regolarità
      description: |
        Permesso: suppliers.update. Il corpo è il file, con il suo Content-Type: PDF, JPEG o
        PNG (una scansione o una foto del documento), al massimo 20 MB. Il contenuto deve
        corrispondere al tipo dichiarato (altrimenti 422 sotto file). Nome del file nella query.
        Un file già presente viene sostituito. If-Match con la versione del documento: la
        risposta è il documento con la versione nuova.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - name: file_name
          in: query
          required: true
          description: Nome originale del file; si tiene solo l'ultima parte del percorso.
          schema: { type: string, minLength: 1, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/pdf:
            schema: { type: string, format: binary }
          image/jpeg:
            schema: { type: string, format: binary }
          image/png:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: File salvato
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupplierDocument' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '413':
          description: File più grande di 20 MB.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '415':
          description: Tipo di file non ammesso.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
    delete:
      operationId: deleteSupplierDocumentFile
      summary: Eliminazione del file di un documento di regolarità
      description: |
        Permesso: suppliers.update. If-Match con la versione del documento. Il documento resta,
        senza file; la risposta è il documento con la versione nuova. Se non c'è un file, 404.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: File eliminato
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupplierDocument' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /api/companies/{company}/deadlines:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: listDeadlines
      summary: Elenco delle scadenze
      description: |
        Permesso: deadlines.view. Per il calendario si chiede un intervallo con filter[from] e
        filter[to] (compresi) e per_page=100.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - name: sort
          in: query
          description: Ordinamento per data di scadenza; il segno meno vuol dire decrescente.
          schema:
            type: string
            enum: [due_on, -due_on]
            default: due_on
        - name: filter
          in: query
          description: |
            Filtri, ad esempio filter[from]=2026-11-01&filter[to]=2026-11-30&filter[status]=open.
            filter[client], filter[supplier], filter[site], filter[employee] e filter[vehicle]
            prendono l'id del soggetto, del cantiere, del dipendente o del mezzo.
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              from: { $ref: '#/components/schemas/Date' }
              to: { $ref: '#/components/schemas/Date' }
              kind: { $ref: '#/components/schemas/DeadlineKind' }
              status: { $ref: '#/components/schemas/DeadlineStatus' }
              client: { $ref: '#/components/schemas/Id' }
              supplier: { $ref: '#/components/schemas/Id' }
              site: { $ref: '#/components/schemas/Id' }
              employee: { $ref: '#/components/schemas/Id' }
              vehicle: { $ref: '#/components/schemas/Id' }
      responses:
        '200':
          description: Una pagina di scadenze
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeadlineList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
