      properties:
        code:
          type: [string, 'null']
          maxLength: 50
        name:
          type: string
          minLength: 1
          maxLength: 200
        unit:
          type: string
          minLength: 1
          maxLength: 20
          examples: ['sacchi']
        notes:
          type: [string, 'null']
          maxLength: 2000
    WarehouseItem:
      allOf:
        - $ref: '#/components/schemas/WarehouseItemInput'
        - type: object
          required: [id, stock, created_at, updated_at]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            stock: { $ref: '#/components/schemas/Quantity' }
            created_at:
              type: string
