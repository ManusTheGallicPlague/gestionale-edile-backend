    put:
      operationId: setPurchaseOrderNumbering
      summary: Prossimo numero degli ordini ai fornitori di un anno
      description: |
        Permesso: settings.update. Come setQuoteNumbering: il prossimo ordine creato con una
        data di quell'anno prende next_number. Si può anche abbassare, ma mai fino a un numero
        già usato (409 code number_in_use). L'anno è quello in corso, il precedente o il
        successivo. La risposta riporta le numerazioni di quell'anno.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [year, next_number]
              properties:
                year: { type: integer }
                next_number:
                  type: integer
                  minimum: 1
                  maximum: 999999
      responses:
        '200':
          description: Numerazione aggiornata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Numbering' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Il numero è già stato usato in quell'anno (code number_in_use).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/settings/logo:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: getCompanyLogo
      summary: Logo dell'azienda
      description: |
        Qualsiasi membro dell'azienda lo vede, senza permessi: l'interfaccia lo mostra a tutti.
        Senza logo risponde 404.
      responses:
        '200':
          description: Il logo
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            image/png:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: setCompanyLogo
      summary: Caricamento del logo
      description: |
        Permesso: settings.update. Il corpo è il file, con Content-Type image/png o image/jpeg:
        al massimo 512 KB e 2000×2000 pixel; PNG a 8 bit non interlacciato (anche con
        trasparenza), JPEG a colori o in grigio. Sostituisce il logo precedente. Il logo
        compare nei PDF.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          image/png:
            schema: { type: string, format: binary }
          image/jpeg:
            schema: { type: string, format: binary }
      responses:
        '204':
          description: Logo salvato
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413':
          description: File più grande di 512 KB.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '415':
          description: Content-Type diverso da image/png e image/jpeg.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      operationId: deleteCompanyLogo
      summary: Eliminazione del logo
      description: 'Permesso: settings.update. Senza logo risponde comunque 204.'
      security:
        - session: []
          csrf: []
      responses:
        '204':
          description: Logo eliminato
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{company}/invoices:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: listInvoices
      summary: Registro delle fatture emesse e ricevute
      description: |
        Permesso: invoices.view. Dalla più recente. total_amount è la somma dei totali delle
        fatture che rispettano i filtri, non solo della pagina; outstanding_amount la parte
        ancora da pagare o incassare (somma dei remaining_amount).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: sort
          in: query
          description: Campo di ordinamento; il segno meno vuol dire ordine decrescente.
          schema:
            type: string
            enum: [date, -date, due_date, -due_date, total, -total]
            default: -date
        - name: filter
          in: query
          description: |
            Filtri, ad esempio filter[direction]=issued, filter[client]=<id>,
            filter[supplier]=<id>, filter[site]=<id>, filter[status]=overdue,
            filter[from]=2026-11-01 e filter[to]=2026-11-30 (sulla data della fattura) e
            filter[q]=testo (nel numero e nella descrizione).
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              direction: { $ref: '#/components/schemas/InvoiceDirection' }
              client: { $ref: '#/components/schemas/Id' }
              supplier: { $ref: '#/components/schemas/Id' }
              site: { $ref: '#/components/schemas/Id' }
              status: { $ref: '#/components/schemas/InvoicePaymentStatus' }
              from: { $ref: '#/components/schemas/Date' }
              to: { $ref: '#/components/schemas/Date' }
              q:
                type: string
                maxLength: 100
      responses:
        '200':
          description: Una pagina di fatture
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoiceList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    post:
      operationId: createInvoice
      summary: Registrazione di una fattura
      description: |
        Permesso: invoices.create. Se ha una scadenza di pagamento, nasce anche la scadenza
        nello scadenziario (invoice_out per le emesse, invoice_in per le ricevute). Un numero
        già usato nello stesso anno (per le ricevute: dello stesso fornitore) risponde 422
        sotto number.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvoiceInput' }
      responses:
        '201':
          description: Fattura registrata
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/invoices/export:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: exportInvoices
      summary: Esportazione del registro delle fatture in CSV
      description: |
        Permesso: invoices.view. Stessi filtri e ordinamento dell'elenco, senza paginazione,
        nello stesso formato dell'esportazione dei clienti. Date come 30/11/2026, importi con
        la virgola decimale (1234,50). Con il netto a pagare ci sono anche il già pagato
        (paid_amount) e il residuo (remaining_amount); dopo la scissione dei pagamenti, Sì o No
        per lo svincolo della ritenuta di garanzia (retention_release). Il file si chiama
        fatture.csv.
      parameters:
        - name: sort
          in: query
          schema:
            type: string
            enum: [date, -date, due_date, -due_date, total, -total]
            default: -date
        - name: filter
          in: query
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              direction: { $ref: '#/components/schemas/InvoiceDirection' }
              client: { $ref: '#/components/schemas/Id' }
              supplier: { $ref: '#/components/schemas/Id' }
              site: { $ref: '#/components/schemas/Id' }
              status: { $ref: '#/components/schemas/InvoicePaymentStatus' }
              from: { $ref: '#/components/schemas/Date' }
              to: { $ref: '#/components/schemas/Date' }
              q:
                type: string
                maxLength: 100
      responses:
        '200':
          description: Il file CSV
          headers:
            Content-Disposition:
              description: attachment, con il nome del file.
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/invoices/{invoice}:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/InvoiceId'
    get:
      operationId: getInvoice
      summary: Una fattura
      description: 'Permesso: invoices.view. Senza permesso risponde 404, non 403.'
      responses:
        '200':
          description: La fattura
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateInvoice
      summary: Modifica di una fattura, anche per segnarla pagata
      description: |
        Permesso: invoices.update. Si inviano tutti i campi. La scadenza nello scadenziario
        segue la fattura: si sposta con la data di pagamento, si chiude quando paid_on è
        valorizzato, si riapre se torna null, sparisce se la scadenza di pagamento torna null.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvoiceInput' }
      responses:
        '200':
          description: Fattura aggiornata
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
    delete:
      operationId: deleteInvoice
      summary: Eliminazione di una fattura
      description: 'Permesso: invoices.delete. Elimina anche la sua scadenza nello scadenziario.'
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Fattura eliminata
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /api/companies/{company}/invoices/{invoice}/file:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/InvoiceId'
    get:
      operationId: getInvoiceFile
      summary: Il PDF di una fattura
      description: |
        Permesso: invoices.view. Senza permesso, o se la fattura non ha un file, risponde
        404. Il file arriva come allegato (Content-Disposition: attachment, con il nome
        originale).
      responses:
        '200':
          description: Il file
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Content-Disposition:
              schema: { type: string }
          content:
            application/pdf:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: setInvoiceFile
      summary: Caricamento o sostituzione del PDF di una fattura
      description: |
        Permesso: invoices.update. Il corpo è il file, con il suo Content-Type: PDF (la copia di
        cortesia della fattura elettronica), JPEG o PNG (una scansione), al massimo 20 MB. Il contenuto deve
        corrispondere al tipo dichiarato (altrimenti 422 sotto file). Nome del file nella query.
        Un file già presente viene sostituito. If-Match con la versione della fattura: la
        risposta è la fattura con la versione nuova.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - name: file_name
          in: query
          required: true
          description: Nome originale del file; si tiene solo l'ultima parte del percorso.
          schema: { type: string, minLength: 1, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/pdf:
            schema: { type: string, format: binary }
          image/jpeg:
            schema: { type: string, format: binary }
          image/png:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: File salvato
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '413':
          description: File più grande di 20 MB.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '415':
          description: Tipo di file non ammesso.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
    delete:
      operationId: deleteInvoiceFile
      summary: Eliminazione del PDF di una fattura
      description: |
        Permesso: invoices.update. If-Match con la versione della fattura. La fattura resta,
        senza file; la risposta è la fattura con la versione nuova. Se non c'è un file, 404.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: File eliminato
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /api/companies/{company}/invoices/{invoice}/payments:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/InvoiceId'
    get:
      operationId: listInvoicePayments
      summary: Incassi o pagamenti parziali di una fattura
      description: |
        Permesso: invoices.view. Senza permesso risponde 404, non 403. Tutti i pagamenti della
        fattura (acconti, rate), dal più vecchio; niente paginazione.
      responses:
        '200':
          description: I pagamenti della fattura
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/InvoicePayment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createInvoicePayment
      summary: Registrazione di un incasso o di un pagamento, anche parziale
      description: |
        Permesso: invoices.update. If-Match con la versione della fattura: la risposta è la
        fattura con la versione nuova. La somma dei pagamenti non può superare amount_due
        (422 sotto amount). Quando la somma arriva ad amount_due la fattura risulta pagata:
        paid_on prende la data dell'ultimo pagamento e la scadenza nello scadenziario si chiude;
        finché non ci arriva, paid_on è null e la scadenza resta aperta con l'importo residuo.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvoicePaymentInput' }
      responses:
        '200':
          description: Pagamento registrato
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /api/companies/{company}/invoices/{invoice}/payments/{payment}:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/InvoiceId'
      - name: payment
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Id' }
    delete:
      operationId: deleteInvoicePayment
      summary: Eliminazione di un pagamento registrato per errore
      description: |
        Permesso: invoices.update. If-Match con la versione della fattura: la risposta è la
        fattura con la versione nuova, con paid_on ricalcolato dai pagamenti rimasti (null se
        non ne resta nessuno). Un pagamento si elimina e si registra di nuovo: non si modifica.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Pagamento eliminato
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /api/companies/{company}/invoice-payments:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: listPayments
      summary: Incassi e pagamenti registrati di tutte le fatture (prima nota)
      description: |
        Permesso: invoices.view. Dal più recente. Filtri sulla data del pagamento
        (filter[from], filter[to]), sul tipo di fattura (filter[direction]: issued per gli
        incassi, received per i pagamenti), sul cantiere della fattura (filter[site]) e sulla
        modalità (filter[method]). collected e paid sono le somme di incassi e pagamenti che
        rispettano i filtri, non solo della pagina. Le fatture segnate pagate senza pagamenti
        registrati non compaiono.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: filter
          in: query
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              direction: { $ref: '#/components/schemas/InvoiceDirection' }
              site: { $ref: '#/components/schemas/Id' }
              method: { $ref: '#/components/schemas/InvoicePaymentMethod' }
              from: { $ref: '#/components/schemas/Date' }
              to: { $ref: '#/components/schemas/Date' }
      responses:
        '200':
          description: Una pagina di incassi e pagamenti
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/invoice-payments/export:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: exportPayments
      summary: Esportazione della prima nota in CSV
      description: |
        Permesso: invoices.view. Stessi filtri e ordinamento di listPayments, senza
        paginazione, nello stesso formato dell'esportazione dei clienti. Date come 30/11/2026,
        importi con la virgola decimale (1234,50). Il file si chiama incassi-e-pagamenti.csv.
      parameters:
        - name: filter
          in: query
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              direction: { $ref: '#/components/schemas/InvoiceDirection' }
              site: { $ref: '#/components/schemas/Id' }
              method: { $ref: '#/components/schemas/InvoicePaymentMethod' }
              from: { $ref: '#/components/schemas/Date' }
              to: { $ref: '#/components/schemas/Date' }
      responses:
        '200':
          description: Il file CSV
          headers:
            Content-Disposition:
              description: attachment, con il nome del file.
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/roles:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: listRoles
      summary: Ruoli dell'azienda con i loro permessi
      description: |
        Permesso: users.view. Tutti i ruoli, in ordine di nome, senza paginazione (sono pochi).
        I permessi di ogni ruolo sono in ordine alfabetico.
      responses:
        '200':
          description: I ruoli
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createRole
      summary: Nuovo ruolo
      description: |
        Permesso: roles.manage. Il nome è unico nell'azienda (422 sul campo name). I permessi
        doppi si tolgono.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleInput' }
      responses:
        '201':
          description: Ruolo creato
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/roles/{role}:
    parameters:
      - $ref: '#/components/parameters/Company'
      - name: role
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Id' }
    put:
      operationId: updateRole
      summary: Modifica di nome e permessi di un ruolo
      description: |
        Permesso: roles.manage. Si inviano nome e tutti i permessi: sostituiscono quelli di
        prima e valgono subito per chi ha il ruolo. Senza If-Match (valori assoluti, li cambia
        solo il titolare). Se nessun utente attivo avrebbe più users.manage la risposta è 409
        con code last_manager e non cambia niente.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleInput' }
      responses:
        '200':
          description: Ruolo aggiornato
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/LastManager' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      operationId: deleteRole
      summary: Eliminazione di un ruolo
      description: |
        Permesso: roles.manage. Solo se nessun utente lo usa, nemmeno disattivato (409 con code
        role_in_use: prima si cambia ruolo a quegli utenti). Gli inviti in attesa con quel
        ruolo vengono annullati.
      security:
        - session: []
          csrf: []
      responses:
        '204':
          description: Ruolo eliminato
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Il ruolo è assegnato ad almeno un utente (code role_in_use).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/companies/{company}/audit-log:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: listAuditLog
      summary: Registro delle modifiche
      description: |
        Permesso: audit.view. Chi ha creato, modificato o eliminato clienti, fornitori,
        scadenze, computi, preventivi, cantieri e gli altri documenti di AuditEntity (anche SAL,
        prezzari e attività del cronoprogramma), e quando; dal più recente. Di una modifica si
        danno i nomi dei campi cambiati, non i valori. Con filter[entity] e filter[entity_id] si ha
        la storia di un solo documento.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: filter
          in: query
          description: Filtri, ad esempio filter[entity]=client&filter[entity_id]=<id>.
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              entity: { $ref: '#/components/schemas/AuditEntity' }
              entity_id: { $ref: '#/components/schemas/Id' }
              user: { $ref: '#/components/schemas/Id' }
      responses:
        '200':
          description: Una pagina del registro
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditLogList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/users:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: listCompanyUsers
      summary: Utenti dell'azienda con il loro ruolo
      description: |
        Permesso: users.view. Tutti i membri, in ordine di nome, senza paginazione; active è
        false per un utente disattivato.
      responses:
        '200':
          description: Gli utenti
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyUserList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{company}/users/{user}/role:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/UserId'
    put:
      operationId: changeUserRole
      summary: Cambio del ruolo di un utente
      description: |
        Permesso: users.manage. Vale subito, anche per le sessioni aperte. Senza If-Match: il
        valore è assoluto. Se dopo il cambio nessun utente attivo avrebbe più users.manage la
        risposta è 409 con code last_manager e non cambia niente.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserRoleInput' }
      responses:
        '200':
          description: Ruolo cambiato
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/LastManager' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/users/{user}/deactivate:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/UserId'
    post:
      operationId: deactivateUser
      summary: Disattivazione di un utente in questa azienda
      description: |
        Permesso: users.manage. L'utente perde subito l'accesso a questa azienda (le altre e
        l'account restano); nell'elenco ha active false. Non si disattiva sé stessi (409 code
        self_deactivation) né l'ultimo utente attivo con users.manage (409 code last_manager).
        Disattivare due volte non cambia niente.
      security:
        - session: []
          csrf: []
      responses:
        '200':
          description: Utente disattivato
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/LastManager' }

  /api/companies/{company}/users/{user}/reactivate:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/UserId'
    post:
      operationId: reactivateUser
      summary: Riattivazione di un utente in questa azienda
      description: |
        Permesso: users.manage. Torna con il ruolo che aveva. Un account disattivato in
        generale resta con active false.
      security:
        - session: []
          csrf: []
      responses:
        '200':
          description: Utente riattivato
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{company}/invitations:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: listInvitations
      summary: Inviti in attesa
      description: |
        Permesso: users.manage. Gli inviti non ancora accettati, dal più recente, senza
        paginazione; status è expired per quelli scaduti, che si possono eliminare o rifare.
        Gli inviti accettati non compaiono: la persona è tra gli utenti.
      responses:
        '200':
          description: Gli inviti
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createInvitation
      summary: Invito di una persona con un ruolo
      description: |
        Permesso: users.manage. Il link è /invito/{token}, vale 7 giorni e una volta sola.
        Il backend lo manda per email all'invitato; il token compare anche in questa risposta
        (e solo qui: il backend ne tiene l'impronta), così il link si può copiare e girare. Un nuovo
        invito per la stessa email sostituisce quello in attesa. Se l'email è già di un
        membro dell'azienda la risposta è 409 con code already_member.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvitationInput' }
      responses:
        '201':
          description: Invito creato
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationCreated' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: L'email è già di un membro dell'azienda (code already_member).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/invitations/{invitation}:
    parameters:
      - $ref: '#/components/parameters/Company'
      - name: invitation
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Id' }
    delete:
      operationId: deleteInvitation
      summary: Annullamento di un invito in attesa
      description: |
        Permesso: users.manage. Il link smette di funzionare. Un invito non si modifica, quindi
        niente If-Match; uno già accettato risponde 404.
      security:
        - session: []
          csrf: []
      responses:
        '204':
          description: Invito annullato
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/invitations/{token}:
    parameters:
      - $ref: '#/components/parameters/InvitationToken'
    get:
      operationId: getInvitation
      summary: Invito dietro un link, per la pagina /invito/:token
      description: |
        Non serve la sessione. Un token sconosciuto, già usato o scaduto risponde 404, sempre
        con lo stesso messaggio. account_exists dice se l'email ha già un account: in quel
        caso la pagina chiede solo la password, altrimenti anche il nome.
      security: []
      responses:
        '200':
          description: L'invito
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationPreview' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/invitations/{token}/logo:
    parameters:
      - $ref: '#/components/parameters/InvitationToken'
    get:
      operationId: getInvitationLogo
      summary: Logo dell'azienda che invita, per la pagina /invito/:token
      description: |
        Non serve la sessione: basta un invito valido. Risponde 404 se il token è sconosciuto,
        già usato o scaduto, o se l'azienda non ha un logo (has_logo nell'invito lo dice prima).
      security: []
      responses:
        '200':
          description: Il logo
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            image/png:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/invitations/{token}/accept:
    parameters:
      - $ref: '#/components/parameters/InvitationToken'
    post:
      operationId: acceptInvitation
      summary: Accettazione di un invito
      description: |
        Serve il token CSRF (come per l'accesso). Senza account si inviano nome e password
        nuova (almeno 10 caratteri) e il backend crea l'account; con un account si invia la
        sua password (name è ignorato). Se va a buon fine l'utente entra nell'azienda con il
        ruolo dell'invito e il backend apre una sessione nuova, come all'accesso. Una
        password sbagliata risponde 422 sul campo password e conta come tentativo di accesso
        fallito. Un utente già membro riceve 409 con code already_member.
      security:
        - csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvitationAcceptInput' }
      responses:
        '204':
          description: Invito accettato, sessione aperta
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: L'utente fa già parte dell'azienda (code already_member).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/companies/{company}/quotes:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: listQuotes
      summary: Elenco dei preventivi
      description: 'Permesso: quotes.view. La ricerca guarda oggetto, numero e cliente.'
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - name: sort
          in: query
          description: |
            Campo di ordinamento; il segno meno vuol dire ordine decrescente. valid_until mette
            le bozze, che non hanno una validità, in fondo.
          schema:
            type: string
            enum: [number, -number, issue_date, -issue_date, updated_at, -updated_at, valid_until, -valid_until]
            default: -updated_at
        - name: filter
          in: query
          description: |
            Filtri, ad esempio filter[status]=sent, filter[client]=<id> o
            filter[follow_up]=expiring.
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              status: { $ref: '#/components/schemas/QuoteStatus' }
              client: { $ref: '#/components/schemas/Id' }
              follow_up: { $ref: '#/components/schemas/QuoteFollowUp' }
      responses:
        '200':
          description: Una pagina di preventivi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuoteList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    post:
      operationId: createQuote
      summary: Nuovo preventivo, in bozza
      description: 'Permesso: quotes.create. Numero e data arrivano al primo invio.'
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuoteInput' }
      responses:
        '201':
          description: Preventivo creato
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quote' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/quotes/export:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: exportQuotes
      summary: Esportazione dei preventivi in CSV
      description: |
        Permesso: quotes.view. Stessi filtri, ricerca e ordinamento dell'elenco, senza
        paginazione, nello stesso formato dell'esportazione dei clienti. Una riga per preventivo,
        con imponibile, IVA e totale (importi con la virgola decimale), date come 30/11/2026.
        Il file si chiama preventivi.csv.
      parameters:
        - $ref: '#/components/parameters/Search'
        - name: sort
          in: query
          schema:
            type: string
            enum: [number, -number, issue_date, -issue_date, updated_at, -updated_at, valid_until, -valid_until]
            default: -updated_at
        - name: filter
          in: query
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              status: { $ref: '#/components/schemas/QuoteStatus' }
              client: { $ref: '#/components/schemas/Id' }
              follow_up: { $ref: '#/components/schemas/QuoteFollowUp' }
      responses:
        '200':
          description: Il file CSV
          headers:
            Content-Disposition:
              description: attachment, con il nome del file.
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/quotes/{quote}:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/QuoteId'
    get:
      operationId: getQuote
      summary: Testata di un preventivo
      description: 'Permesso: quotes.view. Senza permesso risponde 404, non 403.'
      responses:
        '200':
          description: Il preventivo
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quote' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateQuote
      summary: Modifica della testata di un preventivo in bozza
      description: 'Permesso: quotes.update. Si inviano tutti i campi. Solo in bozza.'
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuoteInput' }
      responses:
        '200':
          description: Preventivo aggiornato
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quote' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Il preventivo non è più in bozza (code quote_not_draft).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
    delete:
      operationId: deleteQuote
      summary: Eliminazione di un preventivo in bozza
      description: 'Permesso: quotes.delete. Un preventivo numerato non si elimina, per non lasciare buchi.'
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Preventivo eliminato
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Il preventivo non è più in bozza (code quote_not_draft).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /api/companies/{company}/quotes/{quote}/send:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/QuoteId'
    post:
      operationId: sendQuote
      summary: Invio di un preventivo in bozza
      description: |
        Permesso: quotes.update. Segna il preventivo come inviato, gli dà il numero successivo
        dell'anno (2026/001, senza buchi) e la data di oggi; la validità parte da quella data.
        Una revisione prende invece il numero del preventivo da cui nasce, con la revisione
        successiva (2026/001-R1).
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Preventivo inviato
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quote' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Il preventivo non è più in bozza (code quote_not_draft).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /api/companies/{company}/quotes/{quote}/status:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/QuoteId'
    post:
      operationId: changeQuoteStatus
      summary: Esito di un preventivo inviato
      description: |
        Permesso: quotes.update. Da sent si passa ad accepted, rejected o expired; da questi
        si torna a sent per correggere un errore. Una bozza si invia con send. Numero, data e
        righe non cambiano.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [sent, accepted, rejected, expired]
      responses:
        '200':
          description: Stato cambiato
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quote' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Passaggio di stato non ammesso (code invalid_transition).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /api/companies/{company}/quotes/{quote}/pdf:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/QuoteId'
    get:
      operationId: getQuotePdf
      summary: PDF del preventivo
      description: |
        Permesso: quotes.view. Il preventivo in A4, pronto da stampare o allegare: intestazione
        con il nome dell'azienda, cliente, oggetto, righe, totali per aliquota, validità, note,
        condizioni e spazio per l'accettazione. Una bozza esce con la dicitura «bozza» e senza
        numero. Il file si chiama preventivo-2026-001.pdf (preventivo-bozza.pdf in bozza).
        Senza permesso risponde 404, non 403.
      responses:
        '200':
          description: Il PDF
          headers:
            Content-Disposition:
              description: attachment, con il nome del file.
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{company}/quotes/{quote}/site:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/QuoteId'
    post:
      operationId: createSiteFromQuote
      summary: Cantiere da un preventivo accettato
      description: |
        Permessi: quotes.view e sites.create. Crea il cantiere del lavoro di un preventivo
        accettato: nome dall'oggetto, stesso cliente, budget uguale all'imponibile, stato
        planned, senza codice, indirizzo e date (si completano con updateSite). Il cantiere
        resta collegato al preventivo (quote nel cantiere, site_id nel preventivo); per ogni
        preventivo si crea un solo cantiere. Senza permesso di vedere il preventivo risponde 404.
      security:
        - session: []
          csrf: []
      responses:
        '201':
          description: Il cantiere creato
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Site' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            Il preventivo non è accettato (code invalid_transition) o ha già un cantiere
            (code site_exists).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/companies/{company}/quotes/{quote}/revisions:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/QuoteId'
    post:
      operationId: reviseQuote
      summary: Revisione di un preventivo inviato
      description: |
        Permessi: quotes.view e quotes.create. Crea una bozza con la stessa testata e le stesse
        righe, collegata al preventivo di partenza (revision_of), che resta com'è. Si rivede un
        preventivo inviato, rifiutato o scaduto; non una bozza né uno accettato. Al primo invio
        la revisione prende lo stesso numero con la revisione successiva (2026/001-R1), senza
        usare un numero nuovo. Senza permesso di vedere il preventivo risponde 404.
      security:
        - session: []
          csrf: []
      responses:
        '201':
          description: La revisione in bozza
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quote' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Il preventivo è in bozza o accettato e non si rivede (code invalid_transition).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/companies/{company}/quotes/{quote}/duplicate:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/QuoteId'
    post:
      operationId: duplicateQuote
      summary: Copia di un preventivo, anche per un altro cliente
      description: |
        Permessi: quotes.view e quotes.create. Crea una bozza nuova con oggetto, validità, note,
        condizioni e una copia di tutte le righe, in qualunque stato sia il preventivo di
        partenza, che non cambia. A differenza della revisione la copia non è collegata al
        preventivo di partenza né al suo cantiere e al primo invio prende un numero nuovo. Con
        `client_id` la copia va a un altro cliente dell'azienda (422 sotto `client_id` se non
        si trova); con null resta lo stesso cliente. Senza permesso di vedere il preventivo
        risponde 404.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuoteDuplicateInput' }
      responses:
        '201':
          description: La copia in bozza
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quote' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/quotes/{quote}/lines:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/QuoteId'
    get:
      operationId: listQuoteLines
      summary: Righe di un preventivo
      description: 'Permesso: quotes.view. Tutte le righe, in ordine, senza paginazione.'
      responses:
        '200':
          description: Le righe
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuoteLineList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createQuoteLine
      summary: Nuova riga, in fondo al preventivo
      description: 'Permesso: quotes.update. Solo in bozza.'
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuoteLineInput' }
      responses:
        '201':
          description: Riga creata
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuoteLine' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Il preventivo non è più in bozza (code quote_not_draft).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    put:
      operationId: arrangeQuoteLines
      summary: Riordino delle righe, in blocco
      description: |
        Permesso: quotes.update. Solo in bozza. Si inviano gli id di tutte le righe del
        preventivo, ognuna una volta sola, nel nuovo ordine: la posizione è quella nell'elenco.
        Testi, prezzi, totali e versioni delle righe non cambiano. Se nel frattempo una riga è
        stata aggiunta o eliminata l'elenco non torna più e la risposta è 422 su lines: si
        ricarica la pagina. Per mettere una riga nuova a metà si crea in fondo e poi si riordina.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuoteLineArrangement' }
      responses:
        '200':
          description: Le righe nel nuovo ordine
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuoteLineList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Il preventivo non è più in bozza (code quote_not_draft).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/quotes/{quote}/lines/{line}:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/QuoteId'
      - $ref: '#/components/parameters/LineId'
    put:
      operationId: updateQuoteLine
      summary: Modifica di una riga
      description: 'Permesso: quotes.update. Si inviano tutti i campi. Solo in bozza.'
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuoteLineInput' }
      responses:
        '200':
          description: Riga aggiornata
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuoteLine' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Il preventivo non è più in bozza (code quote_not_draft).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
    delete:
      operationId: deleteQuoteLine
      summary: Eliminazione di una riga
      description: 'Permesso: quotes.update. Solo in bozza.'
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Riga eliminata
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Il preventivo non è più in bozza (code quote_not_draft).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: session
      description: Cookie di sessione HttpOnly, Secure, SameSite=Lax. Il nome lo sceglie il backend.
    csrf:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: |
        Valore del cookie XSRF-TOKEN, ricopiato dal frontend a ogni richiesta che modifica dati.
        Il backend lo verifica contro la sessione: non basta che header e cookie coincidano.

  headers:
    ETag:
      description: Versione del record, da rimandare in If-Match quando lo si modifica.
      schema:
        type: string

  parameters:
    Company:
      name: company
      in: path
      required: true
      description: Slug dell'azienda, lo stesso che compare nell'URL dell'app.
      schema: { $ref: '#/components/schemas/Slug' }
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    ClientId:
      name: client
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    SupplierId:
      name: supplier
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    DeadlineId:
      name: deadline
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    SiteId:
      name: site
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    PriceListId:
      name: list
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    PriceListItemId:
      name: item
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    SiteActivityId:
      name: activity
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    ProgressStatementId:
      name: statement
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    SupplierDocumentId:
      name: document
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    SiteDocumentId:
      name: document
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    WarehouseItemId:
      name: item
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    WarehouseMovementId:
      name: movement
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    InvoiceId:
      name: invoice
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    PurchaseOrderId:
      name: order
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    SiteCostId:
      name: cost
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    DailyReportId:
      name: report
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    EmployeeId:
      name: employee
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    VehicleId:
      name: vehicle
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    EstimateId:
      name: estimate
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    ChapterId:
      name: chapter
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    ItemId:
      name: item
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    MeasurementId:
      name: measurement
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    QuoteId:
      name: quote
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    LineId:
      name: line
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    UserId:
      name: user
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    InvitationToken:
      name: token
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 100
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag della versione che l'utente ha davanti.
      schema:
        type: string
    Search:
      name: search
      in: query
      description: Testo libero; il backend decide su quali campi cercare.
      schema:
        type: string
        maxLength: 100
    WarehouseItemFilter:
      name: filter
      in: query
      description: Filtri, ad esempio filter[below_min]=true.
      style: deepObject
      explode: true
      schema:
        type: object
        properties:
          below_min:
            description: true per i soli articoli sotto la scorta minima, false per gli altri.
            type: boolean

  responses:
    Unauthorized:
      description: Sessione assente o scaduta. Il frontend torna alla pagina di accesso.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: |
        Azione non permessa dal ruolo dell'utente in questa azienda, oppure token CSRF mancante
        o non valido (code csrf_invalid: il frontend rinnova il token e riprova una volta).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Non esiste, oppure appartiene a un'altra azienda o l'utente non può vederlo.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationFailed:
      description: Dati non validi. Il frontend mostra i messaggi sotto i campi.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationError' }
    StaleRecord:
      description: |
        Il record è stato modificato da qualcun altro dopo che l'utente l'ha aperto
        (code stale_record). Niente viene cambiato.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PreconditionRequired:
      description: Manca l'header If-Match (code precondition_required).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    LastManager:
      description: |
        Cambio rifiutato: lascerebbe l'azienda senza utenti attivi con users.manage o con
        roles.manage, se prima qualcuno li aveva (code last_manager), oppure è la
        disattivazione di sé stessi (code self_deactivation).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: Troppi tentativi in poco tempo.
      headers:
        Retry-After:
          description: Secondi da attendere prima di riprovare.
          schema:
            type: integer
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Id:
      type: string
      description: Identificativo scelto dal backend (ad esempio un UUID). Il frontend non ne deduce nulla.
      examples: [0b8f6a52-3c1e-4d7a-9f20-6f1b2c3d4e5f]
    Slug:
      type: string
      description: |
        Non cambia dopo la creazione. Sono riservati i nomi delle rotte fisse del frontend
        (accedi, profilo, password-dimenticata, invito).
      minLength: 3
      maxLength: 50
      pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      examples: [impresa-rossi]
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: Messaggio in italiano, mostrabile all'utente.
        code:
          type: string
          description: |
            Codice stabile per i casi che il frontend deve riconoscere senza leggere il testo.
            Per ora: csrf_invalid, stale_record, precondition_required, has_documents,
            statement_draft_exists, statement_not_draft, invalid_transition, site_exists.
    ValidationError:
      type: object
      required: [message, errors]
      properties:
        message:
          type: string
        errors:
          type: object
          description: Per ogni campo, uno o più messaggi. I campi annidati usano il punto (address.city).
          additionalProperties:
            type: array
            items:
              type: string
          examples:
            - vat_number: [Esiste già un cliente con questa partita IVA.]
    ListMeta:
      type: object
      required: [total, page, per_page]
      properties:
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 200
    ProfileInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
    PasswordChangeInput:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          format: password
          minLength: 1
          maxLength: 200
        new_password:
          type: string
          format: password
          minLength: 10
          maxLength: 200
    PasswordResetRequestInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    PasswordResetInput:
      type: object
      required: [new_password]
      properties:
        new_password:
          type: string
          format: password
          minLength: 10
          maxLength: 200
    Me:
      type: object
      required: [id, name, email, companies]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name:
          type: string
        email:
          type: string
          format: email
        companies:
          type: array
          description: Aziende di cui l'utente fa parte. Può essere vuoto.
          items: { $ref: '#/components/schemas/Membership' }
    Membership:
      type: object
      required: [slug, name, role, permissions, has_logo]
      properties:
        slug: { $ref: '#/components/schemas/Slug' }
        has_logo:
          type: boolean
          description: L'azienda ha un logo, che si legge da getCompanyLogo.
        name:
          type: string
          examples: [Impresa Rossi S.r.l.]
        role:
          type: string
          description: Nome del ruolo, da mostrare così com'è.
          examples: [Titolare]
        permissions:
          type: array
          description: |
            Cosa può fare l'utente in questa azienda. L'interfaccia li usa solo per nascondere
            voci e pulsanti: il controllo vero lo fa il backend a ogni richiesta.
          items: { $ref: '#/components/schemas/Permission' }
    Role:
      type: object
      required: [id, name, permissions]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name:
          type: string
          minLength: 1
          maxLength: 100
          examples: [Ufficio]
        permissions:
          type: array
          items: { $ref: '#/components/schemas/Permission' }
    RoleInput:
      type: object
      required: [name, permissions]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        permissions:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/Permission' }
    RoleList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Role' }
    CompanyUser:
      type: object
      required: [id, name, email, active, role, joined_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        email:
          type: string
          format: email
        active: { type: boolean }
        role:
          type: object
          required: [id, name]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            name: { type: string }
        joined_at:
          type: string
          format: date-time
    CompanyUserList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/CompanyUser' }
    UserRoleInput:
      type: object
      required: [role_id]
      properties:
        role_id: { $ref: '#/components/schemas/Id' }
    InvitationInput:
      type: object
      required: [email, role_id]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        role_id: { $ref: '#/components/schemas/Id' }
    Invitation:
      type: object
      required: [id, email, role, status, expires_at, created_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        email:
          type: string
          format: email
        role:
          type: object
          required: [id, name]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            name: { type: string }
        status:
          type: string
          enum: [pending, expired]
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    InvitationCreated:
      allOf:
        - $ref: '#/components/schemas/Invitation'
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: Da mettere nel link /invito/{token}. Non si può più rileggere.
    InvitationList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Invitation' }
    InvitationPreview:
      type: object
      required: [company_name, email, role_name, expires_at, account_exists, has_logo]
      properties:
        company_name: { type: string }
        has_logo:
          type: boolean
          description: L'azienda ha un logo, che si legge da getInvitationLogo.
        email:
          type: string
          format: email
        role_name: { type: string }
        expires_at:
          type: string
          format: date-time
        account_exists: { type: boolean }
    InvitationAcceptInput:
      type: object
      required: [password]
      properties:
        name:
          type: [string, 'null']
          description: Obbligatorio solo se l'account non esiste.
          minLength: 1
          maxLength: 200
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 200
    Permission:
      type: string
      description: Nella forma <area>.<azione>. L'elenco cresce con i moduli.
      enum:
        - clients.view
        - clients.create
        - clients.update
        - clients.delete
        - suppliers.view
        - suppliers.create
        - suppliers.update
        - suppliers.delete
        - deadlines.view
        - deadlines.create
        - deadlines.update
        - deadlines.delete
        - estimates.view
        - estimates.create
        - estimates.update
        - estimates.delete
        - estimates.approve
        - sites.view
        - sites.create
        - sites.update
        - sites.delete
        - employees.view
        - employees.create
        - employees.update
        - employees.delete
        - vehicles.view
        - vehicles.create
        - vehicles.update
        - vehicles.delete
        - reports.view
        - reports.create
        - reports.update
        - reports.delete
        - reports.approve
        - costs.view
        - costs.create
        - costs.update
        - costs.delete
        - documents.view
        - documents.create
        - documents.update
        - documents.delete
        - price_lists.view
        - price_lists.create
        - price_lists.update
        - price_lists.delete
        - purchases.view
        - purchases.create
        - purchases.update
        - purchases.delete
        - warehouse.view
        - warehouse.create
        - warehouse.update
        - warehouse.delete
        - invoices.view
        - invoices.create
        - invoices.update
        - invoices.delete
        - quotes.view
        - quotes.create
        - quotes.update
        - quotes.delete
        - settings.view
        - settings.update
        - users.view
        - users.manage
        - roles.manage
        - audit.view

    ClientKind:
      type: string
      description: |
        company: impresa, condominio o associazione. person: privato. public_body: ente pubblico.
      enum: [company, person, public_body]
    ClientInput:
      type: object
      description: |
        Dati di un cliente, uguali in creazione e in modifica. I campi facoltativi si inviano
        comunque, con null se vuoti.
      required:
        - kind
        - name
        - vat_number
        - tax_code
        - email
        - pec
        - phone
        - sdi_code
        - street
        - postal_code
        - city
        - province
        - country
        - notes
      properties:
        kind: { $ref: '#/components/schemas/ClientKind' }
        name:
          type: string
          description: Ragione sociale, oppure nome e cognome.
          minLength: 1
          maxLength: 200
        vat_number:
          type: [string, 'null']
          description: |
            Partita IVA, unica nell'azienda. Con country IT, per company e public_body serve
            almeno una tra partita IVA e codice fiscale. Il backend la restituisce normalizzata:
            senza spazi, in maiuscolo, senza il prefisso IT.
          maxLength: 20
        tax_code:
          type: [string, 'null']
          description: |
            Codice fiscale. Con country IT è obbligatorio se kind è person. Unico nell'azienda
            per lo stesso kind. Normalizzato come la partita IVA.
          maxLength: 16
        email:
          type: [string, 'null']
          format: email
        pec:
          type: [string, 'null']
          format: email
        phone:
          type: [string, 'null']
          maxLength: 30
        sdi_code:
          type: [string, 'null']
          description: 'Codice destinatario: 7 caratteri, 6 per la pubblica amministrazione.'
          minLength: 6
          maxLength: 7
        street:
          type: [string, 'null']
          maxLength: 200
        postal_code:
          type: [string, 'null']
          maxLength: 10
        city:
          type: [string, 'null']
          maxLength: 100
        province:
          type: [string, 'null']
          description: Sigla della provincia (TO, MI). Vuota per i clienti esteri.
          maxLength: 2
        country:
          type: string
          description: Paese, codice ISO 3166-1 alpha-2.
          pattern: '^[A-Z]{2}$'
          default: IT
          examples: [IT]
        notes:
          type: [string, 'null']
          maxLength: 2000
    Client:
      allOf:
        - $ref: '#/components/schemas/ClientInput'
        - type: object
          required: [id, archived_at, created_at, updated_at]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            archived_at:
              type: [string, 'null']
              format: date-time
              description: Data di archiviazione; null se il cliente è attivo.
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    AuditEntity:
      type: string
      description: |
        client: cliente. supplier: fornitore. deadline: scadenza. estimate: computo metrico.
        quote: preventivo. site: cantiere. employee: dipendente. vehicle: mezzo.
        daily_report: rapportino. site_cost: costo. site_document: documento o foto del cantiere.
        purchase_order: ordine a un fornitore. warehouse_item: articolo di magazzino.
        invoice: fattura. progress_statement: SAL. price_list: prezzario.
        site_activity: attività del cronoprogramma.
      enum:
        [
          client,
          supplier,
          deadline,
          estimate,
          quote,
          site,
          employee,
          vehicle,
          daily_report,
          site_cost,
          site_document,
          purchase_order,
          warehouse_item,
          invoice,
          progress_statement,
          price_list,
          site_activity,
        ]
    AuditEntry:
      type: object
      required: [id, entity, entity_id, action, fields, user, created_at]
      properties:
        id:
          type: string
          description: Progressivo del registro, come testo.
        entity: { $ref: '#/components/schemas/AuditEntity' }
        entity_id: { $ref: '#/components/schemas/Id' }
        action:
          type: string
          description: create, update o delete.
          enum: [create, update, delete]
        fields:
          type: array
          description: |
            Per update, i nomi dei campi cambiati, in ordine alfabetico. Sono i nomi delle
            colonne del database, quasi sempre uguali ai campi del contratto (name, status,
            client_id…); gli importi hanno il suffisso _cents (amount_cents). Vuoto per create
            e delete.
          items:
            type: string
        user:
          description: Chi ha fatto la modifica; null se non è passata dall'API.
          oneOf:
            - type: 'null'
            - type: object
              required: [id, name]
              properties:
                id: { $ref: '#/components/schemas/Id' }
                name:
                  type: string
                  description: Vuoto se l'account non esiste più.
        created_at:
          type: string
          format: date-time
    AuditLogList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/AuditEntry' }
        meta: { $ref: '#/components/schemas/ListMeta' }
    ClientList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Client' }
        meta: { $ref: '#/components/schemas/ListMeta' }
    SupplierCategory:
      type: string
      description: |
        materials: materiali. rentals: noli (mezzi e attrezzature). subcontracting: subappalto.
        services: servizi (progettisti, consulenti, trasporti). other: altro.
      enum: [materials, rentals, subcontracting, services, other]
    SupplierInput:
      type: object
      description: |
        Dati di un fornitore, uguali in creazione e in modifica. I campi facoltativi si inviano
        comunque, con null se vuoti.
      required:
        - name
        - vat_number
        - tax_code
        - email
        - pec
        - phone
        - street
        - postal_code
        - city
        - province
        - country
        - categories
        - subcontractor
        - notes
      properties:
        name:
          type: string
          description: Ragione sociale, oppure nome e cognome della ditta individuale.
          minLength: 1
          maxLength: 200
        vat_number:
          type: [string, 'null']
          description: |
            Partita IVA, unica nell'azienda. Con country IT serve almeno una tra partita IVA e
            codice fiscale. Restituita normalizzata come per i clienti.
          maxLength: 20
        tax_code:
          type: [string, 'null']
          description: Codice fiscale, unico nell'azienda. Normalizzato come la partita IVA.
          maxLength: 16
        email:
          type: [string, 'null']
          format: email
        pec:
          type: [string, 'null']
          format: email
        phone:
          type: [string, 'null']
          maxLength: 30
        street:
          type: [string, 'null']
          maxLength: 200
        postal_code:
          type: [string, 'null']
          maxLength: 10
        city:
          type: [string, 'null']
          maxLength: 100
        province:
          type: [string, 'null']
          description: Sigla della provincia (TO, MI). Vuota per i fornitori esteri.
          maxLength: 2
        country:
          type: string
          description: Paese, codice ISO 3166-1 alpha-2.
          pattern: '^[A-Z]{2}$'
          default: IT
          examples: [IT]
        categories:
          type: array
          description: Una o più categorie, anche nessuna. I doppioni vengono tolti.
          uniqueItems: true
          items: { $ref: '#/components/schemas/SupplierCategory' }
        subcontractor:
          type: boolean
          description: |
            Subappaltatore: per lui contano i documenti di regolarità (DURC, visura,
            assicurazione) con le loro scadenze.
        notes:
          type: [string, 'null']
          maxLength: 2000
    Supplier:
      allOf:
        - $ref: '#/components/schemas/SupplierInput'
        - type: object
          required: [id, archived_at, created_at, updated_at]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            archived_at:
              type: [string, 'null']
              format: date-time
              description: Data di archiviazione; null se il fornitore è attivo.
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    SupplierList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Supplier' }
        meta: { $ref: '#/components/schemas/ListMeta' }
    SupplierDocumentKind:
      type: string
      description: |
        durc: DURC. chamber_extract: visura camerale. insurance: polizza assicurativa (RCT/RCO).
        other: altro documento (descrizione obbligatoria).
      enum: [durc, chamber_extract, insurance, other]
    Date:
      type: string
      format: date
      description: Data senza ora, AAAA-MM-GG.
      examples: ['2026-11-30']
    SupplierDocumentInput:
      type: object
      description: I campi facoltativi si inviano comunque, con null se vuoti.
      required: [kind, description, issued_on, expires_on, notes]
      properties:
        kind: { $ref: '#/components/schemas/SupplierDocumentKind' }
        description:
          type: [string, 'null']
          description: Obbligatoria se kind è other.
          maxLength: 200
        issued_on:
          oneOf:
            - $ref: '#/components/schemas/Date'
            - type: 'null'
        expires_on:
          description: Non prima di issued_on. Null se il documento non scade.
          oneOf:
            - $ref: '#/components/schemas/Date'
            - type: 'null'
        notes:
          type: [string, 'null']
          maxLength: 2000
    SupplierDocument:
      allOf:
        - $ref: '#/components/schemas/SupplierDocumentInput'
        - type: object
          required: [id, supplier_id, status, file, created_at, updated_at]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            supplier_id: { $ref: '#/components/schemas/Id' }
            file:
              description: Il file allegato (PDF del DURC, scansione della polizza), o null.
              oneOf:
                - $ref: '#/components/schemas/AttachedFile'
                - type: 'null'
            status:
              type: string
              description: |
                Calcolato dal backend sulla data di oggi (ora italiana). valid: valido.
                expiring: scade entro 30 giorni. expired: scaduto. no_expiry: senza scadenza.
              enum: [valid, expiring, expired, no_expiry]
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    AttachedFile:
      type: object
      required: [file_name, content_type, size, uploaded_at]
      properties:
        file_name: { type: string }
        content_type:
          type: string
          enum: [application/pdf, image/jpeg, image/png]
        size:
          type: integer
          description: Dimensione in byte.
        uploaded_at:
          type: string
          format: date-time
    EmployeeAbsenceKind:
      type: string
      description: |
        vacation: ferie. sick_leave: malattia. leave: permesso. injury: infortunio.
        other: altra assenza (note obbligatorie).
      enum: [vacation, sick_leave, leave, injury, other]
    EmployeeAbsenceInput:
      type: object
      description: I campi facoltativi si inviano comunque, con null se vuoti.
      required: [kind, starts_on, ends_on, hours, notes]
      properties:
        kind: { $ref: '#/components/schemas/EmployeeAbsenceKind' }
        starts_on: { $ref: '#/components/schemas/Date' }
        ends_on:
          description: Ultimo giorno di assenza, compreso; non prima di starts_on.
          allOf:
            - $ref: '#/components/schemas/Date'
        hours:
          description: |
            Solo per un'assenza di parte della giornata (es. permesso di 2 ore): ammesse solo se
            starts_on ed ends_on coincidono, da 0.01 a 24. Null per giornate intere.
          oneOf:
            - $ref: '#/components/schemas/Hours'
            - type: 'null'
        notes:
          type: [string, 'null']
          description: Obbligatorie se kind è other.
          maxLength: 2000
    EmployeeAbsence:
      allOf:
        - $ref: '#/components/schemas/EmployeeAbsenceInput'
        - type: object
          required: [id, employee_id, days, created_at, updated_at]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            employee_id: { $ref: '#/components/schemas/Id' }
            days:
              type: integer
              minimum: 1
              description: Giorni di calendario da starts_on a ends_on, estremi compresi.
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    EmployeeAbsenceList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/EmployeeAbsence' }
    SupplierDocumentList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/SupplierDocument' }
    Amount:
      type: string
      description: |
        Importo in euro come stringa con due decimali e il punto, mai numero JSON. In ingresso
        si accettano anche zero o un decimale.
      pattern: '^\d{1,13}(\.\d{1,2})?$'
      examples: ['1234.50']
    SignedAmount:
      type: string
      description: |
        Importo calcolato dal backend, in euro con due decimali e il punto, mai numero JSON.
        Può essere negativo (ad esempio una voce di sole detrazioni).
      pattern: '^-?\d+\.\d{2}$'
      examples: ['1234.50', '-12.00']
    DeadlineKind:
      type: string
      description: |
        durc, insurance (assicurazione), tax (imposte e contributi), invoice_in (fattura da
        pagare), invoice_out (fattura da incassare), contract (contratto), vehicle (mezzo:
        bollo, revisione), medical_check (visita medica del dipendente), training (formazione
        e corsi sulla sicurezza), other.
      enum:
        [durc, insurance, tax, invoice_in, invoice_out, contract, vehicle, medical_check, training, other]
    DeadlineStatus:
      type: string
      enum: [open, done]
    DeadlineRecurrence:
      type: string
      description: |
        monthly (ogni mese), quarterly (ogni tre mesi), yearly (ogni anno). La data successiva
        si ottiene aggiungendo l'intervallo; a fine mese si ferma all'ultimo giorno (31/01 →
        28/02).
      enum: [monthly, quarterly, yearly]
    SubjectRef:
      type: object
      description: Cliente o fornitore collegato, con il nome per mostrarlo senza altre chiamate.
      required: [id, name]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
    DeadlineInput:
      type: object
      description: |
        I campi facoltativi si inviano comunque, con null se vuoti. Al massimo uno tra
        client_id e supplier_id. site_id, employee_id e vehicle_id si possono omettere: un
        campo assente vale null, anche in modifica (toglie il collegamento).
      required: [title, due_on, kind, amount, client_id, supplier_id, notes, recurrence]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        due_on: { $ref: '#/components/schemas/Date' }
        kind: { $ref: '#/components/schemas/DeadlineKind' }
        amount:
          oneOf:
            - $ref: '#/components/schemas/Amount'
            - type: 'null'
        client_id:
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        supplier_id:
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        site_id:
          description: Cantiere a cui si riferisce la scadenza (es. un permesso).
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        employee_id:
          description: Dipendente a cui si riferisce (es. visita medica, corso sulla sicurezza).
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        vehicle_id:
          description: Mezzo a cui si riferisce (es. revisione, bollo, assicurazione).
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        notes:
          type: [string, 'null']
          maxLength: 2000
        recurrence:
          oneOf:
            - $ref: '#/components/schemas/DeadlineRecurrence'
            - type: 'null'
    Deadline:
      allOf:
        - $ref: '#/components/schemas/DeadlineInput'
        - type: object
          required:
            - id
            - status
            - done_at
            - next_deadline_id
            - supplier_document_id
            - invoice_id
            - client
            - supplier
            - site_id
            - employee_id
            - vehicle_id
            - site
            - employee
            - vehicle
            - created_at
            - updated_at
          properties:
            id: { $ref: '#/components/schemas/Id' }
            amount:
              description: In uscita sempre con due decimali.
              oneOf:
                - type: string
                  pattern: '^\d+\.\d{2}$'
                - type: 'null'
            status: { $ref: '#/components/schemas/DeadlineStatus' }
            supplier_document_id:
              description: |
                Documento di regolarità del fornitore da cui nasce la scadenza. Il backend la
                tiene allineata alla data di scadenza del documento (un rinnovo la riapre) e la
                elimina con il documento: si modifica dal documento, non da qui.
              oneOf:
                - $ref: '#/components/schemas/Id'
                - type: 'null'
            invoice_id:
              description: |
                Fattura da cui nasce la scadenza di pagamento. Il backend la tiene allineata alla
                fattura (data, importo, chiusa quando la fattura è pagata) e la elimina con la
                fattura: si modifica dalla fattura, non da qui.
              oneOf:
                - $ref: '#/components/schemas/Id'
                - type: 'null'
            next_deadline_id:
              description: La scadenza creata completando questa, se ricorrente.
              oneOf:
                - $ref: '#/components/schemas/Id'
                - type: 'null'
            done_at:
              type: [string, 'null']
              format: date-time
            client:
              oneOf:
                - $ref: '#/components/schemas/SubjectRef'
                - type: 'null'
            supplier:
              oneOf:
                - $ref: '#/components/schemas/SubjectRef'
                - type: 'null'
            site:
              description: Cantiere collegato, con il nome.
              oneOf:
                - $ref: '#/components/schemas/SubjectRef'
                - type: 'null'
            employee:
              description: Dipendente collegato, con cognome e nome.
              oneOf:
                - $ref: '#/components/schemas/SubjectRef'
                - type: 'null'
            vehicle:
              description: Mezzo collegato, con il nome.
              oneOf:
                - $ref: '#/components/schemas/SubjectRef'
                - type: 'null'
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    DeadlineBucket:
      type: object
      required: [count, amount]
      properties:
        count:
          type: integer
          minimum: 0
        amount:
          description: Somma degli importi, con due decimali; le scadenze senza importo valgono zero.
          type: string
          pattern: '^\d+\.\d{2}$'
    DeadlineSummary:
      type: object
      required: [today, overdue, next_7_days, next_30_days]
      properties:
        today: { $ref: '#/components/schemas/Date' }
        overdue: { $ref: '#/components/schemas/DeadlineBucket' }
        next_7_days: { $ref: '#/components/schemas/DeadlineBucket' }
        next_30_days: { $ref: '#/components/schemas/DeadlineBucket' }
    DeadlineList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Deadline' }
        meta: { $ref: '#/components/schemas/ListMeta' }
    SiteStatus:
      type: string
      description: |
        planned: da iniziare. active: in corso. suspended: sospeso. completed: chiuso.
      enum: [planned, active, suspended, completed]
    SiteInput:
      type: object
      description: I campi facoltativi si inviano comunque, con null se vuoti.
      required: [code, name, client_id, address, status, start_on, end_on, budget, notes]
      properties:
        code:
          type: [string, 'null']
          description: Codice della commessa, unico nell'azienda (senza distinguere maiuscole).
          maxLength: 50
        name:
          type: string
          minLength: 1
          maxLength: 200
        client_id:
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        address:
          type: [string, 'null']
          description: Indirizzo del cantiere, in una riga.
          maxLength: 300
        status: { $ref: '#/components/schemas/SiteStatus' }
        start_on:
          description: Inizio dei lavori.
          oneOf:
            - $ref: '#/components/schemas/Date'
            - type: 'null'
        end_on:
          description: Fine prevista, non prima dell'inizio.
          oneOf:
            - $ref: '#/components/schemas/Date'
            - type: 'null'
        budget:
          description: Budget di costo del cantiere.
          oneOf:
            - $ref: '#/components/schemas/Amount'
            - type: 'null'
        notes:
          type: [string, 'null']
          maxLength: 2000
        location:
          description: |
            Posizione del cantiere sulla mappa (WGS 84, come OpenStreetMap), o null se non
            indicata. Facoltativo: se manca, alla creazione vale null e alla modifica resta
            com'è.
          oneOf:
            - $ref: '#/components/schemas/GeoPoint'
            - type: 'null'
    GeoPoint:
      type: object
      required: [latitude, longitude]
      properties:
        latitude:
          type: string
          description: |
            Latitudine in gradi decimali con il punto, da -90 a 90, fino a sei decimali; mai
            numero JSON. In uscita ha sempre sei decimali.
          pattern: '^-?\d{1,2}(\.\d{1,6})?$'
          examples: ['45.070312']
        longitude:
          type: string
          description: Longitudine in gradi decimali, da -180 a 180, come la latitudine.
          pattern: '^-?\d{1,3}(\.\d{1,6})?$'
          examples: ['7.686856']
    Site:
      allOf:
        - $ref: '#/components/schemas/SiteInput'
        - type: object
          required: [id, client, location, quote, created_at, updated_at]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            client:
              oneOf:
                - $ref: '#/components/schemas/SubjectRef'
                - type: 'null'
            quote:
              description: Il preventivo da cui è nato il cantiere (createSiteFromQuote), o null.
              oneOf:
                - $ref: '#/components/schemas/QuoteRef'
                - type: 'null'
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    SiteList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Site' }
        meta: { $ref: '#/components/schemas/ListMeta' }
    SiteTeamInput:
      type: object
      required: [employee_ids]
      properties:
        employee_ids:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/Id' }
    SiteTeamMember:
      type: object
      required: [employee_id, first_name, last_name, job_title, active]
      properties:
        employee_id: { $ref: '#/components/schemas/Id' }
        first_name: { type: string }
        last_name: { type: string }
        job_title: { type: [string, 'null'] }
        active: { type: boolean }
    SiteTeam:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/SiteTeamMember' }
    DailyReportStatus:
      type: string
      description: |
        draft: bozza. submitted: inviato all'ufficio. approved: approvato.
      enum: [draft, submitted, approved]
    Hours:
      type: string
      description: Ore come stringa con il punto, da 0.01 a 24; in uscita sempre con due decimali.
      pattern: '^\d{1,4}(\.\d{1,2})?$'
      examples: ['8.00', '7.5']
    DailyReportInput:
      type: object
      description: |
        I campi facoltativi si inviano comunque, con null se vuoti. labor e vehicles sono gli
        elenchi completi (anche vuoti), al massimo 100 righe ciascuno, senza doppioni; gli
        errori delle righe usano il percorso con l'indice (labor.0.hours).
      required: [site_id, date, weather, work_done, notes, labor, vehicles]
      properties:
        site_id: { $ref: '#/components/schemas/Id' }
        date: { $ref: '#/components/schemas/Date' }
        weather:
          type: [string, 'null']
          description: Condizioni meteo, testo libero.
          maxLength: 100
        work_done:
          type: [string, 'null']
          description: Lavori svolti nella giornata.
          maxLength: 5000
        notes:
          type: [string, 'null']
          maxLength: 2000
        labor:
          type: array
          maxItems: 100
          items:
            type: object
            required: [employee_id, hours, description]
            properties:
              employee_id: { $ref: '#/components/schemas/Id' }
              hours: { $ref: '#/components/schemas/Hours' }
              description:
                type: [string, 'null']
                maxLength: 500
        vehicles:
          type: array
          maxItems: 100
          items:
            type: object
            required: [vehicle_id, hours, description]
            properties:
              vehicle_id: { $ref: '#/components/schemas/Id' }
              hours: { $ref: '#/components/schemas/Hours' }
              description:
                type: [string, 'null']
                maxLength: 500
    UserRef:
      type: object
      required: [id, name]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
    DailyReportSummary:
      type: object
      required:
        - id
        - site_id
        - site
        - date
        - status
        - weather
        - work_done
        - notes
        - total_labor_hours
        - total_vehicle_hours
        - created_by
        - submitted_at
        - approved_at
        - approved_by
        - created_at
        - updated_at
      properties:
        id: { $ref: '#/components/schemas/Id' }
        site_id: { $ref: '#/components/schemas/Id' }
        site:
          type: object
          required: [id, name, code]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            name: { type: string }
            code: { type: [string, 'null'] }
        date: { $ref: '#/components/schemas/Date' }
        status: { $ref: '#/components/schemas/DailyReportStatus' }
        weather: { type: [string, 'null'] }
        work_done: { type: [string, 'null'] }
        notes: { type: [string, 'null'] }
        total_labor_hours: { $ref: '#/components/schemas/Hours' }
        total_vehicle_hours: { $ref: '#/components/schemas/Hours' }
        created_by:
          description: Chi ha scritto il rapportino; null per i dati caricati fuori dall'API.
          oneOf:
            - $ref: '#/components/schemas/UserRef'
            - type: 'null'
        submitted_at:
          type: [string, 'null']
          format: date-time
        approved_at:
          type: [string, 'null']
          format: date-time
        approved_by:
          oneOf:
            - $ref: '#/components/schemas/UserRef'
            - type: 'null'
