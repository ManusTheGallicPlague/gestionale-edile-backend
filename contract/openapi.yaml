          description: Preventivo creato
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quote' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/estimates/{estimate}/pdf:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/EstimateId'
    get:
      operationId: getEstimatePdf
      summary: PDF del computo metrico estimativo
      description: |
        Permesso: estimates.view. Il computo in A4, da stampare o allegare: intestazione
        dell'azienda, titolo con committente, cantiere e luogo dei lavori, capitoli
        nell'ordine dell'albero (prima le voci, poi i sottocapitoli), per ogni voce il numero
        progressivo, codice, descrizione, righe di misura (parti uguali, lunghezza,
        larghezza, altezza o peso, quantità), «Sommano» con unità di misura, quantità,
        prezzo e importo; il totale di ogni capitolo e del computo, e un riepilogo per
        capitoli. Il file si chiama computo.pdf. Senza permesso risponde 404, non 403.

        Con prices=false esce il «Computo metrico» senza prezzi, da mandare ai fornitori e
        ai subappaltatori per chiedere un'offerta: stesse voci, righe di misura e quantità,
        colonne Prezzo e Importo vuote, niente totali né riepilogo. Il file si chiama
        computo-senza-prezzi.pdf.
      parameters:
        - name: prices
          in: query
          description: false per il computo senza prezzi e importi.
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Il PDF
          headers:
            Content-Disposition:
              description: attachment, con il nome del file.
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/estimates/{estimate}/items/export:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/EstimateId'
    get:
      operationId: exportEstimateItems
      summary: Esportazione del computo metrico in CSV
      description: |
        Permesso: estimates.view. Senza permesso risponde 404. Il computo intero, nello
        stesso formato dell'esportazione dei clienti, nell'ordine dell'albero (come il PDF):
        una riga per capitolo, poi le sue voci, ognuna seguita dalle sue righe di misura,
        poi i sottocapitoli; l'ultima riga ha il totale. Colonne Tipo (Capitolo, Voce,
        Misura, Totale), Livello (1 per i capitoli principali), N. (numero progressivo della
        voce), Codice, Descrizione, Unità, Parti uguali, Lunghezza, Larghezza, Altezza/peso,
        Quantità, Prezzo, Importo; numeri con la virgola decimale (1234,50), anche negativi.
        Il file si chiama computo.csv.
      responses:
        '200':
          description: Il file CSV
          headers:
            Content-Disposition:
              description: attachment, con il nome del file.
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{company}/estimates/{estimate}/structure:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/EstimateId'
    get:
      operationId: getEstimateStructure
      summary: Capitoli e voci di un computo
      description: |
        Permesso: estimates.view. Senza permesso risponde 404, non 403.
        Tre elenchi piatti, già ordinati per posizione: l'albero si ricostruisce con
        parent_id (capitoli), chapter_id (voci) e item_id (righe di misura).
        I totali di voci, capitoli e computo li calcola il backend: ogni importo di voce è
        arrotondato al centesimo, capitoli e computo sommano gli importi arrotondati.
        L'ETag è la versione dell'albero: cambia a ogni modifica di capitoli, voci o misure.
      responses:
        '200':
          description: La struttura del computo
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EstimateStructure' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: arrangeEstimateStructure
      summary: Riordino e spostamento di capitoli e voci, in blocco
      description: |
        Permesso: estimates.update. Si inviano tutti i capitoli e tutte le voci del computo,
        ognuno una volta sola, con il nuovo genitore; l'ordine dell'elenco dà la posizione
        dentro ciascun genitore. Titoli, prezzi e misure non cambiano. If-Match vuole l'ETag
        della struttura. Al massimo 4 livelli di capitoli, senza cicli. Con measurements, che
        è facoltativo, si riordinano anche le righe di misura (tutte, ognuna una volta sola,
        con la voce a cui appartengono: possono anche passare a un'altra voce); senza,
        restano dove sono.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EstimateArrangement' }
      responses:
        '200':
          description: La struttura dopo lo spostamento
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EstimateStructure' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

