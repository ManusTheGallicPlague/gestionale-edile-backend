        errori delle righe usano il percorso con l'indice (labor.0.hours).
      required: [site_id, date, weather, work_done, notes, labor, vehicles]
      properties:
        site_id: { $ref: '#/components/schemas/Id' }
        date: { $ref: '#/components/schemas/Date' }
        weather:
          type: [string, 'null']
          description: Condizioni meteo, testo libero.
          maxLength: 100
        work_done:
          type: [string, 'null']
          description: Lavori svolti nella giornata.
          maxLength: 5000
        notes:
          type: [string, 'null']
          maxLength: 2000
        labor:
          type: array
          maxItems: 100
          items:
            type: object
            required: [employee_id, hours, description]
            properties:
              employee_id: { $ref: '#/components/schemas/Id' }
              hours: { $ref: '#/components/schemas/Hours' }
              description:
                type: [string, 'null']
                maxLength: 500
        vehicles:
          type: array
          maxItems: 100
          items:
            type: object
            required: [vehicle_id, hours, description]
            properties:
              vehicle_id: { $ref: '#/components/schemas/Id' }
              hours: { $ref: '#/components/schemas/Hours' }
              description:
                type: [string, 'null']
                maxLength: 500
    UserRef:
      type: object
      required: [id, name]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
    DailyReportSummary:
      type: object
      required:
        - id
        - site_id
        - site
        - date
        - status
        - weather
        - work_done
        - notes
        - total_labor_hours
        - total_vehicle_hours
        - created_by
        - submitted_at
        - approved_at
        - approved_by
        - created_at
        - updated_at
      properties:
        id: { $ref: '#/components/schemas/Id' }
        site_id: { $ref: '#/components/schemas/Id' }
        site:
          type: object
          required: [id, name, code]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            name: { type: string }
            code: { type: [string, 'null'] }
        date: { $ref: '#/components/schemas/Date' }
        status: { $ref: '#/components/schemas/DailyReportStatus' }
        weather: { type: [string, 'null'] }
        work_done: { type: [string, 'null'] }
        notes: { type: [string, 'null'] }
        total_labor_hours: { $ref: '#/components/schemas/Hours' }
        total_vehicle_hours: { $ref: '#/components/schemas/Hours' }
        created_by:
          description: Chi ha scritto il rapportino; null per i dati caricati fuori dall'API.
          oneOf:
            - $ref: '#/components/schemas/UserRef'
            - type: 'null'
        submitted_at:
          type: [string, 'null']
          format: date-time
        approved_at:
          type: [string, 'null']
          format: date-time
        approved_by:
          oneOf:
            - $ref: '#/components/schemas/UserRef'
            - type: 'null'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    DailyReport:
      allOf:
        - $ref: '#/components/schemas/DailyReportSummary'
        - type: object
          required: [labor, vehicles]
          properties:
            labor:
              type: array
              description: Ore dei dipendenti, senza costi.
              items:
                type: object
                required: [employee_id, first_name, last_name, hours, description]
                properties:
                  employee_id: { $ref: '#/components/schemas/Id' }
                  first_name: { type: string }
                  last_name: { type: string }
                  hours: { $ref: '#/components/schemas/Hours' }
                  description: { type: [string, 'null'] }
            vehicles:
              type: array
              description: Ore dei mezzi, senza costi.
              items:
                type: object
                required: [vehicle_id, name, plate, hours, description]
                properties:
                  vehicle_id: { $ref: '#/components/schemas/Id' }
                  name: { type: string }
                  plate: { type: [string, 'null'] }
                  hours: { $ref: '#/components/schemas/Hours' }
                  description: { type: [string, 'null'] }
    DailyReportToday:
      type: object
      required: [date, site, report, proposal, employees, vehicles]
      properties:
        date: { $ref: '#/components/schemas/Date' }
        site:
          type: object
          required: [id, name, code]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            name: { type: string }
            code: { type: [string, 'null'] }
        report:
          description: Il rapportino già scritto per quel giorno, oppure null.
          oneOf:
            - $ref: '#/components/schemas/DailyReport'
            - type: 'null'
        proposal: { $ref: '#/components/schemas/DailyReportInput' }
        employees:
          type: array
          description: Dipendenti attivi, per cognome e nome; in_team se sono nella squadra.
          items:
            type: object
            required: [id, first_name, last_name, in_team]
            properties:
              id: { $ref: '#/components/schemas/Id' }
              first_name: { type: string }
              last_name: { type: string }
              in_team: { type: boolean }
        vehicles:
          type: array
          description: Mezzi attivi, per nome.
          items:
            type: object
            required: [id, name, plate]
            properties:
              id: { $ref: '#/components/schemas/Id' }
              name: { type: string }
              plate: { type: [string, 'null'] }
    DailyReportList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/DailyReportSummary' }
        meta: { $ref: '#/components/schemas/ListMeta' }
    CostCategory:
      type: string
      description: |
        materials: materiali. rentals: noli. subcontract: subappalti. other: altro.
      enum: [materials, rentals, subcontract, other]
    SiteCostInput:
      type: object
