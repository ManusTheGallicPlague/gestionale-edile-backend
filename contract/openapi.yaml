  /api/companies/{company}/purchase-orders:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: listPurchaseOrders
      summary: Elenco degli ordini ai fornitori
      description: |
        Permesso: purchases.view. Dal più recente, senza le righe. total_amount è la somma degli
        ordini che rispettano i filtri, non solo della pagina. Importi senza IVA.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: sort
          in: query
          description: Campo di ordinamento; il segno meno vuol dire ordine decrescente.
          schema:
            type: string
            enum: [date, -date, number, -number, total, -total, delivery_date, -delivery_date]
            default: -date
        - name: filter
          in: query
          description: |
            Filtri, ad esempio filter[supplier]=<id>, filter[site]=<id>, filter[status]=sent,
            filter[from]=2026-11-01 e filter[to]=2026-11-30 (sulla data dell'ordine),
            filter[follow_up]=late, filter[invoiced]=false, filter[q]=testo (nel numero come
            2026/007, nelle note, nelle descrizioni delle righe e nel CIG o nel CUP del cantiere,
            anche scritti con gli spazi, senza distinguere maiuscole e minuscole). Con
            sort=delivery_date gli ordini senza data di consegna vanno in fondo.
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              supplier: { $ref: '#/components/schemas/Id' }
              site: { $ref: '#/components/schemas/Id' }
              status: { $ref: '#/components/schemas/PurchaseOrderStatus' }
              follow_up: { $ref: '#/components/schemas/PurchaseOrderFollowUp' }
              from: { $ref: '#/components/schemas/Date' }
              to: { $ref: '#/components/schemas/Date' }
              q:
                type: string
                maxLength: 100
              invoiced:
                description: |
                  true per i soli ordini con almeno una fattura ricevuta collegata, false per
                  quelli senza (con filter[status]=received: merce arrivata, fattura da
                  registrare). Chiede anche invoices.view, altrimenti 403.
                type: boolean
              over_invoiced:
                description: |
                  true per i soli ordini con l'imponibile fatturato (invoiced_amount) oltre il
                  totale dell'ordine, da controllare con il fornitore; false per gli altri,
                  anche senza fatture. Chiede anche invoices.view, altrimenti 403.
                type: boolean
      responses:
        '200':
          description: Una pagina di ordini
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseOrderList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    post:
      operationId: createPurchaseOrder
      summary: Nuovo ordine a un fornitore
      description: |
        Permesso: purchases.create. Nasce in bozza, con il numero successivo dell'anno della
        data dell'ordine (2026/001), che poi non cambia.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PurchaseOrderInput' }
      responses:
        '201':
          description: Ordine creato
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseOrder' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/purchase-orders/export:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: exportPurchaseOrders
      summary: Esportazione degli ordini ai fornitori in CSV
      description: |
        Permesso: purchases.view. Stessi filtri e ordinamento dell'elenco, senza paginazione, nello
        stesso formato dell'esportazione dei clienti. Date come 30/11/2026, importi con la
        virgola decimale (1234,50). In fondo la colonna Fatturato (invoiced_amount), vuota
        senza invoices.view, poi CIG e CUP del cantiere (vuote se il cantiere non li ha). Il
        file si chiama ordini.csv.
      parameters:
        - name: sort
          in: query
          schema:
            type: string
            enum: [date, -date, number, -number, total, -total, delivery_date, -delivery_date]
            default: -date
        - name: filter
          in: query
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              supplier: { $ref: '#/components/schemas/Id' }
              site: { $ref: '#/components/schemas/Id' }
              status: { $ref: '#/components/schemas/PurchaseOrderStatus' }
              follow_up: { $ref: '#/components/schemas/PurchaseOrderFollowUp' }
              from: { $ref: '#/components/schemas/Date' }
              to: { $ref: '#/components/schemas/Date' }
              q:
                type: string
                maxLength: 100
              invoiced:
                description: |
                  true per i soli ordini con almeno una fattura ricevuta collegata, false per
                  quelli senza (con filter[status]=received: merce arrivata, fattura da
                  registrare). Chiede anche invoices.view, altrimenti 403.
                type: boolean
              over_invoiced:
                description: |
                  true per i soli ordini con l'imponibile fatturato (invoiced_amount) oltre il
                  totale dell'ordine, da controllare con il fornitore; false per gli altri,
                  anche senza fatture. Chiede anche invoices.view, altrimenti 403.
                type: boolean
      responses:
        '200':
          description: Il file CSV
          headers:
            Content-Disposition:
              description: attachment, con il nome del file.
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/purchase-orders/{order}/pdf:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/PurchaseOrderId'
    get:
      operationId: getPurchaseOrderPdf
      summary: PDF dell'ordine al fornitore
      description: |
        Permesso: purchases.view. L'ordine in A4, da mandare al fornitore: intestazione
        dell'azienda, fornitore con indirizzo e partita IVA, cantiere di consegna e data di
        consegna se ci sono, righe con unità, quantità, prezzo e importo, totale senza IVA e
        note. Una bozza esce con la dicitura «bozza». Il file si chiama ordine-2026-001.pdf.
        Senza permesso risponde 404, non 403.
      responses:
        '200':
          description: Il PDF
          headers:
            Content-Disposition:
              description: attachment, con il nome del file.
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{company}/purchase-orders/{order}/lines/export:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/PurchaseOrderId'
    get:
      operationId: exportPurchaseOrderLines
      summary: Esportazione delle righe di un ordine al fornitore in CSV
      description: |
        Permesso: purchases.view. Senza permesso risponde 404. Tutte le righe, nell'ordine
        dell'ordine, in qualunque stato, nello stesso formato delle altre esportazioni, per
        confrontarle con le offerte o con la fattura del fornitore. Colonne: Descrizione, Unità,
        Quantità, Prezzo e Importo; numeri con la virgola decimale (1234,50). In fondo una riga
        Totale con il solo importo, uguale al totale dell'ordine (senza IVA). Il file si chiama
        come il PDF: ordine-<numero>.csv (la barra del numero diventa un trattino).
      responses:
        '200':
          description: Il file CSV
          headers:
            Content-Disposition:
              description: attachment, con il nome del file.
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{company}/purchase-orders/{order}:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/PurchaseOrderId'
    get:
      operationId: getPurchaseOrder
      summary: Un ordine con le righe
      description: 'Permesso: purchases.view. Senza permesso risponde 404, non 403.'
      responses:
        '200':
          description: L'ordine
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseOrder' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updatePurchaseOrder
      summary: Modifica di un ordine in bozza
      description: |
        Permesso: purchases.update. Si inviano tutti i campi; le righe sostituiscono le
        precedenti. Solo in bozza: altrimenti 409 con code order_not_draft.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PurchaseOrderInput' }
      responses:
        '200':
          description: Ordine aggiornato
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseOrder' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: L'ordine non è in bozza (code order_not_draft).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
    delete:
      operationId: deletePurchaseOrder
      summary: Eliminazione di un ordine in bozza
      description: 'Permesso: purchases.delete. Solo in bozza: altrimenti 409 con code order_not_draft.'
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Ordine eliminato
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: L'ordine non è in bozza (code order_not_draft).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /api/companies/{company}/purchase-orders/{order}/duplicate:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/PurchaseOrderId'
    post:
      operationId: duplicatePurchaseOrder
      summary: Copia di un ordine al fornitore, per riordinare
      description: |
        Permessi: purchases.view e purchases.create. Crea un ordine nuovo in bozza allo stesso
        fornitore, per lo stesso cantiere, con le stesse note e una copia di tutte le righe, in
        qualunque stato sia quello di partenza, che non cambia. La data è quella di oggi (ora
        italiana), con il numero successivo del suo anno; la data di consegna resta vuota.
        Senza permesso di vedere gli ordini risponde 404.
      security:
        - session: []
          csrf: []
      responses:
        '201':
          description: La copia in bozza
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseOrder' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{company}/purchase-orders/{order}/status:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/PurchaseOrderId'
    post:
      operationId: changePurchaseOrderStatus
      summary: Invio, ricevimento o ritorno indietro di un ordine
      description: |
        Permesso: purchases.update. Da draft a sent (inviato al fornitore), da sent a received
        (merce ricevuta), e indietro di un passo: da sent a draft, da received a sent. Un ordine
        senza righe non si invia (422 sotto lines). Gli altri passaggi rispondono 409 con code
        invalid_transition; un ordine già caricato in magazzino non torna indietro (409 con code
        has_documents).
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/PurchaseOrderStatus' }
      responses:
        '200':
          description: Stato cambiato
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseOrder' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            Passaggio di stato non ammesso (code invalid_transition) o ordine già caricato in
            magazzino (code has_documents).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /api/companies/{company}/purchase-orders/{order}/warehouse-loads:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/PurchaseOrderId'
    post:
      operationId: loadPurchaseOrderIntoWarehouse
      summary: Carico in magazzino della merce di un ordine ricevuto
      description: |
        Permessi: warehouse.create e purchases.view. Solo per ordini received (altrimenti 409
        con code invalid_transition). Crea un movimento di carico per ogni riga indicata, con
        la data indicata e collegato all'ordine; gli articoli si scelgono a mano perché le righe
        dell'ordine sono testo libero. Si può caricare in più volte.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, lines]
              properties:
                date: { $ref: '#/components/schemas/Date' }
                lines:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
                    required: [item_id, quantity]
                    properties:
                      item_id: { $ref: '#/components/schemas/Id' }
                      quantity:
                        description: Quantità maggiore di zero, nell'unità dell'articolo.
                        allOf:
                          - $ref: '#/components/schemas/Quantity'
                      unit_cost:
                        description: |
                          Costo unitario senza IVA, nell'unità dell'articolo (di solito il prezzo
                          della riga dell'ordine); si può omettere o mandare null se non si sa.
                        oneOf:
                          - $ref: '#/components/schemas/Amount'
                          - type: 'null'
      responses:
        '201':
          description: Movimenti di carico registrati
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/WarehouseMovement' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: L'ordine non è ricevuto (code invalid_transition).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/warehouse/items:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: listWarehouseItems
      summary: Articoli di magazzino con la giacenza
      description: |
        Permesso: warehouse.view. La ricerca guarda codice e nome. La giacenza è la somma dei
        carichi meno quella degli scarichi, e può essere negativa se manca un carico.
        filter[below_min]=true dà solo gli articoli sotto la scorta minima, da riordinare.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - name: sort
          in: query
          description: Campo di ordinamento; il segno meno vuol dire ordine decrescente.
          schema:
            type: string
            enum: [name, -name, code, -code, stock, -stock]
            default: name
        - $ref: '#/components/parameters/WarehouseItemFilter'
        - $ref: '#/components/parameters/WarehouseAsOf'
      responses:
        '200':
          description: Una pagina di articoli
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarehouseItemList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    post:
      operationId: createWarehouseItem
      summary: Nuovo articolo di magazzino
      description: 'Permesso: warehouse.create. Il codice, se c''è, è unico nell''azienda (422 su code).'
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WarehouseItemInput' }
      responses:
        '201':
          description: Articolo creato
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarehouseItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/warehouse/items/import:
    parameters:
      - $ref: '#/components/parameters/Company'
    post:
      operationId: importWarehouseItems
      summary: Importazione di articoli nuovi di magazzino da un file CSV, con la giacenza iniziale
      description: |
        Permesso: warehouse.create. Come importClients: stesso formato del file (al massimo
        5000 articoli), solo articoli nuovi, tutti o nessuno, errori sotto `file` o
        `row.<n>`; il file di exportWarehouseItems si reimporta così com'è, se nessuna
        giacenza è negativa. Colonne per nome:
        articolo (nome) e unità sono obbligatorie; le altre sono codice, giacenza (12,500
        oppure 12.5, non negativa, al massimo tre decimali) e note. Ogni riga si controlla
        come createWarehouseItem; un codice già presente nell'azienda o ripetuto nel file
        (senza distinguere maiuscole) è un errore della riga. Una giacenza maggiore di zero
        diventa un carico con la data di oggi e la nota «Giacenza iniziale (importazione)».
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string }
            example: "codice;articolo;unità;giacenza\r\nCEM-01;Cemento 32,5 R;sacco;40\r\n"
      responses:
        '200':
          description: Articoli importati
          content:
            application/json:
              schema:
                type: object
                required: [created, stock_loaded]
                properties:
                  created:
                    type: integer
                    minimum: 1
                    description: Articoli aggiunti.
                  stock_loaded:
                    type: integer
                    minimum: 0
                    description: Articoli con un carico della giacenza iniziale.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413':
          description: File più grande di 5 MB.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '415':
          description: Il corpo non è un file CSV (Content-Type text/csv).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/warehouse/items/export:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: exportWarehouseItems
      summary: Esportazione degli articoli di magazzino con la giacenza in CSV
      description: |
        Permesso: warehouse.view. Stessa ricerca e ordinamento dell'elenco, senza paginazione,
        nello stesso formato dell'esportazione dei clienti. Giacenza con la virgola decimale
        (12,500). Il file si chiama magazzino.csv, o magazzino-al-2026-12-31.csv con as_of. Le
        colonne restano quelle dell'importazione, più costo medio e valore in fondo (che
        l'importazione ignora): la scorta minima non c'è.
      parameters:
        - $ref: '#/components/parameters/Search'
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, -name, code, -code, stock, -stock]
            default: name
        - $ref: '#/components/parameters/WarehouseItemFilter'
        - $ref: '#/components/parameters/WarehouseAsOf'
      responses:
        '200':
          description: Il file CSV
          headers:
            Content-Disposition:
              description: attachment, con il nome del file.
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/warehouse/items/{item}:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/WarehouseItemId'
    get:
      operationId: getWarehouseItem
      summary: Un articolo di magazzino
      description: 'Permesso: warehouse.view. Senza permesso risponde 404, non 403.'
      responses:
        '200':
          description: L'articolo
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarehouseItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateWarehouseItem
      summary: Modifica di un articolo
      description: 'Permesso: warehouse.update. Si inviano tutti i campi.'
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WarehouseItemInput' }
      responses:
        '200':
          description: Articolo aggiornato
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarehouseItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
    delete:
      operationId: deleteWarehouseItem
      summary: Eliminazione di un articolo senza movimenti
      description: 'Permesso: warehouse.delete. Con movimenti risponde 409 con code has_documents.'
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Articolo eliminato
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: L'articolo ha movimenti (code has_documents).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /api/companies/{company}/warehouse/movements:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: listWarehouseMovements
      summary: Movimenti di magazzino
      description: 'Permesso: warehouse.view. Dal più recente.'
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: filter
          in: query
          description: |
            Filtri, ad esempio filter[item]=<id>, filter[site]=<id>, filter[kind]=out,
            filter[from]=2026-11-01 e filter[to]=2026-11-30 e filter[q]=testo (nelle note, nel
            codice e nel nome dell'articolo, senza distinguere maiuscole e minuscole).
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              item: { $ref: '#/components/schemas/Id' }
              site: { $ref: '#/components/schemas/Id' }
              kind: { $ref: '#/components/schemas/WarehouseMovementKind' }
              from: { $ref: '#/components/schemas/Date' }
              to: { $ref: '#/components/schemas/Date' }
              q:
                type: string
                maxLength: 100
      responses:
        '200':
          description: Una pagina di movimenti
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarehouseMovementList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    post:
      operationId: createWarehouseMovement
      summary: Carico o scarico di un articolo
      description: |
        Permesso: warehouse.create. Un movimento non si modifica: si elimina e se ne registra un
        altro. Lo scarico verso un cantiere indica site_id; il materiale che torna dal cantiere
        è un carico con site_id e site_return true.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WarehouseMovementInput' }
      responses:
        '201':
          description: Movimento registrato
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarehouseMovement' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/warehouse/movements/export:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: exportWarehouseMovements
      summary: Esportazione dei movimenti di magazzino in CSV
      description: |
        Permesso: warehouse.view. Stessi filtri e stesso ordine dell'elenco (dal più recente),
        senza paginazione, nello stesso formato delle altre esportazioni: ad esempio con
        filter[site]=<id> e filter[kind]=out, il materiale scaricato su un cantiere. Colonne:
        Data (all'italiana), Tipo (Carico, Scarico o Reso dal cantiere), Codice, Articolo, Unità, Quantità con la
        virgola decimale (12,500), Cantiere (codice e nome), Ordine (numero dell'ordine da cui
        viene il carico), Note, Costo unitario (dei carichi) e Valore (come value). Il file si chiama movimenti-magazzino.csv.
      parameters:
        - name: filter
          in: query
          description: Gli stessi filtri di listWarehouseMovements.
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              item: { $ref: '#/components/schemas/Id' }
              site: { $ref: '#/components/schemas/Id' }
              kind: { $ref: '#/components/schemas/WarehouseMovementKind' }
              from: { $ref: '#/components/schemas/Date' }
              to: { $ref: '#/components/schemas/Date' }
              q:
                type: string
                maxLength: 100
      responses:
        '200':
          description: Il file CSV
          headers:
            Content-Disposition:
              description: attachment, con il nome del file.
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/warehouse/movements/{movement}:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/WarehouseMovementId'
    delete:
      operationId: deleteWarehouseMovement
      summary: Eliminazione di un movimento
      description: 'Permesso: warehouse.delete. Il movimento non cambia mai, quindi niente If-Match.'
      security:
        - session: []
          csrf: []
      responses:
        '204':
          description: Movimento eliminato
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{company}/warehouse/stock-counts:
    parameters:
      - $ref: '#/components/parameters/Company'
    post:
      operationId: countWarehouseStock
      summary: Rettifica d'inventario dalla conta fisica
      description: |
        Permesso: warehouse.create. Per ogni articolo indicato si manda la quantità contata a
        una data (anche zero); il backend confronta la conta con la giacenza a quel giorno
        (tutti i movimenti fino a quella data compresa) e registra la differenza: un carico se
        si è contato di più, uno scarico se di meno, nessun movimento se coincide. I movimenti
        hanno la data della conta, nessun cantiere, nessun costo (il costo medio non cambia) e
        come note quelle indicate o «Rettifica d'inventario». I movimenti dopo quella data
        restano e continuano a contare. Un articolo una volta sola (422 su lines.N.item_id);
        un articolo sconosciuto o di un'altra azienda dà 422 su lines.N.item_id e non scrive
        niente. Le righe della risposta sono nello stesso ordine della richiesta.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, lines]
              properties:
                date: { $ref: '#/components/schemas/Date' }
                notes:
                  type: [string, 'null']
                  maxLength: 2000
                lines:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
                    required: [item_id, quantity]
                    properties:
                      item_id: { $ref: '#/components/schemas/Id' }
                      quantity:
                        description: Quantità contata, da zero in su, nell'unità dell'articolo.
                        allOf:
                          - $ref: '#/components/schemas/Quantity'
      responses:
        '201':
          description: Conta registrata
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/WarehouseStockCountLine' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/warehouse/stock-counts/import:
    parameters:
      - $ref: '#/components/parameters/Company'
    post:
      operationId: importWarehouseStockCount
      summary: Rettifica d'inventario da un foglio di conta in CSV
      description: |
        Permesso: warehouse.create. Come countWarehouseStock, ma le quantità contate vengono da
        un file CSV nello stesso formato delle altre importazioni (al massimo 5000 righe):
        di solito magazzino.csv (exportWarehouseItems, anche con as_of) con una colonna
        «Contata» aggiunta e compilata. Colonne per nome: contata (12,500 oppure 12.5, non
        negativa, al massimo tre decimali) e codice o articolo. L'articolo si trova per codice
        (senza distinguere maiuscole); se il codice è vuoto, per nome, purché un solo articolo
        lo abbia. Le righe con la cella contata vuota non si contano e restano come sono. Tutto
        o niente: errori sotto `date`, `file` o `row.<n>` (articolo sconosciuto o contato due
        volte, quantità non valida) e nessun movimento scritto. Le note dei movimenti sono
        «Rettifica d'inventario (importazione)». La risposta è quella di countWarehouseStock,
        nell'ordine delle righe del file.
      security:
        - session: []
          csrf: []
      parameters:
        - name: date
          in: query
          required: true
          description: Data della conta.
          schema: { $ref: '#/components/schemas/Date' }
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string }
            example: "Codice;Articolo;Unità;Giacenza;Contata\r\nCEM-01;Cemento 32,5 R;sacco;40,000;38\r\n"
      responses:
        '201':
          description: Conta registrata
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/WarehouseStockCountLine' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413':
          description: File più grande di 5 MB.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '415':
          description: Il corpo non è un file CSV (Content-Type text/csv).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/sites/{site}/cost-summary:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/SiteId'
    get:
      operationId: getSiteCostSummary
      summary: Riepilogo dei costi di un cantiere, confrontato con il budget
      description: |
        Permesso: costs.view. Senza permesso risponde 404, non 403. Manodopera e mezzi vengono
        dai rapportini approvati, alle ore per il costo orario di dipendenti e mezzi fissato
        all'approvazione del rapportino (quello attuale se allora mancava; senza costo orario
        valgono zero e si contano in missing_hourly_costs); poi i costi
        inseriti a mano per categoria. Importi senza IVA. Con invoices.view anche revenue: il
        fatturato del cantiere (imponibile delle fatture emesse collegate) e il margine
        rispetto ai costi; senza quel permesso revenue è null. Con anche estimates.view, in
        revenue ci sono i SAL approvati dei computi del cantiere (certified) e quelli ancora
        senza fattura (certified_uninvoiced), con la ritenuta di garanzia trattenuta
        (retention_held) e quella ancora da svincolare (retention_to_release); lo svincolo già
        fatturato (retention_released) c'è anche senza estimates.view. Con warehouse.view
        anche warehouse_materials: il materiale scaricato dal magazzino sul cantiere, meno quello
        tornato in magazzino (site_return), valutato al costo medio dei carichi fino al giorno di
        ogni movimento; è un'informazione a parte e
        non entra nel totale né nel margine (il materiale può essere già tra i costi inseriti
        a mano). Senza quel permesso warehouse_materials è null.
        Con purchases.view anche purchase_orders: gli ordini ai fornitori del cantiere già
        inviati o ricevuti (le bozze no), con il loro totale (il costo impegnato) e, con
        invoices.view, l'imponibile delle fatture ricevute collegate; anche questo non entra nel
        totale. Senza purchases.view purchase_orders è null.
      responses:
        '200':
          description: Il riepilogo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteCostSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{company}/sites/{site}/cost-summary/months:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/SiteId'
    get:
      operationId: getSiteMonthlyCosts
      summary: Costi di un cantiere mese per mese, per il grafico della panoramica
      description: |
        Permesso: costs.view. Senza permesso risponde 404, non 403, come getSiteCostSummary. Stessa
        regola del riepilogo: manodopera e mezzi dai rapportini approvati al costo orario
        fissato all'approvazione, più i costi inseriti a mano, divisi per mese della data del rapportino o del
        costo. Un mese per riga, dal primo all'ultimo mese
        con un costo, compresi quelli in mezzo senza costi (a zero); nessuna riga se il
        cantiere non ha costi. cumulative è il totale dall'inizio fino a quel mese compreso,
        da confrontare con budget; l'ultimo cumulative è uguale al total di getSiteCostSummary.
        Con invoices.view anche invoiced, l'imponibile delle fatture emesse collegate al
        cantiere per mese della data della fattura, e il suo progressivo cumulative_invoiced
        (l'ultimo è il fatturato di revenue in getSiteCostSummary); i mesi vanno allora dal primo
        all'ultimo con un costo o una fattura. Senza quel permesso i due campi sono null e le
        fatture non allungano l'elenco. Importi senza IVA.
      responses:
        '200':
          description: I costi per mese
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteMonthlyCosts' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{company}/sites/{site}/cost-summary/months/export:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/SiteId'
    get:
      operationId: exportSiteMonthlyCosts
      summary: Costi di un cantiere mese per mese in CSV
      description: |
        Permesso: costs.view (senza, 404 come getSiteMonthlyCosts). Le stesse righe di
        getSiteMonthlyCosts, nello stesso formato dell'esportazione dei clienti: colonne Mese
        (11/2026), Manodopera, Mezzi, Costi inseriti, Totale, Progressivo, importi con la virgola
        decimale (1234,50); con invoices.view in fondo anche Fatturato e Fatturato progressivo.
        Il file si chiama costi-mensili-cantiere.csv.
      responses:
        '200':
          description: Il file CSV
          headers:
            Content-Disposition:
              description: attachment, con il nome del file.
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{company}/sites/{site}/cost-summary/suppliers:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/SiteId'
    get:
      operationId: getSiteSupplierCosts
      summary: Costi inseriti a mano di un cantiere divisi per fornitore
      description: |
        Permesso: costs.view. Senza permesso risponde 404, non 403, come getSiteCostSummary. I
        costi inseriti a mano del cantiere raggruppati per fornitore, divisi per categoria, con
        quanti sono; i costi senza fornitore stanno in una riga con supplier null. Ordine dal
        totale più alto, a pari merito per nome del fornitore (la riga senza fornitore per
        ultima). total è la somma di tutte le righe ed è uguale a materials + rentals +
        subcontract + other di getSiteCostSummary. Manodopera e mezzi dei rapportini non hanno
        fornitore e restano fuori. Importi senza IVA; nessuna riga se il cantiere non ha costi
        inseriti. Con filter[from] e/o filter[to] contano solo i costi con la data dentro il
        periodo (estremi compresi); 422 se una data non è valida o la fine viene prima
        dell'inizio.
      parameters:
        - name: filter
          in: query
          description: Periodo, ad esempio filter[from]=2026-11-01 e filter[to]=2026-11-30.
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              from: { $ref: '#/components/schemas/Date' }
              to: { $ref: '#/components/schemas/Date' }
      responses:
        '200':
          description: I costi per fornitore
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteSupplierCosts' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/sites/{site}/cost-summary/suppliers/export:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/SiteId'
    get:
      operationId: exportSiteSupplierCosts
      summary: Costi di un cantiere per fornitore in CSV
      description: |
        Permesso: costs.view (senza, 404 come getSiteSupplierCosts). Le stesse righe nello stesso
        ordine di getSiteSupplierCosts, con lo stesso periodo, nello stesso formato dell'esportazione dei clienti:
        colonne Fornitore, Costi, Materiali, Noli, Subappalti, Altro, Totale, importi con la
        virgola decimale (1234,50); la riga senza fornitore ha «Senza fornitore». Il file si
        chiama costi-fornitori-cantiere.csv.
      parameters:
        - name: filter
          in: query
          description: Periodo, ad esempio filter[from]=2026-11-01 e filter[to]=2026-11-30.
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              from: { $ref: '#/components/schemas/Date' }
              to: { $ref: '#/components/schemas/Date' }
      responses:
        '200':
          description: Il file CSV
          headers:
            Content-Disposition:
              description: attachment, con il nome del file.
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/sites/{site}/work-summary:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/SiteId'
    get:
      operationId: getSiteWorkSummary
      summary: Ore di un cantiere per dipendente e per mezzo
      description: |
        Permessi: sites.view (senza, 404 come per la scheda) e reports.view (senza, 403). Per
        la scheda squadra del cantiere: ore dai rapportini, giorni con ore, primo e ultimo
        giorno per dipendente e per mezzo, da chi ha più ore. I costi, alle ore per il costo
        orario fissato all'approvazione (attuale per i rapportini non approvati), ci sono solo con costs.view; senza quel permesso, o senza costo orario,
        sono null. Senza filtri conta tutti i rapportini del cantiere.
        Per ogni dipendente anche le ore di straordinario (comprese nelle ore), i giorni di
        trasferta e le ore perse per maltempo sul cantiere (weather_hours, anche dalle giornate
        perse tutte), con il totale delle ore perse in labor.weather_hours, per la richiesta
        di cassa integrazione per intemperie. Chi nel periodo ha solo ore perse compare con
        ore, giorni e costo a zero, e primo e ultimo giorno sono quelli delle ore perse.
      parameters:
        - name: filter
          in: query
          description: |
            Filtri, ad esempio filter[from]=2026-11-01&filter[to]=2026-11-30 (estremi compresi)
            e filter[status]=approved.
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              from: { $ref: '#/components/schemas/Date' }
              to: { $ref: '#/components/schemas/Date' }
              status: { $ref: '#/components/schemas/DailyReportStatus' }
      responses:
        '200':
          description: Le ore del cantiere
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteWorkSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/sites/{site}/work-summary/export:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/SiteId'
    get:
      operationId: exportSiteWorkSummary
      summary: Ore di un cantiere per dipendente e per mezzo in CSV
      description: |
        Permessi come getSiteWorkSummary: sites.view (senza, 404) e reports.view (senza, 403).
        Le stesse righe nello stesso ordine e con gli stessi filtri: prima i dipendenti, poi
        una riga «Totale dipendenti», poi i mezzi e una riga «Totale mezzi». Colonne Tipo
        (Dipendente o Mezzo), Nome (cognome e nome del dipendente, nome del mezzo), Targa, Ore,
        Giorni, poi Costo solo con costs.view (vuoto senza costo orario), poi Primo giorno e
        Ultimo giorno, e in fondo Ore perse per maltempo, Di cui straordinario, Giorni di
        trasferta e Di cui festive (vuote per i mezzi; nella riga «Totale dipendenti» i totali di
        labor). Ore e
        importi con la virgola decimale (12,50), date come 30/11/2026. Il file si chiama
        ore-cantiere.csv.
      parameters:
        - name: filter
          in: query
          description: |
            Filtri come getSiteWorkSummary, ad esempio filter[from]=2026-11-01&filter[to]=2026-11-30
            (estremi compresi) e filter[status]=approved.
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              from: { $ref: '#/components/schemas/Date' }
              to: { $ref: '#/components/schemas/Date' }
              status: { $ref: '#/components/schemas/DailyReportStatus' }
      responses:
        '200':
          description: Il file CSV
          headers:
            Content-Disposition:
              description: attachment, con il nome del file.
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/sites/{site}/warehouse-materials:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/SiteId'
    get:
      operationId: listSiteWarehouseMaterials
      summary: Materiale del magazzino di un cantiere, articolo per articolo
      description: |
        Permessi: sites.view (senza, 404 come per la scheda) e warehouse.view (senza, 403). Per
        ogni articolo scaricato sul cantiere o tornato dal cantiere (site_return): quantità
        scaricata, tornata e netta, e il valore netto come in warehouse_materials del riepilogo
        dei costi, che è la somma di amount. In ordine di nome dell'articolo, senza paginazione.
      responses:
        '200':
          description: Il materiale del cantiere
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteWarehouseMaterialList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{company}/sites/{site}/warehouse-materials/export:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/SiteId'
    get:
      operationId: exportSiteWarehouseMaterials
      summary: Materiale del magazzino di un cantiere in CSV
      description: |
        Permessi: sites.view (senza, 404) e warehouse.view (senza, 403), come
        listSiteWarehouseMaterials, con le stesse righe nello stesso ordine e lo stesso formato
        delle altre esportazioni. Colonne: Codice, Articolo, Unità, Scaricata, Tornata, Netta
        (quantità con la virgola decimale), Valore (1234,50, anche negativo) e Movimenti senza
        costo; in fondo una riga Totale con il solo valore, uguale ad amount. Il file si chiama
        materiale-cantiere.csv.
      responses:
        '200':
          description: Il file CSV
          headers:
            Content-Disposition:
              description: attachment, con il nome del file.
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{company}/sites/{site}/documents:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/SiteId'
    get:
      operationId: listSiteDocuments
      summary: Documenti e foto di un cantiere
      description: |
        Permesso: documents.view. Senza permesso, o se il cantiere non c'è, risponde 404. Dal più
        recente. Le foto sono i file JPEG, PNG e WebP; gli altri sono documenti. Con filter[q]
        solo i documenti con il testo nel titolo, nel nome del file o nelle note, senza
        distinguere maiuscole e minuscole e senza caratteri jolly; un testo di soli spazi è
        ignorato.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: filter
          in: query
          description: |
            Filtri, ad esempio filter[kind]=photo per la scheda delle foto e
            filter[daily_report]=<id> per le foto di un rapportino.
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              kind: { $ref: '#/components/schemas/SiteDocumentKind' }
              daily_report: { $ref: '#/components/schemas/Id' }
              q:
                type: string
                maxLength: 100
      responses:
        '200':
          description: Una pagina di documenti
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteDocumentList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    post:
      operationId: uploadSiteDocument
      summary: Caricamento di un documento o di una foto
      description: |
        Permesso: documents.create. Il corpo è il file, con il suo Content-Type: PDF, JPEG, PNG,
        WebP, Word (.docx) o Excel (.xlsx), al massimo 20 MB. Il contenuto deve corrispondere al
        tipo dichiarato (altrimenti 422 sotto file). Nome del file e titolo nella query; senza
        titolo vale il nome del file. Il file non si sostituisce: si elimina e se ne carica un
        altro. Con daily_report_id il file (di solito una foto scattata in cantiere) resta
        collegato a un rapportino dello stesso cantiere; se il rapportino non c'è o è di un altro
        cantiere, 422 sotto daily_report_id. Il collegamento non si cambia dopo il caricamento;
        se il rapportino viene eliminato, il file resta nel cantiere senza collegamento.
      security:
        - session: []
          csrf: []
      parameters:
        - name: file_name
          in: query
          required: true
          description: Nome originale del file; si tiene solo l'ultima parte del percorso.
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: title
          in: query
          required: false
          schema: { type: string, maxLength: 200 }
        - name: daily_report_id
          in: query
          required: false
          description: Rapportino dello stesso cantiere a cui collegare il file.
          schema: { $ref: '#/components/schemas/Id' }
      requestBody:
        required: true
        content:
          application/pdf:
            schema: { type: string, format: binary }
          image/jpeg:
            schema: { type: string, format: binary }
          image/png:
            schema: { type: string, format: binary }
          image/webp:
            schema: { type: string, format: binary }
          application/vnd.openxmlformats-officedocument.wordprocessingml.document:
            schema: { type: string, format: binary }
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema: { type: string, format: binary }
      responses:
        '201':
          description: File caricato
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteDocument' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413':
          description: File più grande di 20 MB.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '415':
          description: Tipo di file non ammesso.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/sites/{site}/documents/{document}:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/SiteId'
      - $ref: '#/components/parameters/SiteDocumentId'
    get:
      operationId: getSiteDocument
      summary: Un documento del cantiere
      description: 'Permesso: documents.view. Senza permesso risponde 404, non 403.'
      responses:
        '200':
          description: Il documento, senza il file
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteDocument' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateSiteDocument
      summary: Modifica di titolo e note di un documento
      description: 'Permesso: documents.update. Si inviano tutti i campi.'
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SiteDocumentInput' }
      responses:
        '200':
          description: Documento aggiornato
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteDocument' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
    delete:
      operationId: deleteSiteDocument
      summary: Eliminazione di un documento
      description: 'Permesso: documents.delete. Elimina anche il file.'
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Documento eliminato
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /api/companies/{company}/sites/{site}/documents/{document}/content:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/SiteId'
      - $ref: '#/components/parameters/SiteDocumentId'
    get:
      operationId: getSiteDocumentContent
      summary: Il file di un documento
      description: |
        Permesso: documents.view. Senza permesso risponde 404. Il file arriva sempre come
        allegato (Content-Disposition: attachment, con il nome originale); va bene anche come
        sorgente di un tag img per le anteprime delle foto.
      responses:
        '200':
          description: Il file
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Content-Disposition:
              schema: { type: string }
          content:
            application/pdf:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema: { type: string, format: binary }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{company}/cash-flow:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: getCashFlowForecast
      summary: Previsione di cassa, mese per mese
      description: |
        Permesso: invoices.view. Quanto resta da incassare dalle fatture emesse e da pagare
        per quelle ricevute (remaining_amount, come in DashboardInvoices), diviso per mese
        della scadenza di pagamento, a partire dal mese in corso in Italia. Le fatture già
        scadute stanno in overdue e non nel loro mese; quelle senza scadenza in undated;
        quelle oltre l'ultimo mese in later. balance di ogni mese è il saldo accumulato:
        overdue più i netti dei mesi fino a quello compreso. Conta solo le fatture: preventivi,
        ordini e SAL non ancora fatturati restano fuori.
      parameters:
        - name: months
          in: query
          description: Quanti mesi, quello in corso compreso.
          schema:
            type: integer
            minimum: 1
            maximum: 24
            default: 6
      responses:
        '200':
          description: La previsione
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CashFlowForecast' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/cash-flow/export:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: exportCashFlowForecast
      summary: Previsione di cassa in CSV
      description: |
        Permesso e parametro come getCashFlowForecast, nel formato delle altre esportazioni:
        importi con la virgola decimale (1234,50), negativi con il meno. Una riga per lo
        scaduto (Scaduto al 07/11/2026), una per mese (11/2026), poi Oltre, Senza scadenza e
        Totale; il saldo progressivo c'è solo nelle righe dello scaduto e dei mesi. Il file si
        chiama previsione-cassa.csv.
      parameters:
        - name: months
          in: query
          description: Quanti mesi, quello in corso compreso.
          schema:
            type: integer
            minimum: 1
            maximum: 24
            default: 6
      responses:
        '200':
          description: Il file CSV
          headers:
            Content-Disposition:
              description: attachment, con il nome del file.
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/vat-summary:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: getVatSummary
      summary: Riepilogo IVA per la liquidazione, mese per mese o trimestre per trimestre
      description: |
        Permesso: invoices.view. Imponibile e IVA delle fatture del registro di un anno, divise
        per mese o trimestre della data della fattura (non della registrazione né del
        pagamento: pagate e non pagate contano allo stesso modo), per preparare la
        liquidazione con il commercialista. sales sono le fatture emesse, purchases le
        ricevute. sales_split_payment_vat è la parte di sales_vat delle fatture in scissione
        dei pagamenti, che versa la pubblica amministrazione. reverse_charge_taxable è
        l'imponibile delle fatture ricevute con natura IVA N6.x (inversione contabile):
        l'IVA da integrare non è nel registro e va calcolata a parte. balance è sales_vat
        meno sales_split_payment_vat meno purchases_vat: positivo è IVA a debito, negativo a
        credito. Niente IVA per cassa, pro rata né acconto di dicembre.
      parameters:
        - name: year
          in: query
          description: L'anno, quello in corso in Italia se manca.
          schema:
            type: integer
            minimum: 2000
            maximum: 2100
        - name: period
          in: query
          description: month per i mensili, quarter per i trimestrali.
          schema:
            type: string
            enum: [month, quarter]
            default: month
      responses:
        '200':
          description: Il riepilogo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VatSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/vat-summary/export:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: exportVatSummary
      summary: Riepilogo IVA in CSV
      description: |
        Permesso e parametri come getVatSummary, nel formato delle altre esportazioni: importi
        con la virgola decimale (1234,50), negativi con il meno. Una riga per periodo
        (01/2026 o 1° trimestre 2026) e la riga Totale; colonne Periodo, Imponibile vendite,
        IVA vendite, di cui IVA in scissione, Imponibile acquisti, IVA acquisti, Imponibile
        acquisti in inversione contabile, Saldo IVA. Il file si chiama riepilogo-iva-2026.csv.
      parameters:
        - name: year
          in: query
          description: L'anno, quello in corso in Italia se manca.
          schema:
            type: integer
            minimum: 2000
            maximum: 2100
        - name: period
          in: query
          description: month per i mensili, quarter per i trimestrali.
          schema:
            type: string
            enum: [month, quarter]
            default: month
      responses:
        '200':
          description: Il file CSV
          headers:
            Content-Disposition:
              description: attachment, con il nome del file.
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/dashboard:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: getDashboard
      summary: Indicatori della dashboard dell'azienda
      description: |
        Qualsiasi membro dell'azienda la chiama; ogni sezione è null se manca il suo permesso:
        sites con sites.view; over_budget con sites.view e costs.view; costs_this_month con
        costs.view; reports con reports.view; deadlines con deadlines.view; invoices con
        invoices.view; progress_statements con estimates.view; quotes con quotes.view; purchase_orders con
        purchases.view; warehouse con warehouse.view; vehicles con vehicles.view; employees con employees.view. Le date sono quelle
        di oggi in Italia. over_budget elenca, dal più sforato, al massimo 10 cantieri non chiusi
        con un budget e costi oltre il budget (manodopera e mezzi dai rapportini approvati, più
        i costi inseriti a mano, come in getSiteCostSummary). costs_this_month somma i costi del
        mese in corso con la stessa regola. deadlines elenca al massimo 10 scadenze aperte,
        scadute o entro 7 giorni, dalla più vecchia; i conteggi sono in getDeadlineSummary.
        Per i grafici: costs_by_month (costs.view) dà gli ultimi 12 mesi, mese in corso
        compreso, dal più vecchio, con la stessa regola dei costi divisa tra manodopera, mezzi e
        costi inseriti a mano; site_progress (sites.view) elenca al massimo 10 cantieri attivi
        con un cronoprogramma, dal più in ritardo rispetto al previsto.
      responses:
        '200':
          description: Gli indicatori
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{company}/search:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: searchCompany
      summary: Ricerca rapida in tutta l'azienda
      description: |
        Qualsiasi membro dell'azienda la chiama, per la ricerca della barra in alto. Cerca il
        testo (da 2 a 100 caratteri, maiuscole e minuscole uguali) e restituisce al massimo 5
        risultati per tipo, solo dei tipi che l'utente può vedere: client (clients.view: nome,
        partita IVA, codice fiscale, email), supplier (suppliers.view, come i clienti), site
        (sites.view: nome, codice, indirizzo, CIG e CUP), quote (quotes.view: oggetto e
        numero, es. 2026/001), estimate (estimates.view: titolo), invoice (invoices.view:
        numero, descrizione, CIG e CUP del cantiere), purchase_order (purchases.view: numero,
        nome del fornitore, CIG e CUP del cantiere), employee
        (employees.view: nome, cognome e codice fiscale), vehicle (vehicles.view: nome e
        targa), deadline (deadlines.view: titolo), price_list_item (price_lists.view: codice e
        descrizione della voce), site_document (documents.view: titolo e nome del file),
        warehouse_item (warehouse.view: nome e codice dell'articolo di magazzino),
        site_activity (sites.view: nome dell'attività del cronoprogramma), vehicle_document
        (vehicles.view: descrizione o tipo per esteso, es. Assicurazione, e note, dove di
        solito sta il numero della polizza; subtitle è il nome del mezzo), employee_document
        (employees.view: descrizione o tipo per esteso, es. Formazione sicurezza, e note;
        subtitle è cognome e nome del dipendente).
        parent_id è il prezzario della voce, il cantiere del documento o dell'attività, il
        mezzo del documento del mezzo o il dipendente del documento del dipendente, null per
        gli altri tipi. Clienti e fornitori archiviati sono esclusi. CIG e CUP si trovano anche
        scritti con gli spazi (es. B12C 3400 0560 007).
        I tipi escono in quest'ordine; dentro un tipo prima i titoli che iniziano con il testo,
        poi gli altri in ordine alfabetico.
      parameters:
        - name: q
          in: query
          required: true
          description: Il testo da cercare.
          schema: { type: string, minLength: 2, maxLength: 100 }
      responses:
        '200':
          description: I risultati
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResults' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/sites/{site}/activities:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/SiteId'
    get:
      operationId: listSiteActivities
      summary: Cronoprogramma del cantiere
      description: |
        Permesso: sites.view. Senza permesso risponde 404, non 403. Tutte le attività del
        cantiere (al massimo 500), senza paginazione, per disegnare il Gantt: in ordine di inizio,
        fine e nome.
      responses:
        '200':
          description: Le attività
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteActivityList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createSiteActivity
      summary: Nuova attività del cronoprogramma
      description: |
        Permesso: sites.update. Le dipendenze sono attività dello stesso cantiere che devono
        finire prima che questa inizi; un ciclo di dipendenze dà 422 sotto depends_on. Al
        massimo 500 attività per cantiere (422 sotto `_`).
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SiteActivityInput' }
      responses:
        '201':
          description: Attività creata
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteActivity' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/sites/{site}/activities/{activity}:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/SiteId'
      - $ref: '#/components/parameters/SiteActivityId'
    put:
      operationId: updateSiteActivity
      summary: Modifica di un'attività del cronoprogramma
      description: |
        Permesso: sites.update. Si inviano tutti i campi; depends_on sostituisce le dipendenze
        precedenti.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SiteActivityInput' }
      responses:
        '200':
          description: Attività aggiornata
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteActivity' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
    delete:
      operationId: deleteSiteActivity
      summary: Eliminazione di un'attività del cronoprogramma
      description: |
        Permesso: sites.update. Le attività che dipendevano da questa perdono la dipendenza.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Attività eliminata
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /api/companies/{company}/activities:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: listCompanyActivities
      summary: Attività del cronoprogramma di tutti i cantieri
      description: |
        Permesso: sites.view. Le attività di tutti i cantieri, in ordine di fine, inizio e nome,
        con il cantiere. Filtri sul cantiere (filter[site]) e sulle attività da seguire
        (filter[follow_up]), calcolate sulla data italiana e solo per i cantieri previsti o in
        corso (non sospesi né chiusi): late le attività non finite (avanzamento sotto 100) con
        la fine già passata; starting_soon quelle non ancora iniziate (avanzamento 0) che
        iniziano entro 7 giorni da oggi, oggi compreso; in_progress quelle non finite in corso
        oggi. Sono le stesse condizioni di activities in getDashboard. Con filter[from] e
        filter[to] solo le attività che toccano il periodo (estremi compresi): finiscono dal
        primo giorno in poi e iniziano entro l'ultimo; 422 se la fine viene prima dell'inizio.
        Con filter[q] solo le attività con il testo nel nome o nelle note dell'attività o nel
        nome o nel codice del cantiere, senza distinguere maiuscole e minuscole e senza
        caratteri jolly; un testo di soli spazi è ignorato.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: filter
          in: query
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              site: { $ref: '#/components/schemas/Id' }
              follow_up: { $ref: '#/components/schemas/ActivityFollowUp' }
              from: { $ref: '#/components/schemas/Date' }
              to: { $ref: '#/components/schemas/Date' }
              q:
                type: string
                maxLength: 100
      responses:
        '200':
          description: Una pagina di attività
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyActivityList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/activities/export:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: exportCompanyActivities
      summary: Esportazione in CSV delle attività del cronoprogramma di tutti i cantieri
      description: |
        Permesso: sites.view. Stessi filtri e ordinamento di listCompanyActivities, senza
        paginazione, nello stesso formato dell'esportazione dei clienti. Date come 30/11/2026.
        In fondo le colonne «Giorni lavorativi» (working_days) e «Giorni lavorativi rimanenti»
        (remaining_working_days). Il file si chiama cronoprogramma.csv.
      parameters:
        - name: filter
          in: query
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              site: { $ref: '#/components/schemas/Id' }
              follow_up: { $ref: '#/components/schemas/ActivityFollowUp' }
              from: { $ref: '#/components/schemas/Date' }
              to: { $ref: '#/components/schemas/Date' }
              q:
                type: string
                maxLength: 100
      responses:
        '200':
          description: Il file CSV
          headers:
            Content-Disposition:
              description: attachment, con il nome del file.
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/progress-statements:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: listCompanyProgressStatements
      summary: SAL di tutti i computi dell'azienda
      description: |
        Permesso: estimates.view. Dal più recente per data del SAL. Filtri sul cantiere del
        computo (filter[site]), sul cliente del computo (filter[client]), sul computo
        (filter[estimate]; un computo di un'altra azienda dà un elenco vuoto), sullo stato
        (filter[status]), sulla fattura (filter[invoiced]:
        true i SAL già fatturati, false quelli senza fattura) e sulla data del SAL
        (filter[from], filter[to]). Con filter[status]=approved e filter[invoiced]=false si
        hanno i SAL approvati da fatturare. Con filter[q] solo i SAL con il testo nel titolo del
        computo, nelle note del SAL, nel nome, nel codice, nel CIG o nel CUP del cantiere o nel
        nome del cliente del computo, senza distinguere maiuscole e minuscole e senza caratteri jolly; un testo
        di soli spazi è ignorato. total_amount e total_net_amount sommano i SAL che
        rispettano i filtri, non solo quelli della pagina.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: filter
          in: query
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              site: { $ref: '#/components/schemas/Id' }
              client: { $ref: '#/components/schemas/Id' }
              estimate: { $ref: '#/components/schemas/Id' }
              status: { $ref: '#/components/schemas/ProgressStatementStatus' }
              invoiced: { type: string, enum: ['true', 'false'] }
              from: { $ref: '#/components/schemas/Date' }
              to: { $ref: '#/components/schemas/Date' }
              q:
                type: string
                maxLength: 100
      responses:
        '200':
          description: Una pagina di SAL
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyProgressStatementList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/progress-statements/export:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: exportCompanyProgressStatements
      summary: Esportazione in CSV dei SAL di tutta l'azienda
      description: |
        Permesso: estimates.view. Stessi filtri e ordinamento di listCompanyProgressStatements,
        senza paginazione, nello stesso formato dell'esportazione dei clienti. Date come
        30/11/2026, importi con la virgola decimale (1234,50). Il file si chiama sal.csv.
        Le ultime due colonne sono il CIG e il CUP del cantiere del computo (vuote se il
        cantiere non li ha, o se il computo non ha cantiere), per la contabilità degli appalti
        pubblici.
      parameters:
        - name: filter
          in: query
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              site: { $ref: '#/components/schemas/Id' }
              client: { $ref: '#/components/schemas/Id' }
              estimate: { $ref: '#/components/schemas/Id' }
              status: { $ref: '#/components/schemas/ProgressStatementStatus' }
              invoiced: { type: string, enum: ['true', 'false'] }
              from: { $ref: '#/components/schemas/Date' }
              to: { $ref: '#/components/schemas/Date' }
              q:
                type: string
                maxLength: 100
      responses:
        '200':
          description: Il file CSV
          headers:
            Content-Disposition:
              description: attachment, con il nome del file.
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/estimates/{estimate}/progress-statements:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/EstimateId'
    get:
      operationId: listProgressStatements
      summary: SAL del computo
      description: |
        Permesso: estimates.view. Senza permesso risponde 404. Tutti gli stati di avanzamento
        lavori del computo, in ordine di numero, senza le righe.
      responses:
        '200':
          description: I SAL
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProgressStatementList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createProgressStatement
      summary: Nuovo SAL
      description: |
        Permesso: estimates.update. Il SAL nasce in bozza con il numero successivo. Le quantità
        sono quelle eseguite in questo SAL, voce per voce; il prezzo si copia dalla voce del
        computo. Se c'è già un SAL in bozza risponde 409 con code statement_draft_exists.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProgressStatementInput' }
      responses:
        '201':
          description: SAL creato
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProgressStatement' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: C'è già un SAL in bozza (code statement_draft_exists).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/estimates/{estimate}/progress-statements/{statement}:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/EstimateId'
      - $ref: '#/components/parameters/ProgressStatementId'
    get:
      operationId: getProgressStatement
      summary: Dettaglio di un SAL
      description: |
        Permesso: estimates.view. Le righe sono le voci con una quantità in questo SAL o in uno
        precedente, con quantità e importi del SAL, dei precedenti e progressivi.
      responses:
        '200':
          description: Il SAL
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProgressStatement' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateProgressStatement
      summary: Modifica di un SAL in bozza
      description: |
        Permesso: estimates.update. Si inviano tutti i campi; le righe sostituiscono le
        precedenti e riprendono il prezzo attuale delle voci. Solo in bozza: altrimenti 409 con
        code statement_not_draft.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProgressStatementInput' }
      responses:
        '200':
          description: SAL aggiornato
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProgressStatement' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Il SAL è già approvato (code statement_not_draft).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
    delete:
      operationId: deleteProgressStatement
      summary: Eliminazione di un SAL in bozza
      description: |
        Permesso: estimates.update. Solo in bozza: altrimenti 409 con code statement_not_draft.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: SAL eliminato
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Il SAL è già approvato (code statement_not_draft).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /api/companies/{company}/estimates/{estimate}/progress-statements/{statement}/export:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/EstimateId'
      - $ref: '#/components/parameters/ProgressStatementId'
    get:
      operationId: exportProgressStatement
      summary: Esportazione del SAL in CSV
      description: |
        Permesso: estimates.view. Senza permesso risponde 404, non 403. Le stesse righe di
        getProgressStatement, nello stesso ordine, in qualunque stato, nel formato delle altre
        esportazioni. Colonne: Codice, Descrizione, Unità, Prezzo, Quantità di contratto,
        Quantità precedente, Quantità del SAL, Quantità progressiva, Importo precedente,
        Importo del SAL, Importo progressivo; numeri con la virgola decimale (1234,50). Il
        prezzo è vuoto per le voci senza righe in questo SAL (nel dettaglio è 0.00).
        L'ultima riga, Totale, ha i tre importi del SAL; ritenuta e netto restano nel dettaglio
        e nel PDF. Il file si chiama sal-1.csv.
      responses:
        '200':
          description: Il file CSV
          headers:
            Content-Disposition:
              description: attachment, con il nome del file.
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{company}/estimates/{estimate}/progress-statements/{statement}/pdf:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/EstimateId'
      - $ref: '#/components/parameters/ProgressStatementId'
    get:
      operationId: getProgressStatementPdf
      summary: PDF del SAL
      description: |
        Permesso: estimates.view. Il SAL in A4, pronto da stampare e firmare: intestazione
        dell'azienda, computo con committente, cantiere, luogo dei lavori e, se il cantiere li
        ha, CIG e CUP dell'appalto (riga «CIG … - CUP …»), voci con prezzo,
        quantità precedenti, di questo SAL e progressive, importo di questo SAL, totali
        (lavori a tutto il SAL, SAL precedenti, importo del SAL, ritenuta di garanzia e netto
        se la ritenuta non è zero), note e spazio per le firme del direttore dei lavori e
        dell'impresa. Una bozza esce con la dicitura «bozza». Il file si chiama sal-1.pdf.
        Senza permesso risponde 404, non 403.
      responses:
        '200':
          description: Il PDF
          headers:
            Content-Disposition:
              description: attachment, con il nome del file.
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{company}/estimates/{estimate}/progress-statements/{statement}/approve:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/EstimateId'
      - $ref: '#/components/parameters/ProgressStatementId'
    post:
      operationId: approveProgressStatement
      summary: Approvazione di un SAL
      description: |
        Permesso: estimates.approve (oltre a estimates.view). Il SAL in bozza diventa approvato
        e non si modifica più: quantità e prezzi restano quelli del momento. Se è già approvato
        risponde 409 con code statement_not_draft.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: SAL approvato
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProgressStatement' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Il SAL è già approvato (code statement_not_draft).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /api/companies/{company}/price-lists:
