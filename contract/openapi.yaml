          description: Cerca nel nome.
          schema: { type: string, maxLength: 100 }
      responses:
        '200':
          description: Una pagina di prezzari
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PriceListList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    post:
      operationId: createPriceList
      summary: Nuovo prezzario
      description: 'Permesso: price_lists.create.'
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PriceListInput' }
      responses:
        '201':
          description: Prezzario creato
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PriceList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/price-lists/{list}:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/PriceListId'
    get:
      operationId: getPriceList
      summary: Un prezzario
      description: 'Permesso: price_lists.view. Senza permesso risponde 404, non 403.'
      responses:
        '200':
