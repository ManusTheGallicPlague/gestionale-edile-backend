            amount:
              description: Quantità per prezzo unitario, arrotondato al centesimo.
              allOf: [{ $ref: '#/components/schemas/SignedAmount' }]
            position:
              type: integer
              minimum: 0
              description: Ordine tra le voci dello stesso capitolo.
            version:
              type: string
              description: Lo stesso valore dell'ETag, da rimandare in If-Match.
    EstimateStructure:
      type: object
      required: [total, chapters, items, measurements]
      properties:
        total:
          description: Totale del computo.
          allOf: [{ $ref: '#/components/schemas/SignedAmount' }]
        measurements:
          type: array
          items: { $ref: '#/components/schemas/EstimateMeasurement' }
        chapters:
          type: array
          items: { $ref: '#/components/schemas/EstimateChapter' }
        items:
          type: array
          items: { $ref: '#/components/schemas/EstimateItem' }
    Quantity:
      type: string
      description: |
        Quantità come stringa con il punto e fino a tre decimali, mai numero JSON; può essere
        negativa (detrazioni). In uscita ha sempre tre decimali.
      pattern: '^-?\d+(\.\d{1,3})?$'
      examples: ['12.500', '-2.000']
    MeasurementFactor:
      description: Un fattore della riga di misura, al massimo 9 cifre intere; null se assente.
      oneOf:
        - type: string
          pattern: '^-?\d{1,9}(\.\d{1,3})?$'
        - type: 'null'
    EstimateMeasurementInput:
      type: object
      description: |
        I campi facoltativi si inviano comunque, con null se vuoti. Serve almeno un fattore.
        La quantità è il prodotto dei fattori presenti, arrotondato a tre decimali.
      required: [description, equal_parts, length, width, height]
      properties:
        description:
          type: [string, 'null']
          maxLength: 500
        equal_parts:
          description: Parti uguali.
          allOf: [{ $ref: '#/components/schemas/MeasurementFactor' }]
        length:
          description: Lunghezza.
          allOf: [{ $ref: '#/components/schemas/MeasurementFactor' }]
        width:
          description: Larghezza.
          allOf: [{ $ref: '#/components/schemas/MeasurementFactor' }]
        height:
          description: Altezza o peso.
          allOf: [{ $ref: '#/components/schemas/MeasurementFactor' }]
    EstimateMeasurementCreate:
      allOf:
        - $ref: '#/components/schemas/EstimateMeasurementInput'
        - type: object
          required: [item_id]
          properties:
            item_id: { $ref: '#/components/schemas/Id' }
    EstimateMeasurement:
      allOf:
        - $ref: '#/components/schemas/EstimateMeasurementCreate'
        - type: object
          required: [id, quantity, position, version]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            quantity: { $ref: '#/components/schemas/Quantity' }
            position:
              type: integer
              minimum: 0
              description: Ordine tra le righe della stessa voce.
            version:
              type: string
              description: Lo stesso valore dell'ETag, da rimandare in If-Match.
    EstimateArrangement:
      type: object
      required: [chapters, items]
      properties:
        chapters:
          type: array
          maxItems: 2000
          items:
            type: object
            required: [id, parent_id]
            properties:
              id: { $ref: '#/components/schemas/Id' }
              parent_id:
                oneOf:
                  - $ref: '#/components/schemas/Id'
                  - type: 'null'
        items:
          type: array
          maxItems: 10000
          items:
            type: object
            required: [id, chapter_id]
            properties:
              id: { $ref: '#/components/schemas/Id' }
              chapter_id: { $ref: '#/components/schemas/Id' }
    CompanyProfileInput:
      type: object
      description: |
        Dati fiscali dell'azienda. Per le aziende italiane si controllano partita IVA, codice
        fiscale, CAP e provincia. I campi facoltativi si inviano comunque, con null se vuoti.
      required:
        [legal_name, vat_number, tax_code, rea, share_capital, street, postal_code, city, province, country, phone, email, pec, iban]
      properties:
        legal_name:
          type: string
          description: Ragione sociale.
          minLength: 1
          maxLength: 200
        vat_number: { type: [string, 'null'], maxLength: 20 }
        tax_code: { type: [string, 'null'], maxLength: 16 }
        rea:
          type: [string, 'null']
          description: Numero REA, ad esempio TO-1234567.
          maxLength: 30
        share_capital:
          description: Capitale sociale versato, per le società.
          oneOf:
            - $ref: '#/components/schemas/Amount'
            - type: 'null'
        street: { type: [string, 'null'], maxLength: 200 }
        postal_code: { type: [string, 'null'], maxLength: 10 }
        city: { type: [string, 'null'], maxLength: 100 }
        province: { type: [string, 'null'], maxLength: 2 }
        country:
          type: string
          pattern: '^[A-Za-z]{2}$'
        phone: { type: [string, 'null'], maxLength: 30 }
        email: { type: [string, 'null'], maxLength: 254 }
        pec: { type: [string, 'null'], maxLength: 254 }
        iban:
          type: [string, 'null']
          description: Conto per i pagamenti, stampato nelle condizioni. Gli spazi si tolgono.
          maxLength: 42
    CompanyProfile:
      allOf:
        - $ref: '#/components/schemas/CompanyProfileInput'
        - type: object
          required: [updated_at]
          properties:
            updated_at:
              type: [string, 'null']
              format: date-time
              description: Null se i dati non sono mai stati salvati.
    Numbering:
      type: object
      required: [quotes]
      properties:
        quotes:
          type: object
          required: [year, next_number, next]
          properties:
            year: { type: integer }
            next_number:
              type: integer
              minimum: 1
            next:
              type: string
              description: Il prossimo numero come verrà stampato, ad esempio 2026/046.
              pattern: '^\d{4}/\d{3,}$'
    QuoteStatus:
      type: string
      description: 'draft: bozza. sent: inviato. accepted: accettato. rejected: rifiutato. expired: scaduto.'
      enum: [draft, sent, accepted, rejected, expired]
    QuoteInput:
      type: object
      description: I campi facoltativi si inviano comunque, con null se vuoti.
      required: [client_id, subject, validity_days, notes, terms]
      properties:
        client_id: { $ref: '#/components/schemas/Id' }
        subject:
          type: string
          description: Oggetto del preventivo.
          minLength: 1
          maxLength: 200
        validity_days:
          type: integer
          description: Giorni di validità dalla data del preventivo.
          minimum: 1
          maximum: 365
        notes:
          type: [string, 'null']
          maxLength: 5000
        terms:
          type: [string, 'null']
          description: Condizioni (pagamento, tempi, esclusioni).
          maxLength: 10000
    Quote:
      allOf:
        - $ref: '#/components/schemas/QuoteInput'
        - type: object
          required:
            [id, client, status, number, revision, revision_of, issue_date, valid_until, sent_at, totals, created_at, updated_at]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            totals: { $ref: '#/components/schemas/QuoteTotals' }
            client: { $ref: '#/components/schemas/SubjectRef' }
            status: { $ref: '#/components/schemas/QuoteStatus' }
            number:
              type: [string, 'null']
              description: |
                Numero progressivo dell'anno, ad esempio 2026/001; le revisioni hanno lo stesso
                numero con la revisione in fondo (2026/001-R1). Null in bozza.
              pattern: '^\d{4}/\d{3,}(-R\d+)?$'
            revision:
              type: [integer, 'null']
              description: 0 per il preventivo originale, 1, 2… per le revisioni; null in bozza.
              minimum: 0
            revision_of:
              description: Il preventivo da cui nasce questa revisione; null per un originale.
              oneOf:
                - $ref: '#/components/schemas/QuoteRef'
                - type: 'null'
            issue_date:
              description: Data del preventivo, quella del primo invio; null in bozza.
              oneOf:
                - $ref: '#/components/schemas/Date'
                - type: 'null'
            valid_until:
              description: Data più validity_days; null in bozza.
              oneOf:
                - $ref: '#/components/schemas/Date'
                - type: 'null'
            sent_at:
              type: [string, 'null']
              format: date-time
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    QuoteRef:
      type: object
      required: [id, number]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        number:
          type: [string, 'null']
          pattern: '^\d{4}/\d{3,}(-R\d+)?$'
    QuoteList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Quote' }
        meta: { $ref: '#/components/schemas/ListMeta' }
    QuoteLineKind:
      type: string
      description: 'item: riga con prezzo. text: solo testo. section: titolo di sezione.'
      enum: [item, text, section]
    VatRate:
      type: integer
      description: Aliquota IVA in percentuale.
      enum: [22, 10, 5, 4, 0]
    QuoteLineInput:
      type: object
      description: |
        Per le righe item servono unit, quantity, unit_price, discount_percent e vat_rate; per
        text e section vanno inviati null. I campi si inviano sempre tutti.
      required: [kind, description, unit, quantity, unit_price, discount_percent, vat_rate]
      properties:
        kind: { $ref: '#/components/schemas/QuoteLineKind' }
        description:
          type: string
          minLength: 1
          maxLength: 5000
        unit:
          type: [string, 'null']
          maxLength: 20
        quantity:
          oneOf:
            - type: string
              pattern: '^-?\d{1,11}(\.\d{1,3})?$'
            - type: 'null'
        unit_price:
          oneOf:
            - $ref: '#/components/schemas/Amount'
            - type: 'null'
        discount_percent:
          description: Sconto in percentuale, da 0 a 100, fino a due decimali.
          oneOf:
            - type: string
              pattern: '^\d{1,3}(\.\d{1,2})?$'
            - type: 'null'
        vat_rate:
          oneOf:
            - $ref: '#/components/schemas/VatRate'
            - type: 'null'
    QuoteLine:
      allOf:
        - $ref: '#/components/schemas/QuoteLineInput'
        - type: object
          required: [id, amount, position, version]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            amount:
              description: |
                Imponibile della riga: quantità × prezzo × (1 − sconto), arrotondato al
                centesimo. Null per text e section.
              oneOf:
                - $ref: '#/components/schemas/SignedAmount'
                - type: 'null'
            position:
              type: integer
              minimum: 0
            version:
              type: string
              description: Lo stesso valore dell'ETag, da rimandare in If-Match.
    QuoteLineList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/QuoteLine' }
    QuoteTotals:
      type: object
      description: |
        Calcolati dal backend in centesimi. L'imponibile è la somma degli imponibili di riga;
        l'IVA si calcola per aliquota sull'imponibile di quell'aliquota, arrotondata al
        centesimo; il totale è imponibile più IVA.
      required: [taxable, vat, vat_total, total]
      properties:
        taxable: { $ref: '#/components/schemas/SignedAmount' }
        vat:
          type: array
          description: Una voce per aliquota presente nelle righe, dalla più alta.
          items:
            type: object
            required: [rate, taxable, vat]
            properties:
              rate: { $ref: '#/components/schemas/VatRate' }
              taxable: { $ref: '#/components/schemas/SignedAmount' }
              vat: { $ref: '#/components/schemas/SignedAmount' }
        vat_total: { $ref: '#/components/schemas/SignedAmount' }
        total: { $ref: '#/components/schemas/SignedAmount' }
    QuoteFromEstimateInput:
      allOf:
        - $ref: '#/components/schemas/QuoteInput'
        - type: object
          required: [vat_rate]
          properties:
            vat_rate: { $ref: '#/components/schemas/VatRate' }
