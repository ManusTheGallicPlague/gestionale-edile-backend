      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Prezzario eliminato
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /api/companies/{company}/price-lists/{list}/items:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/PriceListId'
    get:
      operationId: listPriceListItems
      summary: Voci di un prezzario
      description: 'Permesso: price_lists.view. Senza permesso risponde 404. In ordine di codice.'
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: search
          in: query
          description: Cerca nel codice e nella descrizione.
          schema: { type: string, maxLength: 100 }
      responses:
        '200':
          description: Una pagina di voci
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PriceListItemList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    post:
      operationId: createPriceListItem
      summary: Nuova voce del prezzario
      description: |
        Permesso: price_lists.update. Il codice è unico nel prezzario, senza distinguere
        maiuscole (altrimenti 422 sotto code).
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PriceListItemInput' }
      responses:
        '201':
          description: Voce creata
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PriceListItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/price-lists/{list}/duplicate:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/PriceListId'
    post:
      operationId: duplicatePriceList
      summary: Copia di un prezzario, con un aumento dei prezzi facoltativo
      description: |
        Permessi: price_lists.view e price_lists.create (senza uno dei due risponde 403, un
        prezzario di un’altra azienda non si trova: 404). Crea un prezzario nuovo con nome,
        anno e note indicati e una copia di tutte le voci; con `price_change_percent` ogni
        prezzo cambia di quella percentuale (es. 3.5 per l'aggiornamento dei prezzi all'anno
        nuovo, -10 per uno sconto), arrotondato al centesimo. Il prezzario di partenza non
        cambia, né le voci dei computi già prese.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PriceListDuplicateInput' }
      responses:
        '201':
          description: La copia
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PriceList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/price-lists/{list}/items/export:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/PriceListId'
    get:
      operationId: exportPriceListItems
      summary: Esportazione delle voci di un prezzario in CSV
      description: |
        Permesso: price_lists.view. Senza permesso risponde 404. Stessa ricerca e ordine
        dell'elenco, senza paginazione, al massimo 20 000 voci, nello stesso formato
        dell'esportazione dei clienti. Colonne Codice, Descrizione, Unità, Prezzo (con la
        virgola decimale, 1234,50): il file si può modificare e reimportare con
        importPriceListItems. Il file si chiama prezzario.csv.
      parameters:
        - name: search
          in: query
          description: Cerca nel codice e nella descrizione.
          schema: { type: string, maxLength: 100 }
      responses:
        '200':
          description: Il file CSV
          headers:
            Content-Disposition:
              description: attachment, con il nome del file.
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/price-lists/{list}/import:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/PriceListId'
    post:
      operationId: importPriceListItems
      summary: Importazione delle voci da un file CSV
      description: |
        Permesso: price_lists.update (senza price_lists.view risponde 404). Il corpo è un
        file CSV in UTF-8, al massimo 5 MB e 20 000 righe, come lo salva un foglio di
        calcolo: separatore punto e virgola, virgola o tabulazione (si riconosce dalla
        prima riga), campi tra virgolette doppie se serve. La prima riga ha i nomi delle
        colonne, in qualsiasi ordine, senza distinguere maiuscole: codice (code),
        descrizione (description), unità (unita, um, u.m., unit), prezzo (prezzo unitario,
        unit_price). Le altre colonne si ignorano, come le righe vuote. Il prezzo si scrive
        all'italiana (1.234,50) o con il punto (1234.50), al massimo due decimali, mai
        negativo.

        Le voci con un codice già nel prezzario (senza distinguere maiuscole) si
        aggiornano, le altre si aggiungono; quelle che il file non nomina restano come
        sono. Se anche una sola riga è sbagliata non cambia niente: 422 con gli errori
        sotto `file` (colonne, codifica, file vuoto o troppo lungo) o sotto `row.<n>`, con
        n il numero della riga nel file (la prima è l'intestazione), al massimo 50.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string }
            example: "codice;descrizione;unità;prezzo\r\n01.A01.A10;Scavo di sbancamento;m³;8,50\r\n"
      responses:
        '200':
          description: Voci importate
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PriceListImportResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413':
          description: File più grande di 5 MB.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '415':
          description: Il corpo non è un file CSV (Content-Type text/csv).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/price-lists/{list}/items/{item}:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/PriceListId'
      - $ref: '#/components/parameters/PriceListItemId'
    put:
      operationId: updatePriceListItem
      summary: Modifica di una voce del prezzario
      description: 'Permesso: price_lists.update. Si inviano tutti i campi.'
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PriceListItemInput' }
      responses:
        '200':
          description: Voce aggiornata
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PriceListItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
    delete:
      operationId: deletePriceListItem
      summary: Eliminazione di una voce del prezzario
      description: 'Permesso: price_lists.update.'
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Voce eliminata
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /api/companies/{company}/employees:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: listEmployees
      summary: Elenco dei dipendenti
      description: 'Permesso: employees.view. La ricerca guarda nome e cognome, mansione e codice fiscale.'
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - name: sort
          in: query
          description: Campo di ordinamento; il segno meno vuol dire ordine decrescente.
          schema:
            type: string
            enum: [last_name, -last_name, hired_on, -hired_on, updated_at, -updated_at]
            default: last_name
        - name: filter
          in: query
          description: |
            Filtri: filter[active]=true solo gli attivi, false solo i cessati; senza filtro
            tutti. filter[documents]=expired i dipendenti con un documento scaduto, expiring
            quelli con un documento in scadenza.
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              active: { type: boolean }
              documents:
                type: string
                description: |
                  Documenti del dipendente (idoneità sanitaria, corsi...), contando per ogni tipo
                  solo quello con la scadenza più lontana. expired: almeno uno scaduto. expiring:
                  nessuno scaduto e almeno uno che scade entro 30 giorni (ora italiana).
                enum: [expired, expiring]
      responses:
        '200':
          description: Una pagina di dipendenti
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    post:
      operationId: createEmployee
      summary: Nuovo dipendente
      description: 'Permesso: employees.create. Il codice fiscale, se c''è, è unico nell''azienda.'
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmployeeInput' }
      responses:
        '201':
          description: Dipendente creato
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Employee' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/employees/import:
    parameters:
      - $ref: '#/components/parameters/Company'
    post:
      operationId: importEmployees
      summary: Importazione di dipendenti nuovi da un file CSV
      description: |
        Permesso: employees.create. Come importClients: stesso formato del file (al massimo
        5000 dipendenti), solo dipendenti nuovi, tutti o nessuno, errori sotto `file` o
        `row.<n>`; il file di exportEmployees si reimporta così com'è. Colonne per nome:
        cognome e nome sono obbligatorie; le altre sono codice fiscale, mansione, telefono,
        email, assunzione (30/11/2026 oppure 2026-11-30), costo orario (28,50 oppure 28.50),
        attivo (sì o no, vuoto vale sì), note, ferie annue (giorni interi), permessi annui
        (ore intere). Ogni riga si controlla come createEmployee;
        un codice fiscale già presente nell'azienda o ripetuto nel file è un errore della riga.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string }
            example: "cognome;nome;mansione;costo orario\r\nRossi;Mario;Muratore;28,50\r\n"
      responses:
        '200':
          description: Dipendenti importati
          content:
            application/json:
              schema:
                type: object
                required: [created]
                properties:
                  created:
                    type: integer
                    minimum: 1
                    description: Dipendenti aggiunti.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413':
          description: File più grande di 5 MB.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '415':
          description: Il corpo non è un file CSV (Content-Type text/csv).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/employees/export:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: exportEmployees
      summary: Esportazione dei dipendenti in CSV
      description: |
        Permesso: employees.view. Stessi filtri, ricerca e ordinamento dell'elenco, senza
        paginazione, nello stesso formato dell'esportazione dei clienti. Costo orario con la virgola decimale, data di assunzione come 30/11/2026, Attivo Sì o No.
        Il file si chiama dipendenti.csv.
      parameters:
        - $ref: '#/components/parameters/Search'
        - name: sort
          in: query
          schema:
            type: string
            enum: [last_name, -last_name, hired_on, -hired_on, updated_at, -updated_at]
            default: last_name
        - name: filter
          in: query
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              active: { type: boolean }
              documents:
                type: string
                description: |
                  Documenti del dipendente (idoneità sanitaria, corsi...), contando per ogni tipo
                  solo quello con la scadenza più lontana. expired: almeno uno scaduto. expiring:
                  nessuno scaduto e almeno uno che scade entro 30 giorni (ora italiana).
                enum: [expired, expiring]
      responses:
        '200':
          description: Il file CSV
          headers:
            Content-Disposition:
              description: attachment, con il nome del file.
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/employees/{employee}:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/EmployeeId'
    get:
      operationId: getEmployee
      summary: Scheda di un dipendente
      description: 'Permesso: employees.view. Senza permesso risponde 404, non 403.'
      responses:
        '200':
          description: Il dipendente
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Employee' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateEmployee
      summary: Modifica di un dipendente
      description: 'Permesso: employees.update. Si inviano tutti i campi.'
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmployeeInput' }
      responses:
        '200':
          description: Dipendente aggiornato
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Employee' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
    delete:
      operationId: deleteEmployee
      summary: Eliminazione di un dipendente
      description: |
        Permesso: employees.delete. Solo se non è in nessuna squadra e non ha documenti
        collegati: altrimenti 409 con code has_documents, e il dipendente va segnato come non
        attivo.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Dipendente eliminato
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '409':
          description: Il dipendente è in una squadra o ha documenti collegati (code has_documents).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /api/companies/{company}/employees/{employee}/sites:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/EmployeeId'
    get:
      operationId: listEmployeeSites
      summary: Cantieri di un dipendente
      description: |
        Permessi: employees.view e sites.view. Senza employees.view il dipendente è «non
        trovato» (404), come nella scheda; senza sites.view 403. Per la scheda del dipendente,
        al contrario di getSiteTeam: i cantieri nella cui squadra è il dipendente, attivo o no,
        di qualunque stato, prima quelli in corso, poi da iniziare, sospesi e chiusi, e a parità
        in ordine di nome. Senza paginazione, come listSupplierSites.
      responses:
        '200':
          description: I cantieri del dipendente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeSiteList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{company}/employees/{employee}/sites/export:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/EmployeeId'
    get:
      operationId: exportEmployeeSites
      summary: Cantieri di un dipendente in CSV
      description: |
        Permessi come listEmployeeSites: employees.view (senza, 404) e sites.view (senza, 403).
        Le stesse righe nello stesso ordine, nello stesso formato di exportSupplierSites:
        colonne Codice, Cantiere, Stato. Il file si chiama cantieri-dipendente.csv.
      responses:
        '200':
          description: Il file CSV
          headers:
            Content-Disposition:
              description: attachment, con il nome del file.
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{company}/employees/{employee}/work-summary:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/EmployeeId'
    get:
      operationId: getEmployeeWorkSummary
      summary: Ore del dipendente per cantiere
      description: |
        Permessi: employees.view (senza, 404 come per la scheda) e reports.view (senza, 403). Per la
        scheda del dipendente: ore dai rapportini, giorni con ore e costo per cantiere, dal cantiere con
        più ore. Il costo usa il costo orario fissato
        all'approvazione del rapportino (attuale per i rapportini non approvati), come il
        riepilogo dei costi del cantiere; è null se nessuna riga ha un costo orario. Senza
        filtri conta tutti i rapportini.
        Con le ore anche le assenze dello stesso periodo (`absences`), per tipo: i giorni di
        calendario delle assenze di tutto il giorno, contati solo dentro filter[from] e
        filter[to], e le ore dei permessi. filter[status] vale solo per i rapportini.
        In `payroll` le voci delle buste paga dagli stessi rapportini, con gli stessi filtri:
        ore di straordinario, giorni di trasferta e ore perse per maltempo.
      parameters:
        - name: filter
          in: query
          description: |
            Filtri, ad esempio filter[from]=2026-11-01&filter[to]=2026-11-30 (estremi compresi)
            e filter[status]=approved.
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              from: { $ref: '#/components/schemas/Date' }
              to: { $ref: '#/components/schemas/Date' }
              status: { $ref: '#/components/schemas/DailyReportStatus' }
      responses:
        '200':
          description: Le ore per cantiere
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeWorkSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/employees/{employee}/work-summary/export:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/EmployeeId'
    get:
      operationId: exportEmployeeWorkSummary
      summary: Ore del dipendente per cantiere in CSV
      description: |
        Permessi come getEmployeeWorkSummary: employees.view (senza, 404) e reports.view (senza, 403).
        Gli stessi cantieri nello stesso ordine e con gli stessi filtri, nello stesso formato
        delle altre esportazioni: colonne Codice, Cantiere, Ore, Giorni, Costo, Primo giorno,
        Ultimo giorno, Di cui straordinario, Giorni di trasferta, Ore perse per maltempo, Di cui
        festive, e in fondo una riga Totale con ore, giorni, costo e le quattro voci di payroll di
        tutto il periodo
        (nel totale un giorno di trasferta su due cantieri conta una volta). I cantieri dove nel
        periodo il dipendente ha soltanto ore perse per maltempo, assenti da sites, vengono dopo
        gli altri in ordine di nome, con ore e giorni a zero. Ore e importi con la virgola decimale
        (12,50), date come 30/11/2026, costo vuoto se il costo orario manca. Il file si chiama
        ore-dipendente.csv.
      parameters:
        - name: filter
          in: query
          description: |
            Filtri come getEmployeeWorkSummary, ad esempio filter[from]=2026-11-01&filter[to]=2026-11-30
            (estremi compresi) e filter[status]=approved.
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              from: { $ref: '#/components/schemas/Date' }
              to: { $ref: '#/components/schemas/Date' }
              status: { $ref: '#/components/schemas/DailyReportStatus' }
      responses:
        '200':
          description: Il file CSV
          headers:
            Content-Disposition:
              description: attachment, con il nome del file.
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/employees/{employee}/absences:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/EmployeeId'
    get:
      operationId: listEmployeeAbsences
      summary: Assenze di un dipendente
      description: |
        Permesso: employees.view (senza, 404 come per la scheda). Ferie, malattie, permessi e
        infortuni del dipendente, senza paginazione, dalla più recente. Con filter[from] e
        filter[to] (estremi compresi) solo le assenze che toccano quel periodo, per il calendario.
      parameters:
        - name: filter
          in: query
          description: Filtri, ad esempio filter[from]=2026-11-01&filter[to]=2026-11-30.
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              from: { $ref: '#/components/schemas/Date' }
              to: { $ref: '#/components/schemas/Date' }
      responses:
        '200':
          description: Le assenze
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeAbsenceList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    post:
      operationId: createEmployeeAbsence
      summary: Nuova assenza
      description: |
        Permesso: employees.update. Un'assenza non può sovrapporsi a un'altra dello stesso
        dipendente (422 su starts_on).
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmployeeAbsenceInput' }
      responses:
        '201':
          description: Assenza registrata
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeAbsence' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/employees/{employee}/absences/{absence}:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/EmployeeId'
      - name: absence
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Id' }
    put:
      operationId: updateEmployeeAbsence
      summary: Modifica di un'assenza
      description: 'Permesso: employees.update. Si inviano tutti i campi. If-Match come per i dipendenti.'
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmployeeAbsenceInput' }
      responses:
        '200':
          description: Assenza aggiornata
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeAbsence' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
    delete:
      operationId: deleteEmployeeAbsence
      summary: Eliminazione di un'assenza
      description: 'Permesso: employees.update. If-Match come per i dipendenti.'
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Assenza eliminata
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /api/companies/{company}/employees/{employee}/leave-carryovers:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/EmployeeId'
    get:
      operationId: listLeaveCarryovers
      summary: Ferie e permessi riportati dagli anni precedenti
      description: |
        Permesso: employees.view (senza, 404 come per la scheda). Per ogni anno, i giorni di
        ferie e le ore di permesso non goduti riportati dall'anno prima (come nella busta
        paga), dal più recente,
        senza paginazione.
      responses:
        '200':
          description: I riporti
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaveCarryoverList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{company}/employees/{employee}/leave-carryovers/{year}:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/EmployeeId'
      - name: year
        in: path
        required: true
        description: Anno in cui le ferie si riportano, da 2000 a 2100.
        schema:
          type: integer
          minimum: 2000
          maximum: 2100
    put:
      operationId: setLeaveCarryover
      summary: Ferie e permessi riportati dall'anno precedente
      description: |
        Permesso: employees.update. Imposta i giorni di ferie e le ore di permesso riportati
        nell'anno indicato (crea il riporto se manca); un campo che manca resta com'era. Senza If-Match: il valore è assoluto. Un anno fuori
        dall'intervallo è 404, come un indirizzo che non esiste.
        Nel registro delle modifiche compare come modifica del dipendente (entity employee),
        con il campo leave_carryover e senza il valore; anche l'eliminazione.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeaveCarryoverInput' }
      responses:
        '200':
          description: Riporto salvato
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaveCarryover' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      operationId: deleteLeaveCarryover
      summary: Eliminazione del riporto di un anno
      description: 'Permesso: employees.update. 404 se il riporto non c''è.'
      security:
        - session: []
          csrf: []
      responses:
        '204':
          description: Riporto eliminato
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{company}/absences:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: listCompanyAbsences
      summary: Assenze di tutti i dipendenti
      description: |
        Permesso: employees.view. Le assenze di tutti i dipendenti, dalla più recente, con il
        dipendente: per il calendario delle ferie e per sapere chi manca oggi
        (filter[from] e filter[to] uguali a oggi). Con filter[from] e filter[to] (estremi
        compresi) solo le assenze che toccano quel periodo, come in listEmployeeAbsences.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: filter
          in: query
          description: |
            Filtri, ad esempio filter[from]=2026-08-01&filter[to]=2026-08-31&filter[kind]=vacation
            e filter[q]=testo (nel nome e cognome del dipendente, in qualunque ordine, e nelle
            note, senza distinguere maiuscole e minuscole).
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              from: { $ref: '#/components/schemas/Date' }
              to: { $ref: '#/components/schemas/Date' }
              employee: { $ref: '#/components/schemas/Id' }
              kind: { $ref: '#/components/schemas/EmployeeAbsenceKind' }
              q:
                type: string
                maxLength: 100
      responses:
        '200':
          description: Una pagina di assenze
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyAbsenceList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/absences/export:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: exportCompanyAbsences
      summary: Esportazione in CSV delle assenze di tutti i dipendenti
      description: |
        Permesso: employees.view. Stessi filtri e ordinamento di listCompanyAbsences, senza
        paginazione, nello stesso formato dell'esportazione dei clienti: per il consulente del
        lavoro. Tipo per esteso (Ferie, Malattia, Permesso, Infortunio, Altro) e sigla del foglio
        ore (FE, MA, PE, IN, AL), date come 30/11/2026, giorni di calendario e giorni
        lavorativi (come working_days, vuoti per un permesso a ore), ore di un permesso con la
        virgola. Il file si chiama assenze.csv.
      parameters:
        - name: filter
          in: query
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              from: { $ref: '#/components/schemas/Date' }
              to: { $ref: '#/components/schemas/Date' }
              employee: { $ref: '#/components/schemas/Id' }
              kind: { $ref: '#/components/schemas/EmployeeAbsenceKind' }
              q:
                type: string
                maxLength: 100
      responses:
        '200':
          description: Il file CSV
          headers:
            Content-Disposition:
              description: attachment, con il nome del file.
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/absences/calendar:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: exportAbsencesCalendar
      summary: Assenze di tutti i dipendenti in formato calendario (iCalendar)
      description: |
        Permesso: employees.view. Le assenze come file .ics (RFC 5545) da aprire nel calendario
        del telefono o del computer, per sapere chi manca senza aprire il gestionale. Stessi
        filtri di listCompanyAbsences. Ogni assenza è un evento di giorni interi, dal primo
        all'ultimo giorno compresi, senza promemoria e segnato come libero; il titolo è
        «Cognome Nome – Tipo», con le ore di un permesso (es. «Permesso 2,5 h»). Nella
        descrizione ci sono tipo, sigla del foglio ore, periodo, giorni (con i lavorativi) o
        ore e note. L'UID
        dell'evento resta lo stesso a ogni esportazione, così il calendario aggiorna l'evento
        invece di duplicarlo. Il file si chiama assenze.ics.
      parameters:
        - name: filter
          in: query
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              from: { $ref: '#/components/schemas/Date' }
              to: { $ref: '#/components/schemas/Date' }
              employee: { $ref: '#/components/schemas/Id' }
              kind: { $ref: '#/components/schemas/EmployeeAbsenceKind' }
              q:
                type: string
                maxLength: 100
      responses:
        '200':
          description: Il file iCalendar
          headers:
            Content-Disposition:
              description: attachment, con il nome del file.
              schema:
                type: string
          content:
            text/calendar:
              schema:
                type: string
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/absences/totals:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: getAbsenceTotals
      summary: Assenze dell'anno per dipendente
      description: |
        Permesso: employees.view. Quante assenze ha fatto ogni dipendente in un anno solare, per
        tipo: per il titolare che controlla le ferie godute e per il consulente del lavoro.
        days: giorni di calendario delle assenze di tutto il giorno, solo quelli dentro l'anno
        (le ferie a cavallo di Capodanno si dividono tra i due anni); working_days: gli stessi
        giorni senza sabati, domeniche e festività nazionali, come working_days dell'assenza;
        hours: ore dei permessi.
        Ci sono tutti i dipendenti attivi, anche senza assenze, e quelli non più attivi che
        hanno assenze nell'anno, per cognome e nome. kinds ha sempre tutti i tipi, nell'ordine
        di EmployeeAbsenceKind, anche a zero. year è l'anno in corso (ora italiana) se non
        indicato.
        Con filter[employee] solo quel dipendente, attivo o no, anche senza assenze (per la
        scheda del dipendente); un dipendente che non c'è dà un elenco vuoto. Con
        filter[vacation]=exceeded solo chi ha vacation_remaining sotto zero, con
        filter[permit]=exceeded solo chi ha permit_remaining sotto zero. totals somma i
        dipendenti dell'elenco.
      parameters:
        - name: year
          in: query
          description: Anno solare, da 2000 a 2100.
          schema:
            type: integer
            minimum: 2000
            maximum: 2100
        - $ref: '#/components/parameters/AbsenceTotalsFilter'
      responses:
        '200':
          description: Le assenze dell'anno
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AbsenceTotals' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/holidays:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: listHolidays
      summary: Festività dell'anno
      description: |
        Qualsiasi membro dell'azienda le vede, senza permessi: servono ai calendari
        dell'interfaccia (scadenze, assenze, cronoprogramma, rapportini). Sono le stesse
        festività di holiday nei rapportini e di working_days nelle assenze: le festività
        nazionali con il lunedì dell'Angelo (Pasquetta) e, se indicato nei dati dell'azienda
        (patron_saint_day), il santo patrono, in ordine di data. Le domeniche non ci sono:
        sono festive sempre. Se il patrono cade in una festività nazionale la data compare una
        volta sola, come nazionale. year è l'anno in corso (ora italiana) se non indicato.
      parameters:
        - name: year
          in: query
          description: Anno solare, da 2000 a 2100.
          schema:
            type: integer
            minimum: 2000
            maximum: 2100
      responses:
        '200':
          description: Le festività dell'anno
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HolidayList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/working-days:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: countWorkingDays
      summary: Giorni lavorativi tra due date
      description: |
        Qualsiasi membro dell'azienda lo chiede, senza permessi, come listHolidays: serve alle
        anteprime dei form (assenze, attività del cronoprogramma, scadenze) senza ricalcolare
        nell'interfaccia Pasquetta e santo patrono. Conta i giorni da lunedì a venerdì da from
        a to, entrambi compresi, senza le festività nazionali con il lunedì dell'Angelo e il
        santo patrono dell'azienda: le stesse regole di working_days nelle assenze e nel
        cronoprogramma. holidays sono le festività dentro il periodo, in ordine di data, anche
        quelle che cadono di sabato o di domenica (non tolgono giorni lavorativi). to non può
        essere prima di from, e il periodo non può superare i 731 giorni (due anni).
      parameters:
        - name: from
          in: query
          required: true
          description: Primo giorno, AAAA-MM-GG.
          schema: { $ref: '#/components/schemas/Date' }
        - name: to
          in: query
          required: true
          description: Ultimo giorno, AAAA-MM-GG, compreso.
          schema: { $ref: '#/components/schemas/Date' }
      responses:
        '200':
          description: I giorni lavorativi del periodo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkingDays' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/working-days/end:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: findWorkingDaysEnd
      summary: Ultimo giorno dopo un numero di giorni lavorativi
      description: |
        Qualsiasi membro dell'azienda lo chiede, senza permessi, come countWorkingDays: serve
        ai form del cronoprogramma («dura 10 giorni lavorativi, quando finisce?») senza
        ricalcolare nell'interfaccia Pasquetta e santo patrono. to è il giorno in cui cade il
        working_days-esimo giorno lavorativo contando da from, che conta se è lavorativo: con le
        regole di countWorkingDays, il conteggio da from a to dà proprio working_days e to è
        sempre un giorno lavorativo. Se from cade di sabato, di domenica o in una festività, si
        comincia dal primo giorno lavorativo successivo. days sono i giorni di calendario da
        from a to, entrambi compresi. working_days va da 1 a 500 (circa due anni).
      parameters:
        - name: from
          in: query
          required: true
          description: Primo giorno, AAAA-MM-GG.
          schema: { $ref: '#/components/schemas/Date' }
        - name: working_days
          in: query
          required: true
          description: Giorni lavorativi da contare, da 1 a 500.
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        '200':
          description: L'ultimo giorno del periodo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkingDaysEnd' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/working-days/start:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: findWorkingDaysStart
      summary: Primo giorno prima di un numero di giorni lavorativi
      description: |
        Qualsiasi membro dell'azienda lo chiede, senza permessi, come findWorkingDaysEnd, di
        cui è l'inverso: serve a pianificare all'indietro da una data fissa («la consegna è il
        20, l'ordine va fatto 10 giorni lavorativi prima») senza ricalcolare nell'interfaccia
        Pasquetta e santo patrono. from è il giorno in cui cade il working_days-esimo giorno
        lavorativo contando all'indietro da to, che conta se è lavorativo: con le regole di
        countWorkingDays, il conteggio da from a to dà proprio working_days e from è sempre un
        giorno lavorativo. Se to cade di sabato, di domenica o in una festività, si comincia dal
        giorno lavorativo precedente. days sono i giorni di calendario da from a to, entrambi
        compresi. working_days va da 1 a 500 (circa due anni).
      parameters:
        - name: to
          in: query
          required: true
          description: Ultimo giorno, AAAA-MM-GG.
          schema: { $ref: '#/components/schemas/Date' }
        - name: working_days
          in: query
          required: true
          description: Giorni lavorativi da contare all'indietro, da 1 a 500.
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        '200':
          description: Il primo giorno del periodo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkingDaysStart' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/holidays/calendar:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: exportHolidaysCalendar
      summary: Festività dell'anno in formato calendario (iCalendar)
      description: |
        Qualsiasi membro dell'azienda lo scarica, senza permessi, come listHolidays. Le stesse
        festività di listHolidays come file .ics (RFC 5545), da aggiungere al calendario del
        telefono o del computer: ogni festività è un evento di un giorno intero, senza
        promemoria e segnato come libero. Il titolo è il nome della festività (es. «Natale»,
        «Santo patrono»); la descrizione dice se è nazionale o il santo patrono dell'azienda.
        L'UID dell'evento dipende solo da azienda e data, così una nuova esportazione aggiorna
        gli eventi invece di duplicarli. year è l'anno in corso (ora italiana) se non indicato.
        Il file si chiama festivita-AAAA.ics (es. festivita-2026.ics).
      parameters:
        - name: year
          in: query
          description: Anno solare, da 2000 a 2100.
          schema:
            type: integer
            minimum: 2000
            maximum: 2100
      responses:
        '200':
          description: Il file iCalendar
          headers:
            Content-Disposition:
              description: attachment, con il nome del file.
              schema:
                type: string
          content:
            text/calendar:
              schema:
                type: string
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/absences/close-year:
    parameters:
      - $ref: '#/components/parameters/Company'
    post:
      operationId: closeAbsenceYear
      summary: Chiusura dell'anno di ferie e permessi
      description: |
        Permesso: employees.update. Per ogni dipendente attivo con ferie o permessi spettanti,
        le ferie residue e le ore di permesso residue dell'anno (come in getAbsenceTotals)
        diventano il riporto dell'anno dopo (setLeaveCarryover), anche negative. Si scrive
        solo la parte con le spettanze indicate: l'altra resta com'era. I dipendenti non
        attivi e quelli senza spettanze non si toccano. Ripetuta, ricalcola gli stessi valori
        (dopo una correzione delle assenze si rilancia). Se un residuo esce dall'intervallo
        del riporto (giorni da -366 a 366, ore da -2000 a 2000) non si scrive nulla: 422 sotto
        `_` con i dipendenti da sistemare. Nel registro delle modifiche come setLeaveCarryover.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AbsenceYearClosingInput' }
      responses:
        '200':
          description: I riporti scritti nell'anno dopo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AbsenceYearClosing' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/absences/totals/export:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: exportAbsenceTotals
      summary: Esportazione in CSV delle assenze dell'anno per dipendente
      description: |
        Permesso: employees.view. Le stesse righe di getAbsenceTotals, nello stesso formato
        dell'esportazione dei clienti: una riga per dipendente con giorni, giorni lavorativi e
        ore di ogni tipo (ore con la virgola) e una riga finale «Totale». Il file si chiama
        assenze-AAAA.csv, con l'anno. Gli stessi filtri di getAbsenceTotals.
      parameters:
        - name: year
          in: query
          description: Anno solare, da 2000 a 2100.
          schema:
            type: integer
            minimum: 2000
            maximum: 2100
        - $ref: '#/components/parameters/AbsenceTotalsFilter'
      responses:
        '200':
          description: Il file CSV
          headers:
            Content-Disposition:
              description: attachment, con il nome del file.
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/vehicles:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: listVehicles
      summary: Elenco dei mezzi
      description: 'Permesso: vehicles.view. La ricerca guarda nome, targa e modello.'
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - name: sort
          in: query
          description: Campo di ordinamento; il segno meno vuol dire ordine decrescente.
          schema:
            type: string
            enum: [name, -name, updated_at, -updated_at]
            default: name
        - name: filter
          in: query
          description: |
            Filtri: filter[kind]=machine; filter[active]=true solo i mezzi in uso, false solo i
            dismessi; filter[documents]=expired i mezzi con un documento scaduto, expiring quelli
            con un documento in scadenza.
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              kind: { $ref: '#/components/schemas/VehicleKind' }
              active: { type: boolean }
              documents:
                type: string
                description: |
                  Documenti del mezzo (assicurazione, bollo...), contando per ogni tipo solo
                  quello con la scadenza più lontana. expired: almeno uno scaduto. expiring:
                  nessuno scaduto e almeno uno che scade entro 30 giorni (ora italiana).
                enum: [expired, expiring]
      responses:
        '200':
          description: Una pagina di mezzi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VehicleList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    post:
      operationId: createVehicle
      summary: Nuovo mezzo
      description: 'Permesso: vehicles.create. La targa, se c''è, è unica nell''azienda.'
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VehicleInput' }
      responses:
        '201':
          description: Mezzo creato
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehicle' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/vehicles/import:
    parameters:
      - $ref: '#/components/parameters/Company'
    post:
      operationId: importVehicles
      summary: Importazione di mezzi nuovi da un file CSV
      description: |
        Permesso: vehicles.create. Come importClients: stesso formato del file (al massimo
        5000 mezzi), solo mezzi nuovi, tutti o nessuno, errori sotto `file` o `row.<n>`; il
        file di exportVehicles si reimporta così com'è. Colonne per nome: nome è
        obbligatoria; le altre sono tipo (Automezzo, Macchina operatrice o Attrezzatura,
        vuoto vale Automezzo), targa, marca e modello, costo orario (45,00 oppure 45.00),
        in uso (sì o no, vuoto vale sì), note. Ogni riga si controlla come createVehicle;
        una targa già presente nell'azienda o ripetuta nel file è un errore della riga.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string }
            example: "nome;tipo;targa;costo orario\r\nFurgone;Automezzo;AB123CD;12,00\r\n"
      responses:
        '200':
          description: Mezzi importati
          content:
            application/json:
              schema:
                type: object
                required: [created]
                properties:
                  created:
                    type: integer
                    minimum: 1
                    description: Mezzi aggiunti.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413':
          description: File più grande di 5 MB.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '415':
          description: Il corpo non è un file CSV (Content-Type text/csv).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/vehicles/export:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: exportVehicles
      summary: Esportazione dei mezzi in CSV
      description: |
        Permesso: vehicles.view. Stessi filtri, ricerca e ordinamento dell'elenco, senza
        paginazione, nello stesso formato dell'esportazione dei clienti. Tipo tradotto (Automezzo, Macchina operatrice, Attrezzatura), costo orario con la virgola decimale.
        Dopo le note, tre colonne vengono dall'intervento più recente (`last_maintenance`):
        data (gg/mm/aaaa), tipo per esteso e contachilometri o contaore; vuote se non ce ne
        sono. Le ultime tre vengono dal rifornimento più recente (`last_refueling`): data,
        litri con la virgola e contachilometri o contaore; vuote se non ce ne sono.
        L'importazione dei mezzi le ignora tutte e sei.
        Il file si chiama mezzi.csv.
      parameters:
        - $ref: '#/components/parameters/Search'
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, -name, updated_at, -updated_at]
            default: name
        - name: filter
          in: query
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              kind: { $ref: '#/components/schemas/VehicleKind' }
              active: { type: boolean }
              documents:
                type: string
                description: |
                  Documenti del mezzo (assicurazione, bollo...), contando per ogni tipo solo
