    ClientKind:
      type: string
      description: |
        company: impresa, condominio o associazione. person: privato. public_body: ente pubblico.
      enum: [company, person, public_body]
    ClientInput:
      type: object
      description: |
        Dati di un cliente, uguali in creazione e in modifica. I campi facoltativi si inviano
        comunque, con null se vuoti.
      required:
        - kind
        - name
        - vat_number
        - tax_code
        - email
        - pec
        - phone
        - sdi_code
        - street
        - postal_code
        - city
        - province
        - country
        - notes
      properties:
        kind: { $ref: '#/components/schemas/ClientKind' }
        name:
          type: string
          description: Ragione sociale, oppure nome e cognome.
          minLength: 1
          maxLength: 200
        vat_number:
          type: [string, 'null']
          description: |
            Partita IVA, unica nell'azienda. Con country IT, per company e public_body serve
            almeno una tra partita IVA e codice fiscale. Il backend la restituisce normalizzata:
            senza spazi, in maiuscolo, senza il prefisso IT.
          maxLength: 20
        tax_code:
          type: [string, 'null']
          description: |
            Codice fiscale. Con country IT è obbligatorio se kind è person. Unico nell'azienda
            per lo stesso kind. Normalizzato come la partita IVA.
          maxLength: 16
        email:
          type: [string, 'null']
          format: email
        pec:
          type: [string, 'null']
          format: email
        phone:
          type: [string, 'null']
          maxLength: 30
        sdi_code:
          type: [string, 'null']
          description: 'Codice destinatario: 7 caratteri, 6 per la pubblica amministrazione.'
          minLength: 6
          maxLength: 7
        street:
          type: [string, 'null']
          maxLength: 200
        postal_code:
          type: [string, 'null']
          maxLength: 10
        city:
          type: [string, 'null']
          maxLength: 100
        province:
          type: [string, 'null']
          description: Sigla della provincia (TO, MI). Vuota per i clienti esteri.
          maxLength: 2
        country:
          type: string
          description: Paese, codice ISO 3166-1 alpha-2.
          pattern: '^[A-Z]{2}$'
          default: IT
          examples: [IT]
        notes:
          type: [string, 'null']
          maxLength: 2000
    Client:
      allOf:
        - $ref: '#/components/schemas/ClientInput'
        - type: object
          required: [id, archived_at, created_at, updated_at]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            archived_at:
              type: [string, 'null']
              format: date-time
              description: Data di archiviazione; null se il cliente è attivo.
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    AuditEntity:
      type: string
      description: |
        client: cliente. supplier: fornitore. deadline: scadenza. estimate: computo metrico.
        quote: preventivo. site: cantiere. employee: dipendente. vehicle: mezzo.
        daily_report: rapportino. site_cost: costo. site_document: documento o foto del cantiere.
        purchase_order: ordine a un fornitore. warehouse_item: articolo di magazzino.
        invoice: fattura. progress_statement: SAL. price_list: prezzario.
        site_activity: attività del cronoprogramma. employee_absence: assenza di un dipendente.
        vehicle_maintenance: manutenzione di un mezzo. vehicle_refueling: rifornimento di un mezzo.
        vehicle_document: documento di un mezzo (assicurazione, bollo...).
        employee_document: documento di un dipendente (idoneità, attestati dei corsi...).
        invoice_payment: pagamento, incasso o rimborso registrato su una fattura.
        supplier_document: documento di un fornitore (DURC, visura...).
        warehouse_movement: carico o scarico di magazzino (anche inventario e resi).
        role: ruolo (nome e permessi; i permessi cambiati compaiono come campo permissions).
        user: utente dell'azienda, con entity_id uguale all'id dell'utente di …/users/{user}
        (creazione all'accettazione dell'invito, modifica di role_id o disabled_at).
        invitation: invito a entrare nell'azienda (l'accettazione è una modifica di accepted_at).
        company_profile: dati dell'azienda di …/settings/company, con entity_id uguale all'id
        dell'azienda.
      enum:
        [
          client,
          supplier,
          deadline,
          estimate,
          quote,
          site,
          employee,
          vehicle,
          daily_report,
          site_cost,
          site_document,
          purchase_order,
          warehouse_item,
          invoice,
          progress_statement,
          price_list,
          site_activity,
          employee_absence,
          vehicle_maintenance,
          vehicle_refueling,
          vehicle_document,
          employee_document,
          invoice_payment,
          supplier_document,
          warehouse_movement,
          role,
          user,
          invitation,
          company_profile,
        ]
    AuditEntry:
      type: object
      required: [id, entity, entity_id, action, fields, user, created_at]
      properties:
        id:
          type: string
          description: Progressivo del registro, come testo.
        entity: { $ref: '#/components/schemas/AuditEntity' }
        entity_id: { $ref: '#/components/schemas/Id' }
        action:
          type: string
          description: create, update o delete.
          enum: [create, update, delete]
        fields:
          type: array
          description: |
            Per update, i nomi dei campi cambiati, in ordine alfabetico. Sono i nomi delle
            colonne del database, quasi sempre uguali ai campi del contratto (name, status,
            client_id…); gli importi hanno il suffisso _cents (amount_cents). Fanno eccezione
            permissions per un ruolo (permessi cambiati), team per un cantiere (dipendenti
            aggiunti o tolti dalla squadra), lines per un preventivo, un ordine al fornitore
            o un SAL (righe), items per un prezzario (voci), structure per un computo
            (capitoli, voci e misure), labor e vehicles per un rapportino (ore dei dipendenti
            e dei mezzi), dependencies per un'attività del cronoprogramma (attività da cui
            dipende), file per una fattura o un documento di fornitore, mezzo o dipendente
            (file allegato caricato, sostituito o tolto) e logo per i dati dell'azienda.
            Vuoto per create e delete.
          items:
            type: string
        user:
          description: Chi ha fatto la modifica; null se non è passata dall'API.
          oneOf:
            - type: 'null'
            - type: object
              required: [id, name]
              properties:
                id: { $ref: '#/components/schemas/Id' }
                name:
                  type: string
                  description: Vuoto se l'account non esiste più.
        created_at:
          type: string
          format: date-time
    AuditLogList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/AuditEntry' }
        meta: { $ref: '#/components/schemas/ListMeta' }
    ClientList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Client' }
        meta: { $ref: '#/components/schemas/ListMeta' }
