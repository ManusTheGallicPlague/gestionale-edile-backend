        Le singole fatture si leggono con listInvoices e filter[supplier]=<id>. Senza
        suppliers.view il fornitore è «non trovato» (404), come nella scheda; senza invoices.view la
        risposta è 403.
      responses:
        '200':
          description: L'estratto conto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubjectAccount' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{company}/suppliers/{supplier}/account/pdf:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/SupplierId'
    get:
      operationId: getSupplierAccountPdf
      summary: PDF dell'estratto conto di un fornitore, da mandare per la verifica del saldo
      description: |
        Permessi: suppliers.view e invoices.view, come getSupplierAccount. Come
        getClientAccountPdf, con le fatture ricevute dal fornitore, anche archiviato: intestazione
        dell'azienda, fornitore con indirizzo e partita IVA, data di oggi, le fatture ricevute non
        ancora pagate dalla scadenza più vecchia (numero, data, scadenza, netto a pagare, già
        pagato, residuo; «scaduta» accanto alla scadenza passata), totale da pagare e parte
        scaduta, e la richiesta di segnalare eventuali differenze. Niente IBAN. Come nel PDF del
        cliente, sotto il numero di una fattura il cui cantiere ha CIG o CUP esce la riga «CIG …
        - CUP …». Senza fatture aperte esce la riga «Nessuna fattura da pagare.». Il file si
        chiama estratto-conto.pdf.
      responses:
        '200':
          description: Il PDF
          headers:
            Content-Disposition:
              description: attachment, con il nome del file.
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{company}/suppliers/{supplier}/sites:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/SupplierId'
    get:
      operationId: listSupplierSites
      summary: Cantieri di un fornitore
      description: |
        Permessi: suppliers.view e sites.view. Senza suppliers.view il fornitore è «non trovato»
        (404), come nella scheda; senza sites.view 403. Per la scheda del fornitore o del
        subappaltatore, al contrario di listSiteSubcontractors: i cantieri su cui il fornitore,
        anche archiviato, ha un costo o un ordine, di qualunque stato, prima quelli in corso, poi
        da iniziare, sospesi e chiusi, e a parità in ordine di nome. Con costs.view, in costs
        la somma dei costi inseriti a mano con quel fornitore sul cantiere (zero se ha solo
        ordini), con la stessa regola di getSiteSupplierCosts; senza costs.view costs è null.
        Con purchases.view, in orders la somma dei totali dei suoi ordini inviati o ricevuti sul
        cantiere (le bozze no; zero se ha solo costi o bozze), con la stessa regola di total in
        purchase_orders di getSiteCostSummary; senza purchases.view orders è null.
      responses:
        '200':
          description: I cantieri del fornitore
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupplierSiteList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{company}/suppliers/{supplier}/sites/export:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/SupplierId'
    get:
      operationId: exportSupplierSites
      summary: Cantieri di un fornitore in CSV
      description: |
        Permessi come listSupplierSites: suppliers.view (senza, 404) e sites.view (senza, 403).
        Le stesse righe nello stesso ordine, nello stesso formato dell'esportazione dei clienti:
        colonne Codice, Cantiere, Stato, poi Costi solo con costs.view e Ordinato solo con
        purchases.view, importi con la virgola decimale (1234,50), e in fondo CIG e CUP del
        cantiere (vuote se mancano). Il file si chiama cantieri-fornitore.csv.
      responses:
        '200':
          description: Il file CSV
          headers:
            Content-Disposition:
              description: attachment, con il nome del file.
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{company}/suppliers/{supplier}/documents:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/SupplierId'
    get:
      operationId: listSupplierDocuments
      summary: Documenti di regolarità di un fornitore
      description: |
        Permesso: suppliers.view. Tutti i documenti del fornitore, senza paginazione (sono
        pochi), ordinati per scadenza: prima quelli che scadono prima, in fondo quelli senza.
      responses:
        '200':
          description: I documenti
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupplierDocumentList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createSupplierDocument
      summary: Nuovo documento di regolarità
      description: 'Permesso: suppliers.update'
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupplierDocumentInput' }
      responses:
        '201':
          description: Documento registrato
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupplierDocument' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/suppliers/{supplier}/documents/{document}:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/SupplierId'
      - name: document
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Id' }
    put:
      operationId: updateSupplierDocument
      summary: Modifica di un documento di regolarità
      description: 'Permesso: suppliers.update. Si inviano tutti i campi. If-Match come per i fornitori.'
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupplierDocumentInput' }
      responses:
        '200':
          description: Documento aggiornato
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupplierDocument' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
    delete:
      operationId: deleteSupplierDocument
      summary: Eliminazione di un documento di regolarità
      description: 'Permesso: suppliers.update. If-Match come per i fornitori.'
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Documento eliminato
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /api/companies/{company}/suppliers/{supplier}/documents/{document}/file:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/SupplierId'
      - $ref: '#/components/parameters/SupplierDocumentId'
    get:
      operationId: getSupplierDocumentFile
      summary: Il file di un documento di regolarità
      description: |
        Permesso: suppliers.view. Senza permesso, o se il documento non ha un file, risponde
        404. Il file arriva come allegato (Content-Disposition: attachment, con il nome
        originale).
      responses:
        '200':
          description: Il file
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Content-Disposition:
              schema: { type: string }
          content:
            application/pdf:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: setSupplierDocumentFile
      summary: Caricamento o sostituzione del file di un documento di regolarità
      description: |
        Permesso: suppliers.update. Il corpo è il file, con il suo Content-Type: PDF, JPEG o
        PNG (una scansione o una foto del documento), al massimo 20 MB. Il contenuto deve
        corrispondere al tipo dichiarato (altrimenti 422 sotto file). Nome del file nella query.
        Un file già presente viene sostituito. If-Match con la versione del documento: la
        risposta è il documento con la versione nuova.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - name: file_name
          in: query
          required: true
          description: Nome originale del file; si tiene solo l'ultima parte del percorso.
          schema: { type: string, minLength: 1, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/pdf:
            schema: { type: string, format: binary }
          image/jpeg:
            schema: { type: string, format: binary }
          image/png:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: File salvato
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupplierDocument' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '413':
          description: File più grande di 20 MB.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '415':
          description: Tipo di file non ammesso.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
    delete:
      operationId: deleteSupplierDocumentFile
      summary: Eliminazione del file di un documento di regolarità
      description: |
        Permesso: suppliers.update. If-Match con la versione del documento. Il documento resta,
        senza file; la risposta è il documento con la versione nuova. Se non c'è un file, 404.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: File eliminato
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupplierDocument' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /api/companies/{company}/deadlines:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: listDeadlines
      summary: Elenco delle scadenze
      description: |
        Permesso: deadlines.view. Per il calendario si chiede un intervallo con filter[from] e
        filter[to] (compresi) e per_page=100. search cerca nel titolo e nelle note, e nel CIG e
        nel CUP del cantiere (anche in parte, in minuscolo o con gli spazi).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - name: sort
          in: query
          description: Ordinamento per data di scadenza; il segno meno vuol dire decrescente.
          schema:
            type: string
            enum: [due_on, -due_on]
            default: due_on
        - name: filter
          in: query
          description: |
            Filtri, ad esempio filter[from]=2026-11-01&filter[to]=2026-11-30&filter[status]=open.
            filter[client], filter[supplier], filter[site], filter[employee] e filter[vehicle]
            prendono l'id del soggetto, del cantiere, del dipendente o del mezzo.
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              from: { $ref: '#/components/schemas/Date' }
              to: { $ref: '#/components/schemas/Date' }
              kind: { $ref: '#/components/schemas/DeadlineKind' }
              status: { $ref: '#/components/schemas/DeadlineStatus' }
              client: { $ref: '#/components/schemas/Id' }
              supplier: { $ref: '#/components/schemas/Id' }
              site: { $ref: '#/components/schemas/Id' }
              employee: { $ref: '#/components/schemas/Id' }
              vehicle: { $ref: '#/components/schemas/Id' }
      responses:
        '200':
          description: Una pagina di scadenze
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeadlineList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    post:
      operationId: createDeadline
      summary: Nuova scadenza
      description: 'Permesso: deadlines.create. Nasce aperta.'
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeadlineInput' }
      responses:
        '201':
          description: Scadenza creata
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deadline' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/deadlines/export:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: exportDeadlines
      summary: Esportazione delle scadenze in CSV
      description: |
        Permesso: deadlines.view. Stessi filtri, ricerca e ordinamento dell'elenco, senza
        paginazione, nello stesso formato dell'esportazione dei clienti. Date come 30/11/2026,
        importi con la virgola decimale (1234,50). Dopo «Note» le colonne CIG e CUP del
        cantiere, vuote se mancano. L'ultima colonna, «Primo giorno lavorativo», è
        `working_due_on`. Il file si chiama scadenze.csv.
      parameters:
        - $ref: '#/components/parameters/Search'
        - name: sort
          in: query
          schema:
            type: string
            enum: [due_on, -due_on]
            default: due_on
        - name: filter
          in: query
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              from: { $ref: '#/components/schemas/Date' }
              to: { $ref: '#/components/schemas/Date' }
              kind: { $ref: '#/components/schemas/DeadlineKind' }
              status: { $ref: '#/components/schemas/DeadlineStatus' }
              client: { $ref: '#/components/schemas/Id' }
              supplier: { $ref: '#/components/schemas/Id' }
              site: { $ref: '#/components/schemas/Id' }
              employee: { $ref: '#/components/schemas/Id' }
              vehicle: { $ref: '#/components/schemas/Id' }
      responses:
        '200':
          description: Il file CSV
          headers:
            Content-Disposition:
              description: attachment, con il nome del file.
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/deadlines/calendar:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: exportDeadlinesCalendar
      summary: Scadenze in formato calendario (iCalendar)
      description: |
        Permesso: deadlines.view. Le scadenze come file .ics (RFC 5545) da aprire nel calendario
        del telefono o del computer. Stessi filtri e ricerca dell'esportazione CSV; senza
        `filter[status]` escono solo le scadenze aperte. Ogni scadenza è un evento di un giorno
        intero, con un promemoria alle 9 del giorno prima; nella descrizione ci sono tipo,
        importo, cliente, fornitore, cantiere, dipendente, mezzo e note. L'UID dell'evento resta
        lo stesso a ogni esportazione, così il calendario aggiorna l'evento invece di
        duplicarlo. Le ricorrenze non diventano RRULE: la scadenza successiva nasce quando si
        completa quella attuale. Il file si chiama scadenze.ics.
      parameters:
        - $ref: '#/components/parameters/Search'
        - name: filter
          in: query
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              from: { $ref: '#/components/schemas/Date' }
              to: { $ref: '#/components/schemas/Date' }
              kind: { $ref: '#/components/schemas/DeadlineKind' }
              status: { $ref: '#/components/schemas/DeadlineStatus' }
              client: { $ref: '#/components/schemas/Id' }
              supplier: { $ref: '#/components/schemas/Id' }
              site: { $ref: '#/components/schemas/Id' }
              employee: { $ref: '#/components/schemas/Id' }
              vehicle: { $ref: '#/components/schemas/Id' }
      responses:
        '200':
          description: Il file iCalendar
          headers:
            Content-Disposition:
              description: attachment, con il nome del file.
              schema:
                type: string
          content:
            text/calendar:
              schema:
                type: string
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/deadlines/summary:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: getDeadlineSummary
      summary: Riepilogo delle scadenze per la dashboard
      description: |
        Permesso: deadlines.view. Solo scadenze aperte, contate sulla data di oggi in Italia.
        overdue: scadute. next_7_days e next_30_days: da oggi compreso fino a 7 o 30 giorni
        (la seconda comprende la prima).
      responses:
        '200':
          description: Il riepilogo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeadlineSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{company}/deadlines/{deadline}:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/DeadlineId'
    get:
      operationId: getDeadline
      summary: Una scadenza
      description: 'Permesso: deadlines.view. Senza permesso risponde 404, non 403.'
      responses:
        '200':
          description: La scadenza
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deadline' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateDeadline
      summary: Modifica di una scadenza
      description: |
        Permesso: deadlines.update. Si inviano tutti i campi. Lo stato non cambia da qui:
        si usano complete e reopen.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeadlineInput' }
      responses:
        '200':
          description: Scadenza aggiornata
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deadline' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
    delete:
      operationId: deleteDeadline
      summary: Eliminazione di una scadenza
      description: 'Permesso: deadlines.delete.'
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Scadenza eliminata
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /api/companies/{company}/deadlines/{deadline}/complete:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/DeadlineId'
    post:
      operationId: completeDeadline
      summary: Scadenza fatta
      description: |
        Permesso: deadlines.update. Imposta status done e done_at; se è già fatta non cambia
        done_at. Se la scadenza è ricorrente crea la successiva (una volta sola, anche dopo una
        riapertura) e ne restituisce l'id in next_deadline_id.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Scadenza segnata come fatta
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deadline' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /api/companies/{company}/deadlines/{deadline}/reopen:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/DeadlineId'
    post:
      operationId: reopenDeadline
      summary: Scadenza riaperta
      description: |
        Permesso: deadlines.update. Riporta status a open e done_at a null. L'eventuale
        scadenza successiva già creata resta.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Scadenza di nuovo aperta
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deadline' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /api/companies/{company}/sites:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: listSites
      summary: Elenco dei cantieri
      description: |
        Permesso: sites.view. La ricerca guarda nome, codice, indirizzo, cliente, CIG e CUP.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - name: sort
          in: query
          description: Campo di ordinamento; il segno meno vuol dire ordine decrescente.
          schema:
            type: string
            enum: [name, -name, code, -code, start_on, -start_on, updated_at, -updated_at]
            default: -updated_at
        - name: filter
          in: query
          description: Filtri, ad esempio filter[status]=active o filter[client]=<id>.
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              status: { $ref: '#/components/schemas/SiteStatus' }
              client: { $ref: '#/components/schemas/Id' }
              report_missing:
                type: boolean
                description: |
                  true: cantieri attivi senza un rapportino (in qualunque stato) con la data di
                  oggi, gli stessi contati in reports.missing_today di getDashboard. false:
                  cantieri attivi che il rapportino di oggi ce l'hanno.
              subcontractor_compliance:
                type: string
                enum: [expired, expiring, no_valid_durc, no_valid_credit_license]
                description: |
                  Cantieri con almeno un subappaltatore (con un costo o un ordine sul cantiere,
                  anche archiviato) nella condizione indicata, come filter[compliance] dei
                  fornitori e listSiteSubcontractors. Serve anche suppliers.view, altrimenti 403.
              team_documents:
                type: string
                enum: [expired, expiring]
                description: |
                  Cantieri con almeno un dipendente della squadra (getSiteTeam) con un documento
                  nella condizione indicata, come filter[documents] dei dipendenti. expired basta
                  sites.view, come documents_expired della squadra; expiring vuole anche
                  employees.view, altrimenti 403.
      responses:
        '200':
          description: Una pagina di cantieri
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    post:
      operationId: createSite
      summary: Nuovo cantiere
      description: 'Permesso: sites.create. Il codice, se c''è, è unico nell''azienda.'
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SiteInput' }
      responses:
        '201':
          description: Cantiere creato
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Site' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/sites/export:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: exportSites
      summary: Esportazione dei cantieri in CSV
      description: |
        Permesso: sites.view. Stessi filtri, ricerca e ordinamento dell'elenco, senza
        paginazione, nello stesso formato dell'esportazione dei clienti. Stato tradotto (Da iniziare, In corso, Sospeso, Chiuso), date come 30/11/2026, budget con la virgola decimale.
        La penultima colonna, «Documenti squadra scaduti», vale Sì o No come team_documents_expired;
        l'ultima, «Subappaltatori con documenti scaduti», vale Sì o No come subcontractors_expired
        ed è vuota senza suppliers.view.
        Il file si chiama cantieri.csv.
      parameters:
        - $ref: '#/components/parameters/Search'
        - name: sort
