        total_amount: { $ref: '#/components/schemas/Amount' }
    InvoiceDirection:
      type: string
      description: 'issued: emessa a un cliente. received: ricevuta da un fornitore.'
      enum: [issued, received]
    InvoicePaymentStatus:
      type: string
      description: |
        paid: pagata (o incassata). overdue: non pagata e con la scadenza di pagamento passata
        (oggi in Italia). open: non pagata, non ancora scaduta o senza scadenza.
      enum: [open, overdue, paid]
    InvoiceInput:
      type: object
      description: |
        I campi facoltativi si inviano comunque, con null se vuoti. Le emesse hanno client_id
        e supplier_id null, le ricevute il contrario. La scadenza di pagamento non può essere
        prima della data della fattura. Niente invio allo SDI: è solo un registro.
      required:
        [
          direction,
          number,
          date,
          client_id,
          supplier_id,
          site_id,
          description,
          taxable_amount,
          vat_amount,
          due_date,
          paid_on,
          notes,
        ]
      properties:
        direction: { $ref: '#/components/schemas/InvoiceDirection' }
        number:
          type: string
          minLength: 1
          maxLength: 40
          examples: ['12/2026']
        date: { $ref: '#/components/schemas/Date' }
        client_id:
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        supplier_id:
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        site_id:
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        description:
          type: [string, 'null']
          maxLength: 500
        taxable_amount:
          description: Imponibile.
          allOf:
            - $ref: '#/components/schemas/Amount'
        vat_amount:
          description: IVA; 0.00 per le operazioni senza IVA (ad esempio in reverse charge).
          allOf:
            - $ref: '#/components/schemas/Amount'
        vat_nature:
          description: |
            Natura IVA della fattura senza IVA (es. N6.3, subappalto in inversione contabile),
            solo con vat_amount 0.00. Facoltativa: se manca, alla creazione vale null e alla
            modifica resta com'è; diventa null se l'IVA non è più zero.
          oneOf:
            - $ref: '#/components/schemas/VatNature'
            - type: 'null'
        withholding_amount:
          description: |
            Ritenuta d'acconto trattenuta da chi paga (es. 20% sul compenso di un professionista,
            4% del condominio sui lavori in appalto), mai oltre l'imponibile. Facoltativa: se manca, alla creazione vale 0.00 e alla modifica resta
            com'è.
          allOf:
            - $ref: '#/components/schemas/Amount'
        split_payment:
          type: boolean
          description: |
            Scissione dei pagamenti (art. 17-ter DPR 633/72): fattura emessa a una pubblica
            amministrazione, che versa l'IVA direttamente all'erario; amount_due non comprende
            l'IVA. Solo per le emesse. Facoltativo: se manca, alla creazione vale false e alla
            modifica resta com'è.
        progress_statement_id:
          description: |
            Il SAL approvato che questa fattura emessa addebita (fattura d'acconto sullo stato di
            avanzamento); una fattura per SAL. Facoltativo: se manca, alla creazione vale null e
            alla modifica resta com'è. Solo per le emesse; con un cantiere indicato, il SAL deve
            essere di un computo di quel cantiere.
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        retention_release:
          type: boolean
          description: |
            Fattura emessa di svincolo della ritenuta di garanzia trattenuta sui SAL del
            cantiere, a fine lavori: il suo imponibile conta in retention_released del
            riepilogo del cantiere. Solo per le emesse, con un cantiere e senza SAL collegato.
            Facoltativo: se manca, alla creazione vale false e alla modifica resta com'è.
        due_date:
          description: Scadenza di pagamento; alimenta lo scadenziario.
          oneOf:
            - $ref: '#/components/schemas/Date'
            - type: 'null'
        paid_on:
          description: |
            Data del pagamento o dell'incasso; null se non ancora pagata. Se la fattura ha
            pagamenti registrati (createInvoicePayment) il valore inviato non conta: paid_on è
            la data dell'ultimo pagamento quando coprono amount_due, altrimenti null.
          oneOf:
            - $ref: '#/components/schemas/Date'
            - type: 'null'
        notes:
          type: [string, 'null']
          maxLength: 2000
    Invoice:
      allOf:
        - $ref: '#/components/schemas/InvoiceInput'
        - type: object
          required:
            [
              id,
              client,
              supplier,
              site,
              total,
              payment_status,
              deadline_id,
              file,
              vat_nature,
              withholding_amount,
              split_payment,
              amount_due,
              paid_amount,
              remaining_amount,
              progress_statement_id,
              retention_release,
              created_at,
              updated_at,
            ]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            file:
              description: Il PDF della fattura (o la sua scansione), o null.
              oneOf:
                - $ref: '#/components/schemas/AttachedFile'
                - type: 'null'
            client:
              oneOf:
                - $ref: '#/components/schemas/SubjectRef'
                - type: 'null'
            supplier:
              oneOf:
                - $ref: '#/components/schemas/SubjectRef'
                - type: 'null'
            site:
              oneOf:
                - type: object
                  required: [id, name, code]
                  properties:
                    id: { $ref: '#/components/schemas/Id' }
                    name: { type: string }
                    code: { type: [string, 'null'] }
                - type: 'null'
            total:
              description: Imponibile più IVA.
              allOf:
                - $ref: '#/components/schemas/Amount'
            amount_due:
              description: |
                Netto a pagare (o da incassare): totale meno la ritenuta d'acconto e, con la
                scissione dei pagamenti, meno l'IVA. È l'importo della scadenza nello
                scadenziario.
              allOf:
                - $ref: '#/components/schemas/Amount'
            paid_amount:
              description: Somma degli incassi o pagamenti registrati (listInvoicePayments).
              allOf:
                - $ref: '#/components/schemas/Amount'
            remaining_amount:
              description: |
                Quanto resta da incassare o pagare: amount_due meno paid_amount; 0.00 quando la
                fattura è pagata.
              allOf:
                - $ref: '#/components/schemas/Amount'
            payment_status: { $ref: '#/components/schemas/InvoicePaymentStatus' }
            deadline_id:
              description: La scadenza nello scadenziario; null senza scadenza di pagamento.
              oneOf:
                - $ref: '#/components/schemas/Id'
                - type: 'null'
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    InvoicePaymentMethod:
      type: string
      description: |
        bank_transfer: bonifico. riba: ricevuta bancaria. check: assegno. cash: contanti.
        card: carta o bancomat. other: altro (ad esempio una compensazione).
      enum: [bank_transfer, riba, check, cash, card, other]
    InvoicePaymentInput:
      type: object
      description: I campi facoltativi si inviano comunque, con null se vuoti.
      required: [date, amount, method, notes]
      properties:
        date: { $ref: '#/components/schemas/Date' }
        amount:
          description: Importo incassato o pagato, più di zero.
          allOf:
            - $ref: '#/components/schemas/Amount'
        method:
          oneOf:
            - $ref: '#/components/schemas/InvoicePaymentMethod'
            - type: 'null'
        notes:
          type: [string, 'null']
          maxLength: 500
    InvoicePayment:
      allOf:
        - $ref: '#/components/schemas/InvoicePaymentInput'
        - type: object
          required: [id, created_at]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            created_at:
              type: string
              format: date-time
    PaymentList:
      type: object
      required: [data, meta, collected, paid]
      properties:
        data:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/InvoicePayment'
              - type: object
                required: [invoice]
                properties:
                  invoice:
                    type: object
                    required: [id, number, direction, subject, site]
                    properties:
                      id: { $ref: '#/components/schemas/Id' }
                      number: { type: string }
                      direction: { $ref: '#/components/schemas/InvoiceDirection' }
                      subject:
                        description: Il cliente (emesse) o il fornitore (ricevute).
                        allOf:
                          - $ref: '#/components/schemas/SubjectRef'
                      site:
                        oneOf:
                          - type: object
                            required: [id, name, code]
                            properties:
                              id: { $ref: '#/components/schemas/Id' }
                              name: { type: string }
                              code: { type: [string, 'null'] }
                          - type: 'null'
        meta: { $ref: '#/components/schemas/ListMeta' }
        collected:
          description: Somma degli incassi (fatture emesse) filtrati.
          allOf:
            - $ref: '#/components/schemas/Amount'
        paid:
          description: Somma dei pagamenti (fatture ricevute) filtrati.
          allOf:
            - $ref: '#/components/schemas/Amount'
    InvoiceList:
      type: object
      required: [data, meta, total_amount, outstanding_amount]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Invoice' }
        meta: { $ref: '#/components/schemas/ListMeta' }
        total_amount:
          description: Somma dei totali delle fatture filtrate.
          allOf:
            - $ref: '#/components/schemas/Amount'
        outstanding_amount:
          description: |
            Somma di quanto resta da pagare o incassare (remaining_amount) delle fatture
            filtrate non ancora pagate.
          allOf:
            - $ref: '#/components/schemas/Amount'
    WarehouseItemInput:
      type: object
      description: |
        I campi facoltativi si inviano comunque, con null se vuoti; min_stock invece si può
        omettere: un articolo nuovo resta senza scorta minima, una modifica la lascia com'è.
      required: [code, name, unit, notes]
      properties:
        code:
          type: [string, 'null']
          maxLength: 50
        name:
          type: string
          minLength: 1
          maxLength: 200
        unit:
          type: string
          minLength: 1
          maxLength: 20
          examples: ['sacchi']
        notes:
          type: [string, 'null']
          maxLength: 2000
        min_stock:
          description: |
            Scorta minima, da zero in su con il punto e al massimo tre decimali (in uscita
            sempre tre); null se l'articolo non ne ha.
          type: [string, 'null']
          pattern: '^\d{1,11}(\.\d{1,3})?$'
          examples: ['50.000']
