          type: array
          items: { $ref: '#/components/schemas/EmployeeDocument' }
    VehicleDocumentKind:
      type: string
      description: |
        insurance: assicurazione RCA. road_tax: bollo. registration: carta di circolazione.
        tachograph: taratura del tachigrafo. other: altro documento (descrizione obbligatoria).
      enum: [insurance, road_tax, registration, tachograph, other]
    VehicleDocumentInput:
      type: object
      description: I campi facoltativi si inviano comunque, con null se vuoti.
      required: [kind, description, issued_on, expires_on, notes]
      properties:
        kind: { $ref: '#/components/schemas/VehicleDocumentKind' }
        description:
          type: [string, 'null']
          description: Obbligatoria se kind è other (es. numero di polizza, compagnia).
          maxLength: 200
        issued_on:
          oneOf:
            - $ref: '#/components/schemas/Date'
            - type: 'null'
        expires_on:
          description: |
            Non prima di issued_on. Null se il documento non scade. Il backend ne fa una
            scadenza del mezzo e la tiene allineata (una data nuova la riapre).
          oneOf:
            - $ref: '#/components/schemas/Date'
            - type: 'null'
        notes:
          type: [string, 'null']
          maxLength: 2000
    VehicleDocument:
      allOf:
        - $ref: '#/components/schemas/VehicleDocumentInput'
        - type: object
          required: [id, vehicle_id, status, file, created_at, updated_at]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            vehicle_id: { $ref: '#/components/schemas/Id' }
            file:
              description: Il file allegato (scansione della polizza o del libretto), o null.
              oneOf:
                - $ref: '#/components/schemas/AttachedFile'
                - type: 'null'
            status:
              type: string
              description: |
                Calcolato dal backend sulla data di oggi (ora italiana). valid: valido.
                expiring: scade entro 30 giorni. expired: scaduto. no_expiry: senza scadenza.
              enum: [valid, expiring, expired, no_expiry]
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    VehicleDocumentList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/VehicleDocument' }
    VehicleMaintenanceKind:
      type: string
      description: |
        service = tagliando, repair = riparazione, inspection = revisione, tires = gomme,
        other = altro.
      enum: [service, repair, inspection, tires, other]
    VehicleMaintenanceInput:
      type: object
      description: |
        I campi facoltativi si inviano comunque, con null se vuoti; fa eccezione `next_due_on`,
        che se manca vale null alla creazione e resta com'era nella modifica.
      required: [performed_on, kind, description, supplier_id, amount, meter_reading, notes]
      properties:
        performed_on: { $ref: '#/components/schemas/Date' }
        kind: { $ref: '#/components/schemas/VehicleMaintenanceKind' }
        description:
          type: string
          minLength: 1
          maxLength: 300
        supplier_id:
          description: Officina o fornitore che ha fatto il lavoro, dell'azienda.
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        amount:
          description: Spesa senza IVA, non negativa; null se non ancora nota.
          oneOf:
            - $ref: '#/components/schemas/Amount'
            - type: 'null'
        meter_reading:
          type: [integer, 'null']
          minimum: 0
          maximum: 9999999
          description: Chilometri o ore motore segnati al momento della manutenzione.
        notes:
          type: [string, 'null']
          maxLength: 2000
        next_due_on:
          description: |
            Data della prossima manutenzione (es. il prossimo tagliando o la prossima
            revisione), dopo `performed_on`. Il backend ne fa una scadenza del mezzo (tipo
            `vehicle`, `vehicle_maintenance_id` nella scadenza), la tiene allineata alla data
            (una data nuova la riapre) e la elimina quando la data si toglie o la manutenzione
            si elimina. Un mezzo con scadenze non si elimina (409 `has_documents`).
          oneOf:
            - $ref: '#/components/schemas/Date'
            - type: 'null'
    VehicleMaintenance:
      allOf:
        - $ref: '#/components/schemas/VehicleMaintenanceInput'
        - type: object
          required: [id, vehicle_id, supplier, next_due_on, created_at, updated_at]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            vehicle_id: { $ref: '#/components/schemas/Id' }
            supplier:
              oneOf:
                - $ref: '#/components/schemas/SubjectRef'
                - type: 'null'
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    VehicleMaintenanceList:
      type: object
      required: [data, total_amount]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/VehicleMaintenance' }
        total_amount:
          description: Somma delle spese dell'elenco (quelle senza importo contano zero).
          allOf:
            - $ref: '#/components/schemas/SignedAmount'
    CompanyVehicleMaintenanceList:
      type: object
      required: [data, meta, total_amount]
      properties:
        data:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/VehicleMaintenance'
              - type: object
                required: [vehicle]
                properties:
                  vehicle:
                    type: object
                    required: [id, name, plate]
                    properties:
                      id: { $ref: '#/components/schemas/Id' }
                      name: { type: string }
                      plate: { type: [string, 'null'] }
        meta: { $ref: '#/components/schemas/ListMeta' }
        total_amount:
          description: Somma delle spese di tutte le manutenzioni filtrate, non solo della pagina.
          allOf:
            - $ref: '#/components/schemas/SignedAmount'
    VehicleRefuelingInput:
      type: object
      description: I campi facoltativi si inviano comunque, con null se vuoti.
      required: [refueled_on, liters, amount, meter_reading, supplier_id, notes]
      properties:
        refueled_on: { $ref: '#/components/schemas/Date' }
        liters: { $ref: '#/components/schemas/Liters' }
        amount:
          description: Spesa del rifornimento senza IVA, non negativa.
          allOf:
            - $ref: '#/components/schemas/Amount'
        meter_reading:
          type: [integer, 'null']
          minimum: 0
          maximum: 9999999
          description: Chilometri o ore motore segnati al momento del rifornimento.
        supplier_id:
          description: Distributore o fornitore del carburante, dell'azienda.
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        notes:
          type: [string, 'null']
          maxLength: 2000
    VehicleRefueling:
      allOf:
        - $ref: '#/components/schemas/VehicleRefuelingInput'
        - type: object
          required: [id, vehicle_id, supplier, consumption, created_at, updated_at]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            vehicle_id: { $ref: '#/components/schemas/Id' }
            consumption:
              description: |
                Consumo da pieno a pieno: litri di questo rifornimento divisi per i chilometri o
                le ore dal rifornimento precedente, cioè quello del mezzo con la lettura più alta
                tra quelle più basse di questa (di qualunque data, anche fuori dal periodo
                filtrato). Per gli automezzi in litri ogni 100 km, per macchine operatrici e
                attrezzature in litri all'ora, con due decimali e il punto. null senza
                contachilometri o senza un rifornimento precedente con una lettura più bassa.
                Solo lettura, da non inviare: cambia senza cambiare l'ETag quando si registra,
                si modifica o si elimina un altro rifornimento.
              type: [string, 'null']
              pattern: '^\d+\.\d{2}$'
              examples: ['8.75']
            supplier:
              oneOf:
                - $ref: '#/components/schemas/SubjectRef'
                - type: 'null'
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    VehicleRefuelingList:
      type: object
      required: [data, total_liters, total_amount]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/VehicleRefueling' }
        total_liters:
          description: Somma dei litri dell'elenco, con due decimali e il punto.
          type: string
          pattern: '^\d+\.\d{2}$'
          examples: ['1234.50']
        total_amount:
          description: Somma delle spese dell'elenco.
          allOf:
            - $ref: '#/components/schemas/SignedAmount'
    CompanyVehicleRefuelingList:
      type: object
      required: [data, meta, total_liters, total_amount]
      properties:
        data:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/VehicleRefueling'
              - type: object
                required: [vehicle]
                properties:
                  vehicle:
                    type: object
                    required: [id, name, plate]
                    properties:
                      id: { $ref: '#/components/schemas/Id' }
                      name: { type: string }
                      plate: { type: [string, 'null'] }
        meta: { $ref: '#/components/schemas/ListMeta' }
        total_liters:
          description: Somma dei litri di tutti i rifornimenti filtrati, con due decimali e il punto.
          type: string
          pattern: '^\d+\.\d{2}$'
          examples: ['1234.50']
        total_amount:
          description: Somma delle spese di tutti i rifornimenti filtrati, non solo della pagina.
          allOf:
            - $ref: '#/components/schemas/SignedAmount'
    Liters:
      type: string
      description: |
        Litri come stringa con il punto e fino a due decimali, mai numero JSON; più di zero. In
        uscita ha sempre due decimali.
      pattern: '^\d{1,6}(\.\d{1,2})?$'
      examples: ['45.20']
    EmployeeAbsenceInput:
      type: object
      description: I campi facoltativi si inviano comunque, con null se vuoti.
      required: [kind, starts_on, ends_on, hours, notes]
      properties:
        kind: { $ref: '#/components/schemas/EmployeeAbsenceKind' }
        starts_on: { $ref: '#/components/schemas/Date' }
        ends_on:
          description: Ultimo giorno di assenza, compreso; non prima di starts_on.
          allOf:
            - $ref: '#/components/schemas/Date'
        hours:
          description: |
            Solo per un'assenza di parte della giornata (es. permesso di 2 ore): ammesse solo se
            starts_on ed ends_on coincidono, da 0.01 a 24. Null per giornate intere.
          oneOf:
            - $ref: '#/components/schemas/Hours'
            - type: 'null'
        notes:
          type: [string, 'null']
          description: Obbligatorie se kind è other.
          maxLength: 2000
    EmployeeAbsence:
      allOf:
        - $ref: '#/components/schemas/EmployeeAbsenceInput'
        - type: object
          required: [id, employee_id, days, working_days, created_at, updated_at]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            employee_id: { $ref: '#/components/schemas/Id' }
            days:
              type: integer
              minimum: 1
              description: Giorni di calendario da starts_on a ends_on, estremi compresi.
            working_days:
              type: [integer, 'null']
              minimum: 0
              description: |
                Giorni lavorativi da starts_on a ends_on, estremi compresi: dal lunedì al venerdì,
                senza le festività nazionali (1° e 6 gennaio, lunedì dell'Angelo, 25 aprile,
                1° maggio, 2 giugno, 15 agosto, 1° novembre, 8, 25 e 26 dicembre). Il santo
                patrono si toglie se indicato nei dati dell'azienda (patron_saint_day). null per un'assenza a ore.
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    EmployeeAbsenceList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/EmployeeAbsence' }
    CompanyAbsenceList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/EmployeeAbsence'
              - type: object
                required: [employee]
                properties:
                  employee:
                    type: object
                    required: [id, first_name, last_name, active]
                    properties:
                      id: { $ref: '#/components/schemas/Id' }
                      first_name: { type: string }
                      last_name: { type: string }
                      active: { type: boolean }
        meta: { $ref: '#/components/schemas/ListMeta' }
    LeaveCarryoverInput:
      type: object
      additionalProperties: false
      minProperties: 1
      description: |
        Almeno uno dei due campi. Un campo che manca resta com'era (null se il riporto è
        nuovo), null lo toglie; senza giorni e senza ore il riporto non resta (422: si elimina).
      properties:
        days:
          type: [integer, 'null']
          minimum: -366
          maximum: 366
          description: |
            Giorni lavorativi di ferie non godute riportati dall'anno prima; negativo se il
            dipendente ne ha anticipate.
        permit_hours:
          type: [string, 'null']
          pattern: '^-?\d{1,4}(\.\d{1,2})?$'
          examples: ['12.5', '-4']
          description: |
            Ore di permesso (permessi retribuiti, ROL, ex festività) non godute riportate
            dall'anno prima, da -2000 a 2000 con il punto; negativo se ne ha anticipate.
    LeaveCarryover:
      type: object
      required: [year, days, permit_hours, updated_at]
      properties:
        year: { type: integer }
        days:
          type: [integer, 'null']
          description: Giorni riportati, come in LeaveCarryoverInput; null se non indicati.
        permit_hours:
          type: [string, 'null']
          pattern: '^-?\d+\.\d{2}$'
          examples: ['12.50']
          description: Ore di permesso riportate, con due decimali; null se non indicate.
        updated_at:
          type: string
          format: date-time
    LeaveCarryoverList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/LeaveCarryover' }
    AbsenceYearClosingInput:
      type: object
      additionalProperties: false
      required: [year]
      properties:
        year:
          type: integer
          minimum: 2000
          maximum: 2099
          description: Anno da chiudere; i riporti vanno nell'anno dopo.
    AbsenceYearClosing:
      type: object
      required: [year, carried_into, data]
      properties:
        year: { type: integer }
        carried_into:
          type: integer
          description: Anno dei riporti scritti, year + 1.
        data:
          type: array
          description: Un elemento per dipendente toccato, per cognome e nome.
          items:
            type: object
            required: [employee, days, permit_hours]
            properties:
              employee:
                type: object
                required: [id, first_name, last_name]
                properties:
                  id: { $ref: '#/components/schemas/Id' }
                  first_name: { type: string }
                  last_name: { type: string }
              days:
                type: [integer, 'null']
                description: Giorni di ferie del riporto dopo la chiusura, come in LeaveCarryover.
              permit_hours:
                type: [string, 'null']
                pattern: '^-?\d+\.\d{2}$'
                examples: ['12.50']
                description: Ore di permesso del riporto dopo la chiusura, come in LeaveCarryover.
    AbsenceTotalsKinds:
      type: array
      description: Tutti i tipi, nell'ordine di EmployeeAbsenceKind, anche a zero.
      items:
        type: object
        required: [kind, days, working_days, hours]
        properties:
          kind: { $ref: '#/components/schemas/EmployeeAbsenceKind' }
          days: { type: integer }
          working_days:
            type: integer
            description: Giorni lavorativi delle assenze di tutto il giorno, dentro l'anno.
          hours: { $ref: '#/components/schemas/WorkHours' }
    HolidayList:
      type: object
      required: [year, holidays]
      properties:
        year: { type: integer }
        holidays:
          type: array
          items:
            type: object
            required: [date, name, kind]
            properties:
              date: { $ref: '#/components/schemas/Date' }
              name:
                type: string
                description: Nome in italiano, es. «Capodanno», «Lunedì dell'Angelo», «Santo patrono».
              kind:
                type: string
                enum: [national, patron_saint]
    WorkingDays:
      type: object
      required: [from, to, days, working_days, holidays]
      properties:
        from: { $ref: '#/components/schemas/Date' }
        to: { $ref: '#/components/schemas/Date' }
        days:
          type: integer
          description: Giorni di calendario del periodo, from e to compresi.
        working_days:
          type: integer
          description: Giorni da lunedì a venerdì del periodo, senza festività e santo patrono.
        holidays:
          type: array
          items:
            type: object
            required: [date, name, kind]
            properties:
              date: { $ref: '#/components/schemas/Date' }
              name:
                type: string
                description: Nome in italiano, come in listHolidays.
              kind:
                type: string
                enum: [national, patron_saint]
    WorkingDaysEnd:
      type: object
      required: [from, working_days, to, days]
      properties:
        from: { $ref: '#/components/schemas/Date' }
        working_days:
          type: integer
          description: I giorni lavorativi chiesti.
        to:
          $ref: '#/components/schemas/Date'
        days:
          type: integer
          description: Giorni di calendario da from a to, entrambi compresi.
    WorkingDaysStart:
      type: object
      required: [from, working_days, to, days]
      properties:
        from:
          $ref: '#/components/schemas/Date'
        working_days:
          type: integer
          description: I giorni lavorativi chiesti.
        to: { $ref: '#/components/schemas/Date' }
        days:
          type: integer
          description: Giorni di calendario da from a to, entrambi compresi.
    AbsenceTotals:
      type: object
      required: [year, from, to, employees, totals]
      properties:
        year: { type: integer }
        from: { $ref: '#/components/schemas/Date' }
        to: { $ref: '#/components/schemas/Date' }
        employees:
          type: array
          items:
            type: object
            required:
              [
                employee,
                days,
                working_days,
                hours,
                kinds,
                vacation_allowance,
                vacation_carried_over,
                vacation_remaining,
                permit_allowance,
                permit_carried_over,
                permit_remaining,
              ]
            properties:
              employee:
                type: object
                required: [id, first_name, last_name, active]
                properties:
                  id: { $ref: '#/components/schemas/Id' }
                  first_name: { type: string }
                  last_name: { type: string }
                  active: { type: boolean }
              vacation_allowance:
                type: [integer, 'null']
                description: Giorni di ferie spettanti nell'anno (annual_leave_days), null se non indicati.
              vacation_carried_over:
                type: [integer, 'null']
                description: Giorni di ferie riportati dall'anno prima (setLeaveCarryover), null se non indicati.
              vacation_remaining:
                type: [integer, 'null']
                description: |
                  Ferie spettanti più quelle riportate dall'anno prima, meno i giorni lavorativi
                  di ferie dell'anno; negativo se ne ha fatte di più, null senza ferie spettanti.
              permit_allowance:
                type: [integer, 'null']
                description: Ore di permesso spettanti nell'anno (annual_permit_hours), null se non indicate.
              permit_carried_over:
                type: [string, 'null']
                pattern: '^-?\d+\.\d{2}$'
                examples: ['12.50']
                description: Ore di permesso riportate dall'anno prima (setLeaveCarryover), null se non indicate.
              permit_remaining:
                type: [string, 'null']
                pattern: '^-?\d+\.\d{2}$'
                examples: ['80.50', '-4.00']
                description: |
                  Ore di permesso spettanti più quelle riportate dall'anno prima, meno le ore dei
                  permessi dell'anno; un permesso di
                  tutto il giorno conta 8 ore per ogni giorno lavorativo. Negativo se ne ha
                  fatte di più, null senza ore spettanti.
              days: { type: integer }
              working_days: { type: integer }
              hours: { $ref: '#/components/schemas/WorkHours' }
              kinds: { $ref: '#/components/schemas/AbsenceTotalsKinds' }
        totals:
          type: object
          required: [days, working_days, hours, kinds]
          properties:
            days: { type: integer }
            working_days: { type: integer }
            hours: { $ref: '#/components/schemas/WorkHours' }
            kinds: { $ref: '#/components/schemas/AbsenceTotalsKinds' }
    SupplierDocumentList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/SupplierDocument' }
    Amount:
      type: string
      description: |
        Importo in euro come stringa con due decimali e il punto, mai numero JSON. In ingresso
        si accettano anche zero o un decimale.
      pattern: '^\d{1,13}(\.\d{1,2})?$'
      examples: ['1234.50']
    SignedAmount:
      type: string
      description: |
        Importo calcolato dal backend, in euro con due decimali e il punto, mai numero JSON.
        Può essere negativo (ad esempio una voce di sole detrazioni).
      pattern: '^-?\d+\.\d{2}$'
      examples: ['1234.50', '-12.00']
    DeadlineKind:
      type: string
      description: |
        durc, insurance (assicurazione), tax (imposte e contributi), invoice_in (fattura da
        pagare), invoice_out (fattura da incassare), contract (contratto), vehicle (mezzo:
        bollo, revisione), medical_check (visita medica del dipendente), training (formazione
        e corsi sulla sicurezza), other.
      enum:
        [durc, insurance, tax, invoice_in, invoice_out, contract, vehicle, medical_check, training, other]
    DeadlineStatus:
      type: string
      enum: [open, done]
    DeadlineRecurrence:
      type: string
      description: |
        monthly (ogni mese), quarterly (ogni tre mesi), semiannual (ogni sei mesi, es.
        controllo degli estintori), yearly (ogni anno), biennial (ogni due anni, es. revisione
        di un mezzo dopo la prima). La data successiva si ottiene aggiungendo l'intervallo; a
        fine mese si ferma all'ultimo giorno (31/01 → 28/02, 31/08 + sei mesi → 28/02).
      enum: [monthly, quarterly, semiannual, yearly, biennial]
    SubjectRef:
      type: object
      description: Cliente o fornitore collegato, con il nome per mostrarlo senza altre chiamate.
      required: [id, name]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
    DeadlineInput:
      type: object
      description: |
        I campi facoltativi si inviano comunque, con null se vuoti. Al massimo uno tra
        client_id e supplier_id. site_id, employee_id e vehicle_id si possono omettere: un
        campo assente vale null, anche in modifica (toglie il collegamento).
      required: [title, due_on, kind, amount, client_id, supplier_id, notes, recurrence]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        due_on: { $ref: '#/components/schemas/Date' }
        kind: { $ref: '#/components/schemas/DeadlineKind' }
        amount:
          oneOf:
            - $ref: '#/components/schemas/Amount'
            - type: 'null'
        client_id:
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        supplier_id:
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        site_id:
          description: Cantiere a cui si riferisce la scadenza (es. un permesso).
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        employee_id:
          description: Dipendente a cui si riferisce (es. visita medica, corso sulla sicurezza).
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        vehicle_id:
          description: Mezzo a cui si riferisce (es. revisione, bollo, assicurazione).
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        notes:
          type: [string, 'null']
          maxLength: 2000
        recurrence:
          oneOf:
            - $ref: '#/components/schemas/DeadlineRecurrence'
            - type: 'null'
    Deadline:
      allOf:
        - $ref: '#/components/schemas/DeadlineInput'
        - type: object
          required:
            - id
            - working_due_on
            - status
            - done_at
            - next_deadline_id
            - supplier_document_id
            - invoice_id
            - vehicle_maintenance_id
            - vehicle_document_id
            - employee_document_id
            - client
            - supplier
            - site_id
            - employee_id
            - vehicle_id
            - site
            - employee
            - vehicle
            - created_at
            - updated_at
          properties:
            id: { $ref: '#/components/schemas/Id' }
            working_due_on:
              description: |
                Primo giorno lavorativo uguale o successivo a `due_on`: da lunedì a venerdì,
                escluse le festività nazionali con Pasquetta e il santo patrono dell'azienda. Una
                scadenza che cade di sabato o in un giorno festivo slitta qui, come gli adempimenti
                fiscali; coincide con `due_on` se quel giorno è già lavorativo. Lo calcola il
                backend, non si invia.
              allOf:
                - $ref: '#/components/schemas/Date'
            amount:
              description: In uscita sempre con due decimali.
              oneOf:
                - type: string
                  pattern: '^\d+\.\d{2}$'
                - type: 'null'
            status: { $ref: '#/components/schemas/DeadlineStatus' }
            supplier_document_id:
              description: |
                Documento di regolarità del fornitore da cui nasce la scadenza. Il backend la
                tiene allineata alla data di scadenza del documento (un rinnovo la riapre) e la
                elimina con il documento: si modifica dal documento, non da qui.
              oneOf:
                - $ref: '#/components/schemas/Id'
                - type: 'null'
            invoice_id:
              description: |
                Fattura da cui nasce la scadenza di pagamento. Il backend la tiene allineata alla
                fattura (data, importo, chiusa quando la fattura è pagata) e la elimina con la
                fattura: si modifica dalla fattura, non da qui.
              oneOf:
                - $ref: '#/components/schemas/Id'
                - type: 'null'
            vehicle_maintenance_id:
              description: |
                Manutenzione del mezzo da cui nasce la scadenza (la sua `next_due_on`). Il
                backend la tiene allineata alla data della prossima manutenzione (una data nuova
                la riapre) e la elimina con la manutenzione: si modifica dalla manutenzione, non
                da qui.
              oneOf:
                - $ref: '#/components/schemas/Id'
                - type: 'null'
            vehicle_document_id:
              description: |
                Documento del mezzo da cui nasce la scadenza (assicurazione, bollo...). Il backend
                la tiene allineata alla scadenza del documento (una data nuova la riapre) e la
                elimina con il documento: si modifica dal documento, non da qui.
              oneOf:
                - $ref: '#/components/schemas/Id'
                - type: 'null'
            employee_document_id:
              description: |
                Documento del dipendente da cui nasce la scadenza (idoneità sanitaria, corsi...).
                Il backend la tiene allineata alla scadenza del documento (una data nuova la
                riapre) e la elimina con il documento: si modifica dal documento, non da qui.
              oneOf:
                - $ref: '#/components/schemas/Id'
                - type: 'null'
            next_deadline_id:
              description: La scadenza creata completando questa, se ricorrente.
              oneOf:
                - $ref: '#/components/schemas/Id'
                - type: 'null'
            done_at:
              type: [string, 'null']
              format: date-time
            client:
              oneOf:
                - $ref: '#/components/schemas/SubjectRef'
                - type: 'null'
            supplier:
              oneOf:
                - $ref: '#/components/schemas/SubjectRef'
                - type: 'null'
            site:
              description: Cantiere collegato, con il nome.
              oneOf:
                - $ref: '#/components/schemas/SubjectRef'
                - type: 'null'
            employee:
              description: Dipendente collegato, con cognome e nome.
              oneOf:
                - $ref: '#/components/schemas/SubjectRef'
                - type: 'null'
            vehicle:
              description: Mezzo collegato, con il nome.
              oneOf:
                - $ref: '#/components/schemas/SubjectRef'
                - type: 'null'
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    DeadlineBucket:
      type: object
      required: [count, amount]
      properties:
        count:
          type: integer
          minimum: 0
        amount:
          description: Somma degli importi, con due decimali; le scadenze senza importo valgono zero.
          type: string
          pattern: '^\d+\.\d{2}$'
    DeadlineSummary:
      type: object
      required: [today, overdue, next_7_days, next_30_days]
      properties:
        today: { $ref: '#/components/schemas/Date' }
        overdue: { $ref: '#/components/schemas/DeadlineBucket' }
        next_7_days: { $ref: '#/components/schemas/DeadlineBucket' }
        next_30_days: { $ref: '#/components/schemas/DeadlineBucket' }
    DeadlineList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Deadline' }
        meta: { $ref: '#/components/schemas/ListMeta' }
    SiteStatus:
      type: string
      description: |
        planned: da iniziare. active: in corso. suspended: sospeso. completed: chiuso.
      enum: [planned, active, suspended, completed]
    SiteInput:
      type: object
      description: I campi facoltativi si inviano comunque, con null se vuoti.
      required: [code, name, client_id, address, status, start_on, end_on, budget, notes]
      properties:
        code:
          type: [string, 'null']
          description: Codice della commessa, unico nell'azienda (senza distinguere maiuscole).
          maxLength: 50
        name:
          type: string
          minLength: 1
          maxLength: 200
        client_id:
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        address:
          type: [string, 'null']
          description: Indirizzo del cantiere, in una riga.
          maxLength: 300
        status: { $ref: '#/components/schemas/SiteStatus' }
        start_on:
          description: Inizio dei lavori.
          oneOf:
            - $ref: '#/components/schemas/Date'
            - type: 'null'
        end_on:
          description: Fine prevista, non prima dell'inizio.
          oneOf:
            - $ref: '#/components/schemas/Date'
            - type: 'null'
        budget:
          description: Budget di costo del cantiere.
          oneOf:
            - $ref: '#/components/schemas/Amount'
            - type: 'null'
        notes:
          type: [string, 'null']
          maxLength: 2000
        location:
          description: |
            Posizione del cantiere sulla mappa (WGS 84, come OpenStreetMap), o null se non
            indicata. Facoltativo: se manca, alla creazione vale null e alla modifica resta
            com'è.
          oneOf:
            - $ref: '#/components/schemas/GeoPoint'
            - type: 'null'
        cig:
          type: [string, 'null']
          description: |
            CIG (codice identificativo di gara) dei lavori pubblici: 10 lettere e cifre. Si
            salva in maiuscolo e senza spazi; una stringa vuota vale null. Facoltativo come
            location.
          maxLength: 40
          examples: ['1234567890']
        cup:
          type: [string, 'null']
          description: |
            CUP (codice unico di progetto) dei lavori pubblici: 15 lettere e cifre, come il CIG.
            Facoltativo come location.
          maxLength: 40
          examples: ['B12C34000560007']
    GeoPoint:
      type: object
      required: [latitude, longitude]
      properties:
        latitude:
          type: string
          description: |
            Latitudine in gradi decimali con il punto, da -90 a 90, fino a sei decimali; mai
            numero JSON. In uscita ha sempre sei decimali.
          pattern: '^-?\d{1,2}(\.\d{1,6})?$'
          examples: ['45.070312']
        longitude:
          type: string
          description: Longitudine in gradi decimali, da -180 a 180, come la latitudine.
          pattern: '^-?\d{1,3}(\.\d{1,6})?$'
          examples: ['7.686856']
    Site:
      allOf:
        - $ref: '#/components/schemas/SiteInput'
        - type: object
          required:
            [
              id,
              client,
              location,
              cig,
              cup,
              quote,
              team_documents_expired,
              subcontractors_expired,
              created_at,
              updated_at,
            ]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            client:
              oneOf:
                - $ref: '#/components/schemas/SubjectRef'
                - type: 'null'
            team_documents_expired:
              type: boolean
              description: |
                Vero se almeno un dipendente della squadra ha un documento scaduto, come
                documents_expired di getSiteTeam e filter[team_documents]=expired. Calcolato:
                non cambia l'ETag e si ignora se arriva nel corpo.
            subcontractors_expired:
              type: [boolean, 'null']
              description: |
                Vero se almeno un subappaltatore del cantiere ha un documento scaduto, come
                listSiteSubcontractors e filter[subcontractor_compliance]=expired. Null senza
                suppliers.view. Calcolato: non cambia l'ETag e si ignora se arriva nel corpo.
            quote:
              description: Il preventivo da cui è nato il cantiere (createSiteFromQuote), o null.
              oneOf:
                - $ref: '#/components/schemas/QuoteRef'
                - type: 'null'
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    SiteList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Site' }
        meta: { $ref: '#/components/schemas/ListMeta' }
    SiteTeamInput:
      type: object
      required: [employee_ids]
      properties:
        employee_ids:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/Id' }
    SiteTeamMember:
      type: object
      required: [employee_id, first_name, last_name, job_title, active, away, absence,
        absence_hours, documents_expired]
      properties:
        employee_id: { $ref: '#/components/schemas/Id' }
        first_name: { type: string }
        last_name: { type: string }
        job_title: { type: [string, 'null'] }
        active: { type: boolean }
        away:
          type: boolean
          description: Assente oggi tutto il giorno (ferie, malattia…, un'assenza senza ore).
        absence:
          description: |
            Tipo dell'assenza di oggi, se c'è, anche un permesso a ore. Solo con
            employees.view, altrimenti null.
          oneOf:
            - $ref: '#/components/schemas/EmployeeAbsenceKind'
            - type: 'null'
        absence_hours:
          description: Ore del permesso di oggi; null per tutto il giorno o senza employees.view.
          oneOf:
            - $ref: '#/components/schemas/Hours'
            - type: 'null'
        documents_expired:
          type: boolean
          description: |
            Ha un documento scaduto (idoneità, attestato di un corso, patentino…), con le stesse
            condizioni di filter[documents]=expired dei dipendenti: un documento rinnovato non
            conta più. Lo vede anche chi non ha employees.view, senza sapere quale documento.
    SiteSubcontractor:
      type: object
      required: [supplier_id, name, vat_number, archived, documents_expired,
        documents_expiring, no_valid_durc, no_valid_credit_license]
      properties:
        supplier_id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        vat_number: { type: [string, 'null'] }
        archived:
          type: boolean
          description: Il fornitore è archiviato.
        documents_expired:
          type: boolean
          description: |
            Per almeno un tipo di documento la scadenza più lontana è passata (come
            filter[compliance]=expired): un documento rinnovato non conta più.
        documents_expiring:
          type: boolean
          description: Niente di scaduto, ma qualcosa scade entro 30 giorni (filter[compliance]=expiring).
        no_valid_durc:
          type: boolean
          description: Nessun DURC valido oggi (filter[compliance]=no_valid_durc).
        no_valid_credit_license:
          type: boolean
          description: |
            Nessuna patente a crediti valida oggi (filter[compliance]=no_valid_credit_license).
    SiteSubcontractorList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/SiteSubcontractor' }
    ClientSite:
      type: object
      required: [site_id, code, name, status, cig, cup, quoted, invoiced, collected, to_collect]
      properties:
        site_id: { $ref: '#/components/schemas/Id' }
        code: { type: [string, 'null'] }
        name: { type: string }
        status: { $ref: '#/components/schemas/SiteStatus' }
        cig:
          type: [string, 'null']
          description: CIG del cantiere (vedi Site), per i lavori pubblici.
        cup:
          type: [string, 'null']
          description: CUP del cantiere (vedi Site), per i lavori pubblici.
        quoted:
          description: |
            Imponibile del preventivo da cui è nato il cantiere; null se non è nato da un
            preventivo o senza quotes.view.
          oneOf:
            - $ref: '#/components/schemas/Amount'
            - type: 'null'
        invoiced:
          description: |
            Imponibile delle fatture emesse al cliente per il cantiere; null senza invoices.view.
          oneOf:
            - $ref: '#/components/schemas/Amount'
            - type: 'null'
        collected:
          description: Incassato su quelle fatture; null senza invoices.view.
          oneOf:
            - $ref: '#/components/schemas/Amount'
            - type: 'null'
        to_collect:
          description: Resta da incassare su quelle fatture; null senza invoices.view.
          oneOf:
            - $ref: '#/components/schemas/Amount'
            - type: 'null'
    ClientSiteList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ClientSite' }
    SupplierSite:
      type: object
      required: [site_id, code, name, status, cig, cup, costs, orders]
      properties:
        site_id: { $ref: '#/components/schemas/Id' }
        code: { type: [string, 'null'] }
        name: { type: string }
        status: { $ref: '#/components/schemas/SiteStatus' }
        cig:
          type: [string, 'null']
          description: CIG del cantiere (vedi Site), per i lavori pubblici.
        cup:
          type: [string, 'null']
          description: CUP del cantiere (vedi Site), per i lavori pubblici.
        costs:
          description: Costi inseriti a mano con il fornitore sul cantiere; null senza costs.view.
          oneOf:
            - $ref: '#/components/schemas/Amount'
            - type: 'null'
        orders:
          description: |
            Totale senza IVA degli ordini inviati o ricevuti al fornitore per il cantiere; null
            senza purchases.view.
          oneOf:
            - $ref: '#/components/schemas/Amount'
            - type: 'null'
    SupplierSiteList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/SupplierSite' }
    EmployeeSite:
      type: object
      required: [site_id, code, name, status]
      properties:
        site_id: { $ref: '#/components/schemas/Id' }
        code: { type: [string, 'null'] }
        name: { type: string }
        status: { $ref: '#/components/schemas/SiteStatus' }
    EmployeeSiteList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/EmployeeSite' }
    SiteTeam:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/SiteTeamMember' }
    DailyReportStatus:
      type: string
      description: |
        draft: bozza. submitted: inviato all'ufficio. approved: approvato.
      enum: [draft, submitted, approved]
    Hours:
      type: string
      description: Ore come stringa con il punto, da 0.01 a 24; in uscita sempre con due decimali.
      pattern: '^\d{1,4}(\.\d{1,2})?$'
      examples: ['8.00', '7.5']
    LaborHours:
      type: string
      description: |
        Ore lavorate da un dipendente in un rapportino, come stringa con il punto, da 0 a 24; in
        uscita sempre con due decimali. 0 solo per una giornata persa tutta per maltempo, con
        weather_hours maggiore di 0 (altrimenti 422 sotto labor.N.hours): la riga non conta
        come giorno lavorato nei riepiloghi delle ore e nelle ore mensili per cantiere.
      pattern: '^\d{1,4}(\.\d{1,2})?$'
      examples: ['8.00', '7.5', '0']
    OvertimeHoursInput:
      type: [string, 'null']
      description: |
        Ore di straordinario del dipendente in quel giorno, comprese in hours (8 ore con 1
        di straordinario: hours 8, overtime_hours 1): da 0 a hours, con il punto. Facoltativo,
        null o assente vale 0. Servono al consulente del lavoro; i costi restano sulle ore
        (hours) al costo orario del dipendente.
      pattern: '^\d{1,2}(\.\d{1,2})?$'
      examples: ['1.5', '0']
    OvertimeHours:
      type: string
      description: |
        Ore di straordinario comprese nelle ore, con due decimali ('0.00' se non ce ne sono).
      pattern: '^\d{1,4}\.\d{2}$'
      examples: ['1.50', '0.00']
    WeatherHoursInput:
      type: [string, 'null']
      description: |
        Ore della giornata normale che il dipendente non ha lavorato per maltempo (pioggia, neve,
        gelo), per la cassa integrazione per intemperie: non sono comprese in hours (mandato a
        casa dopo 3 ore per la pioggia: hours 3, weather_hours 5; giornata persa tutta: hours 0,
        weather_hours 8), e hours più weather_hours non supera 24. Da 0 a 24, con il punto. Facoltativo, null o assente vale 0. Non hanno costi.
      pattern: '^\d{1,2}(\.\d{1,2})?$'
      examples: ['5', '0']
    WeatherHours:
      type: string
      description: |
        Ore perse per maltempo, non comprese nelle ore, con due decimali ('0.00' se non ce ne
        sono).
      pattern: '^\d{1,4}\.\d{2}$'
      examples: ['5.00', '0.00']
    DailyReportInput:
      type: object
      description: |
        I campi facoltativi si inviano comunque, con null se vuoti. labor e vehicles sono gli
        elenchi completi (anche vuoti), al massimo 100 righe ciascuno, senza doppioni; gli
        errori delle righe usano il percorso con l'indice (labor.0.hours). Fa eccezione
        overtime_hours delle righe dei dipendenti: se manca (o è null) vale 0; travel: se
        manca (o è null) vale false; weather_hours: se manca (o è null) vale 0.
      required: [site_id, date, weather, work_done, notes, labor, vehicles]
      properties:
        site_id: { $ref: '#/components/schemas/Id' }
        date: { $ref: '#/components/schemas/Date' }
        weather:
          type: [string, 'null']
          description: Condizioni meteo, testo libero.
          maxLength: 100
        work_done:
          type: [string, 'null']
          description: Lavori svolti nella giornata.
          maxLength: 5000
        notes:
          type: [string, 'null']
          maxLength: 2000
        labor:
          type: array
          maxItems: 100
          items:
            type: object
            required: [employee_id, hours, description]
            properties:
              employee_id: { $ref: '#/components/schemas/Id' }
              hours: { $ref: '#/components/schemas/LaborHours' }
              overtime_hours: { $ref: '#/components/schemas/OvertimeHoursInput' }
              travel:
                type: [boolean, 'null']
                description: |
                  Il dipendente quel giorno ha lavorato in trasferta, fuori dalla zona abituale:
                  il consulente del lavoro paga l'indennità secondo il contratto (il gestionale
                  segna solo il giorno). Facoltativo, null o assente vale false.
              weather_hours: { $ref: '#/components/schemas/WeatherHoursInput' }
              description:
                type: [string, 'null']
                maxLength: 500
        vehicles:
          type: array
          maxItems: 100
          items:
            type: object
            required: [vehicle_id, hours, description]
            properties:
              vehicle_id: { $ref: '#/components/schemas/Id' }
              hours: { $ref: '#/components/schemas/Hours' }
              description:
                type: [string, 'null']
                maxLength: 500
    UserRef:
      type: object
      required: [id, name]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
    DailyReportSummary:
      type: object
      required:
        - id
        - site_id
        - site
        - date
        - status
        - weather
        - work_done
        - notes
        - total_labor_hours
        - total_overtime_hours
        - total_weather_hours
        - travel_count
        - holiday
        - total_vehicle_hours
        - created_by
        - submitted_at
        - approved_at
        - approved_by
        - created_at
        - updated_at
      properties:
        id: { $ref: '#/components/schemas/Id' }
        site_id: { $ref: '#/components/schemas/Id' }
        site:
          type: object
          required: [id, name, code]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            name: { type: string }
            code: { type: [string, 'null'] }
        date: { $ref: '#/components/schemas/Date' }
        status: { $ref: '#/components/schemas/DailyReportStatus' }
        weather: { type: [string, 'null'] }
        work_done: { type: [string, 'null'] }
        notes: { type: [string, 'null'] }
        total_labor_hours: { $ref: '#/components/schemas/Hours' }
        total_overtime_hours:
          allOf:
            - $ref: '#/components/schemas/OvertimeHours'
          description: Somma degli straordinari dei dipendenti, compresa in total_labor_hours.
        total_weather_hours:
          allOf:
            - $ref: '#/components/schemas/WeatherHours'
          description: |
            Somma delle ore perse per maltempo dei dipendenti, fuori da total_labor_hours: un
            giorno di pioggia si riconosce dall'elenco senza aprire il rapportino.
        travel_count:
          type: integer
          minimum: 0
          description: |
            Quanti dipendenti del rapportino sono in trasferta (travel) quel giorno: le trasferte
            si vedono dall'elenco senza aprire il rapportino.
        holiday:
          type: boolean
          description: |
            Il giorno del rapportino è festivo: domenica, festivo nazionale (Pasquetta compresa) o
            santo patrono dei dati dell'azienda (patron_saint_day). Le stesse giornate delle ore
            festive dei fogli ore mensili, da pagare con la maggiorazione.
        total_vehicle_hours: { $ref: '#/components/schemas/Hours' }
        created_by:
          description: Chi ha scritto il rapportino; null per i dati caricati fuori dall'API.
          oneOf:
            - $ref: '#/components/schemas/UserRef'
            - type: 'null'
        submitted_at:
          type: [string, 'null']
          format: date-time
        approved_at:
          type: [string, 'null']
          format: date-time
        approved_by:
          oneOf:
            - $ref: '#/components/schemas/UserRef'
            - type: 'null'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    DailyReport:
      allOf:
        - $ref: '#/components/schemas/DailyReportSummary'
        - type: object
          required: [labor, vehicles]
          properties:
            labor:
              type: array
              description: Ore dei dipendenti, senza costi.
              items:
                type: object
                required:
                  [
                    employee_id,
                    first_name,
                    last_name,
                    hours,
                    overtime_hours,
                    travel,
                    weather_hours,
                    description,
                  ]
                properties:
                  employee_id: { $ref: '#/components/schemas/Id' }
                  first_name: { type: string }
                  last_name: { type: string }
                  hours: { $ref: '#/components/schemas/LaborHours' }
                  overtime_hours: { $ref: '#/components/schemas/OvertimeHours' }
                  travel:
                    type: boolean
                    description: Giorno in trasferta.
                  weather_hours: { $ref: '#/components/schemas/WeatherHours' }
                  description: { type: [string, 'null'] }
            vehicles:
              type: array
              description: Ore dei mezzi, senza costi.
              items:
                type: object
                required: [vehicle_id, name, plate, hours, description]
                properties:
                  vehicle_id: { $ref: '#/components/schemas/Id' }
                  name: { type: string }
                  plate: { type: [string, 'null'] }
                  hours: { $ref: '#/components/schemas/Hours' }
                  description: { type: [string, 'null'] }
    DailyReportToday:
      type: object
      required: [date, site, report, proposal, employees, vehicles]
      properties:
        date: { $ref: '#/components/schemas/Date' }
        site:
          type: object
          required: [id, name, code]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            name: { type: string }
            code: { type: [string, 'null'] }
        report:
          description: Il rapportino già scritto per quel giorno, oppure null.
          oneOf:
            - $ref: '#/components/schemas/DailyReport'
            - type: 'null'
        proposal: { $ref: '#/components/schemas/DailyReportInput' }
        employees:
          type: array
          description: |
            Dipendenti attivi, per cognome e nome; in_team se sono nella squadra; away se sono
            assenti tutto il giorno (non si possono mettere nel rapportino). Solo con
            employees.view, altrimenti null: absence è il tipo dell'assenza in quel giorno (null
            se non ce n'è), absence_hours le ore di un permesso a ore (null per un'assenza di
            tutto il giorno).
          items:
            type: object
            required:
              [id, first_name, last_name, in_team, away, absence, absence_hours, documents_expired]
            properties:
              id: { $ref: '#/components/schemas/Id' }
              first_name: { type: string }
              last_name: { type: string }
              in_team: { type: boolean }
              away: { type: boolean }
              documents_expired:
                type: boolean
                description: |
                  Vero se in quel giorno è scaduto l'ultimo documento di almeno un tipo (come
                  filter[documents]=expired di listEmployees, ma alla data del rapportino).
              absence:
                oneOf:
                  - $ref: '#/components/schemas/EmployeeAbsenceKind'
                  - type: 'null'
              absence_hours:
                oneOf:
                  - $ref: '#/components/schemas/Hours'
                  - type: 'null'
        vehicles:
          type: array
          description: Mezzi attivi, per nome.
          items:
            type: object
            required: [id, name, plate, documents_expired]
            properties:
              id: { $ref: '#/components/schemas/Id' }
              name: { type: string }
              plate: { type: [string, 'null'] }
              documents_expired:
                type: boolean
                description: |
                  Vero se in quel giorno è scaduto l'ultimo documento di almeno un tipo
                  (assicurazione, bollo, taratura…), come filter[documents]=expired di
                  listVehicles ma alla data del rapportino.
    DailyReportList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/DailyReportSummary' }
        meta: { $ref: '#/components/schemas/ListMeta' }
    CostCategory:
      type: string
      description: |
        materials: materiali. rentals: noli. subcontract: subappalti. other: altro.
      enum: [materials, rentals, subcontract, other]
    SiteCostInput:
      type: object
      description: I campi facoltativi si inviano comunque, con null se vuoti.
      required: [site_id, date, category, description, supplier_id, amount, notes]
      properties:
        site_id: { $ref: '#/components/schemas/Id' }
        date: { $ref: '#/components/schemas/Date' }
        category: { $ref: '#/components/schemas/CostCategory' }
        description:
          type: string
          minLength: 1
          maxLength: 300
        supplier_id:
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        amount:
          description: Importo del costo, senza IVA, non negativo.
          allOf:
            - $ref: '#/components/schemas/Amount'
        notes:
          type: [string, 'null']
          maxLength: 2000
    SiteCost:
      allOf:
        - $ref: '#/components/schemas/SiteCostInput'
        - type: object
          required: [id, site, supplier, created_at, updated_at]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            site:
              type: object
              required: [id, name, code, cig, cup]
              properties:
                id: { $ref: '#/components/schemas/Id' }
                name: { type: string }
                code: { type: [string, 'null'] }
                cig:
                  type: [string, 'null']
                  description: CIG del cantiere (vedi Site), per i lavori pubblici.
                cup:
                  type: [string, 'null']
                  description: CUP del cantiere (vedi Site), per i lavori pubblici.
            supplier:
              oneOf:
                - $ref: '#/components/schemas/SubjectRef'
                - type: 'null'
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    PurchaseOrderStatus:
      type: string
      description: 'draft: bozza. sent: inviato al fornitore. received: merce ricevuta.'
      enum: [draft, sent, received]
    PurchaseOrderLineInput:
      type: object
      required: [description, unit, quantity, unit_price]
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 500
        unit:
          type: [string, 'null']
          maxLength: 20
          examples: ['m³']
        quantity:
          description: Quantità maggiore di zero.
          allOf:
            - $ref: '#/components/schemas/Quantity'
        unit_price:
          description: Prezzo unitario senza IVA.
          allOf:
            - $ref: '#/components/schemas/Amount'
    PurchaseOrderLine:
      allOf:
        - $ref: '#/components/schemas/PurchaseOrderLineInput'
        - type: object
          required: [amount]
          properties:
            amount:
              description: Quantità per prezzo, arrotondato al centesimo.
              allOf:
                - $ref: '#/components/schemas/Amount'
    PurchaseOrderInput:
      type: object
      description: |
        I campi facoltativi si inviano comunque, con null se vuoti. Al massimo 200 righe;
        la consegna prevista non può essere prima della data dell'ordine.
      required: [supplier_id, site_id, date, delivery_date, notes, lines]
      properties:
        supplier_id: { $ref: '#/components/schemas/Id' }
        site_id:
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        date: { $ref: '#/components/schemas/Date' }
        delivery_date:
          description: Consegna prevista.
          oneOf:
            - $ref: '#/components/schemas/Date'
            - type: 'null'
        notes:
          type: [string, 'null']
          maxLength: 2000
        lines:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/PurchaseOrderLineInput' }
    PurchaseOrderSummary:
      type: object
      required:
        [
          id,
          number,
          status,
          supplier_id,
          supplier,
          site_id,
          site,
          date,
          delivery_date,
          notes,
          line_count,
          total,
          invoiced_amount,
          sent_at,
          received_at,
          created_at,
          updated_at,
        ]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        number:
          type: string
          examples: ['2026/001']
        status: { $ref: '#/components/schemas/PurchaseOrderStatus' }
        supplier_id: { $ref: '#/components/schemas/Id' }
        supplier: { $ref: '#/components/schemas/SubjectRef' }
        site_id:
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        site:
          oneOf:
            - type: object
              required: [id, name, code, cig, cup]
              properties:
                id: { $ref: '#/components/schemas/Id' }
                name: { type: string }
                code: { type: [string, 'null'] }
                cig:
                  type: [string, 'null']
                  description: CIG del cantiere (vedi Site), per i lavori pubblici.
                cup:
                  type: [string, 'null']
                  description: CUP del cantiere (vedi Site), per i lavori pubblici.
            - type: 'null'
        date: { $ref: '#/components/schemas/Date' }
        delivery_date:
          oneOf:
            - $ref: '#/components/schemas/Date'
            - type: 'null'
        notes: { type: [string, 'null'] }
        line_count: { type: integer, minimum: 0 }
        total:
          description: Somma delle righe, senza IVA.
          allOf:
            - $ref: '#/components/schemas/Amount'
        invoiced_amount:
          description: |
            Imponibile delle fatture ricevute che addebitano l'ordine (purchase_order_id della
            fattura), da confrontare con total; 0.00 se non ce ne sono. Null senza
            invoices.view. Calcolato: non cambia l'ETag e si ignora nel corpo.
          oneOf:
            - $ref: '#/components/schemas/Amount'
            - type: 'null'
        sent_at:
          type: [string, 'null']
          format: date-time
        received_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PurchaseOrder:
      allOf:
        - $ref: '#/components/schemas/PurchaseOrderSummary'
        - type: object
          required: [lines]
          properties:
            lines:
              type: array
              items: { $ref: '#/components/schemas/PurchaseOrderLine' }
    PurchaseOrderList:
      type: object
      required: [data, meta, total_amount]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/PurchaseOrderSummary' }
        meta: { $ref: '#/components/schemas/ListMeta' }
        total_amount: { $ref: '#/components/schemas/Amount' }
    InvoiceDirection:
      type: string
      description: 'issued: emessa a un cliente. received: ricevuta da un fornitore.'
      enum: [issued, received]
    InvoicePaymentStatus:
      type: string
      description: |
        paid: pagata (o incassata). overdue: non pagata e con la scadenza di pagamento passata
        (oggi in Italia). open: non pagata, non ancora scaduta o senza scadenza.
      enum: [open, overdue, paid]
    InvoiceInput:
      type: object
      description: |
        I campi facoltativi si inviano comunque, con null se vuoti. Le emesse hanno client_id
        e supplier_id null, le ricevute il contrario. La scadenza di pagamento non può essere
        prima della data della fattura. Niente invio allo SDI: è solo un registro.
      required:
        [
          direction,
          number,
          date,
          client_id,
          supplier_id,
          site_id,
          description,
          taxable_amount,
          vat_amount,
          due_date,
          paid_on,
          notes,
        ]
      properties:
        direction: { $ref: '#/components/schemas/InvoiceDirection' }
        number:
          type: string
          minLength: 1
          maxLength: 40
          examples: ['12/2026']
        date: { $ref: '#/components/schemas/Date' }
        client_id:
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        supplier_id:
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        site_id:
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        description:
          type: [string, 'null']
          maxLength: 500
        taxable_amount:
          description: Imponibile.
          allOf:
            - $ref: '#/components/schemas/Amount'
        vat_amount:
          description: IVA; 0.00 per le operazioni senza IVA (ad esempio in reverse charge).
          allOf:
            - $ref: '#/components/schemas/Amount'
        vat_nature:
          description: |
            Natura IVA della fattura senza IVA (es. N6.3, subappalto in inversione contabile),
            solo con vat_amount 0.00. Facoltativa: se manca, alla creazione vale null e alla
            modifica resta com'è; diventa null se l'IVA non è più zero.
          oneOf:
            - $ref: '#/components/schemas/VatNature'
            - type: 'null'
        withholding_amount:
          description: |
            Ritenuta d'acconto trattenuta da chi paga (es. 20% sul compenso di un professionista,
            4% del condominio sui lavori in appalto), mai oltre l'imponibile. Facoltativa: se manca, alla creazione vale 0.00 e alla modifica resta
            com'è.
          allOf:
            - $ref: '#/components/schemas/Amount'
        split_payment:
          type: boolean
          description: |
            Scissione dei pagamenti (art. 17-ter DPR 633/72): fattura emessa a una pubblica
            amministrazione, che versa l'IVA direttamente all'erario; amount_due non comprende
            l'IVA. Solo per le emesse. Facoltativo: se manca, alla creazione vale false e alla
            modifica resta com'è.
        progress_statement_id:
          description: |
            Il SAL approvato che questa fattura emessa addebita (fattura d'acconto sullo stato di
            avanzamento); una fattura per SAL. Facoltativo: se manca, alla creazione vale null e
            alla modifica resta com'è. Solo per le emesse; con un cantiere indicato, il SAL deve
            essere di un computo di quel cantiere.
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        purchase_order_id:
          description: |
            L'ordine al fornitore che questa fattura ricevuta addebita, per confrontarla con
            l'ordinato: un ordine già inviato o ricevuto, dello stesso fornitore della fattura.
            Un ordine può avere più fatture (consegne fatturate una per una). Facoltativo: se
            manca, alla creazione vale null e alla modifica resta com'è. Solo per le ricevute.
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        retention_release:
          type: boolean
          description: |
            Fattura emessa di svincolo della ritenuta di garanzia trattenuta sui SAL del
            cantiere, a fine lavori: il suo imponibile conta in retention_released del
            riepilogo del cantiere. Solo per le emesse, con un cantiere e senza SAL collegato.
            Facoltativo: se manca, alla creazione vale false e alla modifica resta com'è.
        document_type:
          description: |
            Facoltativo: se manca, alla creazione vale invoice e alla modifica resta com'è.
            Non si cambia dopo la creazione (422).
          allOf:
            - $ref: '#/components/schemas/InvoiceDocumentType'
        credited_invoice_id:
          description: |
            Solo per le note di credito, e per loro obbligatoria: la fattura che la nota storna,
            della stessa direzione, dello stesso cliente o fornitore, dello stesso cantiere e
            dello stesso ordine (422 sotto credited_invoice_id, site_id o purchase_order_id).
            Le note di una fattura non superano quanto resta da pagare (amount_due meno i
            pagamenti), né il suo imponibile né la sua IVA (422 sotto taxable_amount o
            vat_amount). Su una fattura già pagata la nota è di rimborso (refund) e sta entro
            quanto è stato pagato, meno le altre note di rimborso; non scende sotto i rimborsi
            già registrati su di lei, e una fattura con note di rimborso deve restare pagata
            almeno per il loro totale (422). Una nota
            non ha due_date, paid_on, SAL, ritenuta, scissione dei pagamenti né svincolo (422
            sotto il campo). Facoltativo: se manca, alla creazione vale null e alla modifica
            resta com'è.
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        due_date:
          description: Scadenza di pagamento; alimenta lo scadenziario.
          oneOf:
            - $ref: '#/components/schemas/Date'
            - type: 'null'
        paid_on:
          description: |
            Data del pagamento o dell'incasso; null se non ancora pagata. Se la fattura ha
            pagamenti registrati (createInvoicePayment) il valore inviato non conta: paid_on è
            la data dell'ultimo pagamento quando coprono amount_due, altrimenti null.
          oneOf:
            - $ref: '#/components/schemas/Date'
            - type: 'null'
        notes:
          type: [string, 'null']
          maxLength: 2000
    Invoice:
      allOf:
        - $ref: '#/components/schemas/InvoiceInput'
        - type: object
          required:
            [
              id,
              client,
              supplier,
              site,
              total,
              payment_status,
              deadline_id,
              file,
              vat_nature,
              withholding_amount,
              split_payment,
              amount_due,
              paid_amount,
              remaining_amount,
              progress_statement_id,
              purchase_order_id,
              purchase_order,
              retention_release,
              document_type,
              credited_invoice_id,
              credited_invoice,
              credited_amount,
              refund,
              refund_due_amount,
              created_at,
              updated_at,
            ]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            credited_invoice:
              description: |
                La fattura stornata da questa nota di credito, con il suo numero; null sulle
                fatture. Calcolato, si ignora nel corpo.
              oneOf:
                - type: object
                  required: [id, number]
                  properties:
                    id: { $ref: '#/components/schemas/Id' }
                    number: { type: string }
                - type: 'null'
            credited_amount:
              description: |
                Somma dei totali delle note di credito che stornano questa fattura, comprese le
                note di rimborso; 0.00 sulle note. Calcolato, si ignora nel corpo.
              allOf:
                - $ref: '#/components/schemas/Amount'
            refund:
              description: |
                Solo sulle note di credito: true se la nota è stata scritta su una fattura già
                pagata (nota di rimborso). Non abbassa quanto resta da pagare della fattura: i
                soldi tornano indietro con i rimborsi registrati sulla nota
                (createInvoicePayment), che contano col segno meno nel pagato e nella prima
                nota. Si decide quando la nota viene scritta e non cambia. Sempre false sulle
                fatture. Calcolato, si ignora nel corpo.
              type: boolean
            refund_due_amount:
              description: |
                Su una nota di rimborso, quanto resta da rimborsare: il suo totale meno i
                rimborsi registrati; 0.00 altrimenti. Calcolato, si ignora nel corpo.
              allOf:
                - $ref: '#/components/schemas/Amount'
            file:
              description: Il PDF della fattura (o la sua scansione), o null.
              oneOf:
                - $ref: '#/components/schemas/AttachedFile'
                - type: 'null'
            client:
              oneOf:
                - $ref: '#/components/schemas/SubjectRef'
                - type: 'null'
            supplier:
              oneOf:
                - $ref: '#/components/schemas/SubjectRef'
                - type: 'null'
            site:
              oneOf:
                - type: object
                  required: [id, name, code, cig, cup]
                  properties:
                    id: { $ref: '#/components/schemas/Id' }
                    name: { type: string }
                    code: { type: [string, 'null'] }
                    cig:
                      type: [string, 'null']
                      description: CIG del cantiere (vedi Site), per i lavori pubblici.
                    cup:
                      type: [string, 'null']
                      description: CUP del cantiere (vedi Site), per i lavori pubblici.
                - type: 'null'
            purchase_order:
              description: |
                L'ordine al fornitore di purchase_order_id con il suo numero (come in
                PurchaseOrderSummary), per mostrarlo senza un'altra chiamata; null senza ordine.
                Calcolato, si ignora nel corpo.
              oneOf:
                - type: object
                  required: [id, number]
                  properties:
                    id: { $ref: '#/components/schemas/Id' }
                    number: { type: string, examples: ['2026/003'] }
                - type: 'null'
            total:
              description: Imponibile più IVA.
              allOf:
                - $ref: '#/components/schemas/Amount'
            amount_due:
              description: |
                Netto a pagare (o da incassare): totale meno la ritenuta d'acconto e, con la
                scissione dei pagamenti, meno l'IVA. Su una nota di credito è il suo totale col
                segno meno. Senza note di credito è l'importo della scadenza nello scadenziario.
              allOf:
                - $ref: '#/components/schemas/SignedAmount'
            paid_amount:
              description: |
                Somma degli incassi o pagamenti registrati (listInvoicePayments). Su una nota di
                rimborso è la somma dei rimborsi col segno meno.
              allOf:
                - $ref: '#/components/schemas/SignedAmount'
            remaining_amount:
              description: |
                Quanto resta da incassare o pagare: amount_due meno paid_amount e meno
                credited_amount; 0.00 quando la fattura è pagata e sempre sulle note di credito,
                che contano sulla fattura stornata. Una fattura coperta da pagamenti e note
                risulta pagata (payment_status paid); una nota di credito è sempre paid. Quanto
                resta da rimborsare su una nota di rimborso è in refund_due_amount.
              allOf:
                - $ref: '#/components/schemas/Amount'
            payment_status: { $ref: '#/components/schemas/InvoicePaymentStatus' }
            deadline_id:
              description: La scadenza nello scadenziario; null senza scadenza di pagamento.
              oneOf:
                - $ref: '#/components/schemas/Id'
                - type: 'null'
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    InvoiceDocumentType:
      type: string
      description: |
        invoice: fattura (TD01). credit_note: nota di credito (TD04), con importi positivi che
        contano col segno meno in tutti i totali (elenchi, saldi, IVA, ricavi, fatturato degli
        ordini).
      enum: [invoice, credit_note]
    InvoicePaymentMethod:
      type: string
      description: |
        bank_transfer: bonifico. riba: ricevuta bancaria. check: assegno. cash: contanti.
        card: carta o bancomat. other: altro (ad esempio una compensazione).
      enum: [bank_transfer, riba, check, cash, card, other]
    InvoicePaymentInput:
      type: object
      description: I campi facoltativi si inviano comunque, con null se vuoti.
      required: [date, amount, method, notes]
      properties:
        date: { $ref: '#/components/schemas/Date' }
        amount:
          description: Importo incassato o pagato, più di zero.
          allOf:
            - $ref: '#/components/schemas/Amount'
        method:
          oneOf:
            - $ref: '#/components/schemas/InvoicePaymentMethod'
            - type: 'null'
        notes:
          type: [string, 'null']
          maxLength: 500
    InvoicePayment:
      type: object
      required: [id, date, amount, method, notes, created_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        date: { $ref: '#/components/schemas/Date' }
        amount:
          description: |
            Importo incassato o pagato. Un rimborso registrato su una nota di credito ha il
            segno meno.
          allOf:
            - $ref: '#/components/schemas/SignedAmount'
        method:
          oneOf:
            - $ref: '#/components/schemas/InvoicePaymentMethod'
            - type: 'null'
        notes:
          type: [string, 'null']
          maxLength: 500
        created_at:
          type: string
          format: date-time
    PaymentList:
      type: object
      required: [data, meta, collected, paid]
      properties:
        data:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/InvoicePayment'
              - type: object
                required: [invoice]
                properties:
                  invoice:
                    type: object
                    required: [id, number, direction, subject, site]
                    properties:
                      id: { $ref: '#/components/schemas/Id' }
                      number: { type: string }
                      direction: { $ref: '#/components/schemas/InvoiceDirection' }
                      subject:
                        description: Il cliente (emesse) o il fornitore (ricevute).
                        allOf:
                          - $ref: '#/components/schemas/SubjectRef'
                      site:
                        oneOf:
                          - type: object
                            required: [id, name, code, cig, cup]
                            properties:
                              id: { $ref: '#/components/schemas/Id' }
                              name: { type: string }
                              code: { type: [string, 'null'] }
                              cig:
                                description: CIG dell'appalto del cantiere, se c'è.
                                type: [string, 'null']
                              cup:
                                description: CUP del progetto del cantiere, se c'è.
                                type: [string, 'null']
                          - type: 'null'
        meta: { $ref: '#/components/schemas/ListMeta' }
        collected:
          description: |
            Somma degli incassi (fatture emesse) filtrati, meno i rimborsi fatti ai clienti
            sulle note di credito; può essere negativa.
          allOf:
            - $ref: '#/components/schemas/SignedAmount'
        paid:
          description: |
            Somma dei pagamenti (fatture ricevute) filtrati, meno i rimborsi ricevuti dai
            fornitori sulle note di credito; può essere negativa.
          allOf:
            - $ref: '#/components/schemas/SignedAmount'
    InvoiceList:
      type: object
      required: [data, meta, total_amount, outstanding_amount]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Invoice' }
        meta: { $ref: '#/components/schemas/ListMeta' }
        total_amount:
          description: |
            Somma dei totali dei documenti filtrati, con le note di credito col segno meno
            (negativa se nel filtro le note superano le fatture).
          allOf:
            - $ref: '#/components/schemas/SignedAmount'
        outstanding_amount:
          description: |
            Somma di quanto resta da pagare o incassare (remaining_amount) delle fatture
            filtrate non ancora pagate.
          allOf:
            - $ref: '#/components/schemas/Amount'
    WarehouseItemInput:
      type: object
      description: |
        I campi facoltativi si inviano comunque, con null se vuoti; min_stock invece si può
        omettere: un articolo nuovo resta senza scorta minima, una modifica la lascia com'è.
      required: [code, name, unit, notes]
      properties:
        code:
          type: [string, 'null']
          maxLength: 50
        name:
          type: string
          minLength: 1
          maxLength: 200
        unit:
          type: string
          minLength: 1
          maxLength: 20
          examples: ['sacchi']
        notes:
          type: [string, 'null']
          maxLength: 2000
        min_stock:
          description: |
            Scorta minima, da zero in su con il punto e al massimo tre decimali (in uscita
            sempre tre); null se l'articolo non ne ha.
          type: [string, 'null']
          pattern: '^\d{1,11}(\.\d{1,3})?$'
          examples: ['50.000']
    WarehouseItem:
      allOf:
        - $ref: '#/components/schemas/WarehouseItemInput'
        - type: object
          required:
            [id, stock, min_stock, below_min, average_cost, stock_value, created_at, updated_at]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            stock: { $ref: '#/components/schemas/Quantity' }
            average_cost:
              description: |
                Costo medio ponderato dei carichi con un costo (somma di quantità per costo
                diviso la somma delle quantità), arrotondato al centesimo; null se nessun carico
                ha un costo.
              oneOf:
                - $ref: '#/components/schemas/Amount'
                - type: 'null'
            stock_value:
              description: |
                Valore della giacenza al costo medio (giacenza per costo medio non arrotondato,
                arrotondato al centesimo); zero se la giacenza non è positiva, null se non c'è
                un costo medio.
              oneOf:
                - $ref: '#/components/schemas/Amount'
                - type: 'null'
            below_min:
              type: boolean
              description: true se c'è una scorta minima e la giacenza è sotto.
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    WarehouseItemList:
      type: object
      required: [data, meta, stock_value]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/WarehouseItem' }
        meta: { $ref: '#/components/schemas/ListMeta' }
        stock_value:
          description: |
            Somma di stock_value di tutti gli articoli che rispondono alla ricerca e ai filtri,
            non solo di questa pagina (gli articoli senza costo medio non contano): il valore
            delle rimanenze.
          allOf:
            - $ref: '#/components/schemas/Amount'
    WarehouseMovementKind:
      type: string
      description: 'in: carico. out: scarico.'
      enum: [in, out]
    WarehouseMovementInput:
      type: object
      description: I campi facoltativi si inviano comunque, con null se vuoti.
      required: [item_id, date, kind, quantity, site_id, notes]
      properties:
        item_id: { $ref: '#/components/schemas/Id' }
        date: { $ref: '#/components/schemas/Date' }
        kind: { $ref: '#/components/schemas/WarehouseMovementKind' }
        quantity:
          description: Quantità maggiore di zero, nell'unità dell'articolo.
          allOf:
            - $ref: '#/components/schemas/Quantity'
        site_id:
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        notes:
          type: [string, 'null']
          maxLength: 2000
        unit_cost:
          description: |
            Costo unitario senza IVA di un carico, nell'unità dell'articolo; dà il costo medio
            dell'articolo e il valore della giacenza. Si può omettere; null se non si sa. Uno
            scarico non ha costo: con kind out deve essere null o assente (422).
          oneOf:
            - $ref: '#/components/schemas/Amount'
            - type: 'null'
        site_return:
          type: boolean
          default: false
          description: |
            Materiale che torna in magazzino dal cantiere site_id: un carico (kind in) con
            site_id e senza unit_cost (altrimenti 422). Vale il costo medio dell'articolo fino
            al suo giorno, non entra nel costo medio e si sottrae da warehouse_materials nel
            riepilogo dei costi del cantiere. Si può omettere; false per un carico qualsiasi,
            anche consegnato in cantiere.
    WarehouseStockCountLine:
      type: object
      required: [item_id, stock, counted, movement]
      properties:
        item_id: { $ref: '#/components/schemas/Id' }
        stock:
          description: Giacenza alla data della conta, prima della rettifica.
          allOf:
            - $ref: '#/components/schemas/Quantity'
        counted: { $ref: '#/components/schemas/Quantity' }
        movement:
          description: Il movimento di rettifica; null se la conta coincide.
          oneOf:
            - $ref: '#/components/schemas/WarehouseMovement'
            - type: 'null'
    WarehouseMovement:
      allOf:
        - $ref: '#/components/schemas/WarehouseMovementInput'
        - type: object
          required:
            [id, item, site, unit_cost, site_return, value, purchase_order, created_by, created_at]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            unit_cost:
              oneOf:
                - $ref: '#/components/schemas/Amount'
                - type: 'null'
            value:
              description: |
                Calcolato, si ignora nel corpo. Un carico vale la quantità per il suo costo
                unitario (null senza costo); uno scarico o un reso dal cantiere la quantità per il
                costo medio ponderato dei carichi con costo dell'articolo fino al suo giorno (null
                se non ce ne sono).
                Arrotondato al centesimo. È lo stesso valore che somma warehouse_materials nel
                riepilogo dei costi del cantiere.
              oneOf:
                - $ref: '#/components/schemas/Amount'
                - type: 'null'
            purchase_order:
              description: L'ordine ricevuto da cui viene il carico, se c'è.
              oneOf:
                - type: object
                  required: [id, number]
                  properties:
                    id: { $ref: '#/components/schemas/Id' }
                    number: { type: string, examples: ['2026/001'] }
                - type: 'null'
            item:
              type: object
              required: [id, code, name, unit]
              properties:
                id: { $ref: '#/components/schemas/Id' }
                code: { type: [string, 'null'] }
                name: { type: string }
                unit: { type: string }
            site:
              oneOf:
                - type: object
                  required: [id, name, code]
                  properties:
                    id: { $ref: '#/components/schemas/Id' }
                    name: { type: string }
                    code: { type: [string, 'null'] }
                - type: 'null'
            created_by:
              oneOf:
                - $ref: '#/components/schemas/UserRef'
                - type: 'null'
            created_at:
              type: string
              format: date-time
    WarehouseMovementList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/WarehouseMovement' }
        meta: { $ref: '#/components/schemas/ListMeta' }
    SiteCostSummary:
      type: object
      required:
        - site
        - labor
        - vehicles
        - materials
        - rentals
        - subcontract
        - other
        - total
        - budget
        - budget_remaining
        - over_budget
        - missing_hourly_costs
        - revenue
        - warehouse_materials
        - purchase_orders
      properties:
        site:
          type: object
          required: [id, name, code]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            name: { type: string }
            code: { type: [string, 'null'] }
        labor: { $ref: '#/components/schemas/HoursCost' }
        vehicles: { $ref: '#/components/schemas/HoursCost' }
        materials: { $ref: '#/components/schemas/Amount' }
        rentals: { $ref: '#/components/schemas/Amount' }
        subcontract: { $ref: '#/components/schemas/Amount' }
        other: { $ref: '#/components/schemas/Amount' }
        total: { $ref: '#/components/schemas/Amount' }
        budget:
          oneOf:
            - $ref: '#/components/schemas/Amount'
            - type: 'null'
        budget_remaining:
          description: Budget meno totale; negativo se il cantiere è sopra budget, null senza budget.
          oneOf:
            - $ref: '#/components/schemas/SignedAmount'
            - type: 'null'
        over_budget: { type: boolean }
        missing_hourly_costs:
          type: integer
          description: Righe dei rapportini approvati con dipendenti o mezzi senza costo orario.
        revenue:
          description: Null senza invoices.view.
          oneOf:
            - $ref: '#/components/schemas/SiteRevenue'
            - type: 'null'
        warehouse_materials:
          description: Null senza warehouse.view. Non entra in total.
          oneOf:
            - $ref: '#/components/schemas/SiteWarehouseMaterials'
            - type: 'null'
        purchase_orders:
          description: Null senza purchases.view. Non entra in total.
          oneOf:
            - $ref: '#/components/schemas/SitePurchaseOrders'
            - type: 'null'
    SitePurchaseOrders:
      type: object
      required: [count, received, total, received_total, invoiced]
      properties:
        count:
          type: integer
          minimum: 0
          description: Ordini del cantiere inviati o ricevuti (le bozze no).
        received:
          type: integer
          minimum: 0
          description: Quanti di questi sono già ricevuti.
        total:
          description: |
            Somma dei totali degli ordini contati (senza IVA, come total dell'ordine): il costo
            impegnato con i fornitori.
          allOf:
            - $ref: '#/components/schemas/Amount'
        received_total:
          description: La parte di total degli ordini già ricevuti.
          allOf:
            - $ref: '#/components/schemas/Amount'
        invoiced:
          description: |
            Imponibile delle fatture ricevute collegate a questi ordini, la somma di
            invoiced_amount degli ordini. Null senza invoices.view.
          oneOf:
            - $ref: '#/components/schemas/Amount'
            - type: 'null'
    SiteWarehouseMaterialList:
      type: object
      required: [data, amount]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/SiteWarehouseMaterial' }
        amount:
          description: Somma di amount, uguale a warehouse_materials.amount del riepilogo dei costi.
          allOf:
            - $ref: '#/components/schemas/SignedAmount'
    SiteWarehouseMaterial:
      type: object
      required: [item, unloaded, returned, net, amount, missing_costs]
      properties:
        item:
          type: object
          required: [id, code, name, unit]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            code: { type: [string, 'null'] }
            name: { type: string }
            unit: { type: string }
        unloaded:
          description: Quantità scaricata sul cantiere.
          allOf:
            - $ref: '#/components/schemas/Quantity'
        returned:
          description: Quantità tornata in magazzino dal cantiere.
          allOf:
            - $ref: '#/components/schemas/Quantity'
        net:
          description: Scaricata meno tornata; negativa se è tornato più di quanto scaricato.
          allOf:
            - $ref: '#/components/schemas/Quantity'
        amount:
          description: |
            Scarichi meno resi, ciascuno al costo medio dell'articolo fino al suo giorno,
            arrotondato al centesimo movimento per movimento.
          allOf:
            - $ref: '#/components/schemas/SignedAmount'
        missing_costs:
          type: integer
          description: Scarichi e resi senza nessun carico con costo fino a quel giorno.
    SiteWarehouseMaterials:
      type: object
      required: [amount, movements, returns, missing_costs]
      properties:
        amount:
          description: |
            Somma degli scarichi verso il cantiere meno i resi dal cantiere (site_return),
            ciascuno per il costo medio ponderato dei carichi con costo dell'articolo fino al
            suo giorno, arrotondato al centesimo movimento per movimento. Gli scarichi e i resi
            senza un costo medio valgono zero. Può essere negativo se il materiale torna quando
            il costo medio è salito.
          allOf:
            - $ref: '#/components/schemas/SignedAmount'
        movements:
          type: integer
          description: Scarichi dal magazzino verso il cantiere.
        returns:
          type: integer
          description: Resi dal cantiere al magazzino.
        missing_costs:
          type: integer
          description: Scarichi e resi di articoli senza nessun carico con costo fino a quel giorno.
    SiteRevenue:
      type: object
      required:
        [
          invoiced,
          margin,
          collected,
          to_collect,
          certified,
          certified_uninvoiced,
          retention_held,
          retention_released,
          retention_to_release,
        ]
      properties:
        invoiced:
          description: Imponibile delle fatture emesse collegate al cantiere, pagate o no.
          allOf:
            - $ref: '#/components/schemas/Amount'
        margin:
          description: Fatturato meno il totale dei costi; negativo se i costi superano il fatturato.
          allOf:
            - $ref: '#/components/schemas/SignedAmount'
        collected:
          description: |
            Incassato sulle fatture emesse del cantiere: il netto a pagare (amount_due, con
            l'IVA) di quelle pagate più gli acconti registrati su quelle non ancora pagate.
          allOf:
            - $ref: '#/components/schemas/Amount'
        to_collect:
          description: Da incassare sulle fatture emesse del cantiere (somma dei remaining_amount).
          allOf:
            - $ref: '#/components/schemas/Amount'
        certified:
          description: |
            Importo dei SAL approvati dei computi del cantiere, prima della ritenuta di garanzia;
            null senza estimates.view. Negativo solo con SAL di correzione.
          oneOf:
            - $ref: '#/components/schemas/SignedAmount'
            - type: 'null'
        certified_uninvoiced:
          description: |
            La parte di certified dei SAL approvati senza fattura collegata: maturato da
            fatturare. Null senza estimates.view.
          oneOf:
            - $ref: '#/components/schemas/SignedAmount'
            - type: 'null'
        retention_held:
          description: |
            Ritenuta di garanzia dei SAL approvati (retention_amount), da svincolare a fine
            lavori. Null senza estimates.view.
          oneOf:
            - $ref: '#/components/schemas/SignedAmount'
            - type: 'null'
        retention_released:
          description: |
            Imponibile delle fatture emesse di svincolo della ritenuta (retention_release) del
            cantiere, pagate o no.
          allOf:
            - $ref: '#/components/schemas/Amount'
        retention_to_release:
          description: |
            Ritenuta ancora da svincolare: retention_held meno retention_released; negativa se
            si è svincolato più di quanto trattenuto. Null senza estimates.view.
          oneOf:
            - $ref: '#/components/schemas/SignedAmount'
            - type: 'null'
    HoursCost:
      type: object
      required: [hours, amount]
      properties:
        hours:
          type: string
          description: Ore totali con due decimali.
          pattern: '^\d+\.\d{2}$'
        amount: { $ref: '#/components/schemas/Amount' }
    SiteDocumentKind:
      type: string
      description: 'photo: foto (JPEG, PNG, WebP). document: gli altri file.'
      enum: [document, photo]
    SiteDocumentInput:
      type: object
      description: Le note si inviano comunque, con null se vuote.
      required: [title, notes]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        notes: { type: [string, 'null'], maxLength: 2000 }
    SiteDocument:
      allOf:
        - $ref: '#/components/schemas/SiteDocumentInput'
        - type: object
          required:
            [
              id,
              site_id,
              daily_report_id,
              kind,
              file_name,
              content_type,
              size,
              uploaded_by,
              created_at,
              updated_at,
            ]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            site_id: { $ref: '#/components/schemas/Id' }
            daily_report_id:
              description: Rapportino a cui il file è collegato, o null.
              oneOf:
                - $ref: '#/components/schemas/Id'
                - type: 'null'
            kind: { $ref: '#/components/schemas/SiteDocumentKind' }
            file_name: { type: string }
            content_type: { type: string }
            size:
              type: integer
              minimum: 1
              description: Dimensione del file in byte.
            uploaded_by:
              description: Chi l'ha caricato; null se l'utente non c'è più.
              oneOf:
                - $ref: '#/components/schemas/UserRef'
                - type: 'null'
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    SiteDocumentList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/SiteDocument' }
        meta: { $ref: '#/components/schemas/ListMeta' }
    SearchResults:
      type: object
      required: [q, items]
      properties:
        q: { type: string, description: Il testo cercato, senza spazi ai lati. }
        items:
          type: array
          maxItems: 65
          items: { $ref: '#/components/schemas/SearchHit' }
    SearchHit:
      type: object
      required: [type, id, parent_id, title, subtitle]
      properties:
        type:
          type: string
          enum:
            [
              client,
              supplier,
              site,
              quote,
              estimate,
              invoice,
              purchase_order,
              employee,
              vehicle,
              deadline,
              price_list_item,
              site_document,
              warehouse_item,
              site_activity,
              vehicle_document,
              employee_document,
            ]
        id: { type: string, format: uuid }
        parent_id:
          description: |
            Il prezzario della voce, il cantiere del documento o dell'attività, il mezzo del
            documento del mezzo; null per gli altri tipi.
          oneOf:
            - { type: string, format: uuid }
            - type: 'null'
        title: { type: string, description: 'Cosa mostrare: nome, oggetto o numero.' }
        subtitle:
          description: Un dettaglio per distinguere risultati simili (città, codice, numero, data).
          oneOf:
            - type: string
            - type: 'null'
    Dashboard:
      type: object
      required:
        [
          today,
          today_holiday,
          sites,
          over_budget,
          costs_this_month,
          costs_by_month,
          site_progress,
          reports,
          deadlines,
          invoices,
          progress_statements,
          quotes,
          purchase_orders,
          warehouse,
          subcontractors,
          vehicles,
          employees,
          activities,
          absences,
          vat,
        ]
      properties:
        today: { $ref: '#/components/schemas/Date' }
        today_holiday:
          type: boolean
          description: |
            Oggi è festivo, con la regola di holiday dei rapportini: domenica, festivo nazionale
            (Pasquetta compresa) o santo patrono dei dati dell'azienda (patron_saint_day). Senza
            permessi, come listHolidays. Serve al frontend per non sollecitare reports.missing_today
            nei giorni in cui non si lavora.
        sites:
          description: Numero di cantieri per stato.
          oneOf:
            - type: object
              required: [planned, active, suspended, completed]
              properties:
                planned: { type: integer, minimum: 0 }
                active: { type: integer, minimum: 0 }
                suspended: { type: integer, minimum: 0 }
                completed: { type: integer, minimum: 0 }
            - type: 'null'
        over_budget:
          oneOf:
            - type: array
              maxItems: 10
              items: { $ref: '#/components/schemas/DashboardOverBudgetSite' }
            - type: 'null'
        costs_this_month:
          oneOf:
            - type: object
              required: [month, total]
              properties:
                month:
                  type: string
                  pattern: '^\d{4}-\d{2}$'
                  description: Il mese in corso, AAAA-MM.
                total: { $ref: '#/components/schemas/SignedAmount' }
            - type: 'null'
        costs_by_month:
          oneOf:
            - type: array
              minItems: 12
              maxItems: 12
              items: { $ref: '#/components/schemas/DashboardMonthCosts' }
            - type: 'null'
        site_progress:
          oneOf:
            - type: array
              maxItems: 10
              items: { $ref: '#/components/schemas/DashboardSiteProgress' }
            - type: 'null'
        reports:
          oneOf:
            - type: object
              required: [to_approve, drafts, missing_today]
              properties:
                to_approve:
                  type: integer
                  minimum: 0
                  description: Rapportini inviati, in attesa di approvazione.
                drafts:
                  type: integer
                  minimum: 0
                  description: Rapportini in bozza di giorni passati, ancora da inviare.
                missing_today:
                  description: |
                    Cantieri attivi senza un rapportino (in qualunque stato) con la data di oggi,
                    da sollecitare al capo cantiere. Si conta ogni giorno, sabato e domenica
                    compresi: è il frontend a decidere se mostrarlo, ad esempio non nei giorni con
                    today_holiday. null senza sites.view.
                  oneOf:
                    - type: integer
                      minimum: 0
                    - type: 'null'
            - type: 'null'
        deadlines:
          oneOf:
            - type: array
              maxItems: 10
              items: { $ref: '#/components/schemas/DashboardDeadline' }
            - type: 'null'
        invoices:
          oneOf:
            - $ref: '#/components/schemas/DashboardInvoices'
            - type: 'null'
        vat:
          description: |
            Con invoices.view: il riepilogo IVA (come getVatSummary) del mese e del trimestre in
            corso in Italia, per chi liquida l'IVA mensilmente e per chi lo fa ogni trimestre.
          oneOf:
            - $ref: '#/components/schemas/DashboardVat'
            - type: 'null'
        progress_statements:
          description: |
            SAL di tutti i computi: in bozza, e approvati senza una fattura emessa collegata
            (da fatturare), con l'importo e il netto dopo la ritenuta di garanzia. Sono gli
            stessi di listCompanyProgressStatements con filter[status]=approved e
            filter[invoiced]=false.
          oneOf:
            - type: object
              required: [drafts, to_invoice, to_invoice_amount, to_invoice_net_amount]
              properties:
                drafts: { type: integer, minimum: 0 }
                to_invoice: { type: integer, minimum: 0 }
                to_invoice_amount: { $ref: '#/components/schemas/SignedAmount' }
                to_invoice_net_amount: { $ref: '#/components/schemas/SignedAmount' }
            - type: 'null'
        quotes:
          oneOf:
            - $ref: '#/components/schemas/DashboardQuotes'
            - type: 'null'
        purchase_orders:
          oneOf:
            - $ref: '#/components/schemas/DashboardPurchaseOrders'
            - type: 'null'
        warehouse:
          oneOf:
            - type: object
              description: Magazzino, con warehouse.view.
              required: [below_min, stock_value]
              properties:
                below_min:
                  type: integer
                  minimum: 0
                  description: Articoli sotto la scorta minima, da riordinare.
                stock_value:
                  description: |
                    Valore di tutto il magazzino oggi al costo medio, come stock_value di
                    listWarehouseItems senza filtri.
                  allOf:
                    - $ref: '#/components/schemas/Amount'
            - type: 'null'
        subcontractors:
          oneOf:
            - type: object
              description: |
                Subappaltatori non archiviati da controllare prima di farli entrare in cantiere,
                con suppliers.view: gli stessi di filter[compliance] con
                filter[subcontractor]=true in listSuppliers.
              required: [expired, expiring, no_valid_durc, no_valid_credit_license,
                active_sites_expired, active_sites_no_valid_durc,
                active_sites_no_valid_credit_license]
              properties:
                expired:
                  type: integer
                  minimum: 0
                  description: Con almeno un documento scaduto.
                expiring:
                  type: integer
                  minimum: 0
                  description: Nessuno scaduto, almeno uno in scadenza entro 30 giorni.
                no_valid_durc:
                  type: integer
                  minimum: 0
                  description: Senza un DURC valido oggi.
                no_valid_credit_license:
                  type: integer
                  minimum: 0
                  description: Senza una patente a crediti valida oggi.
                active_sites_expired:
                  type: [integer, 'null']
                  minimum: 0
                  description: |
                    Cantieri in corso con almeno un subappaltatore (con un costo o un ordine sul
                    cantiere, anche archiviato) con un documento scaduto: gli stessi di
                    filter[subcontractor_compliance]=expired con filter[status]=active in
                    listSites. null senza sites.view.
                active_sites_no_valid_durc:
                  type: [integer, 'null']
                  minimum: 0
                  description: |
                    Cantieri in corso con almeno un subappaltatore senza un DURC valido oggi
                    (filter[subcontractor_compliance]=no_valid_durc). null senza sites.view.
                active_sites_no_valid_credit_license:
                  type: [integer, 'null']
                  minimum: 0
                  description: |
                    Cantieri in corso con almeno un subappaltatore senza una patente a crediti
                    valida oggi (filter[subcontractor_compliance]=no_valid_credit_license). null
                    senza sites.view.
            - type: 'null'
        vehicles:
          oneOf:
            - type: object
              description: |
                Mezzi attivi da controllare, con vehicles.view. Documenti da rinnovare: gli
                stessi di filter[documents] con filter[active]=true in listVehicles, per ogni
                tipo di documento conta solo la scadenza più lontana. Manutenzioni: le scadenze
                aperte nate dalla prossima manutenzione (vehicle_maintenance_id); completarle
                le toglie. Giorno italiano.
              required:
                [documents_expired, documents_expiring, maintenance_overdue, maintenance_due_soon]
              properties:
                documents_expired:
                  type: integer
                  minimum: 0
                  description: Con almeno un documento scaduto.
                documents_expiring:
                  type: integer
                  minimum: 0
                  description: Nessuno scaduto, almeno uno in scadenza entro 30 giorni.
                maintenance_overdue:
                  type: integer
                  minimum: 0
                  description: |
                    Con la prossima manutenzione (next_due_on) già passata e la sua scadenza
                    ancora aperta.
                maintenance_due_soon:
                  type: integer
                  minimum: 0
                  description: |
                    Nessuna manutenzione passata, almeno una aperta entro 30 giorni (oggi
                    compreso).
            - type: 'null'
        employees:
          oneOf:
            - type: object
              description: |
                Dipendenti attivi con documenti da rinnovare (idoneità sanitaria, corsi,
                patentini), con employees.view: gli stessi di filter[documents] con
                filter[active]=true in listEmployees. Giorno italiano.
              required: [documents_expired, documents_expiring, active_sites_expired]
              properties:
                documents_expired:
                  type: integer
                  minimum: 0
                  description: Con almeno un documento scaduto.
                documents_expiring:
                  type: integer
                  minimum: 0
                  description: Nessuno scaduto, almeno uno in scadenza entro 30 giorni.
                active_sites_expired:
                  type: [integer, 'null']
                  minimum: 0
                  description: |
                    Cantieri in corso con almeno un dipendente della squadra (anche non attivo)
                    con un documento scaduto: gli stessi di filter[team_documents]=expired con
                    filter[status]=active in listSites. null senza sites.view.
            - type: 'null'
        activities:
          oneOf:
            - $ref: '#/components/schemas/DashboardActivities'
            - type: 'null'
        absences:
          oneOf:
            - $ref: '#/components/schemas/DashboardAbsences'
            - type: 'null'
    SubjectAccount:
      type: object
      description: |
        Estratto conto di un cliente (fatture emesse) o di un fornitore (fatture ricevute).
        Gli importi seguono quelli della fattura: total è imponibile più IVA; amount_due è il
        netto a pagare, senza la ritenuta d'acconto e senza l'IVA in scissione dei pagamenti;
        settled è amount_due meno outstanding. Scaduto: residuo delle fatture non pagate con la
        scadenza di pagamento passata (giorno italiano).
      required:
        [invoice_count, open_invoice_count, total, amount_due, settled, outstanding, overdue]
      properties:
        invoice_count:
          type: integer
          minimum: 0
        open_invoice_count:
          description: Fatture non ancora pagate.
          type: integer
          minimum: 0
        total:
          description: Imponibile più IVA di tutte le fatture.
          allOf:
            - $ref: '#/components/schemas/Amount'
        amount_due:
          allOf:
            - $ref: '#/components/schemas/Amount'
        settled:
          description: Già incassato (cliente) o pagato (fornitore).
          allOf:
            - $ref: '#/components/schemas/Amount'
        outstanding:
          description: Ancora da incassare o da pagare.
          allOf:
            - $ref: '#/components/schemas/Amount'
        overdue:
          description: Parte di outstanding già scaduta.
          allOf:
            - $ref: '#/components/schemas/Amount'
    SubjectBalanceList:
      type: object
      required: [data, meta, outstanding, overdue]
      properties:
        data:
          type: array
          items:
            type: object
            required: [subject, open_invoice_count, outstanding, overdue, oldest_due_date]
            properties:
              subject: { $ref: '#/components/schemas/SubjectRef' }
              open_invoice_count:
                type: integer
                minimum: 1
              outstanding:
                description: Ancora da incassare o da pagare.
                allOf:
                  - $ref: '#/components/schemas/Amount'
              overdue:
                description: Parte di outstanding già scaduta.
                allOf:
                  - $ref: '#/components/schemas/Amount'
              oldest_due_date:
                description: La scadenza più vecchia tra le fatture aperte; null se nessuna ne ha.
                oneOf:
                  - $ref: '#/components/schemas/Date'
                  - type: 'null'
        meta: { $ref: '#/components/schemas/ListMeta' }
        outstanding:
          allOf:
            - $ref: '#/components/schemas/Amount'
        overdue:
          allOf:
            - $ref: '#/components/schemas/Amount'
    CashFlowAmounts:
      type: object
      description: Da incassare (fatture emesse), da pagare (ricevute) e la differenza.
      required: [incoming, outgoing, net]
      properties:
        incoming: { $ref: '#/components/schemas/Amount' }
        outgoing: { $ref: '#/components/schemas/Amount' }
        net: { $ref: '#/components/schemas/SignedAmount' }
    CashFlowMonth:
      allOf:
        - $ref: '#/components/schemas/CashFlowAmounts'
        - type: object
          required: [month, balance]
          properties:
            month:
              type: string
              pattern: '^\d{4}-\d{2}$'
              description: AAAA-MM.
            balance:
              description: Saldo accumulato, scaduto compreso, alla fine del mese.
              allOf:
                - $ref: '#/components/schemas/SignedAmount'
    CashFlowForecast:
      type: object
      required: [today, overdue, months, later, undated, total]
      properties:
        today:
          description: La data di oggi in Italia, su cui è calcolato lo scaduto.
          allOf:
            - $ref: '#/components/schemas/Date'
        overdue:
          description: Fatture con la scadenza già passata.
          allOf:
            - $ref: '#/components/schemas/CashFlowAmounts'
        months:
          type: array
          minItems: 1
          maxItems: 24
          description: Dal mese in corso, uno per mese, anche quelli a zero.
          items: { $ref: '#/components/schemas/CashFlowMonth' }
        later:
          description: Fatture con la scadenza dopo l'ultimo mese.
          allOf:
            - $ref: '#/components/schemas/CashFlowAmounts'
        undated:
          description: Fatture senza scadenza di pagamento.
          allOf:
            - $ref: '#/components/schemas/CashFlowAmounts'
        total:
          description: Somma di tutte le fatture aperte.
          allOf:
            - $ref: '#/components/schemas/CashFlowAmounts'
    VatSummaryAmounts:
      type: object
      description: |
        Imponibile e IVA delle fatture emesse e ricevute, e il saldo IVA. Le note di credito
        contano col segno meno: in un periodo con più note che fatture gli importi sono negativi.
      required:
        - sales_taxable
        - sales_vat
        - sales_split_payment_vat
        - purchases_taxable
        - purchases_vat
        - reverse_charge_taxable
        - balance
      properties:
        sales_taxable: { $ref: '#/components/schemas/SignedAmount' }
        sales_vat: { $ref: '#/components/schemas/SignedAmount' }
        sales_split_payment_vat:
          description: Parte di sales_vat in scissione dei pagamenti.
          allOf:
            - $ref: '#/components/schemas/SignedAmount'
        purchases_taxable: { $ref: '#/components/schemas/SignedAmount' }
        purchases_vat: { $ref: '#/components/schemas/SignedAmount' }
        reverse_charge_taxable:
          description: Imponibile delle fatture ricevute con natura N6.x, parte di purchases_taxable.
          allOf:
            - $ref: '#/components/schemas/SignedAmount'
        balance:
          description: IVA a debito se positivo, a credito se negativo.
          allOf:
            - $ref: '#/components/schemas/SignedAmount'
    VatSummaryPeriod:
      allOf:
        - $ref: '#/components/schemas/VatSummaryAmounts'
        - type: object
          required: [period, from, to]
          properties:
            period:
              type: string
              pattern: '^\d{4}-(0[1-9]|1[0-2]|Q[1-4])$'
              description: AAAA-MM per i mesi, AAAA-Q1 … AAAA-Q4 per i trimestri.
            from:
              description: Primo giorno del periodo.
              allOf:
                - $ref: '#/components/schemas/Date'
            to:
              description: Ultimo giorno del periodo, compreso.
              allOf:
                - $ref: '#/components/schemas/Date'
    VatSummary:
      type: object
      required: [year, period, periods, total]
      properties:
        year:
          type: integer
          minimum: 2000
          maximum: 2100
        period:
          type: string
          enum: [month, quarter]
        periods:
          type: array
          minItems: 4
          maxItems: 12
          description: Tutti i mesi o i trimestri dell'anno, anche quelli a zero, in ordine.
          items: { $ref: '#/components/schemas/VatSummaryPeriod' }
        total:
          description: Somma dell'anno.
          allOf:
            - $ref: '#/components/schemas/VatSummaryAmounts'
    DashboardVat:
      type: object
      required: [month, quarter]
      properties:
        month: { $ref: '#/components/schemas/VatSummaryPeriod' }
        quarter: { $ref: '#/components/schemas/VatSummaryPeriod' }
    DashboardInvoices:
      type: object
      description: |
        Fatture non ancora pagate, per quanto resta da pagare (remaining_amount: il netto a
        pagare, cioè senza la ritenuta d'acconto e senza l'IVA in scissione dei pagamenti, meno
        gli acconti già registrati). Scadute: con la scadenza di pagamento passata.
      required:
        [
          receivable,
          receivable_overdue,
          payable,
          payable_overdue,
          payable_without_order,
          payable_without_order_amount,
        ]
      properties:
        receivable:
          description: Da incassare, dalle fatture emesse.
          allOf:
            - $ref: '#/components/schemas/Amount'
        receivable_overdue:
          description: Parte di receivable già scaduta.
          allOf:
            - $ref: '#/components/schemas/Amount'
        payable:
          description: Da pagare, dalle fatture ricevute.
          allOf:
            - $ref: '#/components/schemas/Amount'
        payable_overdue:
          description: Parte di payable già scaduta.
          allOf:
            - $ref: '#/components/schemas/Amount'
        payable_without_order:
          description: |
            Fatture ricevute non pagate e senza ordine al fornitore, da controllare prima di
            pagarle: le stesse di filter[direction]=received con filter[has_purchase_order]=false
            e filter[status] open o overdue.
          type: integer
          minimum: 0
        payable_without_order_amount:
          description: Parte di payable dovuta alle fatture di payable_without_order.
          allOf:
            - $ref: '#/components/schemas/Amount'
    DashboardPurchaseOrders:
      type: object
      description: |
        Ordini ai fornitori da seguire, con purchases.view, con le stesse condizioni di
        filter[follow_up] in listPurchaseOrders. In attesa: inviati (status sent) e non ancora
        ricevuti; l'importo è la somma dei loro totali. Gli ordini senza data di consegna
        contano solo in awaiting. received_uninvoiced e received_uninvoiced_total, solo con
        anche invoices.view (altrimenti null), sono gli stessi ordini di filter[status]=received
        con filter[invoiced]=false: la merce arrivata di cui manca la fattura del fornitore.
      required:
        [
          drafts,
          awaiting,
          awaiting_total,
          late,
          due_soon,
          received_uninvoiced,
          received_uninvoiced_total,
          over_invoiced,
        ]
      properties:
        drafts:
          type: integer
          minimum: 0
          description: Ordini in bozza, ancora da inviare.
        awaiting:
          type: integer
          minimum: 0
          description: Ordini inviati e non ancora ricevuti.
        awaiting_total:
          description: Totale degli ordini in attesa.
          allOf:
            - $ref: '#/components/schemas/Amount'
        late:
          type: integer
          minimum: 0
          description: In attesa con la consegna prevista già passata, da sollecitare.
        due_soon:
          type: integer
          minimum: 0
          description: In attesa con la consegna prevista entro 7 giorni da oggi, oggi compreso.
        received_uninvoiced:
          type: [integer, 'null']
          minimum: 0
          description: |
            Ordini ricevuti senza nessuna fattura ricevuta collegata; null senza invoices.view.
        over_invoiced:
          type: [integer, 'null']
          minimum: 0
          description: |
            Ordini con l'imponibile fatturato oltre il totale, gli stessi di
            filter[over_invoiced]=true in listPurchaseOrders; null senza invoices.view.
        received_uninvoiced_total:
          description: |
            Totale degli ordini in received_uninvoiced, da aspettarsi in fattura; null senza
            invoices.view.
          oneOf:
            - $ref: '#/components/schemas/Amount'
            - type: 'null'
    DashboardQuotes:
      type: object
      description: |
        Preventivi da seguire, con quotes.view. In attesa: inviati (status sent) e non
        sostituiti da una revisione già inviata (una revisione in bozza non conta: il cliente ha
        ancora il preventivo di prima); l'importo è la somma dei loro imponibili. Validità: la
        data valid_until del preventivo, cioè la data più validity_days.
      required: [drafts, awaiting, awaiting_taxable, expiring, past_validity, accepted_without_site]
      properties:
        drafts:
          type: integer
          minimum: 0
          description: Preventivi in bozza.
        awaiting:
          type: integer
          minimum: 0
          description: Preventivi in attesa di risposta del cliente.
        awaiting_taxable:
          description: Imponibile dei preventivi in attesa.
          allOf:
            - $ref: '#/components/schemas/SignedAmount'
        expiring:
          type: integer
          minimum: 0
          description: In attesa con la validità che finisce entro 7 giorni da oggi, oggi compreso.
        past_validity:
          type: integer
          minimum: 0
          description: In attesa con la validità già finita, da sollecitare o da segnare scaduti.
        accepted_without_site:
          type: integer
          minimum: 0
          description: Preventivi accettati da cui non è ancora stato creato un cantiere.
    DashboardOverBudgetSite:
      type: object
      required: [site, budget, total, overrun]
      properties:
        site:
          type: object
          required: [id, name, code]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            name: { type: string }
            code: { type: [string, 'null'] }
        budget: { $ref: '#/components/schemas/SignedAmount' }
        total: { $ref: '#/components/schemas/SignedAmount' }
        overrun:
          description: Quanto i costi superano il budget.
          allOf:
            - $ref: '#/components/schemas/SignedAmount'
    DashboardMonthCosts:
      type: object
      required: [month, labor, vehicles, other, total]
      properties:
        month:
          type: string
          pattern: '^\d{4}-\d{2}$'
          description: AAAA-MM.
        labor:
          description: Manodopera dai rapportini approvati.
          allOf:
            - $ref: '#/components/schemas/SignedAmount'
        vehicles:
          description: Mezzi dai rapportini approvati.
          allOf:
            - $ref: '#/components/schemas/SignedAmount'
        other:
          description: Costi inseriti a mano (materiali, noli, subappalti...).
          allOf:
            - $ref: '#/components/schemas/SignedAmount'
        total: { $ref: '#/components/schemas/SignedAmount' }
    SiteMonthlyCosts:
      type: object
      required: [budget, months]
      properties:
        budget:
          oneOf:
            - $ref: '#/components/schemas/Amount'
            - type: 'null'
        months:
          type: array
          description: Dal mese più vecchio.
          items: { $ref: '#/components/schemas/SiteMonthCosts' }
    SiteSupplierCosts:
      type: object
      required: [total, suppliers]
      properties:
        total:
          description: Somma di tutte le righe.
          allOf:
            - $ref: '#/components/schemas/Amount'
        suppliers:
          type: array
          items: { $ref: '#/components/schemas/SiteSupplierCost' }
    SiteSupplierCost:
      type: object
      required: [supplier, costs, materials, rentals, subcontract, other, total]
      properties:
        supplier:
          description: Null per i costi senza fornitore.
          oneOf:
            - $ref: '#/components/schemas/SubjectRef'
            - type: 'null'
        costs:
          description: Quanti costi inseriti.
          type: integer
          minimum: 1
        materials: { $ref: '#/components/schemas/Amount' }
        rentals: { $ref: '#/components/schemas/Amount' }
        subcontract: { $ref: '#/components/schemas/Amount' }
        other: { $ref: '#/components/schemas/Amount' }
        total: { $ref: '#/components/schemas/Amount' }
    SiteMonthCosts:
      allOf:
        - $ref: '#/components/schemas/DashboardMonthCosts'
        - type: object
          required: [cumulative, invoiced, cumulative_invoiced]
          properties:
            cumulative:
              description: Totale dei costi dal primo mese fino a questo compreso.
              allOf:
                - $ref: '#/components/schemas/SignedAmount'
            invoiced:
              description: Imponibile delle fatture emesse del mese. Null senza invoices.view.
              oneOf:
                - $ref: '#/components/schemas/SignedAmount'
                - type: 'null'
            cumulative_invoiced:
              description: Fatturato dal primo mese fino a questo compreso. Null senza invoices.view.
              oneOf:
                - $ref: '#/components/schemas/SignedAmount'
                - type: 'null'
    DashboardSiteProgress:
      type: object
      required: [site, activities, progress, planned]
      properties:
        site:
          type: object
          required: [id, name, code]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            name: { type: string }
            code: { type: [string, 'null'] }
        activities: { type: integer, minimum: 1 }
        progress:
          type: integer
          minimum: 0
          maximum: 100
          description: Avanzamento delle attività, pesato sulla loro durata in giorni.
        planned:
          type: integer
          minimum: 0
          maximum: 100
          description: |
            Avanzamento previsto a oggi: la parte dei giorni delle attività già trascorsa, con la
            stessa pesatura.
    DashboardDeadline:
      type: object
      required: [id, title, due_on, working_due_on, kind, amount, overdue]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        title: { type: string }
        due_on: { $ref: '#/components/schemas/Date' }
        working_due_on:
          description: |
            Primo giorno lavorativo uguale o successivo a `due_on`, come in Deadline: da lunedì a
            venerdì, escluse le festività nazionali con Pasquetta e il santo patrono dell'azienda.
            overdue resta legato a `due_on`.
          allOf:
            - $ref: '#/components/schemas/Date'
        kind: { $ref: '#/components/schemas/DeadlineKind' }
        amount:
          oneOf:
            - $ref: '#/components/schemas/SignedAmount'
            - type: 'null'
        overdue: { type: boolean }
    PriceListInput:
      type: object
      description: I campi facoltativi si inviano comunque, con null se vuoti.
      required: [name, year, notes]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Ad esempio «Prezzario regionale 2026» o «Prezzi interni».
        year:
          type: [integer, 'null']
          minimum: 1900
          maximum: 2100
        notes:
          type: [string, 'null']
          maxLength: 2000
    PriceListDuplicateInput:
      allOf:
        - $ref: '#/components/schemas/PriceListInput'
        - type: object
          required: [price_change_percent]
          properties:
            price_change_percent:
              description: |
                Variazione dei prezzi in percentuale, da -99.99 a 100, fino a due decimali;
                null per copiare i prezzi come sono.
              oneOf:
                - type: string
                  pattern: '^-?\d{1,3}(\.\d{1,2})?$'
                - type: 'null'
    PriceList:
      allOf:
        - $ref: '#/components/schemas/PriceListInput'
        - type: object
          required: [id, item_count, created_at, updated_at]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            item_count:
              type: integer
              minimum: 0
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    PriceListList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/PriceList' }
        meta: { $ref: '#/components/schemas/ListMeta' }
    PriceListItemInput:
      type: object
      required: [code, description, unit, unit_price]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 50
          description: Codice della voce, ad esempio quello del prezzario regionale.
        description:
          type: string
          minLength: 1
          maxLength: 2000
        unit:
          type: string
          minLength: 1
          maxLength: 20
          description: Unità di misura, ad esempio m², m³, kg, cad.
        unit_price: { $ref: '#/components/schemas/Amount' }
    PriceListItem:
      allOf:
        - $ref: '#/components/schemas/PriceListItemInput'
        - type: object
          required: [id, price_list_id, created_at, updated_at]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            price_list_id: { $ref: '#/components/schemas/Id' }
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    PriceListItemList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/PriceListItem' }
        meta: { $ref: '#/components/schemas/ListMeta' }
    PriceListImportResult:
      type: object
      required: [created, updated, unchanged]
      properties:
        created:
          type: integer
          minimum: 0
          description: Voci aggiunte.
        updated:
          type: integer
          minimum: 0
          description: Voci già nel prezzario con descrizione, unità o prezzo cambiati.
        unchanged:
          type: integer
          minimum: 0
          description: Voci già nel prezzario e uguali a quelle del file.
    SiteActivityInput:
      type: object
      description: I campi facoltativi si inviano comunque, con null se vuoti.
      required: [name, start_on, end_on, progress, depends_on, notes]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        start_on: { $ref: '#/components/schemas/Date' }
        end_on:
          $ref: '#/components/schemas/Date'
          description: Ultimo giorno dell'attività, uguale o dopo start_on.
        progress:
          type: integer
          minimum: 0
          maximum: 100
          description: Avanzamento in percentuale.
        depends_on:
          type: array
          maxItems: 50
          description: |
            Attività dello stesso cantiere che devono finire prima che questa inizi (fine-inizio).
            I doppioni si tolgono.
          items: { $ref: '#/components/schemas/Id' }
        notes:
          type: [string, 'null']
          maxLength: 2000
    SiteActivity:
      allOf:
        - $ref: '#/components/schemas/SiteActivityInput'
        - type: object
          required: [id, site_id, working_days, created_at, updated_at]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            site_id: { $ref: '#/components/schemas/Id' }
            working_days:
              type: integer
              minimum: 0
              description: |
                Durata in giorni lavorativi da start_on a end_on, estremi compresi: da lunedì a
                venerdì, senza le festività nazionali (con Pasquetta) e il santo patrono dei dati
                dell'azienda, come working_days delle assenze. Si calcola, non si invia.
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    ActivityFollowUp:
      type: string
      description: |
        late: non finite con la fine già passata. starting_soon: non iniziate che iniziano entro
        7 giorni, oggi compreso. in_progress: non finite in corso oggi. Solo cantieri previsti o
        in corso.
      enum: [late, starting_soon, in_progress]
    CompanyActivityList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/SiteActivity'
              - type: object
                required: [site, days_late, remaining_working_days]
                properties:
                  site:
                    type: object
                    required: [id, name, code, status]
                    properties:
                      id: { $ref: '#/components/schemas/Id' }
                      name: { type: string }
                      code: { type: [string, 'null'] }
                      status: { $ref: '#/components/schemas/SiteStatus' }
                  days_late:
                    type: integer
                    minimum: 0
                    description: |
                      Giorni passati dalla fine prevista per un'attività non finita; 0 se è
                      finita o la fine non è ancora passata.
                  remaining_working_days:
                    type: integer
                    minimum: 0
                    description: |
                      Giorni lavorativi che restano a un'attività non finita (avanzamento sotto
                      100): da oggi, o dall'inizio se è più avanti, alla fine prevista, estremi
                      compresi, con le stesse regole di working_days (da lunedì a venerdì, senza
                      festività nazionali con Pasquetta e santo patrono dell'azienda), sulla data
                      italiana. 0 se l'attività è finita o la fine è già passata.
        meta: { $ref: '#/components/schemas/ListMeta' }
    DashboardActivities:
      type: object
      description: |
        Attività del cronoprogramma da seguire, con sites.view, con le stesse condizioni di
        filter[follow_up] in listCompanyActivities (solo cantieri previsti o in corso).
      required: [late, starting_soon]
      properties:
        late:
          type: integer
          minimum: 0
          description: Attività non finite con la fine già passata.
        starting_soon:
          type: integer
          minimum: 0
          description: Attività non iniziate che iniziano entro 7 giorni da oggi, oggi compreso.
    DashboardAbsences:
      type: object
      description: |
        Assenze dei dipendenti attivi (listCompanyAbsences), con employees.view, sulla data
        italiana: per sapere chi manca in squadra.
      required: [away_today, starting_soon, vacation_exceeded, permit_exceeded]
      properties:
        away_today:
          type: integer
          minimum: 0
          description: Dipendenti attivi con un'assenza che comprende oggi.
        starting_soon:
          type: integer
          minimum: 0
          description: Assenze di dipendenti attivi che iniziano nei prossimi 7 giorni, da domani.
        vacation_exceeded:
          type: integer
          minimum: 0
          description: |
            Dipendenti attivi che nell'anno in corso hanno fatto più ferie di quelle spettanti e
            riportate (getAbsenceTotals con filter[vacation]=exceeded).
        permit_exceeded:
          type: integer
          minimum: 0
          description: |
            Dipendenti attivi che nell'anno in corso hanno fatto più ore di permesso di quelle
            spettanti (getAbsenceTotals con filter[permit]=exceeded).
    SiteActivityList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/SiteActivity' }
    ProgressStatementStatus:
      type: string
      description: 'draft: bozza, si modifica. approved: approvato, non si modifica più.'
      enum: [draft, approved]
    ProgressStatementInput:
      type: object
      description: I campi facoltativi si inviano comunque, con null se vuoti.
      required: [statement_date, notes, lines]
      properties:
        statement_date:
          $ref: '#/components/schemas/Date'
          description: Data del SAL («lavori eseguiti a tutto il»).
        notes:
          type: [string, 'null']
          maxLength: 2000
        retention_percent:
          description: |
            Ritenuta di garanzia in percentuale, da 0 a 100, fino a due decimali. Facoltativa:
            se manca (o è null), alla creazione vale quella del SAL precedente del computo (0
            per il primo) e alla modifica resta com'è.
          oneOf:
            - type: string
              pattern: '^\d{1,3}(\.\d{1,2})?$'
            - type: 'null'
        lines:
          type: array
          maxItems: 2000
          description: Una riga per voce del computo, senza doppioni.
          items:
            type: object
            required: [item_id, quantity]
            properties:
              item_id: { $ref: '#/components/schemas/Id' }
              quantity:
                $ref: '#/components/schemas/Quantity'
                description: Quantità eseguita in questo SAL; negativa per una correzione.
    ProgressStatementSummary:
      type: object
      required:
        [id, estimate_id, number, statement_date, status, notes, amount, previous_amount,
         cumulative_amount, retention_percent, retention_amount, net_amount, approved_at,
         invoice_id, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        invoice_id:
          description: La fattura emessa che addebita questo SAL (progress_statement_id), o null.
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        estimate_id: { $ref: '#/components/schemas/Id' }
        number:
          type: integer
          minimum: 1
          description: Numero progressivo del SAL nel computo.
        statement_date: { $ref: '#/components/schemas/Date' }
        status: { $ref: '#/components/schemas/ProgressStatementStatus' }
        notes: { type: [string, 'null'] }
        amount:
          $ref: '#/components/schemas/SignedAmount'
          description: Importo dei lavori di questo SAL.
        previous_amount:
          $ref: '#/components/schemas/SignedAmount'
          description: Importo dei SAL precedenti.
        cumulative_amount:
          $ref: '#/components/schemas/SignedAmount'
          description: Importo maturato a tutto questo SAL.
        retention_percent:
          type: string
          description: Ritenuta di garanzia in percentuale, con due decimali (es. "5.00").
        retention_amount:
          $ref: '#/components/schemas/SignedAmount'
          description: Ritenuta su questo SAL, amount × percentuale, arrotondata al centesimo.
        net_amount:
          $ref: '#/components/schemas/SignedAmount'
          description: Importo netto di questo SAL, amount meno la ritenuta.
        approved_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProgressStatementLine:
      type: object
      required:
        [item_id, code, description, unit, unit_price, contract_quantity, quantity,
         previous_quantity, cumulative_quantity, amount, previous_amount, cumulative_amount]
      properties:
        item_id: { $ref: '#/components/schemas/Id' }
        code: { type: [string, 'null'] }
        description: { type: string }
        unit: { type: string }
        unit_price:
          $ref: '#/components/schemas/Amount'
          description: Prezzo usato in questo SAL (0.00 se la voce non ha righe in questo SAL).
        contract_quantity:
          $ref: '#/components/schemas/Quantity'
          description: Quantità attuale della voce nel computo.
        quantity: { $ref: '#/components/schemas/Quantity' }
        previous_quantity: { $ref: '#/components/schemas/Quantity' }
        cumulative_quantity: { $ref: '#/components/schemas/Quantity' }
        amount: { $ref: '#/components/schemas/SignedAmount' }
        previous_amount: { $ref: '#/components/schemas/SignedAmount' }
        cumulative_amount: { $ref: '#/components/schemas/SignedAmount' }
    ProgressStatement:
      allOf:
        - $ref: '#/components/schemas/ProgressStatementSummary'
        - type: object
          required: [lines]
          properties:
            lines:
              type: array
              description: In ordine di codice e descrizione della voce.
              items: { $ref: '#/components/schemas/ProgressStatementLine' }
    ProgressStatementList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ProgressStatementSummary' }
    CompanyProgressStatementList:
      type: object
      required: [data, meta, total_amount, total_net_amount]
      properties:
        data:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/ProgressStatementSummary'
              - type: object
                required: [estimate, site]
                properties:
                  estimate:
                    type: object
                    required: [id, title]
                    properties:
                      id: { $ref: '#/components/schemas/Id' }
                      title: { type: string }
                  site:
                    description: Il cantiere del computo, o null.
                    oneOf:
                      - type: object
                        required: [id, name, code, cig, cup]
                        properties:
                          id: { $ref: '#/components/schemas/Id' }
                          name: { type: string }
                          code: { type: [string, 'null'] }
                          cig:
                            type: [string, 'null']
                            description: CIG dell'appalto, letto dal cantiere.
                          cup:
                            type: [string, 'null']
                            description: CUP dell'appalto, letto dal cantiere.
                      - type: 'null'
        meta: { $ref: '#/components/schemas/ListMeta' }
        total_amount:
          description: Somma degli importi dei SAL filtrati.
          allOf:
            - $ref: '#/components/schemas/SignedAmount'
        total_net_amount:
          description: Somma degli importi netti (dopo la ritenuta di garanzia) dei SAL filtrati.
          allOf:
            - $ref: '#/components/schemas/SignedAmount'
    SiteCostTotal:
      type: object
      required:
        [site, labor, vehicles, manual, total, period_total, budget, budget_remaining, over_budget]
      properties:
        site:
          type: object
          required: [id, name, code, cig, cup, status]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            name: { type: string }
            code: { type: [string, 'null'] }
            cig:
              type: [string, 'null']
              description: CIG del cantiere (vedi Site), per i lavori pubblici.
            cup:
              type: [string, 'null']
              description: CUP del cantiere (vedi Site), per i lavori pubblici.
            status: { $ref: '#/components/schemas/SiteStatus' }
        labor:
          description: Manodopera dai rapportini approvati.
          allOf:
            - $ref: '#/components/schemas/Amount'
        vehicles:
          description: Mezzi dai rapportini approvati.
          allOf:
            - $ref: '#/components/schemas/Amount'
        manual:
          description: Costi inseriti a mano (materiali, noli, subappalti e altro).
          allOf:
            - $ref: '#/components/schemas/Amount'
        total: { $ref: '#/components/schemas/Amount' }
        period_total:
          description: |
            Parte del totale con data dentro filter[from] e filter[to]; null senza periodo.
          oneOf:
            - $ref: '#/components/schemas/Amount'
            - type: 'null'
        budget:
          oneOf:
            - $ref: '#/components/schemas/Amount'
            - type: 'null'
        budget_remaining:
          description: Budget meno totale; negativo sopra budget, null senza budget.
          oneOf:
            - $ref: '#/components/schemas/SignedAmount'
            - type: 'null'
        over_budget: { type: boolean }
    SiteCostTotalList:
      type: object
      required: [data, meta, total_amount, period_total_amount, budget_amount]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/SiteCostTotal' }
        meta: { $ref: '#/components/schemas/ListMeta' }
        total_amount:
          description: Somma dei costi di tutti i cantieri filtrati.
          allOf:
            - $ref: '#/components/schemas/Amount'
        period_total_amount:
          description: Somma di period_total dei cantieri filtrati; null senza periodo.
          oneOf:
            - $ref: '#/components/schemas/Amount'
            - type: 'null'
        budget_amount:
          description: Somma dei budget dei cantieri filtrati che ne hanno uno.
          allOf:
            - $ref: '#/components/schemas/Amount'
    SiteCostList:
      type: object
      required: [data, meta, total_amount]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/SiteCost' }
        meta: { $ref: '#/components/schemas/ListMeta' }
        total_amount: { $ref: '#/components/schemas/Amount' }
    EmployeeInput:
      type: object
      description: I campi facoltativi si inviano comunque, con null se vuoti.
      required:
        [first_name, last_name, tax_code, job_title, phone, email, hired_on, hourly_cost, active, notes]
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 100
        last_name:
          type: string
          minLength: 1
          maxLength: 100
        tax_code:
          type: [string, 'null']
          description: Codice fiscale della persona (16 caratteri), unico nell'azienda. Si salva in maiuscolo, senza spazi.
          maxLength: 20
        job_title:
          type: [string, 'null']
          description: Mansione, ad esempio Muratore o Carpentiere.
          maxLength: 100
        phone:
          type: [string, 'null']
          maxLength: 30
        email:
          type: [string, 'null']
          format: email
          maxLength: 254
        hired_on:
          description: Data di assunzione.
          oneOf:
            - $ref: '#/components/schemas/Date'
            - type: 'null'
        hourly_cost:
          description: |
            Costo orario aziendale, per il costo della manodopera nei cantieri. Cambiarlo non
            cambia i rapportini già approvati, che tengono quello del giorno dell'approvazione.
          oneOf:
            - $ref: '#/components/schemas/Amount'
            - type: 'null'
        active:
          type: boolean
          description: false per chi non lavora più in azienda; resta nello storico.
        notes:
          type: [string, 'null']
          maxLength: 2000
        annual_leave_days:
          type: [integer, 'null']
          minimum: 0
          maximum: 366
          description: |
            Giorni lavorativi di ferie spettanti in un anno, per le ferie residue di
            getAbsenceTotals; null se non si tiene il conto. Facoltativo: se manca, alla
            creazione vale null e alla modifica resta quello che c'era.
        annual_permit_hours:
          type: [integer, 'null']
          minimum: 0
          maximum: 2000
          description: |
            Ore di permesso spettanti in un anno (permessi retribuiti, ROL ed ex festività),
            per i permessi residui di getAbsenceTotals; null se non si tiene il conto.
            Facoltativo: se manca, alla creazione vale null e alla modifica resta quello che
            c'era.
    Employee:
      allOf:
        - $ref: '#/components/schemas/EmployeeInput'
        - type: object
          required: [id, annual_leave_days, annual_permit_hours, created_at, updated_at]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    EmployeeList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Employee' }
        meta: { $ref: '#/components/schemas/ListMeta' }
    WorkHours:
      type: string
      description: Somma di ore come stringa con il punto e due decimali.
      pattern: '^\d+\.\d{2}$'
      examples: ['164.50']
    WorkSummary:
      type: object
      required: [hours, days, cost, sites]
      properties:
        hours: { $ref: '#/components/schemas/WorkHours' }
        days:
          type: integer
          description: Giorni con ore, contando una volta un giorno su più cantieri.
        cost:
          description: |
            Ore per costo orario fissato all'approvazione (attuale per i rapportini non
            approvati), o null se nessuna riga ha un costo orario.
          oneOf:
            - $ref: '#/components/schemas/Amount'
            - type: 'null'
        sites:
          type: array
          items:
            type: object
            required: [site, hours, days, cost, first_date, last_date]
            properties:
              site:
                type: object
                required: [id, name, code]
                properties:
                  id: { $ref: '#/components/schemas/Id' }
                  name: { type: string }
                  code: { type: [string, 'null'] }
              hours: { $ref: '#/components/schemas/WorkHours' }
              days: { type: integer }
              cost:
                oneOf:
                  - $ref: '#/components/schemas/Amount'
                  - type: 'null'
              first_date: { $ref: '#/components/schemas/Date' }
              last_date: { $ref: '#/components/schemas/Date' }
    VehicleWorkSummary:
      allOf:
        - $ref: '#/components/schemas/WorkSummary'
        - type: object
          required: [maintenance, fuel]
          properties:
            fuel:
              type: object
              description: |
                Rifornimenti del periodo (refueled_on tra filter[from] e filter[to]): quanti
                sono, i litri e la spesa senza IVA, con il consumo medio calcolato da pieno a
                pieno sui rifornimenti del periodo con il contachilometri o contaore.
              required: [count, liters, amount, meter_distance, consumption]
              properties:
                count: { type: integer, minimum: 0 }
                liters:
                  type: string
                  pattern: '^\d+\.\d{2}$'
                  examples: ['1234.50']
                amount: { $ref: '#/components/schemas/SignedAmount' }
                meter_distance:
                  description: |
                    Chilometri (automezzi) o ore motore (macchine operatrici e attrezzature) fatti
                    nel periodo: differenza tra il contachilometri più alto e il più basso dei
                    rifornimenti del periodo che lo hanno. null se ce n'è meno di due.
                  type: [integer, 'null']
                  minimum: 0
                consumption:
                  description: |
                    Consumo medio da pieno a pieno: litri dei rifornimenti con il contachilometri,
                    tranne quello con il contachilometri più basso, divisi per meter_distance.
                    Per gli automezzi in litri ogni 100 km, per macchine operatrici e attrezzature
                    in litri all'ora, con due decimali e il punto. null se meter_distance è null
                    o zero.
                  type: [string, 'null']
                  pattern: '^\d+\.\d{2}$'
                  examples: ['8.75']
            maintenance:
              type: object
              description: |
                Manutenzioni del periodo (performed_on tra filter[from] e filter[to]): quante
                sono e la spesa senza IVA, quelle senza importo contano zero.
              required: [count, amount]
              properties:
                count: { type: integer, minimum: 0 }
                amount: { $ref: '#/components/schemas/SignedAmount' }
    EmployeeWorkSummary:
      allOf:
        - $ref: '#/components/schemas/WorkSummary'
        - type: object
          required: [absences, payroll]
          properties:
            payroll:
              type: object
              description: |
                Voci delle buste paga dai rapportini del periodo, con gli stessi filtri delle ore
                (anche filter[status]), di tutti i cantieri. overtime_hours: somma di
                overtime_hours, già comprese in hours; travel_days: giorni con travel, un giorno
                su due cantieri conta una volta; weather_hours: somma di weather_hours, anche
                dalle giornate perse tutte (non comprese in hours né in days); holiday_hours: ore
                lavorate di domenica, nei festivi nazionali (Pasquetta compresa) e nel santo
                patrono dei dati dell'azienda, già comprese in hours.
              required: [overtime_hours, travel_days, weather_hours, holiday_hours]
              properties:
                overtime_hours: { $ref: '#/components/schemas/WorkHours' }
                travel_days: { type: integer, minimum: 0 }
                weather_hours: { $ref: '#/components/schemas/WorkHours' }
                holiday_hours: { $ref: '#/components/schemas/WorkHours' }
            absences:
              type: object
              description: |
                Assenze del periodo. days: giorni di calendario delle assenze di tutto il giorno
                (un'assenza a cavallo del periodo conta solo i suoi giorni dentro); hours: ore
                dei permessi. kinds: solo i tipi con almeno un'assenza, nell'ordine di
                EmployeeAbsenceKind.
              required: [days, hours, kinds]
              properties:
                days: { type: integer }
                hours: { $ref: '#/components/schemas/WorkHours' }
                kinds:
                  type: array
                  items:
                    type: object
                    required: [kind, days, hours]
                    properties:
                      kind: { $ref: '#/components/schemas/EmployeeAbsenceKind' }
                      days: { type: integer }
                      hours: { $ref: '#/components/schemas/WorkHours' }
    SiteWorkSummary:
      type: object
      required: [labor, vehicles]
      properties:
        labor:
          type: object
          required: [hours, overtime_hours, travel_days, weather_hours, holiday_hours, cost, rows]
          properties:
            hours: { $ref: '#/components/schemas/WorkHours' }
            overtime_hours:
              description: Di cui straordinario sul cantiere, somma delle righe.
              allOf: [{ $ref: '#/components/schemas/WorkHours' }]
            travel_days:
              type: integer
              minimum: 0
              description: |
                Giorni di trasferta sul cantiere, somma delle righe: due dipendenti in trasferta
                lo stesso giorno contano due.
            weather_hours:
              description: Ore perse per maltempo sul cantiere, somma delle righe.
              allOf: [{ $ref: '#/components/schemas/WorkHours' }]
            holiday_hours:
              description: Di cui festive sul cantiere, somma delle righe.
              allOf: [{ $ref: '#/components/schemas/WorkHours' }]
            cost: { $ref: '#/components/schemas/NullableWorkCost' }
            rows:
              type: array
              items:
                type: object
                required:
                  - employee
                  - hours
                  - days
                  - overtime_hours
                  - travel_days
                  - weather_hours
                  - holiday_hours
                  - cost
                  - first_date
                  - last_date
                properties:
                  employee:
                    type: object
                    required: [id, first_name, last_name]
                    properties:
                      id: { $ref: '#/components/schemas/Id' }
                      first_name: { type: string }
                      last_name: { type: string }
                  hours: { $ref: '#/components/schemas/WorkHours' }
                  days: { type: integer }
                  overtime_hours:
                    description: Di cui straordinario, somma di overtime_hours sul cantiere.
                    allOf: [{ $ref: '#/components/schemas/WorkHours' }]
                  travel_days:
                    type: integer
                    minimum: 0
                    description: Giorni con travel sul cantiere, tra quelli con ore.
                  weather_hours:
                    description: |
                      Ore perse per maltempo sul cantiere (non comprese nelle ore), anche dalle
                      giornate perse tutte.
                    allOf: [{ $ref: '#/components/schemas/WorkHours' }]
                  holiday_hours:
                    description: |
                      Di cui festive: ore lavorate sul cantiere di domenica, nei festivi nazionali
                      (Pasquetta compresa) e nel santo patrono dei dati dell'azienda.
                    allOf: [{ $ref: '#/components/schemas/WorkHours' }]
                  cost: { $ref: '#/components/schemas/NullableWorkCost' }
                  first_date: { $ref: '#/components/schemas/Date' }
                  last_date: { $ref: '#/components/schemas/Date' }
        vehicles:
          type: object
          required: [hours, cost, rows]
          properties:
            hours: { $ref: '#/components/schemas/WorkHours' }
            cost: { $ref: '#/components/schemas/NullableWorkCost' }
            rows:
              type: array
              items:
                type: object
                required: [vehicle, hours, days, cost, first_date, last_date]
                properties:
                  vehicle:
                    type: object
                    required: [id, name, plate]
                    properties:
                      id: { $ref: '#/components/schemas/Id' }
                      name: { type: string }
                      plate: { type: [string, 'null'] }
                  hours: { $ref: '#/components/schemas/WorkHours' }
                  days: { type: integer }
                  cost: { $ref: '#/components/schemas/NullableWorkCost' }
                  first_date: { $ref: '#/components/schemas/Date' }
                  last_date: { $ref: '#/components/schemas/Date' }
    NullableWorkCost:
      description: |
        Ore per costo orario fissato all'approvazione (attuale per i rapportini non approvati).
        Null senza costs.view; nei totali le ore senza costo
        orario valgono zero, nelle righe il costo è null se il costo orario manca.
      oneOf:
        - $ref: '#/components/schemas/Amount'
        - type: 'null'
    VehicleKind:
      type: string
      description: |
        vehicle: automezzo (furgone, autocarro). machine: macchina operatrice (escavatore, gru).
        equipment: attrezzatura (betoniera, ponteggio, generatore).
      enum: [vehicle, machine, equipment]
    VehicleInput:
      type: object
      description: I campi facoltativi si inviano comunque, con null se vuoti.
      required: [name, kind, plate, model, hourly_cost, active, notes]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        kind: { $ref: '#/components/schemas/VehicleKind' }
        plate:
          type: [string, 'null']
          description: Targa, unica nell'azienda. Si salva in maiuscolo, senza spazi né trattini.
          maxLength: 20
        model:
          type: [string, 'null']
          description: Marca e modello.
          maxLength: 200
        hourly_cost:
          description: |
            Costo orario del mezzo, per i costi dei cantieri. Cambiarlo non cambia i rapportini
            già approvati, che tengono quello del giorno dell'approvazione.
          oneOf:
            - $ref: '#/components/schemas/Amount'
            - type: 'null'
        active:
          type: boolean
          description: false per un mezzo venduto o dismesso; resta nello storico.
        notes:
          type: [string, 'null']
          maxLength: 2000
    Vehicle:
      allOf:
        - $ref: '#/components/schemas/VehicleInput'
        - type: object
          required: [id, last_maintenance, last_refueling, created_at, updated_at]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            last_refueling:
              description: |
                Rifornimento più recente del mezzo (data più recente; a parità, l'ultimo
                registrato), null se non ce ne sono. Solo lettura: si ignora se inviato, e
                registrare un rifornimento non cambia l'ETag del mezzo.
              oneOf:
                - $ref: '#/components/schemas/VehicleLastRefueling'
                - type: 'null'
            last_maintenance:
              description: |
                Intervento più recente del mezzo (data più recente; a parità, l'ultimo
                registrato), null se non ce ne sono. Solo lettura: si ignora se inviato, e
                registrare un intervento non cambia l'ETag del mezzo.
              oneOf:
                - $ref: '#/components/schemas/VehicleLastMaintenance'
                - type: 'null'
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    VehicleLastRefueling:
      type: object
      required: [id, refueled_on, liters, meter_reading]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        refueled_on: { $ref: '#/components/schemas/Date' }
        liters: { $ref: '#/components/schemas/Liters' }
        meter_reading:
          type: [integer, 'null']
          description: Contachilometri o contaore registrato in quel rifornimento.
          minimum: 0
          maximum: 9999999
    VehicleLastMaintenance:
      type: object
      required: [id, performed_on, kind, meter_reading, next_due_on]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        performed_on: { $ref: '#/components/schemas/Date' }
        kind: { $ref: '#/components/schemas/VehicleMaintenanceKind' }
        meter_reading:
          type: [integer, 'null']
          description: Contachilometri o contaore registrato in quell'intervento.
          minimum: 0
          maximum: 9999999
        next_due_on:
          description: Prossima manutenzione indicata in quell'intervento, se c'è.
          oneOf:
            - $ref: '#/components/schemas/Date'
            - type: 'null'
    VehicleList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Vehicle' }
        meta: { $ref: '#/components/schemas/ListMeta' }
    EstimateStatus:
      type: string
      description: >-
        draft: bozza. final: definitivo: capitoli, voci e righe di misura non si modificano
        più (409 estimate_final) finché il computo non torna in bozza; la testata resta
        modificabile, stato compreso.
      enum: [draft, final]
    EstimateInput:
      type: object
      description: I campi facoltativi si inviano comunque, con null se vuoti.
      required: [title, client_id, site_id, site_address, status, notes]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        client_id:
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        site_id:
          description: Cantiere a cui appartiene il computo (scheda «Computo» del cantiere).
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        site_address:
          type: [string, 'null']
          description: Indirizzo del lavoro, in una riga.
          maxLength: 300
        status: { $ref: '#/components/schemas/EstimateStatus' }
        notes:
          type: [string, 'null']
          maxLength: 2000
    Estimate:
      allOf:
        - $ref: '#/components/schemas/EstimateInput'
        - type: object
          required: [id, client, site, total, created_at, updated_at]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            site:
              oneOf:
                - type: object
                  required: [id, name, code, cig, cup]
                  properties:
                    id: { $ref: '#/components/schemas/Id' }
                    name: { type: string }
                    code: { type: [string, 'null'] }
                    cig:
                      type: [string, 'null']
                      description: CIG del cantiere (vedi Site), per i lavori pubblici.
                    cup:
                      type: [string, 'null']
                      description: CUP del cantiere (vedi Site), per i lavori pubblici.
                - type: 'null'
            total:
              description: Totale del computo, somma degli importi delle voci.
              allOf: [{ $ref: '#/components/schemas/SignedAmount' }]
            client:
              oneOf:
                - $ref: '#/components/schemas/SubjectRef'
                - type: 'null'
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    EstimateList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Estimate' }
        meta: { $ref: '#/components/schemas/ListMeta' }
    EstimateChapterInput:
      type: object
      description: I campi facoltativi si inviano comunque, con null se vuoti.
      required: [code, title]
      properties:
        code:
          type: [string, 'null']
          maxLength: 50
        title:
          type: string
          minLength: 1
          maxLength: 200
    EstimateChapterCreate:
      allOf:
        - $ref: '#/components/schemas/EstimateChapterInput'
        - type: object
          required: [parent_id]
          properties:
            parent_id:
              description: Capitolo che lo contiene, null per il primo livello.
              oneOf:
                - $ref: '#/components/schemas/Id'
                - type: 'null'
    EstimateChapter:
      allOf:
        - $ref: '#/components/schemas/EstimateChapterCreate'
        - type: object
          required: [id, amount, position, version]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            amount:
              description: Totale del capitolo, sottocapitoli compresi.
              allOf: [{ $ref: '#/components/schemas/SignedAmount' }]
            position:
              type: integer
              minimum: 0
              description: Ordine tra i capitoli con lo stesso parent_id.
            version:
              type: string
              description: Lo stesso valore dell'ETag, da rimandare in If-Match.
    EstimateItemInput:
      type: object
      description: I campi facoltativi si inviano comunque, con null se vuoti.
      required: [code, description, unit, unit_price]
      properties:
        code:
          type: [string, 'null']
          description: Codice della voce, ad esempio quello del prezzario regionale.
          maxLength: 50
        description:
          type: string
          minLength: 1
          maxLength: 5000
        unit:
          type: string
          description: Unità di misura, ad esempio m², m³, kg, cad.
          minLength: 1
          maxLength: 20
        unit_price: { $ref: '#/components/schemas/Amount' }
    EstimateItemCreate:
      allOf:
        - $ref: '#/components/schemas/EstimateItemInput'
        - type: object
          required: [chapter_id]
          properties:
            chapter_id: { $ref: '#/components/schemas/Id' }
    EstimateItem:
      allOf:
        - $ref: '#/components/schemas/EstimateItemCreate'
        - type: object
          required: [id, quantity, amount, position, version]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            quantity:
              description: Somma delle quantità delle righe di misura; 0.000 se non ce ne sono.
              allOf: [{ $ref: '#/components/schemas/Quantity' }]
            amount:
              description: Quantità per prezzo unitario, arrotondato al centesimo.
              allOf: [{ $ref: '#/components/schemas/SignedAmount' }]
            position:
              type: integer
              minimum: 0
              description: Ordine tra le voci dello stesso capitolo.
            version:
              type: string
              description: Lo stesso valore dell'ETag, da rimandare in If-Match.
    EstimateStructure:
      type: object
      required: [total, chapters, items, measurements]
      properties:
        total:
          description: Totale del computo.
          allOf: [{ $ref: '#/components/schemas/SignedAmount' }]
        measurements:
          type: array
          items: { $ref: '#/components/schemas/EstimateMeasurement' }
        chapters:
          type: array
          items: { $ref: '#/components/schemas/EstimateChapter' }
        items:
          type: array
          items: { $ref: '#/components/schemas/EstimateItem' }
    Quantity:
      type: string
      description: |
        Quantità come stringa con il punto e fino a tre decimali, mai numero JSON; può essere
        negativa (detrazioni). In uscita ha sempre tre decimali.
      pattern: '^-?\d+(\.\d{1,3})?$'
      examples: ['12.500', '-2.000']
    MeasurementFactor:
      description: Un fattore della riga di misura, al massimo 9 cifre intere; null se assente.
      oneOf:
        - type: string
          pattern: '^-?\d{1,9}(\.\d{1,3})?$'
        - type: 'null'
    EstimateMeasurementInput:
      type: object
      description: |
        I campi facoltativi si inviano comunque, con null se vuoti. Serve almeno un fattore.
        La quantità è il prodotto dei fattori presenti, arrotondato a tre decimali.
      required: [description, equal_parts, length, width, height]
      properties:
        description:
          type: [string, 'null']
          maxLength: 500
        equal_parts:
          description: Parti uguali.
          allOf: [{ $ref: '#/components/schemas/MeasurementFactor' }]
        length:
          description: Lunghezza.
          allOf: [{ $ref: '#/components/schemas/MeasurementFactor' }]
        width:
          description: Larghezza.
          allOf: [{ $ref: '#/components/schemas/MeasurementFactor' }]
        height:
          description: Altezza o peso.
          allOf: [{ $ref: '#/components/schemas/MeasurementFactor' }]
    EstimateMeasurementCreate:
      allOf:
        - $ref: '#/components/schemas/EstimateMeasurementInput'
        - type: object
          required: [item_id]
          properties:
            item_id: { $ref: '#/components/schemas/Id' }
    EstimateMeasurement:
      allOf:
        - $ref: '#/components/schemas/EstimateMeasurementCreate'
        - type: object
          required: [id, quantity, position, version]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            quantity: { $ref: '#/components/schemas/Quantity' }
            position:
              type: integer
              minimum: 0
              description: Ordine tra le righe della stessa voce.
            version:
              type: string
              description: Lo stesso valore dell'ETag, da rimandare in If-Match.
    EstimateArrangement:
      type: object
      required: [chapters, items]
      properties:
        chapters:
          type: array
          maxItems: 2000
          items:
            type: object
            required: [id, parent_id]
            properties:
              id: { $ref: '#/components/schemas/Id' }
              parent_id:
                oneOf:
                  - $ref: '#/components/schemas/Id'
                  - type: 'null'
        items:
          type: array
          maxItems: 10000
          items:
            type: object
            required: [id, chapter_id]
            properties:
              id: { $ref: '#/components/schemas/Id' }
              chapter_id: { $ref: '#/components/schemas/Id' }
        measurements:
          type: array
          maxItems: 50000
          items:
            type: object
            required: [id, item_id]
            properties:
              id: { $ref: '#/components/schemas/Id' }
              item_id: { $ref: '#/components/schemas/Id' }
    CompanyProfileInput:
      type: object
      description: |
        Dati fiscali dell'azienda. Per le aziende italiane si controllano partita IVA, codice
        fiscale, CAP e provincia. I campi facoltativi si inviano comunque, con null se vuoti.
      required:
        [legal_name, vat_number, tax_code, rea, share_capital, street, postal_code, city, province, country, phone, email, pec, iban]
      properties:
        legal_name:
          type: string
          description: Ragione sociale.
          minLength: 1
          maxLength: 200
        vat_number: { type: [string, 'null'], maxLength: 20 }
        tax_code: { type: [string, 'null'], maxLength: 16 }
        rea:
          type: [string, 'null']
          description: Numero REA, ad esempio TO-1234567.
          maxLength: 30
        share_capital:
          description: Capitale sociale versato, per le società.
          oneOf:
            - $ref: '#/components/schemas/Amount'
            - type: 'null'
        street: { type: [string, 'null'], maxLength: 200 }
        postal_code: { type: [string, 'null'], maxLength: 10 }
        city: { type: [string, 'null'], maxLength: 100 }
        province: { type: [string, 'null'], maxLength: 2 }
        country:
          type: string
          pattern: '^[A-Za-z]{2}$'
        phone: { type: [string, 'null'], maxLength: 30 }
        email: { type: [string, 'null'], maxLength: 254 }
        pec: { type: [string, 'null'], maxLength: 254 }
        iban:
          type: [string, 'null']
          description: Conto per i pagamenti, stampato nelle condizioni. Gli spazi si tolgono.
          maxLength: 42
        patron_saint_day:
          type: [string, 'null']
          pattern: '^(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$'
          examples: ['06-29']
          description: |
            Giorno del santo patrono del comune dove l'azienda lavora, come MM-GG (mai 02-29).
            Facoltativo: se manca resta com'era, null lo toglie. Si toglie dai giorni lavorativi
            delle assenze (working_days) come le festività nazionali.
    CompanyProfile:
      allOf:
        - $ref: '#/components/schemas/CompanyProfileInput'
        - type: object
          required: [patron_saint_day, updated_at]
          properties:
            updated_at:
              type: [string, 'null']
              format: date-time
              description: Null se i dati non sono mai stati salvati.
    Numbering:
      type: object
      required: [quotes, purchase_orders]
      properties:
        quotes: { $ref: '#/components/schemas/NumberingSeries' }
        purchase_orders: { $ref: '#/components/schemas/NumberingSeries' }
    NumberingSeries:
      type: object
      required: [year, next_number, next]
      properties:
        year: { type: integer }
        next_number:
          type: integer
          minimum: 1
        next:
          type: string
          description: Il prossimo numero come verrà stampato, ad esempio 2026/046.
          pattern: '^\d{4}/\d{3,}$'
    PurchaseOrderFollowUp:
      type: string
      description: |
        Ordini ai fornitori da seguire, gli stessi contati nella sezione purchase_orders di
        getDashboard. awaiting: inviati e non ancora ricevuti. late: in attesa, con la consegna
        prevista (delivery_date) già passata. due_soon: in attesa, con la consegna prevista
        entro 7 giorni da oggi, oggi compreso.
      enum: [awaiting, late, due_soon]
    QuoteFollowUp:
      type: string
      description: |
        Preventivi da seguire, gli stessi contati nella sezione quotes di getDashboard.
        awaiting: inviati e non sostituiti da una revisione già inviata. expiring: in attesa,
        con la validità (valid_until) che finisce entro 7 giorni da oggi, oggi compreso.
        past_validity: in attesa, con la validità già finita. accepted_without_site: accettati
        senza un cantiere creato dal preventivo.
      enum: [awaiting, expiring, past_validity, accepted_without_site]
    QuoteStatus:
      type: string
      description: 'draft: bozza. sent: inviato. accepted: accettato. rejected: rifiutato. expired: scaduto.'
      enum: [draft, sent, accepted, rejected, expired]
    QuoteDuplicateInput:
      type: object
      required: [client_id]
      properties:
        client_id:
          description: Il cliente della copia; null per lo stesso del preventivo di partenza.
          oneOf:
            - { $ref: '#/components/schemas/Id' }
            - type: 'null'
    QuoteInput:
      type: object
      description: I campi facoltativi si inviano comunque, con null se vuoti.
      required: [client_id, subject, validity_days, notes, terms]
      properties:
        client_id: { $ref: '#/components/schemas/Id' }
        subject:
          type: string
          description: Oggetto del preventivo.
          minLength: 1
          maxLength: 200
        validity_days:
          type: integer
          description: Giorni di validità dalla data del preventivo.
          minimum: 1
          maximum: 365
        notes:
          type: [string, 'null']
          maxLength: 5000
        terms:
          type: [string, 'null']
          description: Condizioni (pagamento, tempi, esclusioni).
          maxLength: 10000
    Quote:
      allOf:
        - $ref: '#/components/schemas/QuoteInput'
        - type: object
          required:
            [id, client, status, number, revision, revision_of, issue_date, valid_until, sent_at, totals, site_id, created_at, updated_at]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            site_id:
              description: Il cantiere creato da questo preventivo (createSiteFromQuote), o null.
              oneOf:
                - $ref: '#/components/schemas/Id'
                - type: 'null'
            totals: { $ref: '#/components/schemas/QuoteTotals' }
            client: { $ref: '#/components/schemas/SubjectRef' }
            status: { $ref: '#/components/schemas/QuoteStatus' }
            number:
              type: [string, 'null']
              description: |
                Numero progressivo dell'anno, ad esempio 2026/001; le revisioni hanno lo stesso
                numero con la revisione in fondo (2026/001-R1). Null in bozza.
              pattern: '^\d{4}/\d{3,}(-R\d+)?$'
            revision:
              type: [integer, 'null']
              description: 0 per il preventivo originale, 1, 2… per le revisioni; null in bozza.
              minimum: 0
            revision_of:
              description: Il preventivo da cui nasce questa revisione; null per un originale.
              oneOf:
                - $ref: '#/components/schemas/QuoteRef'
                - type: 'null'
            issue_date:
              description: Data del preventivo, quella del primo invio; null in bozza.
              oneOf:
                - $ref: '#/components/schemas/Date'
                - type: 'null'
            valid_until:
              description: Data più validity_days; null in bozza.
              oneOf:
                - $ref: '#/components/schemas/Date'
                - type: 'null'
            sent_at:
              type: [string, 'null']
              format: date-time
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    QuoteRef:
      type: object
      required: [id, number]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        number:
          type: [string, 'null']
          pattern: '^\d{4}/\d{3,}(-R\d+)?$'
    QuoteList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Quote' }
        meta: { $ref: '#/components/schemas/ListMeta' }
    QuoteLineKind:
      type: string
      description: 'item: riga con prezzo. text: solo testo. section: titolo di sezione.'
      enum: [item, text, section]
    VatRate:
      type: integer
      description: Aliquota IVA in percentuale.
      enum: [22, 10, 5, 4, 0]
    VatNature:
      type: string
      description: |
        Natura di un'operazione ad aliquota 0, con i codici della fattura elettronica. Per
        l'edilizia: N6.3 (subappalto) e N6.7 (prestazioni del comparto edile), inversione
        contabile dell'art. 17, c. 6, DPR 633/72.
      enum:
        [
          N1,
          N2.1,
          N2.2,
          N3.1,
          N3.2,
          N3.3,
          N3.4,
          N3.5,
          N3.6,
          N4,
          N5,
          N6.1,
          N6.2,
          N6.3,
          N6.4,
          N6.5,
          N6.6,
          N6.7,
          N6.8,
          N6.9,
          N7,
        ]
    QuoteLineInput:
      type: object
      description: |
        Per le righe item servono unit, quantity, unit_price, discount_percent e vat_rate; per
        text e section vanno inviati null. I campi si inviano sempre tutti, tranne vat_nature:
        facoltativa, solo per le righe item con aliquota 0 (assente vuol dire null).
      required: [kind, description, unit, quantity, unit_price, discount_percent, vat_rate]
      properties:
        kind: { $ref: '#/components/schemas/QuoteLineKind' }
        description:
          type: string
          minLength: 1
          maxLength: 5000
        unit:
          type: [string, 'null']
          maxLength: 20
        quantity:
          oneOf:
            - type: string
              pattern: '^-?\d{1,11}(\.\d{1,3})?$'
            - type: 'null'
        unit_price:
          oneOf:
            - $ref: '#/components/schemas/Amount'
            - type: 'null'
        discount_percent:
          description: Sconto in percentuale, da 0 a 100, fino a due decimali.
          oneOf:
            - type: string
              pattern: '^\d{1,3}(\.\d{1,2})?$'
            - type: 'null'
        vat_rate:
          oneOf:
            - $ref: '#/components/schemas/VatRate'
            - type: 'null'
        vat_nature:
          description: Natura IVA della riga con aliquota 0 (es. N6.7, inversione contabile).
          oneOf:
            - $ref: '#/components/schemas/VatNature'
            - type: 'null'
    QuoteLine:
      allOf:
        - $ref: '#/components/schemas/QuoteLineInput'
        - type: object
          required: [id, vat_nature, amount, position, version]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            amount:
              description: |
                Imponibile della riga: quantità × prezzo × (1 − sconto), arrotondato al
                centesimo. Null per text e section.
              oneOf:
                - $ref: '#/components/schemas/SignedAmount'
                - type: 'null'
            position:
              type: integer
              minimum: 0
            version:
              type: string
              description: Lo stesso valore dell'ETag, da rimandare in If-Match.
    QuoteLineArrangement:
      type: object
      required: [lines]
      properties:
        lines:
          type: array
          description: Gli id di tutte le righe del preventivo, nel nuovo ordine.
          maxItems: 2000
          items: { $ref: '#/components/schemas/Id' }
    QuoteLineList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/QuoteLine' }
    QuoteTotals:
      type: object
      description: |
        Calcolati dal backend in centesimi. L'imponibile è la somma degli imponibili di riga;
        l'IVA si calcola per aliquota sull'imponibile di quell'aliquota, arrotondata al
        centesimo; il totale è imponibile più IVA.
      required: [taxable, vat, vat_total, total]
      properties:
        taxable: { $ref: '#/components/schemas/SignedAmount' }
        vat:
          type: array
          description: |
            Una voce per aliquota e natura presenti nelle righe, dall'aliquota più alta; a
            parità di aliquota prima quella senza natura, poi le nature in ordine di codice.
          items:
            type: object
            required: [rate, nature, taxable, vat]
            properties:
              rate: { $ref: '#/components/schemas/VatRate' }
              nature:
                oneOf:
                  - $ref: '#/components/schemas/VatNature'
                  - type: 'null'
              taxable: { $ref: '#/components/schemas/SignedAmount' }
              vat: { $ref: '#/components/schemas/SignedAmount' }
        vat_total: { $ref: '#/components/schemas/SignedAmount' }
        total: { $ref: '#/components/schemas/SignedAmount' }
    QuoteFromEstimateInput:
      allOf:
        - $ref: '#/components/schemas/QuoteInput'
        - type: object
          required: [vat_rate]
          properties:
            vat_rate: { $ref: '#/components/schemas/VatRate' }
            vat_nature:
              description: Facoltativa, solo con vat_rate 0; vale per tutte le voci.
              oneOf:
                - $ref: '#/components/schemas/VatNature'
                - type: 'null'
