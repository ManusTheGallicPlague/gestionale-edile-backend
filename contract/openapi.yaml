  /api/companies/{company}/settings/logo:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: getCompanyLogo
      summary: Logo dell'azienda
      description: |
        Qualsiasi membro dell'azienda lo vede, senza permessi: l'interfaccia lo mostra a tutti.
        Senza logo risponde 404.
      responses:
        '200':
          description: Il logo
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            image/png:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: setCompanyLogo
      summary: Caricamento del logo
      description: |
        Permesso: settings.update. Il corpo è il file, con Content-Type image/png o image/jpeg:
        al massimo 512 KB e 2000×2000 pixel; PNG a 8 bit non interlacciato (anche con
        trasparenza), JPEG a colori o in grigio. Sostituisce il logo precedente. Il logo
        compare nei PDF.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          image/png:
            schema: { type: string, format: binary }
          image/jpeg:
            schema: { type: string, format: binary }
      responses:
        '204':
          description: Logo salvato
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413':
          description: File più grande di 512 KB.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '415':
          description: Content-Type diverso da image/png e image/jpeg.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      operationId: deleteCompanyLogo
      summary: Eliminazione del logo
      description: 'Permesso: settings.update. Senza logo risponde comunque 204.'
      security:
        - session: []
          csrf: []
      responses:
        '204':
          description: Logo eliminato
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{company}/invoices:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: listInvoices
      summary: Registro delle fatture emesse e ricevute
      description: |
        Permesso: invoices.view. Dalla più recente. total_amount è la somma dei totali delle
        fatture che rispettano i filtri, non solo della pagina; outstanding_amount la parte
        ancora da pagare o incassare (somma dei remaining_amount).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: sort
          in: query
          description: Campo di ordinamento; il segno meno vuol dire ordine decrescente.
          schema:
            type: string
            enum: [date, -date, due_date, -due_date, total, -total]
            default: -date
        - name: filter
          in: query
          description: |
            Filtri, ad esempio filter[direction]=issued, filter[client]=<id>,
            filter[supplier]=<id>, filter[site]=<id>, filter[status]=overdue,
            filter[from]=2026-11-01 e filter[to]=2026-11-30 (sulla data della fattura) e
            filter[q]=testo (nel numero, nella descrizione e nel CIG o nel CUP del cantiere,
            anche scritti con gli spazi), filter[reverse_charge]=true e
            filter[split_payment]=true (le fatture dietro reverse_charge_taxable e
            sales_split_payment_vat di getVatSummary), filter[purchase_order]=<id> (le fatture
            ricevute di un ordine al fornitore), filter[direction]=received con
            filter[has_purchase_order]=false (le fatture ricevute senza ordine),
            filter[document_type]=credit_note (solo le note di credito),
            filter[credited_invoice]=<id> (le note di credito di una fattura) e
            filter[retention_release]=true (le fatture di svincolo della ritenuta).
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              direction: { $ref: '#/components/schemas/InvoiceDirection' }
              document_type: { $ref: '#/components/schemas/InvoiceDocumentType' }
              credited_invoice: { $ref: '#/components/schemas/Id' }
              client: { $ref: '#/components/schemas/Id' }
              supplier: { $ref: '#/components/schemas/Id' }
              site: { $ref: '#/components/schemas/Id' }
              status: { $ref: '#/components/schemas/InvoicePaymentStatus' }
              from: { $ref: '#/components/schemas/Date' }
              to: { $ref: '#/components/schemas/Date' }
              q:
                type: string
                maxLength: 100
              reverse_charge:
                description: |
                  true per le sole fatture con natura IVA N6.x (inversione contabile), false
                  per le altre.
                type: boolean
              split_payment:
                description: true per le sole fatture in scissione dei pagamenti, false per le altre.
                type: boolean
              retention_release:
                description: |
                  true per le sole fatture di svincolo della ritenuta di garanzia (quelle dietro
                  retention_released del riepilogo dei costi del cantiere), false per le altre.
                type: boolean
              purchase_order:
                description: Le sole fatture ricevute che addebitano questo ordine al fornitore.
                allOf:
                  - $ref: '#/components/schemas/Id'
              has_purchase_order:
                description: |
                  true per le sole fatture collegate a un ordine al fornitore, false per le altre;
                  con filter[direction]=received e false, le fatture ricevute senza ordine (da
                  controllare: acquisti fatti fuori dagli ordini, o ordine da collegare).
                type: boolean
      responses:
        '200':
          description: Una pagina di fatture
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoiceList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    post:
      operationId: createInvoice
      summary: Registrazione di una fattura
      description: |
        Permesso: invoices.create. Se ha una scadenza di pagamento, nasce anche la scadenza
        nello scadenziario (invoice_out per le emesse, invoice_in per le ricevute). Un numero
        già usato nello stesso anno (per le ricevute: dello stesso fornitore) risponde 422
        sotto number.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvoiceInput' }
      responses:
        '201':
          description: Fattura registrata
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/invoices/export:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: exportInvoices
      summary: Esportazione del registro delle fatture in CSV
      description: |
        Permesso: invoices.view. Stessi filtri e ordinamento dell'elenco, senza paginazione,
        nello stesso formato dell'esportazione dei clienti. Date come 30/11/2026, importi con
        la virgola decimale (1234,50). Con il netto a pagare ci sono anche il già pagato
        (paid_amount) e il residuo (remaining_amount); dopo la scissione dei pagamenti, Sì o No
        per lo svincolo della ritenuta di garanzia (retention_release). In fondo la colonna
        Ordine, con il numero dell'ordine al fornitore collegato (vuota senza ordine), poi
        Documento (Fattura o Nota di credito), Fattura stornata (il numero, solo sulle note), CIG
        e CUP del cantiere (vuote se il cantiere non li ha). Il file si chiama fatture.csv.
      parameters:
        - name: sort
          in: query
          schema:
            type: string
            enum: [date, -date, due_date, -due_date, total, -total]
            default: -date
        - name: filter
          in: query
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              direction: { $ref: '#/components/schemas/InvoiceDirection' }
              document_type: { $ref: '#/components/schemas/InvoiceDocumentType' }
              credited_invoice: { $ref: '#/components/schemas/Id' }
              client: { $ref: '#/components/schemas/Id' }
              supplier: { $ref: '#/components/schemas/Id' }
              site: { $ref: '#/components/schemas/Id' }
              status: { $ref: '#/components/schemas/InvoicePaymentStatus' }
              from: { $ref: '#/components/schemas/Date' }
              to: { $ref: '#/components/schemas/Date' }
              q:
                type: string
                maxLength: 100
              reverse_charge:
                description: |
                  true per le sole fatture con natura IVA N6.x (inversione contabile), false
                  per le altre.
                type: boolean
              split_payment:
                description: true per le sole fatture in scissione dei pagamenti, false per le altre.
                type: boolean
              retention_release:
                description: |
                  true per le sole fatture di svincolo della ritenuta di garanzia (quelle dietro
                  retention_released del riepilogo dei costi del cantiere), false per le altre.
                type: boolean
              purchase_order:
                description: Le sole fatture ricevute che addebitano questo ordine al fornitore.
                allOf:
                  - $ref: '#/components/schemas/Id'
              has_purchase_order:
                description: |
                  true per le sole fatture collegate a un ordine al fornitore, false per le altre;
                  con filter[direction]=received e false, le fatture ricevute senza ordine (da
                  controllare: acquisti fatti fuori dagli ordini, o ordine da collegare).
                type: boolean
      responses:
        '200':
          description: Il file CSV
          headers:
            Content-Disposition:
              description: attachment, con il nome del file.
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/invoices/{invoice}:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/InvoiceId'
    get:
      operationId: getInvoice
      summary: Una fattura
      description: 'Permesso: invoices.view. Senza permesso risponde 404, non 403.'
      responses:
        '200':
          description: La fattura
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateInvoice
      summary: Modifica di una fattura, anche per segnarla pagata
      description: |
        Permesso: invoices.update. Si inviano tutti i campi. La scadenza nello scadenziario
        segue la fattura: si sposta con la data di pagamento, si chiude quando paid_on è
        valorizzato, si riapre se torna null, sparisce se la scadenza di pagamento torna null.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvoiceInput' }
      responses:
        '200':
          description: Fattura aggiornata
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
    delete:
      operationId: deleteInvoice
      summary: Eliminazione di una fattura
      description: |
        Permesso: invoices.delete. Elimina anche la sua scadenza nello scadenziario. Una fattura
        con note di credito non si elimina (409, code has_documents): prima si eliminano le note.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Fattura eliminata
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: La fattura ha note di credito (code has_documents).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /api/companies/{company}/invoices/{invoice}/file:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/InvoiceId'
    get:
      operationId: getInvoiceFile
      summary: Il PDF di una fattura
      description: |
        Permesso: invoices.view. Senza permesso, o se la fattura non ha un file, risponde
        404. Il file arriva come allegato (Content-Disposition: attachment, con il nome
        originale).
      responses:
        '200':
          description: Il file
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Content-Disposition:
              schema: { type: string }
          content:
            application/pdf:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: setInvoiceFile
      summary: Caricamento o sostituzione del PDF di una fattura
      description: |
        Permesso: invoices.update. Il corpo è il file, con il suo Content-Type: PDF (la copia di
        cortesia della fattura elettronica), JPEG o PNG (una scansione), al massimo 20 MB. Il contenuto deve
        corrispondere al tipo dichiarato (altrimenti 422 sotto file). Nome del file nella query.
        Un file già presente viene sostituito. If-Match con la versione della fattura: la
        risposta è la fattura con la versione nuova.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - name: file_name
          in: query
          required: true
          description: Nome originale del file; si tiene solo l'ultima parte del percorso.
          schema: { type: string, minLength: 1, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/pdf:
            schema: { type: string, format: binary }
          image/jpeg:
            schema: { type: string, format: binary }
          image/png:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: File salvato
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '413':
          description: File più grande di 20 MB.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '415':
          description: Tipo di file non ammesso.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
    delete:
      operationId: deleteInvoiceFile
      summary: Eliminazione del PDF di una fattura
      description: |
        Permesso: invoices.update. If-Match con la versione della fattura. La fattura resta,
        senza file; la risposta è la fattura con la versione nuova. Se non c'è un file, 404.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: File eliminato
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /api/companies/{company}/invoices/{invoice}/payments:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/InvoiceId'
    get:
      operationId: listInvoicePayments
      summary: Incassi o pagamenti parziali di una fattura
      description: |
        Permesso: invoices.view. Senza permesso risponde 404, non 403. Tutti i pagamenti della
        fattura (acconti, rate), dal più vecchio; niente paginazione.
      responses:
        '200':
          description: I pagamenti della fattura
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/InvoicePayment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createInvoicePayment
      summary: Registrazione di un incasso o di un pagamento, anche parziale
      description: |
        Permesso: invoices.update. If-Match con la versione della fattura: la risposta è la
        fattura con la versione nuova. La somma dei pagamenti non può superare amount_due
        (422 sotto amount). Quando la somma arriva ad amount_due la fattura risulta pagata:
        paid_on prende la data dell'ultimo pagamento e la scadenza nello scadenziario si chiude;
        finché non ci arriva, paid_on è null e la scadenza resta aperta con l'importo residuo.
        Le note di credito della fattura abbassano quanto si può pagare. Su una nota di
        rimborso (refund true) registra un rimborso, fatto al cliente o ricevuto dal fornitore,
        entro refund_due_amount (422 sotto amount): conta col segno meno in paid_amount e nella
        prima nota. Su una nota di credito che non è di rimborso risponde 409 con code
        credit_note.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvoicePaymentInput' }
      responses:
        '200':
          description: Pagamento registrato
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            Sulla nota di credito, che non è di rimborso, non si registrano pagamenti (code
            credit_note).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /api/companies/{company}/invoices/{invoice}/payments/{payment}:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/InvoiceId'
      - name: payment
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Id' }
    delete:
      operationId: deleteInvoicePayment
      summary: Eliminazione di un pagamento registrato per errore
      description: |
        Permesso: invoices.update. If-Match con la versione della fattura: la risposta è la
        fattura con la versione nuova, con paid_on ricalcolato dai pagamenti rimasti (null se
        non ne resta nessuno). Un pagamento si elimina e si registra di nuovo: non si modifica.
        Su una nota di rimborso elimina un rimborso. Una fattura con note di rimborso deve
        restare pagata almeno per il loro totale: altrimenti risponde 409 con code
        has_documents.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Pagamento eliminato
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            La fattura ha note di rimborso e non resterebbe pagata per il loro totale (code
            has_documents).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /api/companies/{company}/invoice-payments:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: listPayments
      summary: Incassi e pagamenti registrati di tutte le fatture (prima nota)
      description: |
        Permesso: invoices.view. Dal più recente. Filtri sulla data del pagamento
        (filter[from], filter[to]), sul tipo di fattura (filter[direction]: issued per gli
        incassi, received per i pagamenti), sul cantiere della fattura (filter[site]), sul
        cliente o sul fornitore della fattura (filter[client], filter[supplier]; uno di un'altra
        azienda dà un elenco vuoto), sulla modalità (filter[method]) e sul testo (filter[q]: nel
        numero della fattura e nelle note del pagamento, senza distinguere maiuscole e
        minuscole, e nel CIG e nel CUP del cantiere della fattura, anche in parte o con gli
        spazi). collected e paid sono le somme di incassi e pagamenti che
        rispettano i filtri, non solo della pagina. Le fatture segnate pagate senza pagamenti
        registrati non compaiono. I rimborsi registrati sulle note di credito compaiono col
        segno meno, tra gli incassi (emesse) o i pagamenti (ricevute).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: filter
          in: query
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              direction: { $ref: '#/components/schemas/InvoiceDirection' }
              site: { $ref: '#/components/schemas/Id' }
              client: { $ref: '#/components/schemas/Id' }
              supplier: { $ref: '#/components/schemas/Id' }
              method: { $ref: '#/components/schemas/InvoicePaymentMethod' }
              from: { $ref: '#/components/schemas/Date' }
              to: { $ref: '#/components/schemas/Date' }
              q:
                type: string
                maxLength: 100
      responses:
        '200':
          description: Una pagina di incassi e pagamenti
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/invoice-payments/export:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: exportPayments
      summary: Esportazione della prima nota in CSV
      description: |
        Permesso: invoices.view. Stessi filtri e ordinamento di listPayments, senza
        paginazione, nello stesso formato dell'esportazione dei clienti. Date come 30/11/2026,
        importi con la virgola decimale (1234,50). Il file si chiama incassi-e-pagamenti.csv.
        Nella colonna Tipo: Incasso, Pagamento, Rimborso fatto (a un cliente) o Rimborso
        ricevuto (da un fornitore), con l'importo dei rimborsi col segno meno.
        Le ultime colonne sono CIG e CUP del cantiere della fattura, vuote se mancano.
      parameters:
        - name: filter
          in: query
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              direction: { $ref: '#/components/schemas/InvoiceDirection' }
              site: { $ref: '#/components/schemas/Id' }
              client: { $ref: '#/components/schemas/Id' }
              supplier: { $ref: '#/components/schemas/Id' }
              method: { $ref: '#/components/schemas/InvoicePaymentMethod' }
              from: { $ref: '#/components/schemas/Date' }
              to: { $ref: '#/components/schemas/Date' }
              q:
                type: string
                maxLength: 100
      responses:
        '200':
          description: Il file CSV
          headers:
            Content-Disposition:
              description: attachment, con il nome del file.
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/roles:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: listRoles
      summary: Ruoli dell'azienda con i loro permessi
      description: |
        Permesso: users.view. Tutti i ruoli, in ordine di nome, senza paginazione (sono pochi).
        I permessi di ogni ruolo sono in ordine alfabetico.
      responses:
        '200':
          description: I ruoli
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createRole
      summary: Nuovo ruolo
      description: |
        Permesso: roles.manage. Il nome è unico nell'azienda (422 sul campo name). I permessi
        doppi si tolgono.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleInput' }
      responses:
        '201':
          description: Ruolo creato
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/roles/{role}:
    parameters:
      - $ref: '#/components/parameters/Company'
      - name: role
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Id' }
    put:
      operationId: updateRole
      summary: Modifica di nome e permessi di un ruolo
      description: |
        Permesso: roles.manage. Si inviano nome e tutti i permessi: sostituiscono quelli di
        prima e valgono subito per chi ha il ruolo. Senza If-Match (valori assoluti, li cambia
        solo il titolare). Se nessun utente attivo avrebbe più users.manage la risposta è 409
        con code last_manager e non cambia niente.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleInput' }
      responses:
        '200':
          description: Ruolo aggiornato
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/LastManager' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      operationId: deleteRole
      summary: Eliminazione di un ruolo
      description: |
        Permesso: roles.manage. Solo se nessun utente lo usa, nemmeno disattivato (409 con code
        role_in_use: prima si cambia ruolo a quegli utenti). Gli inviti in attesa con quel
        ruolo vengono annullati.
      security:
        - session: []
          csrf: []
      responses:
        '204':
          description: Ruolo eliminato
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Il ruolo è assegnato ad almeno un utente (code role_in_use).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/companies/{company}/audit-log:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: listAuditLog
      summary: Registro delle modifiche
      description: |
        Permesso: audit.view. Chi ha creato, modificato o eliminato clienti, fornitori,
        scadenze, computi, preventivi, cantieri e gli altri documenti di AuditEntity (anche SAL,
        prezzari, attività del cronoprogramma e assenze dei dipendenti), e quando; dal più recente. Di una modifica si
        danno i nomi dei campi cambiati, non i valori. Con filter[entity] e filter[entity_id] si ha
        la storia di un solo documento; con filter[action]=delete, chi ha eliminato cosa; con
        filter[field]=budget, chi ha cambiato il budget.
        filter[from] e filter[to] sono giorni compresi, contati sull'ora italiana.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: filter
          in: query
          description: Filtri, ad esempio filter[entity]=client&filter[entity_id]=<id>.
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              entity: { $ref: '#/components/schemas/AuditEntity' }
              entity_id: { $ref: '#/components/schemas/Id' }
              user: { $ref: '#/components/schemas/Id' }
              from: { $ref: '#/components/schemas/Date' }
              to: { $ref: '#/components/schemas/Date' }
              action:
                description: create, update o delete; ad esempio solo le eliminazioni.
                type: string
                enum: [create, update, delete]
              field:
                description: |
                  Solo le modifiche che hanno cambiato questo campo, con il nome dei campi
                  di AuditEntry (ad esempio budget, permissions, lines); da 1 a 64 lettere
                  minuscole, cifre e trattini bassi.
                type: string
                pattern: '^[a-z][a-z0-9_]{0,63}$'
      responses:
        '200':
          description: Una pagina del registro
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditLogList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/audit-log/export:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: exportAuditLog
      summary: Esportazione del registro delle modifiche in CSV
      description: |
        Permesso: audit.view. Stessi filtri e stesso ordine dell'elenco (dal più recente), senza
        paginazione, nello stesso formato delle altre esportazioni: ad esempio con
        filter[from] e filter[to], le modifiche di un mese. Colonne: Data e ora (all'italiana,
        ora italiana: 30/11/2026 14:05), Utente (vuoto se la modifica non è passata dall'API),
        Documento (il tipo in italiano: Cliente, Cantiere…), Id del documento, Azione
        (Creazione, Modifica o Eliminazione) e Campi (i nomi dei campi cambiati, separati da
        virgola). Il file si chiama registro-modifiche.csv.
      parameters:
        - name: filter
          in: query
          description: Gli stessi filtri di listAuditLog.
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              entity: { $ref: '#/components/schemas/AuditEntity' }
              entity_id: { $ref: '#/components/schemas/Id' }
              user: { $ref: '#/components/schemas/Id' }
              from: { $ref: '#/components/schemas/Date' }
              to: { $ref: '#/components/schemas/Date' }
              action:
                description: create, update o delete; ad esempio solo le eliminazioni.
                type: string
                enum: [create, update, delete]
              field:
                description: |
                  Solo le modifiche che hanno cambiato questo campo, con il nome dei campi
                  di AuditEntry (ad esempio budget, permissions, lines); da 1 a 64 lettere
                  minuscole, cifre e trattini bassi.
                type: string
                pattern: '^[a-z][a-z0-9_]{0,63}$'
      responses:
        '200':
          description: Il file CSV
          headers:
            Content-Disposition:
              description: attachment, con il nome del file.
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/users:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: listCompanyUsers
      summary: Utenti dell'azienda con il loro ruolo
      description: |
        Permesso: users.view. Tutti i membri, in ordine di nome, senza paginazione; active è
        false per un utente disattivato.
      responses:
        '200':
          description: Gli utenti
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyUserList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{company}/users/{user}/role:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/UserId'
    put:
      operationId: changeUserRole
      summary: Cambio del ruolo di un utente
      description: |
        Permesso: users.manage. Vale subito, anche per le sessioni aperte. Senza If-Match: il
        valore è assoluto. Se dopo il cambio nessun utente attivo avrebbe più users.manage la
        risposta è 409 con code last_manager e non cambia niente.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserRoleInput' }
      responses:
        '200':
          description: Ruolo cambiato
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/LastManager' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/users/{user}/deactivate:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/UserId'
    post:
      operationId: deactivateUser
      summary: Disattivazione di un utente in questa azienda
      description: |
        Permesso: users.manage. L'utente perde subito l'accesso a questa azienda (le altre e
        l'account restano); nell'elenco ha active false. Non si disattiva sé stessi (409 code
        self_deactivation) né l'ultimo utente attivo con users.manage (409 code last_manager).
        Disattivare due volte non cambia niente.
      security:
        - session: []
          csrf: []
      responses:
        '200':
          description: Utente disattivato
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/LastManager' }

  /api/companies/{company}/users/{user}/reactivate:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/UserId'
    post:
      operationId: reactivateUser
      summary: Riattivazione di un utente in questa azienda
      description: |
        Permesso: users.manage. Torna con il ruolo che aveva. Un account disattivato in
        generale resta con active false.
      security:
        - session: []
          csrf: []
      responses:
        '200':
          description: Utente riattivato
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{company}/invitations:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: listInvitations
      summary: Inviti in attesa
      description: |
        Permesso: users.manage. Gli inviti non ancora accettati, dal più recente, senza
        paginazione; status è expired per quelli scaduti, che si possono eliminare o rifare.
        Gli inviti accettati non compaiono: la persona è tra gli utenti.
      responses:
        '200':
          description: Gli inviti
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createInvitation
      summary: Invito di una persona con un ruolo
      description: |
        Permesso: users.manage. Il link è /invito/{token}, vale 7 giorni e una volta sola.
        Il backend lo manda per email all'invitato; il token compare anche in questa risposta
        (e solo qui: il backend ne tiene l'impronta), così il link si può copiare e girare. Un nuovo
        invito per la stessa email sostituisce quello in attesa. Se l'email è già di un
        membro dell'azienda la risposta è 409 con code already_member.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvitationInput' }
      responses:
        '201':
          description: Invito creato
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationCreated' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: L'email è già di un membro dell'azienda (code already_member).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/invitations/{invitation}:
    parameters:
      - $ref: '#/components/parameters/Company'
      - name: invitation
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Id' }
    delete:
      operationId: deleteInvitation
      summary: Annullamento di un invito in attesa
      description: |
        Permesso: users.manage. Il link smette di funzionare. Un invito non si modifica, quindi
        niente If-Match; uno già accettato risponde 404.
      security:
        - session: []
          csrf: []
      responses:
        '204':
          description: Invito annullato
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/invitations/{token}:
    parameters:
      - $ref: '#/components/parameters/InvitationToken'
    get:
      operationId: getInvitation
      summary: Invito dietro un link, per la pagina /invito/:token
      description: |
        Non serve la sessione. Un token sconosciuto, già usato o scaduto risponde 404, sempre
        con lo stesso messaggio. account_exists dice se l'email ha già un account: in quel
        caso la pagina chiede solo la password, altrimenti anche il nome.
      security: []
      responses:
        '200':
          description: L'invito
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationPreview' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/invitations/{token}/logo:
    parameters:
      - $ref: '#/components/parameters/InvitationToken'
    get:
      operationId: getInvitationLogo
      summary: Logo dell'azienda che invita, per la pagina /invito/:token
      description: |
        Non serve la sessione: basta un invito valido. Risponde 404 se il token è sconosciuto,
        già usato o scaduto, o se l'azienda non ha un logo (has_logo nell'invito lo dice prima).
      security: []
      responses:
        '200':
          description: Il logo
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            image/png:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/invitations/{token}/accept:
    parameters:
      - $ref: '#/components/parameters/InvitationToken'
    post:
      operationId: acceptInvitation
      summary: Accettazione di un invito
      description: |
        Serve il token CSRF (come per l'accesso). Senza account si inviano nome e password
        nuova (almeno 10 caratteri) e il backend crea l'account; con un account si invia la
        sua password (name è ignorato). Se va a buon fine l'utente entra nell'azienda con il
        ruolo dell'invito e il backend apre una sessione nuova, come all'accesso. Una
        password sbagliata risponde 422 sul campo password e conta come tentativo di accesso
        fallito. Un utente già membro riceve 409 con code already_member.
      security:
        - csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvitationAcceptInput' }
      responses:
        '204':
          description: Invito accettato, sessione aperta
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: L'utente fa già parte dell'azienda (code already_member).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/companies/{company}/quotes:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: listQuotes
      summary: Elenco dei preventivi
      description: 'Permesso: quotes.view. La ricerca guarda oggetto, numero e cliente.'
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - name: sort
          in: query
          description: |
            Campo di ordinamento; il segno meno vuol dire ordine decrescente. valid_until mette
            le bozze, che non hanno una validità, in fondo.
          schema:
            type: string
            enum: [number, -number, issue_date, -issue_date, updated_at, -updated_at, valid_until, -valid_until]
            default: -updated_at
        - name: filter
          in: query
          description: |
            Filtri, ad esempio filter[status]=sent, filter[client]=<id> o
            filter[follow_up]=expiring.
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              status: { $ref: '#/components/schemas/QuoteStatus' }
              client: { $ref: '#/components/schemas/Id' }
              follow_up: { $ref: '#/components/schemas/QuoteFollowUp' }
      responses:
        '200':
          description: Una pagina di preventivi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuoteList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    post:
      operationId: createQuote
      summary: Nuovo preventivo, in bozza
      description: 'Permesso: quotes.create. Numero e data arrivano al primo invio.'
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuoteInput' }
      responses:
        '201':
          description: Preventivo creato
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quote' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/quotes/export:
    parameters:
      - $ref: '#/components/parameters/Company'
    get:
      operationId: exportQuotes
      summary: Esportazione dei preventivi in CSV
      description: |
        Permesso: quotes.view. Stessi filtri, ricerca e ordinamento dell'elenco, senza
        paginazione, nello stesso formato dell'esportazione dei clienti. Una riga per preventivo,
        con imponibile, IVA e totale (importi con la virgola decimale), date come 30/11/2026.
        Il file si chiama preventivi.csv.
      parameters:
        - $ref: '#/components/parameters/Search'
        - name: sort
          in: query
          schema:
            type: string
            enum: [number, -number, issue_date, -issue_date, updated_at, -updated_at, valid_until, -valid_until]
            default: -updated_at
        - name: filter
          in: query
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              status: { $ref: '#/components/schemas/QuoteStatus' }
              client: { $ref: '#/components/schemas/Id' }
              follow_up: { $ref: '#/components/schemas/QuoteFollowUp' }
      responses:
        '200':
          description: Il file CSV
          headers:
            Content-Disposition:
              description: attachment, con il nome del file.
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/quotes/{quote}:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/QuoteId'
    get:
      operationId: getQuote
      summary: Testata di un preventivo
      description: 'Permesso: quotes.view. Senza permesso risponde 404, non 403.'
      responses:
        '200':
          description: Il preventivo
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quote' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateQuote
      summary: Modifica della testata di un preventivo in bozza
      description: 'Permesso: quotes.update. Si inviano tutti i campi. Solo in bozza.'
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuoteInput' }
      responses:
        '200':
          description: Preventivo aggiornato
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quote' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Il preventivo non è più in bozza (code quote_not_draft).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
    delete:
      operationId: deleteQuote
      summary: Eliminazione di un preventivo in bozza
      description: 'Permesso: quotes.delete. Un preventivo numerato non si elimina, per non lasciare buchi.'
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Preventivo eliminato
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Il preventivo non è più in bozza (code quote_not_draft).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /api/companies/{company}/quotes/{quote}/send:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/QuoteId'
    post:
      operationId: sendQuote
      summary: Invio di un preventivo in bozza
      description: |
        Permesso: quotes.update. Segna il preventivo come inviato, gli dà il numero successivo
        dell'anno (2026/001, senza buchi) e la data di oggi; la validità parte da quella data.
        Una revisione prende invece il numero del preventivo da cui nasce, con la revisione
        successiva (2026/001-R1).
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Preventivo inviato
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quote' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Il preventivo non è più in bozza (code quote_not_draft).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /api/companies/{company}/quotes/{quote}/status:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/QuoteId'
    post:
      operationId: changeQuoteStatus
      summary: Esito di un preventivo inviato
      description: |
        Permesso: quotes.update. Da sent si passa ad accepted, rejected o expired; da questi
        si torna a sent per correggere un errore. Una bozza si invia con send. Numero, data e
        righe non cambiano.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [sent, accepted, rejected, expired]
      responses:
        '200':
          description: Stato cambiato
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quote' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Passaggio di stato non ammesso (code invalid_transition).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /api/companies/{company}/quotes/{quote}/pdf:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/QuoteId'
    get:
      operationId: getQuotePdf
      summary: PDF del preventivo
      description: |
        Permesso: quotes.view. Il preventivo in A4, pronto da stampare o allegare: intestazione
        con il nome dell'azienda, cliente, oggetto, righe, totali per aliquota, validità, note,
        condizioni e spazio per l'accettazione. Una bozza esce con la dicitura «bozza» e senza
        numero. Il file si chiama preventivo-2026-001.pdf (preventivo-bozza.pdf in bozza).
        Senza permesso risponde 404, non 403.
      responses:
        '200':
          description: Il PDF
          headers:
            Content-Disposition:
              description: attachment, con il nome del file.
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{company}/quotes/{quote}/site:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/QuoteId'
    post:
      operationId: createSiteFromQuote
      summary: Cantiere da un preventivo accettato
      description: |
        Permessi: quotes.view e sites.create. Crea il cantiere del lavoro di un preventivo
        accettato: nome dall'oggetto, stesso cliente, budget uguale all'imponibile, stato
        planned, senza codice, indirizzo e date (si completano con updateSite). Il cantiere
        resta collegato al preventivo (quote nel cantiere, site_id nel preventivo); per ogni
        preventivo si crea un solo cantiere. Senza permesso di vedere il preventivo risponde 404.
      security:
        - session: []
          csrf: []
      responses:
        '201':
          description: Il cantiere creato
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Site' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            Il preventivo non è accettato (code invalid_transition) o ha già un cantiere
            (code site_exists).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/companies/{company}/quotes/{quote}/revisions:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/QuoteId'
    post:
      operationId: reviseQuote
      summary: Revisione di un preventivo inviato
      description: |
        Permessi: quotes.view e quotes.create. Crea una bozza con la stessa testata e le stesse
        righe, collegata al preventivo di partenza (revision_of), che resta com'è. Si rivede un
        preventivo inviato, rifiutato o scaduto; non una bozza né uno accettato. Al primo invio
        la revisione prende lo stesso numero con la revisione successiva (2026/001-R1), senza
        usare un numero nuovo. Senza permesso di vedere il preventivo risponde 404.
      security:
        - session: []
          csrf: []
      responses:
        '201':
          description: La revisione in bozza
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quote' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Il preventivo è in bozza o accettato e non si rivede (code invalid_transition).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/companies/{company}/quotes/{quote}/duplicate:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/QuoteId'
    post:
      operationId: duplicateQuote
      summary: Copia di un preventivo, anche per un altro cliente
      description: |
        Permessi: quotes.view e quotes.create. Crea una bozza nuova con oggetto, validità, note,
        condizioni e una copia di tutte le righe, in qualunque stato sia il preventivo di
        partenza, che non cambia. A differenza della revisione la copia non è collegata al
        preventivo di partenza né al suo cantiere e al primo invio prende un numero nuovo. Con
        `client_id` la copia va a un altro cliente dell'azienda (422 sotto `client_id` se non
        si trova); con null resta lo stesso cliente. Senza permesso di vedere il preventivo
        risponde 404.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuoteDuplicateInput' }
      responses:
        '201':
          description: La copia in bozza
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quote' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/quotes/{quote}/lines:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/QuoteId'
    get:
      operationId: listQuoteLines
      summary: Righe di un preventivo
      description: 'Permesso: quotes.view. Tutte le righe, in ordine, senza paginazione.'
      responses:
        '200':
          description: Le righe
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuoteLineList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createQuoteLine
      summary: Nuova riga, in fondo al preventivo
      description: 'Permesso: quotes.update. Solo in bozza.'
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuoteLineInput' }
      responses:
        '201':
          description: Riga creata
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuoteLine' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Il preventivo non è più in bozza (code quote_not_draft).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    put:
      operationId: arrangeQuoteLines
      summary: Riordino delle righe, in blocco
      description: |
        Permesso: quotes.update. Solo in bozza. Si inviano gli id di tutte le righe del
        preventivo, ognuna una volta sola, nel nuovo ordine: la posizione è quella nell'elenco.
        Testi, prezzi, totali e versioni delle righe non cambiano. Se nel frattempo una riga è
        stata aggiunta o eliminata l'elenco non torna più e la risposta è 422 su lines: si
        ricarica la pagina. Per mettere una riga nuova a metà si crea in fondo e poi si riordina.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuoteLineArrangement' }
      responses:
        '200':
          description: Le righe nel nuovo ordine
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuoteLineList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Il preventivo non è più in bozza (code quote_not_draft).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/quotes/{quote}/lines/export:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/QuoteId'
    get:
      operationId: exportQuoteLines
      summary: Esportazione delle righe di un preventivo in CSV
      description: |
        Permesso: quotes.view. Senza permesso risponde 404. Tutte le righe, nell'ordine del
        preventivo, in qualunque stato, nello stesso formato delle altre esportazioni. Colonne:
        Tipo (Voce, Testo o Sezione), Descrizione, Unità, Quantità, Prezzo, Sconto %, Imponibile,
        IVA % e Natura IVA; numeri con la virgola decimale (1234,50), vuoti per testi e sezioni.
        Senza totali, che sono in getQuote e nel PDF. Il file si chiama come il PDF:
        preventivo-<numero>.csv (la barra del numero diventa un trattino), o preventivo-bozza.csv.
      responses:
        '200':
          description: Il file CSV
          headers:
            Content-Disposition:
              description: attachment, con il nome del file.
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{company}/quotes/{quote}/lines/{line}:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/QuoteId'
      - $ref: '#/components/parameters/LineId'
    put:
      operationId: updateQuoteLine
      summary: Modifica di una riga
      description: 'Permesso: quotes.update. Si inviano tutti i campi. Solo in bozza.'
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuoteLineInput' }
      responses:
        '200':
          description: Riga aggiornata
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuoteLine' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Il preventivo non è più in bozza (code quote_not_draft).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
    delete:
      operationId: deleteQuoteLine
      summary: Eliminazione di una riga
      description: 'Permesso: quotes.update. Solo in bozza.'
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Riga eliminata
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Il preventivo non è più in bozza (code quote_not_draft).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: session
      description: Cookie di sessione HttpOnly, Secure, SameSite=Lax. Il nome lo sceglie il backend.
    csrf:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: |
        Valore del cookie XSRF-TOKEN, ricopiato dal frontend a ogni richiesta che modifica dati.
        Il backend lo verifica contro la sessione: non basta che header e cookie coincidano.

  headers:
    ETag:
      description: Versione del record, da rimandare in If-Match quando lo si modifica.
      schema:
        type: string

  parameters:
    WarehouseAsOf:
      name: as_of
      in: query
      description: |
        Giacenza, costo medio, valore e scorta minima a fine giornata di questa data, con i soli
        movimenti fino a quel giorno compreso: ad esempio le rimanenze al 31 dicembre. Senza,
        contano tutti i movimenti.
      schema: { $ref: '#/components/schemas/Date' }
    AbsenceTotalsFilter:
      name: filter
      in: query
      description: |
        Filtri, ad esempio filter[employee]=<id>, filter[vacation]=exceeded oppure
        filter[permit]=exceeded; insieme valgono tutti.
      style: deepObject
      explode: true
      schema:
        type: object
        properties:
          employee: { $ref: '#/components/schemas/Id' }
          vacation:
            type: string
            enum: [exceeded]
            description: exceeded tiene solo chi ha fatto più ferie di quelle spettanti e riportate.
          permit:
            type: string
            enum: [exceeded]
            description: exceeded tiene solo chi ha permit_remaining sotto zero.
    Company:
      name: company
      in: path
      required: true
      description: Slug dell'azienda, lo stesso che compare nell'URL dell'app.
      schema: { $ref: '#/components/schemas/Slug' }
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    ClientId:
      name: client
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    SupplierId:
      name: supplier
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    DeadlineId:
      name: deadline
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    SiteId:
      name: site
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    PriceListId:
      name: list
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    PriceListItemId:
      name: item
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    SiteActivityId:
      name: activity
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    ProgressStatementId:
      name: statement
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    SupplierDocumentId:
      name: document
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    SiteDocumentId:
      name: document
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    WarehouseItemId:
      name: item
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    WarehouseMovementId:
      name: movement
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    InvoiceId:
      name: invoice
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    PurchaseOrderId:
      name: order
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    SiteCostId:
      name: cost
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    DailyReportId:
      name: report
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    EmployeeId:
      name: employee
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    VehicleId:
      name: vehicle
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    EstimateId:
      name: estimate
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    ChapterId:
      name: chapter
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    ItemId:
      name: item
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    MeasurementId:
      name: measurement
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    QuoteId:
      name: quote
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    LineId:
      name: line
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    UserId:
      name: user
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    InvitationToken:
      name: token
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 100
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag della versione che l'utente ha davanti.
      schema:
        type: string
    Search:
      name: search
      in: query
      description: Testo libero; il backend decide su quali campi cercare.
      schema:
        type: string
        maxLength: 100
    WarehouseItemFilter:
      name: filter
      in: query
      description: Filtri, ad esempio filter[below_min]=true.
      style: deepObject
      explode: true
      schema:
        type: object
        properties:
          below_min:
            description: true per i soli articoli sotto la scorta minima, false per gli altri.
            type: boolean

  responses:
    Unauthorized:
      description: Sessione assente o scaduta. Il frontend torna alla pagina di accesso.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: |
        Azione non permessa dal ruolo dell'utente in questa azienda, oppure token CSRF mancante
        o non valido (code csrf_invalid: il frontend rinnova il token e riprova una volta).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Non esiste, oppure appartiene a un'altra azienda o l'utente non può vederlo.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationFailed:
      description: Dati non validi. Il frontend mostra i messaggi sotto i campi.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationError' }
    StaleRecord:
      description: |
        Il record è stato modificato da qualcun altro dopo che l'utente l'ha aperto
        (code stale_record). Niente viene cambiato.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PreconditionRequired:
      description: Manca l'header If-Match (code precondition_required).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    LastManager:
      description: |
        Cambio rifiutato: lascerebbe l'azienda senza utenti attivi con users.manage o con
        roles.manage, se prima qualcuno li aveva (code last_manager), oppure è la
        disattivazione di sé stessi (code self_deactivation).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: Troppi tentativi in poco tempo.
      headers:
        Retry-After:
          description: Secondi da attendere prima di riprovare.
          schema:
            type: integer
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Id:
      type: string
      description: Identificativo scelto dal backend (ad esempio un UUID). Il frontend non ne deduce nulla.
      examples: [0b8f6a52-3c1e-4d7a-9f20-6f1b2c3d4e5f]
    Slug:
      type: string
      description: |
        Non cambia dopo la creazione. Sono riservati i nomi delle rotte fisse del frontend
        (accedi, profilo, password-dimenticata, invito).
      minLength: 3
      maxLength: 50
      pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      examples: [impresa-rossi]
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: Messaggio in italiano, mostrabile all'utente.
        code:
          type: string
          description: |
            Codice stabile per i casi che il frontend deve riconoscere senza leggere il testo.
            Tutti quelli in uso: already_member, credit_note, csrf_invalid, current_session,
            database_unavailable, email_in_use, estimate_final, has_documents, invalid_transition, last_manager,
            number_in_use, order_not_draft, precondition_required, quote_not_draft,
            report_not_draft, role_in_use, self_deactivation, site_exists, stale_record,
            statement_draft_exists, statement_not_draft.
    ValidationError:
      type: object
      required: [message, errors]
      properties:
        message:
          type: string
        errors:
          type: object
