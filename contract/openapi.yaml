      summary: Ore del mezzo per cantiere in CSV
      description: |
        Permessi come getVehicleWorkSummary: vehicles.view (senza, 404) e reports.view (senza, 403).
        Gli stessi cantieri nello stesso ordine e con gli stessi filtri, nello stesso formato
        delle altre esportazioni: colonne Codice, Cantiere, Ore, Giorni, Costo, Primo giorno,
        Ultimo giorno, e in fondo una riga Totale con ore, giorni e costo di tutto il periodo. Ore e
        importi con la virgola decimale (12,50), date come 30/11/2026, costo vuoto se il costo
        orario manca. Il file si chiama ore-mezzo.csv.
      parameters:
        - name: filter
          in: query
          description: |
