        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/companies/{company}/price-lists/{list}:
    parameters:
      - $ref: '#/components/parameters/Company'
      - $ref: '#/components/parameters/PriceListId'
    get:
      operationId: getPriceList
      summary: Un prezzario
      description: 'Permesso: price_lists.view. Senza permesso risponde 404, non 403.'
      responses:
        '200':
          description: Il prezzario
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PriceList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updatePriceList
      summary: Modifica di un prezzario
      description: 'Permesso: price_lists.update. Si inviano tutti i campi.'
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PriceListInput' }
      responses:
        '200':
          description: Prezzario aggiornato
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PriceList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/StaleRecord' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
    delete:
      operationId: deletePriceList
      summary: Eliminazione di un prezzario
      description: 'Permesso: price_lists.delete. Elimina anche tutte le sue voci.'
      security:
        - session: []
