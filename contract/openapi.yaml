              type: string
              format: date-time
    EstimateList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Estimate' }
        meta: { $ref: '#/components/schemas/ListMeta' }
    EstimateChapterInput:
      type: object
      description: I campi facoltativi si inviano comunque, con null se vuoti.
      required: [code, title]
      properties:
        code:
          type: [string, 'null']
          maxLength: 50
        title:
          type: string
          minLength: 1
          maxLength: 200
    EstimateChapterCreate:
      allOf:
        - $ref: '#/components/schemas/EstimateChapterInput'
        - type: object
          required: [parent_id]
          properties:
            parent_id:
              description: Capitolo che lo contiene, null per il primo livello.
              oneOf:
                - $ref: '#/components/schemas/Id'
                - type: 'null'
    EstimateChapter:
      allOf:
        - $ref: '#/components/schemas/EstimateChapterCreate'
        - type: object
          required: [id, amount, position, version]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            amount:
              description: Totale del capitolo, sottocapitoli compresi.
              allOf: [{ $ref: '#/components/schemas/SignedAmount' }]
            position:
              type: integer
              minimum: 0
              description: Ordine tra i capitoli con lo stesso parent_id.
            version:
              type: string
              description: Lo stesso valore dell'ETag, da rimandare in If-Match.
    EstimateItemInput:
      type: object
      description: I campi facoltativi si inviano comunque, con null se vuoti.
      required: [code, description, unit, unit_price]
      properties:
        code:
          type: [string, 'null']
          description: Codice della voce, ad esempio quello del prezzario regionale.
          maxLength: 50
        description:
          type: string
          minLength: 1
          maxLength: 5000
        unit:
          type: string
          description: Unità di misura, ad esempio m², m³, kg, cad.
          minLength: 1
          maxLength: 20
        unit_price: { $ref: '#/components/schemas/Amount' }
    EstimateItemCreate:
      allOf:
        - $ref: '#/components/schemas/EstimateItemInput'
        - type: object
          required: [chapter_id]
          properties:
            chapter_id: { $ref: '#/components/schemas/Id' }
    EstimateItem:
      allOf:
        - $ref: '#/components/schemas/EstimateItemCreate'
        - type: object
          required: [id, quantity, amount, position, version]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            quantity:
              description: Somma delle quantità delle righe di misura; 0.000 se non ce ne sono.
              allOf: [{ $ref: '#/components/schemas/Quantity' }]
            amount:
              description: Quantità per prezzo unitario, arrotondato al centesimo.
              allOf: [{ $ref: '#/components/schemas/SignedAmount' }]
            position:
              type: integer
              minimum: 0
              description: Ordine tra le voci dello stesso capitolo.
            version:
              type: string
              description: Lo stesso valore dell'ETag, da rimandare in If-Match.
    EstimateStructure:
      type: object
      required: [total, chapters, items, measurements]
      properties:
        total:
          description: Totale del computo.
          allOf: [{ $ref: '#/components/schemas/SignedAmount' }]
        measurements:
          type: array
          items: { $ref: '#/components/schemas/EstimateMeasurement' }
        chapters:
          type: array
          items: { $ref: '#/components/schemas/EstimateChapter' }
        items:
          type: array
          items: { $ref: '#/components/schemas/EstimateItem' }
    Quantity:
      type: string
      description: |
        Quantità come stringa con il punto e fino a tre decimali, mai numero JSON; può essere
        negativa (detrazioni). In uscita ha sempre tre decimali.
      pattern: '^-?\d+(\.\d{1,3})?$'
      examples: ['12.500', '-2.000']
    MeasurementFactor:
      description: Un fattore della riga di misura, al massimo 9 cifre intere; null se assente.
      oneOf:
        - type: string
          pattern: '^-?\d{1,9}(\.\d{1,3})?$'
        - type: 'null'
    EstimateMeasurementInput:
      type: object
      description: |
        I campi facoltativi si inviano comunque, con null se vuoti. Serve almeno un fattore.
