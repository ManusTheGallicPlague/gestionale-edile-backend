# Postgres for development and tests. Exposed only on 127.0.0.1.
services:
  db:
    image: postgres:17-alpine
    container_name: gestionale-edile-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: gestionale
      POSTGRES_USER: gestionale_owner
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?set DB_OWNER_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:${DB_PORT:-5434}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gestionale_owner -d gestionale']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
